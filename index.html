<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>jadenfamily</title>
<meta name="description" content="우리 집 대시보드">
<meta name="apple-mobile-web-app-title" content="jadenfamily">
<meta property="og:title" content="jadenfamily">
<meta property="og:description" content="우리 집 대시보드">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="jadenfamily">
<meta name="twitter:description" content="우리 집 대시보드">
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --line:#f1e6da;
    --card:#ffffff;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --r-lg:26px;
    --sun:#ff9f1c;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ff5c8a;
    --sky:#3d9be9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
    min-height:100vh;
    background-color:#fff8ef;
    background-image:
      radial-gradient(circle at 8% -6%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% -2%, #dcf0ff 0, rgba(220,240,255,0) 44%),
      radial-gradient(circle at 50% 112%, #ffe7f0 0, rgba(255,231,240,0) 46%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }
  select,input{ font-family:inherit; }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:inherit; }

  @keyframes popIn{ 0%{transform:scale(.94); opacity:0} 100%{transform:scale(1); opacity:1} }

  /* ---------- 허브 화면 ---------- */
  .portal{
    max-width:1180px; margin:0 auto;
    padding:clamp(14px,2.4vw,30px) clamp(12px,2.2vw,24px) calc(38px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:clamp(14px,2.2vw,24px);
  }
  .topbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-logo{
    width:52px; height:52px; border-radius:18px; flex:0 0 auto;
    background:linear-gradient(135deg,#fff0cf,#ffe1ef); display:grid; place-items:center;
    font-size:27px; line-height:1; box-shadow:var(--shadow);
  }
  .brand-text{ min-width:0; }
  .brand-text h1{ margin:0; font-size:clamp(20px,2.4vw,26px); font-weight:900; letter-spacing:-.025em; }
  .brand-sub{
    margin:4px 0 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:12px; font-weight:800; color:var(--ink-2);
  }
  .dot{ color:#cbbfae; }
  .sync-pill{
    font-size:11px; font-weight:900; padding:3px 8px; border-radius:999px; white-space:nowrap;
    background:#fff; color:#8a7f70; box-shadow:var(--shadow);
  }
  .sync-pill.ok{ background:#eefaf3; color:#0f7a55; }
  .sync-pill.sync{ background:#eef5ff; color:#2f6fb5; }
  .sync-pill.off{ background:#fff4e6; color:#b0610b; }
  .sync-pill.err{ background:#fff0f3; color:#c6415a; }

  .actions{ margin-left:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .user-chip{ display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:3px 8px 3px 4px; box-shadow:var(--shadow); }
  .uc-av{
    width:28px; height:28px; border-radius:10px; flex:0 0 auto; display:grid; place-items:center;
    background:linear-gradient(135deg,#ffe0a8,#ffc9dd); font-size:12.5px; font-weight:900; color:#8a4b00;
  }
  .uc-meta{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .uc-meta b{ font-size:12.5px; font-weight:900; white-space:nowrap; }
  .uc-role{ font-size:9.5px; font-weight:900; color:#a2937f; }
  .edit-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    min-height:44px; padding:0 14px; border:2px solid #f0e4d6; border-radius:14px;
    background:#fff; color:#5d5375; font-size:13px; font-weight:900; letter-spacing:-.01em;
    cursor:pointer; touch-action:manipulation; text-decoration:none; box-shadow:var(--shadow);
  }
  .edit-btn:active{ transform:translateY(1px); }
  .edit-btn .bi{ font-size:15px; line-height:1; }
  .edit-btn.out-btn{ background:linear-gradient(135deg,#fff3f6,#f7f4ff); color:#8a4b6b; border-color:#f6dde7; }

  .greet{ padding:2px 2px 0; }
  .greet h2{ margin:0; font-size:clamp(19px,2.6vw,27px); font-weight:900; letter-spacing:-.03em; }
  .greet p{ margin:6px 0 0; font-size:13px; font-weight:800; color:var(--ink-2); }

  .hub-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(12px,1.6vw,18px); }
  .hub-tile{
    word-break:keep-all;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:9px; text-align:left;
    min-height:236px; padding:22px;
    border-radius:28px; border:2px solid #f1e6da; background:#fff;
    box-shadow:0 10px 26px rgba(118,86,54,.09), 0 2px 6px rgba(118,86,54,.04);
    text-decoration:none; color:inherit; cursor:pointer; touch-action:manipulation;
    transition:transform .16s ease, box-shadow .16s ease;
    animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
  }
  .hub-tile:hover{ transform:translateY(-2px); box-shadow:0 16px 34px rgba(118,86,54,.14), 0 3px 8px rgba(118,86,54,.05); }
  .hub-tile:active{ transform:scale(.99); }
  .hub-tile .ht-emoji{ font-size:46px; line-height:1; }
  .hub-tile .ht-body{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .hub-tile .ht-title{ font-size:21px; font-weight:900; letter-spacing:-.025em; line-height:1.25; }
  .hub-tile .ht-desc{ font-size:13px; font-weight:800; color:var(--ink-2); line-height:1.55; }
  .hub-tile .ht-go{ margin-top:auto; font-size:13px; font-weight:900; color:#0f6b8a; }
  .hub-tile.kids{ background:linear-gradient(155deg,#fff8e8 0%,#fff0f6 100%); border-color:#ffe2cc; }
  .hub-tile.fridge{ background:linear-gradient(155deg,#eaf7ff 0%,#f2f0ff 100%); border-color:#d9e8fb; }
  .hub-tile.ledger{ background:linear-gradient(155deg,#fffdf1 0%,#eefaf3 100%); border-color:#dceee3; }
  .hub-tile .ht-badge{
    position:absolute; top:14px; right:14px; font-size:10.5px; font-weight:900; padding:4px 9px;
    border-radius:999px; background:#fff; color:#8a6a2f; box-shadow:0 2px 8px rgba(0,0,0,.07);
  }
  .hub-foot{ margin:2px 0 0; font-size:11.5px; font-weight:700; color:#a99c8c; line-height:1.6; text-align:center; }

  @media (max-width:720px){
    .hub-grid{ grid-template-columns:1fr; }
    .hub-tile{ min-height:0; flex-direction:row; align-items:center; gap:14px; padding:15px 16px; border-radius:22px; }
    .hub-tile .ht-emoji{ font-size:34px; }
    .hub-tile .ht-go{ margin:0 0 0 auto; white-space:nowrap; }
    .hub-tile .ht-badge{ display:none; }
  }
  @media (max-width:560px){
    .brand-logo{ width:44px; height:44px; border-radius:15px; font-size:23px; }
    .brand-text h1{ font-size:19px; }
    .edit-btn{ min-height:40px; padding:0 11px; font-size:12px; }
    .uc-meta b{ font-size:11.5px; }
    .uc-role{ display:none; }
    .hub-tile{ padding:13px 14px; }
    .hub-tile .ht-title{ font-size:18px; }
    .hub-tile .ht-desc{ font-size:12px; }
  }

  /* ---------- 로그인 / 기기 연결 ---------- */
  .login{
    position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center;
    padding:18px; overflow:auto;
    background:
      radial-gradient(circle at 12% 0%, #ffe6c7 0, rgba(255,230,199,0) 42%),
      radial-gradient(circle at 88% 4%, #dcf0ff 0, rgba(220,240,255,0) 40%),
      radial-gradient(circle at 50% 108%, #ffe7f0 0, rgba(255,231,240,0) 44%),
      #fff8ef;
  }
  .login-card{
    width:100%; max-width:436px; background:#fff; border-radius:28px; padding:26px 24px 22px;
    box-shadow:0 24px 60px rgba(118,86,54,.18);
  }
  .login-brand{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .login-logo{
    width:54px; height:54px; border-radius:18px; flex:0 0 auto;
    background:linear-gradient(135deg,#fff0cf,#ffe1ef); display:grid; place-items:center; font-size:28px;
  }
  .login-brand h1{ margin:0; font-size:21px; font-weight:900; letter-spacing:-.02em; }
  .login-brand p{ margin:3px 0 0; font-size:12.5px; font-weight:800; color:var(--ink-2); }
  .lf{ display:flex; flex-direction:column; gap:11px; }
  .lf label{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:900; color:#6d6484; }
  .lf input, .lf select{
    width:100%; min-height:50px; padding:10px 13px; border-radius:14px; border:2px solid #e6dccf;
    background:#fffdf9; font-size:15px; font-weight:800; color:var(--ink);
  }
  .lf input:focus, .lf select:focus{ outline:none; border-color:#ffb703; box-shadow:0 0 0 4px rgba(255,183,3,.16); }
  .lf-note{ margin:0; font-size:12px; font-weight:700; color:#8a93a8; line-height:1.55; }
  .lf-hint{ margin:0; font-size:11.5px; font-weight:700; color:#a99c8c; line-height:1.5; }
  .lf-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lf label.lf-check{
    flex-direction:row; align-items:center; gap:9px; font-size:12.5px; font-weight:900;
    color:#6d6484; cursor:pointer; touch-action:manipulation; padding:2px 0;
  }
  .lf label.lf-check input[type="checkbox"]{
    width:20px; height:20px; min-height:0; padding:0; flex:0 0 auto; margin:0;
    accent-color:#ff9f1c; cursor:pointer;
  }
  .lf-btn{
    width:100%; min-height:54px; border:none; border-radius:17px; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(135deg,#ffd43b,#ff9f1c); color:#5a3200;
    font-size:17px; font-weight:900; letter-spacing:-.01em; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .lf-btn:active{ transform:translateY(1px); }
  .lf-btn:disabled{ opacity:.6; cursor:default; }
  .lf-msg{ margin:0; min-height:17px; font-size:12.5px; font-weight:800; color:#c6415a; line-height:1.45; }
  .lf-msg.ok{ color:#12805c; }
  .lf-link{ border:none; background:none; color:#7c6aa8; font-size:12.5px; font-weight:900; cursor:pointer; text-decoration:underline; padding:4px; }
  .lf-foot{ margin:4px 0 0; font-size:11px; font-weight:700; color:#b3a696; line-height:1.55; text-align:center; }

  /* ---------- 계정 관리 모달 ---------- */
  .hist{
    position:fixed; inset:0; z-index:85; display:flex; align-items:center; justify-content:center;
    padding:clamp(8px,1.6vw,22px); background:rgba(45,30,10,.45);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    overflow:hidden; overscroll-behavior:contain; touch-action:none;
  }
  .hist-card{
    width:100%; max-width:700px; max-height:94vh; max-height:calc(100dvh - 20px); display:flex; flex-direction:column;
    background:#fffdf9; border-radius:28px; overflow:hidden;
    box-shadow:0 26px 64px rgba(0,0,0,.3); animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
    overscroll-behavior:contain;
  }
  .hist-head{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px 11px; border-bottom:2px solid #f6ece0;
    background:linear-gradient(135deg,#fff6e6 0%,#f5efff 100%);
  }
  .hist-head h2{ margin:0; font-size:clamp(18px,2vw,21px); font-weight:900; letter-spacing:-.02em; }
  .hist-close{
    flex:0 0 auto; width:46px; height:46px; border-radius:15px; border:none; background:#fff;
    color:#8a7f70; font-size:17px; font-weight:900; cursor:pointer; touch-action:manipulation;
    box-shadow:0 4px 10px rgba(0,0,0,.07);
  }
  .hist-close:active{ transform:scale(.94); }
  .hist-body{
    padding:14px 16px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; touch-action:pan-y;
    display:flex; flex-direction:column; gap:13px;
  }
  .acct-list{ display:flex; flex-direction:column; gap:8px; }
  .acct-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; background:#fff; border:2px solid #f4eadd; border-radius:16px; padding:9px 11px; }
  .acct-id{ display:flex; flex-direction:column; min-width:104px; }
  .acct-id b{ font-size:14px; font-weight:900; }
  .acct-id span{ font-size:11.5px; font-weight:800; color:#a2937f; }
  .acct-row select{
    margin-left:auto; min-height:40px; padding:4px 8px; border-radius:11px; border:2px solid #e6dccf;
    background:#fffdf9; color:var(--ink); font-size:13px; font-weight:800;
  }
  .ghost-btn{ min-height:40px; padding:6px 12px; border-radius:12px; border:2px solid #eadfd1; background:#fff; color:#6d6484; font-size:12.5px; font-weight:900; cursor:pointer; }
  .del-btn{ min-height:40px; padding:0 12px; border-radius:12px; border:none; background:#fff0f3; color:#c6415a; font-size:12.5px; font-weight:900; cursor:pointer; }
  .acct-pw{ display:flex; flex:1 1 100%; align-items:center; gap:7px; }
  .acct-pw input{ flex:1 1 auto; min-height:42px; padding:6px 11px; border-radius:11px; border:2px solid #e6dccf; font-size:14px; font-weight:800; }
  .acct-pw button{ width:auto; min-height:42px; padding:0 16px; font-size:13.5px; }
  .acct-add{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:4px; padding-top:12px; border-top:2px dashed #f0e4d6; }
  .acct-add label{ display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:900; color:#6d6484; }
  .acct-add input, .acct-add select{ min-height:44px; padding:8px 11px; border-radius:12px; border:2px solid #e6dccf; font-size:14px; font-weight:800; background:#fffdf9; color:var(--ink); }
  .acct-add .full{ grid-column:1 / -1; }
  .acct-note{ margin:0; font-size:11.5px; font-weight:700; color:#a2937f; line-height:1.55; }
  .acct-connect{ display:flex; flex-direction:column; gap:9px; background:linear-gradient(135deg,#fff6e6 0%,#f1f6ff 100%); border:2px solid #ffe7c2; border-radius:18px; padding:12px 13px 13px; }
  .acct-connect-head{ display:flex; flex-direction:column; gap:3px; }
  .acct-connect-head b{ font-size:14px; font-weight:900; letter-spacing:-.01em; }
  .acct-connect-head span{ font-size:11.5px; font-weight:700; color:#8a7f70; line-height:1.5; }
  .acct-connect .lf-btn{ min-height:48px; font-size:15px; border-radius:14px; }
  .acct-linkbox{ display:flex; flex-direction:column; gap:5px; }
  .acct-linkbox p{ margin:0; font-size:11.5px; font-weight:800; color:#b0610b; line-height:1.5; }
  .acct-linkbox input{ width:100%; min-height:42px; padding:8px 11px; border-radius:11px; border:2px solid #e6dccf; background:#fff; color:#4b3f7a; font-size:12px; font-weight:700; }
  .acct-role-note{ font-size:11.5px; font-weight:700; color:#8a93a8; line-height:1.6; }

  /* ---------- 토스트 ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,14px);
    opacity:0; pointer-events:none; z-index:200; max-width:min(92vw,460px);
    background:#3a3228; color:#fffdf9; font-size:13.5px; font-weight:800; line-height:1.45; text-align:center;
    padding:12px 16px; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,.3);
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:560px){
    .acct-add{ grid-template-columns:1fr; }
    .hist-body{ padding:12px 12px 16px; }
    .login-card{ padding:22px 18px 18px; border-radius:24px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<div class="portal" id="portalRoot" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🏠</span>
      <div class="brand-text">
        <h1>jadenfamily</h1>
        <p class="brand-sub">
          <span id="dateLine">-</span>
          <span class="dot">·</span>
          <span id="clockLine">-</span>
          <span class="sync-pill" id="syncPill">☁️ 준비</span>
        </p>
      </div>
    </div>
    <div class="actions">
      <div class="user-chip" id="userChip" hidden>
        <span class="uc-av" id="ucAv">·</span>
        <span class="uc-meta"><b id="ucName">-</b><span class="uc-role" id="ucRole">-</span></span>
      </div>
      <button class="edit-btn" type="button" id="accountsBtn" data-act="accounts-open" aria-haspopup="dialog" hidden><span class="bi" aria-hidden="true">👥</span><span class="bl">계정</span></button>
      <button class="edit-btn out-btn" type="button" data-act="logout"><span class="bi" aria-hidden="true">⏻</span><span class="bl">로그아웃</span></button>
    </div>
  </header>

  <section class="greet">
    <h2>오늘은 어디로 갈까요?</h2>
    <p id="greetSub">가족 대시보드를 골라 주세요.</p>
  </section>

  <main class="hub-grid" id="hubGrid" aria-label="가족 대시보드 목록"></main>

  <p class="hub-foot">우리 집 대시보드 · 가족 모두 함께 쓰는 공간이에요 🌿</p>
</div>

<div class="login" id="loginScreen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="login-logo" aria-hidden="true">🏠</span>
      <div>
        <h1>jadenfamily</h1>
        <p>우리 집 대시보드 · 가족만 들어올 수 있어요</p>
      </div>
    </div>
    <div id="loginBody"></div>
  </div>
</div>

<div class="hist" id="acctModal" hidden role="dialog" aria-modal="true" aria-labelledby="acctTitle">
  <div class="hist-card">
    <div class="hist-head">
      <h2 id="acctTitle">👥 계정 관리</h2>
      <button class="hist-close" type="button" data-act="accounts-close" aria-label="계정 관리 닫기">✕</button>
    </div>
    <div class="hist-body" id="acctBody"></div>
  </div>
</div>

<div class="toast" id="dashToast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============ 기본값 / 상수 ============ */
  var API_BASE = 'https://api.github.com';
  var DEFAULT_OWNER = 'jadenfamily';
  var DEFAULT_REPO = 'kids-dashboard-data';

  /* 아이 대시보드·냉장고 대시보드와 똑같은 키를 써요 (같은 주소라서 로그인이 함께 이어져요) */
  var DEVICE_KEY = 'kidsDashboard.device.v1';
  var USERS_CACHE_KEY = 'kidsDashboard.users.v1';
  var SHA_KEY = 'kidsDashboard.sha.v1';
  var LAST_ID_KEY = 'kidsDashboard.lastId';
  var LAST_REMEMBER_KEY = 'kidsDashboard.remember';
  var SESSION_KEY = 'kidsDashboard.session.v1';
  var HUB_LAST_KEY = 'kidsDashboard.hub.last';
  var SESSION_MS = 30 * 24 * 60 * 60 * 1000; /* 로그인 유지 30일 */

  var ROLES = {
    admin: { label: '관리자', perms: { check: 1, sticker: 1, stickerManage: 1, edit: 1, reset: 1, history: 1, accounts: 1 } },
    parent: { label: '보호자', perms: { check: 1, sticker: 1, stickerManage: 1, edit: 1, reset: 1, history: 1 } },
    child: { label: '아이', perms: { check: 1, sticker: 1, history: 1 } },
    viewer: { label: '보기 전용', perms: { history: 1 } }
  };

  /* 가족 대시보드 목록 (여기에 한 줄씩 추가하면 카드가 생겨요) */
  var DASHBOARDS = [
    { id: 'kids', emoji: '🌟', title: "Jaden's Today", desc: '하루 루틴 · 칭찬 스티커 · 학원 시간표', kind: 'link', cls: 'kids', url: '../kids-dashboard/' },
    { id: 'fridge', emoji: '🧊', title: '냉장고 파먹기', desc: '식재료 재고 · 장보기 알림 · 주간 식단', kind: 'link', cls: 'fridge', url: '../fridge-dashboard/' },
    { id: 'ledger', emoji: '📒', title: '가계부', desc: '수입·고정비·변동지출과 예산을 한곳에', kind: 'link', cls: 'ledger', url: '../ledger-dashboard/' }
  ];

  var cloud = { conn: null, users: null, me: null, session: null, status: 'idle', statusAt: 0, sha: {} };
  var acct = { pwFor: '', msg: '', busy: false, link: '' };
  var connectPrefill = null;
  var connectJustDone = false;
  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  /* ============ 작은 도구들 ============ */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      if (c === '"') return '&quot;';
      return '&#39;';
    });
  }
  function fmtDate(d) {
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_NAMES[d.getDay()] + '요일';
  }
  function fmtClock(d) {
    var h = d.getHours();
    var ap = h < 12 ? '오전' : '오후';
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return ap + ' ' + h12 + ':' + pad2(d.getMinutes());
  }
  function roleLabel(role) { return (ROLES[role] && ROLES[role].label) || '보기 전용'; }
  function roleOptions(sel) {
    var out = '';
    for (var key in ROLES) {
      if (!Object.prototype.hasOwnProperty.call(ROLES, key)) continue;
      out += '<option value="' + key + '"' + (key === sel ? ' selected' : '') + '>' + ROLES[key].label + '</option>';
    }
    return out;
  }
  function initialOf(name) {
    var s = String(name || '').trim();
    return s ? s.slice(0, 1) : '·';
  }
  function can(perm) {
    if (!cloud || !cloud.me) return false;
    var r = ROLES[cloud.me.role];
    return !!(r && r.perms && r.perms[perm]);
  }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function ssGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { window.sessionStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function ssDel(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function fieldVal(id) { var el = document.getElementById(id); return el ? String(el.value == null ? '' : el.value) : ''; }

  function randomHex(n) {
    var bytes = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < n; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytesToHex(bytes);
  }
  function bytesToHex(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += ('0' + bytes[i].toString(16)).slice(-2);
    return s;
  }
  async function sha256Hex(text) {
    if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest)) {
      throw new Error('이 브라우저에서는 암호화 기능을 쓸 수 없어요. Safari/Chrome을 최신 버전으로 올려 주세요.');
    }
    var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text)));
    return bytesToHex(new Uint8Array(buf));
  }
  function hashPassword(pw, salt) { return sha256Hex(String(salt) + ':' + String(pw)); }

  /* ============ 기기 연결 정보 / 캐시 ============ */
  function loadDevice() {
    try {
      var j = JSON.parse(lsGet(DEVICE_KEY) || 'null');
      if (j && j.owner && j.repo && j.token) return { owner: j.owner, repo: j.repo, token: j.token, branch: j.branch || 'main', at: j.at || 0 };
    } catch (e) { /* 무시 */ }
    return null;
  }
  function saveDevice(c) { if (c) lsSet(DEVICE_KEY, JSON.stringify(c)); else lsDel(DEVICE_KEY); }

  function clearSession() {
    lsDel(SESSION_KEY);
    ssDel(SESSION_KEY);
    cloud.session = null;
  }
  function loadSession() {
    var raw = lsGet(SESSION_KEY);
    var store = 'local';
    if (!raw) { raw = ssGet(SESSION_KEY); store = 'session'; }
    if (!raw) return null;
    var j = null;
    try { j = JSON.parse(raw); } catch (e) { j = null; }
    if (!j || !j.id) { clearSession(); return null; }
    var exp = Number(j.expiresAt) || 0;
    if (store === 'local' && (!exp || exp <= Date.now())) { clearSession(); return null; } /* 30일 만료 */
    return {
      id: String(j.id),
      name: String(j.name || j.id),
      role: ROLES[j.role] ? j.role : 'viewer',
      store: store,
      issuedAt: Number(j.issuedAt) || 0,
      expiresAt: exp
    };
  }
  function saveSession(me, remember, prev) {
    if (!me || !me.id) return null;
    var now = Date.now();
    var keepExp = (prev && prev.store === 'local' && prev.expiresAt > now) ? prev.expiresAt : 0;
    var s = {
      version: 1,
      id: me.id,
      name: me.name || me.id,
      role: ROLES[me.role] ? me.role : 'viewer',
      store: remember ? 'local' : 'session',
      issuedAt: (prev && prev.issuedAt) || now,
      expiresAt: remember ? (keepExp || (now + SESSION_MS)) : 0
    };
    clearSession();
    var ok = remember ? lsSet(SESSION_KEY, JSON.stringify(s)) : ssSet(SESSION_KEY, JSON.stringify(s));
    if (!ok) return null;
    cloud.session = s;
    return s;
  }
  function loadUsersCache() { try { return JSON.parse(lsGet(USERS_CACHE_KEY) || 'null'); } catch (e) { return null; } }
  function saveUsersCache(u) { if (u) lsSet(USERS_CACHE_KEY, JSON.stringify(u)); }
  function loadShaCache() { try { return JSON.parse(lsGet(SHA_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function rememberSha(p, sha) { if (!p || !sha) return; cloud.sha[p] = sha; lsSet(SHA_KEY, JSON.stringify(cloud.sha || {})); }

  /* ============ GitHub Contents API ============ */
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + (token || (cloud.conn && cloud.conn.token) || ''),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function ghBase() { return API_BASE + '/repos/' + encodeURIComponent(cloud.conn.owner) + '/' + encodeURIComponent(cloud.conn.repo); }
  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(String(str));
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return window.btoa(bin);
  }
  function b64decodeUtf8(b64) {
    var bin = window.atob(String(b64 || '').replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
    return decodeURIComponent(escape(bin));
  }

  async function ghGet(path) {
    var branch = (cloud.conn && cloud.conn.branch) || 'main';
    var url = ghBase() + '/contents/' + path + '?ref=' + encodeURIComponent(branch) + '&_=' + Date.now();
    try {
      var res = await window.fetch(url, { headers: ghHeaders(), cache: 'no-store' });
      if (res.status === 404) return { ok: true, missing: true };
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var j = await res.json();
      if (Object.prototype.toString.call(j) === '[object Array]') return { ok: true, list: j };
      var text = j && j.content ? b64decodeUtf8(j.content) : '';
      var data = null;
      if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
      rememberSha(path, j && j.sha);
      return { ok: true, data: data, sha: j && j.sha, raw: text };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghPut(path, obj, message) {
    var payload = {
      message: message || ('업데이트: ' + path),
      content: b64encodeUtf8(JSON.stringify(obj, null, 2)),
      branch: (cloud.conn && cloud.conn.branch) || 'main'
    };
    if (cloud.sha[path]) payload.sha = cloud.sha[path];
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var res = await window.fetch(ghBase() + '/contents/' + path, {
          method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload)
        });
        if (res.ok) {
          var j = await res.json();
          rememberSha(path, j && j.content && j.content.sha);
          return { ok: true };
        }
        if (res.status === 409 || res.status === 422 || res.status === 404) {
          var cur = await ghGet(path);
          if (!cur.ok) return { ok: false, status: cur.status, error: cur.error };
          if (cur.missing) delete payload.sha;
          else payload.sha = cur.sha;
          continue;
        }
        if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
        if (res.status === 403) return { ok: false, status: 403, error: '쓰기 권한이 없어요' };
        return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
      }
    }
    return { ok: false, status: 409, error: '다른 기기에서 먼저 저장했어요' };
  }

  function renderSyncPill() {

  /* ============ 로그인 / 기기 연결 ============ */
  async function doSetup() {
    var owner = fieldVal('setupOwner').trim();
    var repo = fieldVal('setupRepo').trim();
    var token = fieldVal('setupToken').trim();
    var pw = fieldVal('setupPw');
    var pw2 = fieldVal('setupPw2');
    var msg = document.getElementById('setupMsg');
    function fail(t) { if (msg) { msg.className = 'lf-msg'; msg.textContent = t; } }

    if (!owner || !repo || !token) return fail('GitHub 아이디, 저장소 이름, 토큰을 모두 넣어 주세요.');
    if (!/^[A-Za-z0-9-]{1,39}$/.test(owner)) return fail('GitHub 아이디 형식을 확인해 주세요.');
    if (!/^[A-Za-z0-9._-]{1,100}$/.test(repo)) return fail('저장소 이름 형식을 확인해 주세요.');
    if (!/^(gh[pousr]_|github_pat_)/.test(token)) return fail('GitHub 토큰 형식이 아니에요. (github_pat_… 로 시작해요)');

    var btn = document.getElementById('setupBtn');
    if (btn) { btn.disabled = true; btn.textContent = '연결하는 중…'; }
    var prev = cloud.conn;
    cloud.conn = { owner: owner, repo: repo, token: token, branch: 'main', at: Date.now() };
    try {
      var res = await window.fetch(API_BASE + '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo), { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 401) { cloud.conn = prev; return fail('토큰이 올바르지 않아요. 다시 확인해 주세요.'); }
      if (res.status === 404) { cloud.conn = prev; return fail('저장소를 찾을 수 없어요. 아이디·저장소 이름과 토큰이 그 저장소를 포함하는지 확인해 주세요.'); }
      if (res.status === 403) { cloud.conn = prev; return fail('토큰에 저장소 접근 권한이 없어요. Fine-grained 토큰의 Contents를 Read and write로 주세요.'); }
      if (!res.ok) { cloud.conn = prev; return fail('저장소를 확인하지 못했어요. (HTTP ' + res.status + ')'); }
      var info = await res.json();
      if (info && info.private === false) { cloud.conn = prev; return fail('비공개(private) 저장소만 연결할 수 있어요. GitHub에서 저장소를 Private로 바꿔 주세요.'); }
      if (info && info.permissions && info.permissions.push === false) {
        cloud.conn = prev;
        return fail('이 토큰에는 쓰기 권한이 없어요. Contents 권한을 Read and write로 바꿔 주세요.');
      }

      cloud.sha = loadShaCache();
      var cur = await ghGet('config/users.json');
      if (!cur.ok && cur.status !== 404 && cur.missing !== true) { cloud.conn = prev; return fail('계정 파일을 확인하지 못했어요. (' + (cur.error || '') + ')'); }

      if (cur.ok && cur.data && Object.prototype.toString.call(cur.data.users) === '[object Array]') {
        cloud.users = cur.data;
        saveUsersCache(cur.data);
        if (!cur.data.users.length) {
          if (pw.length < 4) { cloud.conn = prev; return fail('관리자 비밀번호를 4자 이상으로 정해 주세요.'); }
          if (pw !== pw2) { cloud.conn = prev; return fail('비밀번호 확인이 맞지 않아요.'); }
          var salt0 = randomHex(16);
          var users0 = { version: 1, updatedAt: new Date().toISOString(), users: [{ id: 'admin', name: '관리자', role: 'admin', salt: salt0, hash: await hashPassword(pw, salt0), createdAt: new Date().toISOString() }] };
          var put0 = await ghPut('config/users.json', users0, '관리자 계정 만들기');
          if (!put0.ok) { cloud.conn = prev; return fail('계정 파일을 만들지 못했어요. (' + (put0.error || '') + ')'); }
          cloud.users = users0;
          saveUsersCache(users0);
        }
      } else if (cur.ok && cur.missing) {
        if (pw.length < 4) { cloud.conn = prev; return fail('관리자 비밀번호를 4자 이상으로 정해 주세요.'); }
        if (pw !== pw2) { cloud.conn = prev; return fail('비밀번호 확인이 맞지 않아요.'); }
        var salt = randomHex(16);
        var users = { version: 1, updatedAt: new Date().toISOString(), users: [{ id: 'admin', name: '관리자', role: 'admin', salt: salt, hash: await hashPassword(pw, salt), createdAt: new Date().toISOString() }] };
        var put = await ghPut('config/users.json', users, '관리자 계정 만들기');
        if (!put.ok) { cloud.conn = prev; return fail('계정 파일을 만들지 못했어요. (' + (put.error || '') + ')'); }
        cloud.users = users;
        saveUsersCache(users);
      }

      saveDevice(cloud.conn);
      clearSession(); /* 기기를 다시 연결했으면 다시 로그인 */
      setSync('ok');
      renderLoginBody('login');
      var lm = document.getElementById('loginMsg');
      if (lm) { lm.className = 'lf-msg ok'; lm.textContent = '기기 연결 완료! 아이디와 비밀번호로 로그인해 주세요.'; }
    } catch (e) {
      cloud.conn = prev;
      fail('연결에 실패했어요. 인터넷 연결과 토큰을 확인해 주세요.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '기기 연결하고 시작'; }
    }
  }

  async function doLogin() {
    var id = fieldVal('loginId').trim().toLowerCase();
    var pw = fieldVal('loginPw');
    var rememberEl = document.getElementById('loginRemember');
    var remember = rememberEl ? !!rememberEl.checked : true;
    var msg = document.getElementById('loginMsg');
    function fail(t) { if (msg) { msg.className = 'lf-msg'; msg.textContent = t; } }
    if (!id || !pw) return fail('아이디와 비밀번호를 넣어 주세요.');
    if (!cloud.conn) { renderLoginBody('setup'); return; }

    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
    try {
      setSync('syncing');
      var fresh = await ghGet('config/users.json');
      if (fresh.ok && fresh.data && Object.prototype.toString.call(fresh.data.users) === '[object Array]') {
        cloud.users = fresh.data;
        saveUsersCache(fresh.data);
      } else if (!fresh.ok && fresh.status !== 404) {
        if (!cloud.users) {
          return fail(navigator.onLine === false ? '오프라인 상태예요. 인터넷에 연결한 뒤 다시 시도해 주세요.' : '계정 정보를 불러오지 못했어요. (' + (fresh.error || '') + ')');
        }
      }
      var users = (cloud.users && cloud.users.users) || [];
      var u = null;
      for (var i = 0; i < users.length; i++) {
        if (String(users[i].id).toLowerCase() === id) { u = users[i]; break; }
      }
      var ok = false;
      if (u && u.salt && u.hash) {
        var hash = await hashPassword(pw, u.salt);
        ok = (hash === u.hash);
      }
      if (!ok) { setSync(navigator.onLine === false ? 'offline' : 'ok'); return fail('아이디 또는 비밀번호가 맞지 않아요.'); }
      lsSet(LAST_ID_KEY, u.id);
      lsSet(LAST_REMEMBER_KEY, remember ? '1' : '0');
      cloud.me = { id: u.id, name: u.name || u.id, role: ROLES[u.role] ? u.role : 'viewer' };
      saveSession(cloud.me, remember, null);
      enterPortal();
    } catch (e) {
      fail('로그인 중 문제가 생겼어요. ' + (e && e.message ? e.message : ''));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
    }
  }

  function doLogout(silent) {
    clearSession();
    cloud.me = null;
    closeAccounts();
    if (!silent) showToast('로그아웃했어요.');
    showLogin('login');
  }

  /* ============ 세션 이어쓰기 ============ */
  function findUserById(id) {
    var users = (cloud.users && cloud.users.users) || [];
    var key = String(id || '').toLowerCase();
    for (var i = 0; i < users.length; i++) {
      if (String(users[i].id).toLowerCase() === key) return users[i];
    }
    return null;
  }

  async function restoreSession(sess) {
    setSync('syncing');
    var u = findUserById(sess.id);
    if (!u) {
      var res = await ghGet('config/users.json');
      if (res.ok && res.data && Object.prototype.toString.call(res.data.users) === '[object Array]') {
        cloud.users = res.data;
        saveUsersCache(res.data);
        u = findUserById(sess.id);
      }
      if (!u) {
        clearSession();
        showLogin('login');
        setLoginMsg(navigator.onLine === false ? '오프라인이라 로그인 상태를 확인하지 못했어요. 인터넷에 연결한 뒤 다시 열어 주세요.' : '계정을 찾을 수 없어 다시 로그인해야 해요.');
        setSync(navigator.onLine === false ? 'offline' : 'error');
        return;
      }
    }
    cloud.me = { id: u.id, name: u.name || u.id, role: ROLES[u.role] ? u.role : 'viewer' };
    saveSession(cloud.me, sess.store === 'local', sess);
    enterPortal();
    verifySession();
  }

  async function verifySession() {
    if (!cloud.conn || !cloud.me) return;
    var res = await ghGet('config/users.json');
    if (!res.ok) { setSync(res.status === 401 ? 'error' : (navigator.onLine === false ? 'offline' : 'ok')); return; }
    if (!res.data || Object.prototype.toString.call(res.data.users) !== '[object Array]') return;
    cloud.users = res.data;
    saveUsersCache(res.data);
    var u = findUserById(cloud.me.id);
    if (!u) {
      clearSession();
      cloud.me = null;
      showLogin('login');
      setLoginMsg('계정이 삭제되어 로그아웃했어요. 다시 로그인해 주세요.');
      return;
    }
    var role = ROLES[u.role] ? u.role : 'viewer';
    var name = u.name || u.id;
    if (role !== cloud.me.role || name !== cloud.me.name) {
      cloud.me = { id: u.id, name: name, role: role };
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
      applyUserUi();
      applyPermissions();
      renderGreeting();
    }
    setSync('ok');
  }

  /* ============ 계정 관리 ============ */
  /* iOS Safari는 body overflow만으로는 뒷페이지 스크롤을 막지 못해서 body를 fixed로 고정한다. */
  var scrollLock = { on: false, y: 0 };
  function lockBodyScroll() {
    if (scrollLock.on) return;
    scrollLock.y = window.scrollY || window.pageYOffset || 0;
    var b = document.body, h = document.documentElement;
    b.style.position = 'fixed';
    b.style.top = '-' + scrollLock.y + 'px';
    b.style.left = '0';
    b.style.right = '0';
    b.style.width = '100%';
    b.style.overflow = 'hidden';
    h.style.overflow = 'hidden';
    scrollLock.on = true;
  }
  function unlockBodyScroll() {
    if (!scrollLock.on) return;
    var b = document.body, h = document.documentElement;
    b.style.position = '';
    b.style.top = '';
    b.style.left = '';
    b.style.right = '';
    b.style.width = '';
    b.style.overflow = '';
    h.style.overflow = '';
    scrollLock.on = false;
    window.scrollTo(0, scrollLock.y);
  }

  function acctCountAdmins() {

    for (var i = 0; i < users.length; i++) if (users[i].role === 'admin') n++;

  function renderAccounts() {
    var body = document.getElementById('acctBody');
    if (!body) return;
    body.innerHTML = accountsHtml();
  }
  function acctFail(msg) { acct.msg = msg; renderAccounts(); }

  async function persistUsers(message) {
    cloud.users.version = 1;
    cloud.users.updatedAt = new Date().toISOString();
    var res = await ghPut('config/users.json', cloud.users, message || '계정 업데이트');
    if (res.ok) saveUsersCache(cloud.users);
    return res;
  }

  async function addAccount() {
    if (!can('accounts') || !cloud.users) return;
    var id = fieldVal('acctNewId').trim().toLowerCase();
    var name = fieldVal('acctNewName').trim();
    var role = fieldVal('acctNewRole');
    var pw = fieldVal('acctNewPw');
    if (!/^[a-z0-9_-]{2,20}$/.test(id)) return acctFail('아이디는 영문 소문자·숫자·_·- 로 2~20자로 정해 주세요.');
    if (pw.length < 4) return acctFail('비밀번호는 4자 이상으로 정해 주세요.');
    if (!ROLES[role]) role = 'child';
    var users = cloud.users.users;
    for (var i = 0; i < users.length; i++) if (String(users[i].id).toLowerCase() === id) return acctFail('이미 쓰고 있는 아이디예요.');
    acct.msg = '저장하는 중…';
    renderAccounts();
    var salt = randomHex(16);
    var u = { id: id, name: name || id, role: role, salt: salt, hash: await hashPassword(pw, salt), createdAt: new Date().toISOString() };
    users.push(u);
    var res = await persistUsers('계정 추가: ' + id);
    if (!res.ok) {
      users.pop();
      return acctFail('저장하지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.msg = id + ' 계정을 추가했어요.';
    renderAccounts();
  }

  async function changeRole(id, role) {
    if (!can('accounts') || !cloud.users) return;
    if (!ROLES[role]) return;
    var users = cloud.users.users;
    var target = null;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { target = users[i]; break; }
    if (!target) return;
    var prev = target.role;
    if (prev === 'admin' && role !== 'admin' && acctCountAdmins() <= 1) {
      return acctFail('관리자는 최소 한 명이 있어야 해요.');
    }
    target.role = role;
    var res = await persistUsers('권한 변경: ' + id + ' → ' + role);
    if (!res.ok) {
      target.role = prev;
      return acctFail('권한을 바꾸지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    if (cloud.me && cloud.me.id === id) {
      cloud.me.role = role;
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
    }
    acct.msg = id + ' 권한을 ' + roleLabel(role) + '(으)로 바꿨어요.';
    renderAccounts();
    applyUserUi();
    applyPermissions();
    renderGreeting();
  }

  async function deleteAccount(id) {
    if (!can('accounts') || !cloud.users) return;
    if (cloud.me && cloud.me.id === id) return acctFail('지금 로그인한 계정은 지울 수 없어요.');
    var users = cloud.users.users;
    var idx = -1;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    if (users[idx].role === 'admin' && acctCountAdmins() <= 1) return acctFail('관리자는 최소 한 명이 있어야 해요.');
    if (!window.confirm('"' + (users[idx].name || id) + '" 계정을 지울까요? 지금 화면은 그대로지만, 다음에 그 계정으로는 로그인할 수 없게 돼요.')) return;
    var removed = users.splice(idx, 1)[0];
    var res = await persistUsers('계정 삭제: ' + id);
    if (!res.ok) {
      users.splice(idx, 0, removed);
      return acctFail('삭제하지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.msg = id + ' 계정을 지웠어요.';
    renderAccounts();
  }

  async function saveAccountPassword() {
    if (!can('accounts') || !cloud.users) return;
    var form = document.getElementById('acctPwForm');
    if (!form) return;
    var id = form.getAttribute('data-id');
    var pw = fieldVal('acctPwNew');
    if (pw.length < 4) return acctFail('비밀번호는 4자 이상으로 정해 주세요.');
    var users = cloud.users.users;
    var target = null;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { target = users[i]; break; }
    if (!target) return;
    var oldSalt = target.salt, oldHash = target.hash;
    var salt = randomHex(16);
    target.salt = salt;
    target.hash = await hashPassword(pw, salt);
    var res = await persistUsers('비밀번호 변경: ' + id);
    if (!res.ok) {
      target.salt = oldSalt;
      target.hash = oldHash;
      return acctFail('비밀번호를 바꾸지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.pwFor = '';
    acct.msg = id + ' 비밀번호를 바꿨어요.';
    renderAccounts();
  }

  /* ============ 새 기기 연결 링크 (#connect=…) ============ */
  function b64urlEncodeUtf8(str) {
    return b64encodeUtf8(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDecodeUtf8(s) {
    var t = String(s || '').replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
    while (t.length % 4) t += '=';
    return b64decodeUtf8(t);
  }
  function buildConnectLink() {
    var c = cloud.conn;
    if (!c || !c.owner || !c.repo || !c.token) return '';
    var payload = { owner: c.owner, repo: c.repo, token: c.token, branch: c.branch || 'main' };
    var base = String(window.location.href || '').split('#')[0].split('?')[0];
    if (!/\/$/.test(base) && !/\.html?$/i.test(base)) base += '/';
    if (/\/index\.html?$/i.test(base)) base = base.replace(/index\.html?$/i, '');
    return base + '#connect=' + b64urlEncodeUtf8(JSON.stringify(payload));
  }

  function showToast(text) {
    var el = document.getElementById('dashToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'dashToast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.classList.add('show');
    if (showToast.timer) window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(function () { el.classList.remove('show'); }, 2800);
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      function legacy() {
        var ok = false;
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.width = '1px';
          ta.style.height = '1px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try { ta.setSelectionRange(0, text.length); } catch (e) { /* 무시 */ }
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
        } catch (e) { ok = false; }
        resolve(!!ok);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, legacy);
          return;
        } catch (e) { /* 아래 fallback */ }
      }
      legacy();
    });
  }

  async function copyConnectLink() {
    if (!can('accounts')) return;
    var link = buildConnectLink();
    if (!link) {
      acct.link = '';
      acct.msg = '이 기기의 연결 정보가 없어 링크를 만들 수 없어요. 기기를 다시 연결한 뒤 시도해 주세요.';
      renderAccounts();
      return;
    }
    var ok = await copyText(link);
    acct.msg = '';
    acct.link = ok ? '' : link;
    renderAccounts();
    if (ok) showToast('연결 링크를 복사했어요! 가족에게 보내주세요.');
    else showToast('자동 복사가 안 돼요. 아래 링크를 길게 눌러 복사해 주세요.');
  }

  function takeConnectHash() {
    var hash = String(window.location.hash || '');
    if (hash.indexOf('#connect=') !== 0) return null;
    var encoded = hash.slice(9);
    /* 주소창에서 토큰이 보이지 않도록 바로 지워요 */
    try {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    } catch (e) {
      try { window.location.hash = ''; } catch (e2) { /* 무시 */ }
    }
    return encoded;
  }

  function parseConnectPayload(encoded) {
    var tries = [String(encoded || '')];
    try {
      var dec = decodeURIComponent(tries[0]);
      if (dec !== tries[0]) tries.push(dec);
    } catch (e) { /* 무시 */ }
    for (var i = 0; i < tries.length; i++) {
      try {
        var obj = JSON.parse(b64urlDecodeUtf8(tries[i]));
        if (obj && typeof obj === 'object' && !Array.isArray(obj)) return obj;
      } catch (e) { /* 다음 시도 */ }
    }
    return null;
  }

  function showConnectProgress(text) {
    var login = document.getElementById('loginScreen');
    var portal = document.getElementById('portalRoot');
    if (portal) portal.hidden = true;
    if (login) login.hidden = false;
    closeAccounts(); /* 계정 팝업이 열려 있었다면 닫고 배경 스크롤 잠금도 푼다 */
    var body = document.getElementById('loginBody');
    if (body) {
      body.innerHTML = '<div class="lf">' +
        '<p class="lf-note">🔗 새 기기를 연결하는 중이에요. 잠시만 기다려 주세요…</p>' +
        '<p class="lf-msg" id="connectMsg">' + esc(text || '') + '</p>' +
        '</div>';
    }
  }

  function connectFail(msg) {
    showLogin('setup');
    var m = document.getElementById('setupMsg');
    if (m) { m.className = 'lf-msg'; m.textContent = msg; }
  }

  async function applyConnectLink(encoded) {
    showConnectProgress();
    var data = parseConnectPayload(encoded);
    if (!data) return connectFail('연결 링크가 올바르지 않아요. 관리자 기기에서 링크를 다시 복사해 열어 주세요.');

    var owner = String(data.owner == null ? '' : data.owner).trim();
    var repo = String(data.repo == null ? '' : data.repo).trim();
    var token = String(data.token == null ? '' : data.token).trim();
    var branch = String(data.branch == null ? '' : data.branch).trim() || 'main';
    connectPrefill = { owner: owner, repo: repo };

    if (!owner || !repo || !token) return connectFail('연결 링크에 필요한 정보가 빠져 있어요. 관리자 기기에서 링크를 다시 복사해 주세요.');
    if (!/^[A-Za-z0-9-]{1,39}$/.test(owner)) return connectFail('연결 링크의 GitHub 아이디 형식이 올바르지 않아요. 링크를 다시 복사해 주세요.');
    if (!/^[A-Za-z0-9._-]{1,100}$/.test(repo)) return connectFail('연결 링크의 저장소 이름 형식이 올바르지 않아요. 링크를 다시 복사해 주세요.');
    if (!/^(gh[pousr]_|github_pat_)/.test(token)) return connectFail('연결 링크의 토큰 형식이 올바르지 않아요. 관리자 기기에서 링크를 다시 복사해 주세요.');
    if (!/^[A-Za-z0-9._\/-]{1,120}$/.test(branch)) branch = 'main';

    if (navigator.onLine === false) return connectFail('인터넷에 연결되어 있지 않아요. 연결한 뒤 링크를 다시 열어 주세요.');

    var prev = cloud.conn;
    cloud.conn = { owner: owner, repo: repo, token: token, branch: branch, at: Date.now() };
    try {
      var res = await window.fetch(API_BASE + '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo), { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 401) { cloud.conn = prev; return connectFail('연결 링크의 토큰이 올바르지 않아요. 관리자에게 새 링크를 받아 주세요.'); }
      if (res.status === 404) { cloud.conn = prev; return connectFail('연결 링크의 저장소를 찾을 수 없어요. 관리자에게 새 링크를 받아 주세요.'); }
      if (res.status === 403) { cloud.conn = prev; return connectFail('연결 링크의 토큰에 저장소 접근 권한이 없어요. 관리자에게 새 링크를 받아 주세요.'); }
      if (!res.ok) { cloud.conn = prev; return connectFail('저장소를 확인하지 못했어요. (HTTP ' + res.status + ') 관리자에게 새 링크를 받아 주세요.'); }
      var info = await res.json();
      if (info && info.private === false) { cloud.conn = prev; return connectFail('연결 링크가 가리키는 저장소가 비공개가 아니에요. 관리자에게 새 링크를 받아 주세요.'); }
      if (info && info.permissions && info.permissions.push === false) { cloud.conn = prev; return connectFail('연결 링크의 토큰에 쓰기 권한이 없어요. 관리자에게 새 링크를 받아 주세요.'); }

      cloud.sha = loadShaCache() || {};
      var cur = await ghGet('config/users.json');
      if (!cur.ok) { cloud.conn = prev; return connectFail('계정 정보를 불러오지 못했어요. (' + (cur.error || '') + ') 관리자에게 새 링크를 받아 주세요.'); }
      if (!(cur.data && Object.prototype.toString.call(cur.data.users) === '[object Array]')) {
        cloud.conn = prev;
        return connectFail('이 저장소에는 아직 계정이 없어요. 관리자 기기에서 계정을 먼저 만든 뒤 새 링크를 받아 주세요.');
      }

      cloud.users = cur.data;
      saveUsersCache(cur.data);
      cloud.conn.at = Date.now();
      saveDevice(cloud.conn);
      clearSession(); /* 새로 연결했으면 이전 로그인은 지우고 아이디·비밀번호로 다시 받아요 */
      connectJustDone = true;
      setSync('ok');
      showLogin('login');
      var lm = document.getElementById('loginMsg');
      if (lm) { lm.className = 'lf-msg ok'; lm.textContent = '기기가 자동으로 연결됐어요! 아이디와 비밀번호로 로그인해 주세요.'; }
    } catch (e) {
      cloud.conn = prev;
      connectFail('연결하지 못했어요. 인터넷 연결을 확인한 뒤 링크를 다시 열어 주세요.');
    }
  }

  /* ============ 이벤트 ============ */
  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'logout') { doLogout(); return; }
    if (act === 'accounts-open') { openAccounts(); return; }
    if (act === 'accounts-close') { closeAccounts(); return; }
    if (act === 'acct-pw') { acct.pwFor = el.getAttribute('data-id') || ''; acct.msg = ''; renderAccounts(); return; }
    if (act === 'acct-pw-cancel') { acct.pwFor = ''; renderAccounts(); return; }
    if (act === 'acct-del') { deleteAccount(el.getAttribute('data-id')); return; }
    if (act === 'acct-connect-link') { copyConnectLink(); return; }
    if (act === 'acct-link-select') { try { el.focus(); el.select(); } catch (e2) { /* 무시 */ } return; }
    if (act === 'relink') { renderLoginBody('setup'); return; }
    if (act === 'relink-cancel') { renderLoginBody(cloud.conn ? 'login' : 'setup'); return; }
    if (act === 'hub-go') { lsSet(HUB_LAST_KEY, el.getAttribute('data-id') || ''); return; } /* 기본 동작(이동)은 그대로 */
  });

  document.addEventListener('click', function (e) {
    var a = document.getElementById('acctModal');
    if (a && !a.hidden && e.target === a) closeAccounts();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    var a = document.getElementById('acctModal');
    if (a && !a.hidden) closeAccounts();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-act') === 'acct-role') changeRole(el.getAttribute('data-id'), el.value);
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || !f.id) return;
    if (f.id === 'loginForm') { e.preventDefault(); doLogin(); return; }
    if (f.id === 'setupForm') { e.preventDefault(); doSetup(); return; }
    if (f.id === 'acctAddForm') { e.preventDefault(); addAccount(); return; }
    if (f.id === 'acctPwForm') { e.preventDefault(); saveAccountPassword(); return; }
  });

  /* ============ 시작 ============ */
  function init() {
    cloud.conn = loadDevice();
    cloud.users = loadUsersCache();
    cloud.sha = loadShaCache() || {};
    renderClock();
    if (renderClock.timer) window.clearInterval(renderClock.timer);
    renderClock.timer = window.setInterval(renderClock, 30000);

    /* 새 기기 연결 링크(#connect=…)로 들어왔으면 토큰 입력 없이 바로 연결해요 */
    var connectPayload = takeConnectHash();
    if (connectPayload !== null) { applyConnectLink(connectPayload); return; }

    var sess = cloud.conn ? loadSession() : null;
    if (!cloud.conn) { clearSession(); showLogin('setup'); return; }
    if (!sess) { showLogin('login'); return; }
    restoreSession(sess);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
