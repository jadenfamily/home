<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>jadenfamily</title>
<meta name="description" content="우리 집 대시보드">
<meta name="apple-mobile-web-app-title" content="jadenfamily">
<meta property="og:title" content="jadenfamily">
<meta property="og:description" content="우리 집 대시보드">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="jadenfamily">
<meta name="twitter:description" content="우리 집 대시보드">
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --line:#f1e6da;
    --card:#ffffff;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --r-lg:26px;
    --sun:#ff9f1c;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ff5c8a;
    --sky:#3d9be9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
    min-height:100vh;
    background-color:#fff8ef;
    background-image:
      radial-gradient(circle at 8% -6%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% -2%, #dcf0ff 0, rgba(220,240,255,0) 44%),
      radial-gradient(circle at 50% 112%, #ffe7f0 0, rgba(255,231,240,0) 46%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }
  select,input{ font-family:inherit; }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:inherit; }

  @keyframes popIn{ 0%{transform:scale(.94); opacity:0} 100%{transform:scale(1); opacity:1} }

  /* ---------- 허브 화면 ---------- */
  .portal{
    max-width:1180px; margin:0 auto;
    padding:clamp(14px,2.4vw,30px) clamp(12px,2.2vw,24px) calc(38px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:clamp(14px,2.2vw,24px);
  }
  .topbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-logo{
    width:52px; height:52px; border-radius:18px; flex:0 0 auto;
    background:linear-gradient(135deg,#fff0cf,#ffe1ef); display:grid; place-items:center;
    font-size:27px; line-height:1; box-shadow:var(--shadow);
  }
  .brand-text{ min-width:0; }
  .brand-text h1{ margin:0; font-size:clamp(20px,2.4vw,26px); font-weight:900; letter-spacing:-.025em; }
  .brand-sub{
    margin:4px 0 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:12px; font-weight:800; color:var(--ink-2);
  }
  .dot{ color:#cbbfae; }
  .sync-pill{
    font-size:11px; font-weight:900; padding:3px 8px; border-radius:999px; white-space:nowrap;
    background:#fff; color:#8a7f70; box-shadow:var(--shadow);
  }
  .sync-pill.ok{ background:#eefaf3; color:#0f7a55; }
  .sync-pill.sync{ background:#eef5ff; color:#2f6fb5; }
  .sync-pill.off{ background:#fff4e6; color:#b0610b; }
  .sync-pill.err{ background:#fff0f3; color:#c6415a; }

  .actions{ margin-left:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .user-chip{ display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:3px 8px 3px 4px; box-shadow:var(--shadow); }
  .uc-av{
    width:28px; height:28px; border-radius:10px; flex:0 0 auto; display:grid; place-items:center;
    background:linear-gradient(135deg,#ffe0a8,#ffc9dd); font-size:12.5px; font-weight:900; color:#8a4b00;
  }
  .uc-meta{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .uc-meta b{ font-size:12.5px; font-weight:900; white-space:nowrap; }
  .uc-role{ font-size:9.5px; font-weight:900; color:#a2937f; }
  .edit-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    min-height:44px; padding:0 14px; border:2px solid #f0e4d6; border-radius:14px;
    background:#fff; color:#5d5375; font-size:13px; font-weight:900; letter-spacing:-.01em;
    cursor:pointer; touch-action:manipulation; text-decoration:none; box-shadow:var(--shadow);
  }
  .edit-btn:active{ transform:translateY(1px); }
  .edit-btn .bi{ font-size:15px; line-height:1; }
  .edit-btn.out-btn{ background:linear-gradient(135deg,#fff3f6,#f7f4ff); color:#8a4b6b; border-color:#f6dde7; }

  .greet{ padding:2px 2px 0; }
  .greet h2{ margin:0; font-size:clamp(19px,2.6vw,27px); font-weight:900; letter-spacing:-.03em; }
  .greet p{ margin:6px 0 0; font-size:13px; font-weight:800; color:var(--ink-2); }

  .hub-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(12px,1.6vw,18px); }
  .hub-tile{
    word-break:keep-all;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:9px; text-align:left;
    min-height:236px; padding:22px;
    border-radius:28px; border:2px solid #f1e6da; background:#fff;
    box-shadow:0 10px 26px rgba(118,86,54,.09), 0 2px 6px rgba(118,86,54,.04);
    text-decoration:none; color:inherit; cursor:pointer; touch-action:manipulation;
    transition:transform .16s ease, box-shadow .16s ease;
    animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
  }
  .hub-tile:hover{ transform:translateY(-2px); box-shadow:0 16px 34px rgba(118,86,54,.14), 0 3px 8px rgba(118,86,54,.05); }
  .hub-tile:active{ transform:scale(.99); }
  .hub-tile .ht-emoji{ font-size:46px; line-height:1; }
  .hub-tile .ht-body{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .hub-tile .ht-title{ font-size:21px; font-weight:900; letter-spacing:-.025em; line-height:1.25; }
  .hub-tile .ht-desc{ font-size:13px; font-weight:800; color:var(--ink-2); line-height:1.55; }
  .hub-tile .ht-go{ margin-top:auto; font-size:13px; font-weight:900; color:#0f6b8a; }
  .hub-tile.kids{ background:linear-gradient(155deg,#fff8e8 0%,#fff0f6 100%); border-color:#ffe2cc; }
  .hub-tile.fridge{ background:linear-gradient(155deg,#eaf7ff 0%,#f2f0ff 100%); border-color:#d9e8fb; }
  .hub-tile.ledger{ background:linear-gradient(155deg,#fffdf1 0%,#eefaf3 100%); border-color:#dceee3; }
  .hub-tile .ht-badge{
    position:absolute; top:14px; right:14px; font-size:10.5px; font-weight:900; padding:4px 9px;
    border-radius:999px; background:#fff; color:#8a6a2f; box-shadow:0 2px 8px rgba(0,0,0,.07);
  }
  .hub-foot{ margin:2px 0 0; font-size:11.5px; font-weight:700; color:#a99c8c; line-height:1.6; text-align:center; }

  @media (max-width:720px){
    .hub-grid{ grid-template-columns:1fr; }
    .hub-tile{ min-height:0; flex-direction:row; align-items:center; gap:14px; padding:15px 16px; border-radius:22px; }
    .hub-tile .ht-emoji{ font-size:34px; }
    .hub-tile .ht-go{ margin:0 0 0 auto; white-space:nowrap; }
    .hub-tile .ht-badge{ display:none; }
  }
  @media (max-width:560px){
    .brand-logo{ width:44px; height:44px; border-radius:15px; font-size:23px; }
    .brand-text h1{ font-size:19px; }
    .edit-btn{ min-height:40px; padding:0 11px; font-size:12px; }
    .uc-meta b{ font-size:11.5px; }
    .uc-role{ display:none; }
    .hub-tile{ padding:13px 14px; }
    .hub-tile .ht-title{ font-size:18px; }
    .hub-tile .ht-desc{ font-size:12px; }
  }

  /* ---------- 로그인 / 기기 연결 ---------- */
  .login{
    position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center;
    padding:18px; overflow:auto;
    background:
      radial-gradient(circle at 12% 0%, #ffe6c7 0, rgba(255,230,199,0) 42%),
      radial-gradient(circle at 88% 4%, #dcf0ff 0, rgba(220,240,255,0) 40%),
      radial-gradient(circle at 50% 108%, #ffe7f0 0, rgba(255,231,240,0) 44%),
      #fff8ef;
  }
  .login-card{
    width:100%; max-width:436px; background:#fff; border-radius:28px; padding:26px 24px 22px;
    box-shadow:0 24px 60px rgba(118,86,54,.18);
  }
  .login-brand{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .login-logo{
    width:54px; height:54px; border-radius:18px; flex:0 0 auto;
    background:linear-gradient(135deg,#fff0cf,#ffe1ef); display:grid; place-items:center; font-size:28px;
  }
  .login-brand h1{ margin:0; font-size:21px; font-weight:900; letter-spacing:-.02em; }
  .login-brand p{ margin:3px 0 0; font-size:12.5px; font-weight:800; color:var(--ink-2); }
  .lf{ display:flex; flex-direction:column; gap:11px; }
  .lf label{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:900; color:#6d6484; }
  .lf input, .lf select{
    width:100%; min-height:50px; padding:10px 13px; border-radius:14px; border:2px solid #e6dccf;
    background:#fffdf9; font-size:15px; font-weight:800; color:var(--ink);
  }
  .lf input:focus, .lf select:focus{ outline:none; border-color:#ffb703; box-shadow:0 0 0 4px rgba(255,183,3,.16); }
  .lf-note{ margin:0; font-size:12px; font-weight:700; color:#8a93a8; line-height:1.55; }
  .lf-hint{ margin:0; font-size:11.5px; font-weight:700; color:#a99c8c; line-height:1.5; }
  .lf-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lf label.lf-check{
    flex-direction:row; align-items:center; gap:9px; font-size:12.5px; font-weight:900;
    color:#6d6484; cursor:pointer; touch-action:manipulation; padding:2px 0;
  }
  .lf label.lf-check input[type="checkbox"]{
    width:20px; height:20px; min-height:0; padding:0; flex:0 0 auto; margin:0;
    accent-color:#ff9f1c; cursor:pointer;
  }
  .lf-btn{
    width:100%; min-height:54px; border:none; border-radius:17px; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(135deg,#ffd43b,#ff9f1c); color:#5a3200;
    font-size:17px; font-weight:900; letter-spacing:-.01em; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .lf-btn:active{ transform:translateY(1px); }
  .lf-btn:disabled{ opacity:.6; cursor:default; }
  .lf-msg{ margin:0; min-height:17px; font-size:12.5px; font-weight:800; color:#c6415a; line-height:1.45; }
  .lf-msg.ok{ color:#12805c; }
  .lf-link{ border:none; background:none; color:#7c6aa8; font-size:12.5px; font-weight:900; cursor:pointer; text-decoration:underline; padding:4px; }
  .lf-foot{ margin:4px 0 0; font-size:11px; font-weight:700; color:#b3a696; line-height:1.55; text-align:center; }

  /* ---------- 계정 관리 모달 ---------- */
  .hist{
    position:fixed; inset:0; z-index:85; display:flex; align-items:center; justify-content:center;
    padding:clamp(8px,1.6vw,22px); background:rgba(45,30,10,.45);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    overflow:hidden; overscroll-behavior:contain; touch-action:none;
  }
  .hist-card{
    width:100%; max-width:700px; max-height:94vh; max-height:calc(100dvh - 20px); display:flex; flex-direction:column;
    background:#fffdf9; border-radius:28px; overflow:hidden;
    box-shadow:0 26px 64px rgba(0,0,0,.3); animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
    overscroll-behavior:contain;
  }
  .hist-head{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px 11px; border-bottom:2px solid #f6ece0;
    background:linear-gradient(135deg,#fff6e6 0%,#f5efff 100%);
  }
  .hist-head h2{ margin:0; font-size:clamp(18px,2vw,21px); font-weight:900; letter-spacing:-.02em; }
  .hist-close{
    flex:0 0 auto; width:46px; height:46px; border-radius:15px; border:none; background:#fff;
    color:#8a7f70; font-size:17px; font-weight:900; cursor:pointer; touch-action:manipulation;
    box-shadow:0 4px 10px rgba(0,0,0,.07);
  }
  .hist-close:active{ transform:scale(.94); }
  .hist-body{
    padding:14px 16px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; touch-action:pan-y;
    display:flex; flex-direction:column; gap:13px;
  }
  .acct-list{ display:flex; flex-direction:column; gap:8px; }
  .acct-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; background:#fff; border:2px solid #f4eadd; border-radius:16px; padding:9px 11px; }
  .acct-id{ display:flex; flex-direction:column; min-width:104px; }
  .acct-id b{ font-size:14px; font-weight:900; }
  .acct-id span{ font-size:11.5px; font-weight:800; color:#a2937f; }
  .acct-row select{
    margin-left:auto; min-height:40px; padding:4px 8px; border-radius:11px; border:2px solid #e6dccf;
    background:#fffdf9; color:var(--ink); font-size:13px; font-weight:800;
  }
  .ghost-btn{ min-height:40px; padding:6px 12px; border-radius:12px; border:2px solid #eadfd1; background:#fff; color:#6d6484; font-size:12.5px; font-weight:900; cursor:pointer; }
  .del-btn{ min-height:40px; padding:0 12px; border-radius:12px; border:none; background:#fff0f3; color:#c6415a; font-size:12.5px; font-weight:900; cursor:pointer; }
  .acct-pw{ display:flex; flex:1 1 100%; align-items:center; gap:7px; }
  .acct-pw input{ flex:1 1 auto; min-height:42px; padding:6px 11px; border-radius:11px; border:2px solid #e6dccf; font-size:14px; font-weight:800; }
  .acct-pw button{ width:auto; min-height:42px; padding:0 16px; font-size:13.5px; }
  .acct-add{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:4px; padding-top:12px; border-top:2px dashed #f0e4d6; }
  .acct-add label{ display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:900; color:#6d6484; }
  .acct-add input, .acct-add select{ min-height:44px; padding:8px 11px; border-radius:12px; border:2px solid #e6dccf; font-size:14px; font-weight:800; background:#fffdf9; color:var(--ink); }
  .acct-add .full{ grid-column:1 / -1; }
  .acct-note{ margin:0; font-size:11.5px; font-weight:700; color:#a2937f; line-height:1.55; }
  .acct-connect{ display:flex; flex-direction:column; gap:9px; background:linear-gradient(135deg,#fff6e6 0%,#f1f6ff 100%); border:2px solid #ffe7c2; border-radius:18px; padding:12px 13px 13px; }
  .acct-connect-head{ display:flex; flex-direction:column; gap:3px; }
  .acct-connect-head b{ font-size:14px; font-weight:900; letter-spacing:-.01em; }
  .acct-connect-head span{ font-size:11.5px; font-weight:700; color:#8a7f70; line-height:1.5; }
  .acct-connect .lf-btn{ min-height:48px; font-size:15px; border-radius:14px; }
  .acct-linkbox{ display:flex; flex-direction:column; gap:5px; }
  .acct-linkbox p{ margin:0; font-size:11.5px; font-weight:800; color:#b0610b; line-height:1.5; }
  .acct-linkbox input{ width:100%; min-height:42px; padding:8px 11px; border-radius:11px; border:2px solid #e6dccf; background:#fff; color:#4b3f7a; font-size:12px; font-weight:700; }
  .acct-role-note{ font-size:11.5px; font-weight:700; color:#8a93a8; line-height:1.6; }
  .acct-dash{ display:flex; flex:1 1 100%; align-items:center; gap:6px; flex-wrap:wrap; padding-top:8px; margin-top:1px; border-top:1px dashed #f2e8dc; }
  .acct-dash-label{ flex:0 0 auto; font-size:11px; font-weight:900; color:#8a93a8; }
  .dash-chk{ display:inline-flex; align-items:center; gap:5px; min-height:34px; padding:0 10px; border-radius:11px; border:2px solid #e6dccf; background:#fffdf9; font-size:12px; font-weight:900; color:#6d6484; cursor:pointer; }
  .dash-chk input{ width:15px; height:15px; margin:0; accent-color:#f0a02a; }
  .dash-chk.on{ border-color:#ffd28a; background:#fff6e6; color:#a8620b; }
  .dash-always{ display:inline-flex; align-items:center; min-height:34px; padding:0 11px; border-radius:11px; background:#eef8f3; color:#0a6b50; font-size:12px; font-weight:900; }
  .acct-newdash{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding-top:6px; }
  .hub-empty{ grid-column:1 / -1; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:34px 20px; border-radius:24px; border:2px dashed #eadfd1; background:#fffdf9; font-size:16px; font-weight:900; color:#6d6484; line-height:1.6; }
  .hub-empty span{ font-size:12.5px; font-weight:800; color:#a2937f; }

  /* ---------- 테스트 데이터 초기화 (관리자 전용) ---------- */
  .reset-note{ margin:0; font-size:11.5px; font-weight:800; color:#8a7f70; line-height:1.6; }
  .reset-note b{ color:#6d6484; }
  .reset-list{ display:flex; flex-direction:column; gap:11px; }
  .reset-card{
    display:flex; flex-direction:column; gap:9px; padding:14px 14px 13px;
    border-radius:20px; border:2px solid #f1e6da; background:#fffdf9;
  }
  .reset-card.kids{ border-color:#ffe3b8; background:linear-gradient(140deg,#fff8ea 0%,#fffdf9 62%); }
  .reset-card.fridge{ border-color:#cfe9ff; background:linear-gradient(140deg,#f1f9ff 0%,#fffdf9 62%); }
  .reset-card.ledger{ border-color:#e6dfff; background:linear-gradient(140deg,#f6f3ff 0%,#fffdf9 62%); }
  .reset-head{ display:flex; align-items:center; gap:8px; }
  .reset-head .re-emoji{ font-size:19px; line-height:1; }
  .reset-head b{ font-size:14.5px; font-weight:900; letter-spacing:-.015em; }
  .reset-lines{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; }
  .reset-lines li{ position:relative; padding-left:13px; font-size:11.5px; font-weight:800; color:#8a7f70; line-height:1.5; }
  .reset-lines li:before{ content:'·'; position:absolute; left:2px; top:0; font-weight:900; }
  .reset-lines li b{ color:#6d6484; }
  .reset-lines li.keep{ color:#0f7a55; }
  .reset-lines li.keep b{ color:#0a6b50; }
  .reset-btn{
    min-height:46px; border:none; border-radius:14px; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(135deg,#ffb15c,#ff7f7f); color:#fff; font-size:14px; font-weight:900;
    box-shadow:0 8px 18px rgba(255,140,90,.28);
  }
  .reset-btn:active{ transform:translateY(1px); }
  .reset-btn:disabled{ opacity:.55; box-shadow:none; cursor:default; }
  .reset-msg{ margin:0; font-size:11.5px; font-weight:900; color:#0f7a55; line-height:1.5; }
  .reset-msg.err{ color:#c6415a; }
  .reset-msg:empty{ display:none; }

  /* ---------- 백업 · 복구 (관리자 전용) ---------- */
  .bak-note{ margin:0; font-size:11.5px; font-weight:800; color:#8a7f70; line-height:1.6; }
  .bak-note b{ color:#6d6484; }
  .bak-hero{
    display:flex; flex-direction:column; gap:9px; padding:14px;
    border-radius:20px; border:2px solid #d9e8fb;
    background:linear-gradient(140deg,#eef7ff 0%,#fffdf9 64%);
  }
  .bak-hero-head{ display:flex; flex-direction:column; gap:3px; }
  .bak-hero-head b{ font-size:14.5px; font-weight:900; letter-spacing:-.015em; }
  .bak-hero-head span{ font-size:11.5px; font-weight:800; color:#8a7f70; line-height:1.5; }
  .bak-btn{
    min-height:46px; border:none; border-radius:14px; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(135deg,#7fc7ff,#7c5cfc); color:#fff; font-size:14px; font-weight:900;
    box-shadow:0 8px 18px rgba(110,140,255,.26);
  }
  .bak-btn:active{ transform:translateY(1px); }
  .bak-btn:disabled{ opacity:.55; box-shadow:none; cursor:default; }
  .bak-msg{ margin:0; font-size:11.5px; font-weight:900; color:#0f7a55; line-height:1.55; white-space:pre-line; }
  .bak-msg.err{ color:#c6415a; }
  .bak-msg:empty{ display:none; }

  /* ---------- 토스트 ---------- */

    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,14px);
    opacity:0; pointer-events:none; z-index:200; max-width:min(92vw,460px);
    background:#3a3228; color:#fffdf9; font-size:13.5px; font-weight:800; line-height:1.45; text-align:center;
    padding:12px 16px; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,.3);

  }

<script>
(function () {
  'use strict';

  /* ============ 기본값 / 상수 ============ */
  var API_BASE = 'https://api.github.com';
  var DEFAULT_OWNER = 'jadenfamily';
  var DEFAULT_REPO = 'kids-dashboard-data';

  /* 아이 대시보드·냉장고 대시보드와 똑같은 키를 써요 (같은 주소라서 로그인이 함께 이어져요) */
  var DEVICE_KEY = 'kidsDashboard.device.v1';
  var USERS_CACHE_KEY = 'kidsDashboard.users.v1';
  var SHA_KEY = 'kidsDashboard.sha.v1';
  var LAST_ID_KEY = 'kidsDashboard.lastId';
  var LAST_REMEMBER_KEY = 'kidsDashboard.remember';
  var SESSION_KEY = 'kidsDashboard.session.v1';
  var HUB_LAST_KEY = 'kidsDashboard.hub.last';
  var SESSION_MS = 30 * 24 * 60 * 60 * 1000; /* 로그인 유지 30일 */

  var ROLES = {
    admin: { label: '관리자', perms: { check: 1, sticker: 1, stickerManage: 1, edit: 1, reset: 1, history: 1, accounts: 1 } },
    parent: { label: '보호자', perms: { check: 1, sticker: 1, stickerManage: 1, edit: 1, reset: 1, history: 1 } },
    child: { label: '아이', perms: { check: 1, sticker: 1, history: 1 } },
    viewer: { label: '보기 전용', perms: { history: 1 } }
  };

  /* 가족 대시보드 목록 (여기에 한 줄씩 추가하면 카드가 생겨요) */
  var DASHBOARDS = [
    { id: 'kids', emoji: '🌟', title: "Jaden's Today", desc: '하루 루틴 · 칭찬 스티커 · 학원 시간표', kind: 'link', cls: 'kids', url: '../kids-dashboard/' },
    { id: 'fridge', emoji: '🧊', title: '냉장고 파먹기', desc: '식재료 재고 · 장보기 알림 · 주간 식단', kind: 'link', cls: 'fridge', url: '../fridge-dashboard/' },
    { id: 'ledger', emoji: '📒', title: '가계부', desc: '수입·고정비·변동지출과 예산을 한곳에', kind: 'link', cls: 'ledger', url: '../ledger-dashboard/' }
  ];

  /* 계정별로 갈 수 있는 대시보드 (관리자는 언제나 전부) */
  var DASH_IDS = ['kids', 'fridge', 'ledger'];
  var DASH_DEFAULTS = {
    admin: ['kids', 'fridge', 'ledger'],
    parent: ['kids', 'fridge', 'ledger'],
    viewer: ['kids', 'fridge', 'ledger'],
    child: ['kids']
  };
  function dashboardsFor(u) {
    if (!u) return [];
    if (u.role === 'admin') return DASH_IDS.slice();
    if (Object.prototype.toString.call(u.dashboards) === '[object Array]') {
      var out = [];
      for (var i = 0; i < u.dashboards.length; i++) {
        var id = String(u.dashboards[i] == null ? '' : u.dashboards[i]);
        if (DASH_IDS.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
      }
      return out;
    }
    var def = DASH_DEFAULTS[u.role] || DASH_IDS;
    return def.slice();
  }
  function dashAllowed(u, id) { return dashboardsFor(u).indexOf(id) >= 0; }
  function dashTitle(id) {
    for (var i = 0; i < DASHBOARDS.length; i++) if (DASHBOARDS[i].id === id) return DASHBOARDS[i].title;
    return id;
  }
  function dashNames(ids) {
    var out = [];
    for (var i = 0; i < ids.length; i++) out.push(dashTitle(ids[i]));
    return out.join(' · ');
  }

  var cloud = { conn: null, users: null, me: null, session: null, status: 'idle', statusAt: 0, sha: {} };
  var acct = { pwFor: '', msg: '', busy: false, link: '' };
  var connectPrefill = null;
  var connectJustDone = false;
  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  /* ============ 작은 도구들 ============ */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      if (c === '"') return '&quot;';
      return '&#39;';
    });
  }
  function fmtDate(d) {
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_NAMES[d.getDay()] + '요일';
  }
  function fmtClock(d) {
    var h = d.getHours();
    var ap = h < 12 ? '오전' : '오후';
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return ap + ' ' + h12 + ':' + pad2(d.getMinutes());
  }
  function roleLabel(role) { return (ROLES[role] && ROLES[role].label) || '보기 전용'; }
  function roleOptions(sel) {
    var out = '';
    for (var key in ROLES) {
      if (!Object.prototype.hasOwnProperty.call(ROLES, key)) continue;
      out += '<option value="' + key + '"' + (key === sel ? ' selected' : '') + '>' + ROLES[key].label + '</option>';
    }
    return out;
  }
  function initialOf(name) {
    var s = String(name || '').trim();
    return s ? s.slice(0, 1) : '·';
  }
  function can(perm) {
    if (!cloud || !cloud.me) return false;
    var r = ROLES[cloud.me.role];
    return !!(r && r.perms && r.perms[perm]);
  }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function ssGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { window.sessionStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function ssDel(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function fieldVal(id) { var el = document.getElementById(id); return el ? String(el.value == null ? '' : el.value) : ''; }

  function randomHex(n) {
    var bytes = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < n; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytesToHex(bytes);
  }
  function bytesToHex(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += ('0' + bytes[i].toString(16)).slice(-2);
    return s;
  }
  async function sha256Hex(text) {
    if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest)) {
      throw new Error('이 브라우저에서는 암호화 기능을 쓸 수 없어요. Safari/Chrome을 최신 버전으로 올려 주세요.');
    }
    var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text)));
    return bytesToHex(new Uint8Array(buf));
  }
  function hashPassword(pw, salt) { return sha256Hex(String(salt) + ':' + String(pw)); }

  /* ============ 기기 연결 정보 / 캐시 ============ */
  function loadDevice() {
    try {
      var j = JSON.parse(lsGet(DEVICE_KEY) || 'null');
      if (j && j.owner && j.repo && j.token) return { owner: j.owner, repo: j.repo, token: j.token, branch: j.branch || 'main', at: j.at || 0 };
    } catch (e) { /* 무시 */ }
    return null;
  }
  function saveDevice(c) { if (c) lsSet(DEVICE_KEY, JSON.stringify(c)); else lsDel(DEVICE_KEY); }

  function clearSession() {
    lsDel(SESSION_KEY);
    ssDel(SESSION_KEY);
    cloud.session = null;
  }
  function loadSession() {
    var raw = lsGet(SESSION_KEY);
    var store = 'local';
    if (!raw) { raw = ssGet(SESSION_KEY); store = 'session'; }
    if (!raw) return null;
    var j = null;
    try { j = JSON.parse(raw); } catch (e) { j = null; }
    if (!j || !j.id) { clearSession(); return null; }
    var exp = Number(j.expiresAt) || 0;
    if (store === 'local' && (!exp || exp <= Date.now())) { clearSession(); return null; } /* 30일 만료 */
    return {
      id: String(j.id),
      name: String(j.name || j.id),
      role: ROLES[j.role] ? j.role : 'viewer',
      dashboards: Object.prototype.toString.call(j.dashboards) === '[object Array]' ? j.dashboards : null,
      store: store,
      issuedAt: Number(j.issuedAt) || 0,
      expiresAt: exp
    };
  }
  function saveSession(me, remember, prev) {
    if (!me || !me.id) return null;
    var now = Date.now();
    var keepExp = (prev && prev.store === 'local' && prev.expiresAt > now) ? prev.expiresAt : 0;
    var s = {
      version: 1,
      id: me.id,
      name: me.name || me.id,
      role: ROLES[me.role] ? me.role : 'viewer',
      dashboards: dashboardsFor(me),
      store: remember ? 'local' : 'session',
      issuedAt: (prev && prev.issuedAt) || now,
      expiresAt: remember ? (keepExp || (now + SESSION_MS)) : 0
    };
    clearSession();
    var ok = remember ? lsSet(SESSION_KEY, JSON.stringify(s)) : ssSet(SESSION_KEY, JSON.stringify(s));
    if (!ok) return null;
    cloud.session = s;
    return s;
  }
  function loadUsersCache() { try { return JSON.parse(lsGet(USERS_CACHE_KEY) || 'null'); } catch (e) { return null; } }
  function saveUsersCache(u) { if (u) lsSet(USERS_CACHE_KEY, JSON.stringify(u)); }
  function loadShaCache() { try { return JSON.parse(lsGet(SHA_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function rememberSha(p, sha) { if (!p || !sha) return; cloud.sha[p] = sha; lsSet(SHA_KEY, JSON.stringify(cloud.sha || {})); }

  /* ============ GitHub Contents API ============ */
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + (token || (cloud.conn && cloud.conn.token) || ''),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function ghBase() { return API_BASE + '/repos/' + encodeURIComponent(cloud.conn.owner) + '/' + encodeURIComponent(cloud.conn.repo); }
  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(String(str));
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return window.btoa(bin);
  }
  function b64decodeUtf8(b64) {
    var bin = window.atob(String(b64 || '').replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
    return decodeURIComponent(escape(bin));
  }

  async function ghGet(path) {
    var branch = (cloud.conn && cloud.conn.branch) || 'main';
    var url = ghBase() + '/contents/' + path + '?ref=' + encodeURIComponent(branch) + '&_=' + Date.now();
    try {
      var res = await window.fetch(url, { headers: ghHeaders(), cache: 'no-store' });
      if (res.status === 404) return { ok: true, missing: true };
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var j = await res.json();
      if (Object.prototype.toString.call(j) === '[object Array]') return { ok: true, list: j };
      var text = j && j.content ? b64decodeUtf8(j.content) : '';
      var data = null;
      if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
      rememberSha(path, j && j.sha);
      return { ok: true, data: data, sha: j && j.sha, raw: text };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghPut(path, obj, message) {
    var payload = {
      message: message || ('업데이트: ' + path),
      content: b64encodeUtf8(JSON.stringify(obj, null, 2)),
      branch: (cloud.conn && cloud.conn.branch) || 'main'
    };
    if (cloud.sha[path]) payload.sha = cloud.sha[path];
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var res = await window.fetch(ghBase() + '/contents/' + path, {
          method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload)
        });
        if (res.ok) {
          var j = await res.json();
          rememberSha(path, j && j.content && j.content.sha);
          return { ok: true };
        }
        if (res.status === 409 || res.status === 422 || res.status === 404) {
          var cur = await ghGet(path);
          if (!cur.ok) return { ok: false, status: cur.status, error: cur.error };
          if (cur.missing) delete payload.sha;
          else payload.sha = cur.sha;
          continue;
        }
        if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
        if (res.status === 403) return { ok: false, status: 403, error: '쓰기 권한이 없어요' };
        return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
      }
    }
    return { ok: false, status: 409, error: '다른 기기에서 먼저 저장했어요' };
  }

  /* ============ 연결 상태 표시 ============ */
  function setSync(status) { cloud.status = status; cloud.statusAt = Date.now(); renderSyncPill(); }
  function renderSyncPill() {
    var el = document.getElementById('syncPill');
    if (!el) return;
    if (!cloud.conn) { el.className = 'sync-pill'; el.textContent = '☁️ 연결 전'; return; }
    if (!cloud.me) { el.className = 'sync-pill'; el.textContent = '🔐 로그인 전'; return; }
    if (cloud.status === 'offline') { el.className = 'sync-pill off'; el.textContent = '📴 오프라인'; return; }
    if (cloud.status === 'error') { el.className = 'sync-pill err'; el.textContent = '⚠️ 연결 오류'; return; }
    if (cloud.status === 'syncing') { el.className = 'sync-pill sync'; el.textContent = '☁️ 확인 중…'; return; }
    if (cloud.status === 'ok') {
      el.className = 'sync-pill ok';
      var d = new Date(cloud.statusAt || Date.now());
      el.textContent = '☁️ 연결됨 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      return;
    }
    el.className = 'sync-pill';
    el.textContent = '☁️ 준비';
  }

  /* ============ 허브 화면 ============ */
  function renderClock() {
    var now = new Date();
    var dEl = document.getElementById('dateLine');
    var cEl = document.getElementById('clockLine');
    if (dEl) dEl.textContent = fmtDate(now);

  function renderHub() {
    var grid = document.getElementById('hubGrid');
    if (!grid) return;
    var last = lsGet(HUB_LAST_KEY) || '';
    var allowed = dashboardsFor(cloud.me);
    var html = '';
    for (var i = 0; i < DASHBOARDS.length; i++) {
      var d = DASHBOARDS[i];
      if (allowed.indexOf(d.id) < 0) continue; /* 이 계정이 갈 수 있는 곳만 보여 줘요 */
      var badge = (d.kind !== 'soon' && last === d.id) ? '<span class="ht-badge">최근 사용</span>' : '';
      var body = '<span class="ht-emoji" aria-hidden="true">' + d.emoji + '</span>' +
        '<span class="ht-body"><span class="ht-title">' + esc(d.title) + '</span>' +
        '<span class="ht-desc">' + esc(d.desc) + '</span></span>';
      if (d.kind === 'link') {
        html += '<a class="hub-tile ' + d.cls + '" href="' + esc(d.url) + '" data-act="hub-go" data-id="' + esc(d.id) + '">' +
          badge + body + '<span class="ht-go">열기 →</span></a>';
      } else {
        html += '<div class="hub-tile ' + d.cls + '">' + badge + body + '<span class="ht-go">준비 중 🚧</span></div>';
      }

    if (!html) {
      html = '<div class="hub-empty">🔒 열 수 있는 대시보드가 아직 없어요.<span>관리자에게 허용된 대시보드를 요청해 주세요.</span></div>';

  /* ============ 로그인 / 기기 연결 ============ */
  async function doSetup() {
    var owner = fieldVal('setupOwner').trim();
    var repo = fieldVal('setupRepo').trim();
    var token = fieldVal('setupToken').trim();
    var pw = fieldVal('setupPw');
    var pw2 = fieldVal('setupPw2');
    var msg = document.getElementById('setupMsg');
    function fail(t) { if (msg) { msg.className = 'lf-msg'; msg.textContent = t; } }

    if (!owner || !repo || !token) return fail('GitHub 아이디, 저장소 이름, 토큰을 모두 넣어 주세요.');
    if (!/^[A-Za-z0-9-]{1,39}$/.test(owner)) return fail('GitHub 아이디 형식을 확인해 주세요.');
    if (!/^[A-Za-z0-9._-]{1,100}$/.test(repo)) return fail('저장소 이름 형식을 확인해 주세요.');
    if (!/^(gh[pousr]_|github_pat_)/.test(token)) return fail('GitHub 토큰 형식이 아니에요. (github_pat_… 로 시작해요)');

    var btn = document.getElementById('setupBtn');
    if (btn) { btn.disabled = true; btn.textContent = '연결하는 중…'; }
    var prev = cloud.conn;
    cloud.conn = { owner: owner, repo: repo, token: token, branch: 'main', at: Date.now() };
    try {
      var res = await window.fetch(API_BASE + '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo), { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 401) { cloud.conn = prev; return fail('토큰이 올바르지 않아요. 다시 확인해 주세요.'); }
      if (res.status === 404) { cloud.conn = prev; return fail('저장소를 찾을 수 없어요. 아이디·저장소 이름과 토큰이 그 저장소를 포함하는지 확인해 주세요.'); }
      if (res.status === 403) { cloud.conn = prev; return fail('토큰에 저장소 접근 권한이 없어요. Fine-grained 토큰의 Contents를 Read and write로 주세요.'); }
      if (!res.ok) { cloud.conn = prev; return fail('저장소를 확인하지 못했어요. (HTTP ' + res.status + ')'); }
      var info = await res.json();
      if (info && info.private === false) { cloud.conn = prev; return fail('비공개(private) 저장소만 연결할 수 있어요. GitHub에서 저장소를 Private로 바꿔 주세요.'); }
      if (info && info.permissions && info.permissions.push === false) {
        cloud.conn = prev;
        return fail('이 토큰에는 쓰기 권한이 없어요. Contents 권한을 Read and write로 바꿔 주세요.');
      }

      cloud.sha = loadShaCache();
      var cur = await ghGet('config/users.json');
      if (!cur.ok && cur.status !== 404 && cur.missing !== true) { cloud.conn = prev; return fail('계정 파일을 확인하지 못했어요. (' + (cur.error || '') + ')'); }

      if (cur.ok && cur.data && Object.prototype.toString.call(cur.data.users) === '[object Array]') {
        cloud.users = cur.data;
        saveUsersCache(cur.data);
        if (!cur.data.users.length) {
          if (pw.length < 4) { cloud.conn = prev; return fail('관리자 비밀번호를 4자 이상으로 정해 주세요.'); }
          if (pw !== pw2) { cloud.conn = prev; return fail('비밀번호 확인이 맞지 않아요.'); }
          var salt0 = randomHex(16);
          var users0 = { version: 1, updatedAt: new Date().toISOString(), users: [{ id: 'admin', name: '관리자', role: 'admin', salt: salt0, hash: await hashPassword(pw, salt0), createdAt: new Date().toISOString() }] };
          var put0 = await ghPut('config/users.json', users0, '관리자 계정 만들기');
          if (!put0.ok) { cloud.conn = prev; return fail('계정 파일을 만들지 못했어요. (' + (put0.error || '') + ')'); }
          cloud.users = users0;
          saveUsersCache(users0);
        }
      } else if (cur.ok && cur.missing) {
        if (pw.length < 4) { cloud.conn = prev; return fail('관리자 비밀번호를 4자 이상으로 정해 주세요.'); }
        if (pw !== pw2) { cloud.conn = prev; return fail('비밀번호 확인이 맞지 않아요.'); }
        var salt = randomHex(16);
        var users = { version: 1, updatedAt: new Date().toISOString(), users: [{ id: 'admin', name: '관리자', role: 'admin', salt: salt, hash: await hashPassword(pw, salt), createdAt: new Date().toISOString() }] };
        var put = await ghPut('config/users.json', users, '관리자 계정 만들기');
        if (!put.ok) { cloud.conn = prev; return fail('계정 파일을 만들지 못했어요. (' + (put.error || '') + ')'); }
        cloud.users = users;
        saveUsersCache(users);
      }

      saveDevice(cloud.conn);
      clearSession(); /* 기기를 다시 연결했으면 다시 로그인 */
      setSync('ok');
      renderLoginBody('login');
      var lm = document.getElementById('loginMsg');
      if (lm) { lm.className = 'lf-msg ok'; lm.textContent = '기기 연결 완료! 아이디와 비밀번호로 로그인해 주세요.'; }
    } catch (e) {
      cloud.conn = prev;
      fail('연결에 실패했어요. 인터넷 연결과 토큰을 확인해 주세요.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '기기 연결하고 시작'; }
    }
  }

  async function doLogin() {
    var id = fieldVal('loginId').trim().toLowerCase();
    var pw = fieldVal('loginPw');
    var rememberEl = document.getElementById('loginRemember');
    var remember = rememberEl ? !!rememberEl.checked : true;
    var msg = document.getElementById('loginMsg');
    function fail(t) { if (msg) { msg.className = 'lf-msg'; msg.textContent = t; } }
    if (!id || !pw) return fail('아이디와 비밀번호를 넣어 주세요.');
    if (!cloud.conn) { renderLoginBody('setup'); return; }

    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
    try {
      setSync('syncing');
      var fresh = await ghGet('config/users.json');
      if (fresh.ok && fresh.data && Object.prototype.toString.call(fresh.data.users) === '[object Array]') {
        cloud.users = fresh.data;
        saveUsersCache(fresh.data);
      } else if (!fresh.ok && fresh.status !== 404) {
        if (!cloud.users) {
          return fail(navigator.onLine === false ? '오프라인 상태예요. 인터넷에 연결한 뒤 다시 시도해 주세요.' : '계정 정보를 불러오지 못했어요. (' + (fresh.error || '') + ')');
        }
      }
      var users = (cloud.users && cloud.users.users) || [];
      var u = null;
      for (var i = 0; i < users.length; i++) {
        if (String(users[i].id).toLowerCase() === id) { u = users[i]; break; }
      }
      var ok = false;
      if (u && u.salt && u.hash) {
        var hash = await hashPassword(pw, u.salt);
        ok = (hash === u.hash);
      }
      if (!ok) { setSync(navigator.onLine === false ? 'offline' : 'ok'); return fail('아이디 또는 비밀번호가 맞지 않아요.'); }
      lsSet(LAST_ID_KEY, u.id);
      lsSet(LAST_REMEMBER_KEY, remember ? '1' : '0');
      cloud.me = { id: u.id, name: u.name || u.id, role: ROLES[u.role] ? u.role : 'viewer', dashboards: dashboardsFor(u) };
      saveSession(cloud.me, remember, null);
      enterPortal();
    } catch (e) {
      fail('로그인 중 문제가 생겼어요. ' + (e && e.message ? e.message : ''));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
    }
  }

  function doLogout(silent) {
    clearSession();
    cloud.me = null;
    closeAccounts();
    closeReset();
    closeBackup();
    if (!silent) showToast('로그아웃했어요.');
    showLogin('login');
  }

  /* ============ 세션 이어쓰기 ============ */
  function findUserById(id) {
    var users = (cloud.users && cloud.users.users) || [];
    var key = String(id || '').toLowerCase();
    for (var i = 0; i < users.length; i++) {
      if (String(users[i].id).toLowerCase() === key) return users[i];
    }
    return null;
  }

  async function restoreSession(sess) {
    setSync('syncing');
    var u = findUserById(sess.id);
    if (!u) {
      var res = await ghGet('config/users.json');
      if (res.ok && res.data && Object.prototype.toString.call(res.data.users) === '[object Array]') {
        cloud.users = res.data;
        saveUsersCache(res.data);
        u = findUserById(sess.id);
      }
      if (!u) {
        clearSession();
        showLogin('login');
        setLoginMsg(navigator.onLine === false ? '오프라인이라 로그인 상태를 확인하지 못했어요. 인터넷에 연결한 뒤 다시 열어 주세요.' : '계정을 찾을 수 없어 다시 로그인해야 해요.');
        setSync(navigator.onLine === false ? 'offline' : 'error');
        return;
      }
    }
    cloud.me = { id: u.id, name: u.name || u.id, role: ROLES[u.role] ? u.role : 'viewer', dashboards: dashboardsFor(u) };
    saveSession(cloud.me, sess.store === 'local', sess);
    enterPortal();
    verifySession();
  }

  async function verifySession() {
    if (!cloud.conn || !cloud.me) return;
    var res = await ghGet('config/users.json');
    if (!res.ok) { setSync(res.status === 401 ? 'error' : (navigator.onLine === false ? 'offline' : 'ok')); return; }
    if (!res.data || Object.prototype.toString.call(res.data.users) !== '[object Array]') return;
    cloud.users = res.data;
    saveUsersCache(res.data);
    var u = findUserById(cloud.me.id);
    if (!u) {
      clearSession();
      cloud.me = null;
      showLogin('login');
      setLoginMsg('계정이 삭제되어 로그아웃했어요. 다시 로그인해 주세요.');
      return;
    }
    var role = ROLES[u.role] ? u.role : 'viewer';
    var name = u.name || u.id;
    var nextDash = dashboardsFor(u).join(',');
    var nowDash = dashboardsFor(cloud.me).join(',');
    if (role !== cloud.me.role || name !== cloud.me.name || nextDash !== nowDash) {
      cloud.me = { id: u.id, name: name, role: role, dashboards: dashboardsFor(u) };
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
      applyUserUi();
      applyPermissions();
      renderGreeting();
      renderHub();
    }
    setSync('ok');
  }

  /* ============ 계정 관리 ============ */
  /* iOS Safari는 body overflow만으로는 뒷페이지 스크롤을 막지 못해서 body를 fixed로 고정한다. */
  var scrollLock = { on: false, y: 0 };
  function lockBodyScroll() {
    if (scrollLock.on) return;
    scrollLock.y = window.scrollY || window.pageYOffset || 0;
    var b = document.body, h = document.documentElement;
    b.style.position = 'fixed';
    b.style.top = '-' + scrollLock.y + 'px';
    b.style.left = '0';
    b.style.right = '0';
    b.style.width = '100%';
    b.style.overflow = 'hidden';
    h.style.overflow = 'hidden';
    scrollLock.on = true;
  }
  function unlockBodyScroll() {
    if (!scrollLock.on) return;
    var b = document.body, h = document.documentElement;
    b.style.position = '';
    b.style.top = '';
    b.style.left = '';
    b.style.right = '';
    b.style.width = '';
    b.style.overflow = '';
    h.style.overflow = '';
    scrollLock.on = false;
    window.scrollTo(0, scrollLock.y);
  }
  function openAccounts() {
    if (!can('accounts')) return;
    closeReset();
    acct.pwFor = '';
    acct.msg = '';
    acct.link = '';
    renderAccounts();
    var m = document.getElementById('acctModal');
    if (!m) return;
    m.hidden = false;
    lockBodyScroll();
  }
  function closeAccounts() {
    var m = document.getElementById('acctModal');
    if (m) m.hidden = true;
    unlockBodyScroll();
  }
  function acctCountAdmins() {
    var users = (cloud.users && cloud.users.users) || [];
    var n = 0;
    for (var i = 0; i < users.length; i++) if (users[i].role === 'admin') n++;
    return n;
  }
  function dashboardPickerHtml(u) {
    if (u.role === 'admin') {
      return '<div class="acct-dash"><span class="acct-dash-label">갈 수 있는 대시보드</span>' +
        '<span class="dash-always">🔓 관리자는 모두</span></div>';
    }
    var allow = dashboardsFor(u);
    var h = '<div class="acct-dash"><span class="acct-dash-label">갈 수 있는 대시보드</span>';
    for (var i = 0; i < DASHBOARDS.length; i++) {
      var d = DASHBOARDS[i];
      var on = allow.indexOf(d.id) >= 0;
      h += '<label class="dash-chk' + (on ? ' on' : '') + '">' +
        '<input type="checkbox" data-act="acct-dash" data-id="' + esc(u.id) + '" data-dash="' + esc(d.id) + '"' + (on ? ' checked' : '') + '>' +
        '<span>' + d.emoji + ' ' + esc(d.title) + '</span></label>';
    }
    h += '</div>';
    return h;
  }
  function newAccountDashHtml(role) {
    if (role === 'admin') {
      return '<span class="acct-dash-label">갈 수 있는 대시보드</span><span class="dash-always">🔓 관리자는 모두</span>';
    }
    var allow = dashboardsFor({ role: role });
    var h = '<span class="acct-dash-label">갈 수 있는 대시보드</span>';
    for (var i = 0; i < DASHBOARDS.length; i++) {
      var d = DASHBOARDS[i];

    }

  }

        (acct.pwFor === u.id ?
          '<form class="acct-pw" id="acctPwForm" data-id="' + esc(u.id) + '">' +

            '<button class="lf-btn" type="submit">저장</button>' +
            '<button class="ghost-btn" type="button" data-act="acct-pw-cancel">취소</button>' +

        '</div>';
    }
    h += '</div>';
    h += '<div class="acct-role-note">관리자: 모든 기능 · 보호자: 루틴·스티커·편집·기록 · 아이: 루틴·스티커·기록 · 보기 전용: 화면과 기록만<br>계정마다 갈 수 있는 대시보드를 골라 둘 수 있어요. 관리자는 항상 세 곳 모두 열 수 있어요.</div>';
    h += '<form class="acct-add" id="acctAddForm" autocomplete="off">' +

      '<label>이름<input id="acctNewName" maxlength="20" placeholder="예: 지우"></label>' +
      '<label>권한<select id="acctNewRole" data-act="acct-new-role">' + roleOptions('child') + '</select></label>' +
      '<label>비밀번호<input id="acctNewPw" type="password" maxlength="64" placeholder="4자 이상" autocomplete="new-password"></label>' +

      '<div class="full"><button class="lf-btn" type="submit">계정 추가</button></div>' +

    h += '<p class="lf-msg" id="acctMsg">' + esc(acct.msg || '') + '</p>';

  }
  function renderAccounts() {
    var body = document.getElementById('acctBody');
    if (!body) return;
    body.innerHTML = accountsHtml();
  }
  function acctFail(msg) { acct.msg = msg; renderAccounts(); }

  async function persistUsers(message) {
    cloud.users.version = 1;
    cloud.users.updatedAt = new Date().toISOString();
    var res = await ghPut('config/users.json', cloud.users, message || '계정 업데이트');
    if (res.ok) saveUsersCache(cloud.users);
    return res;
  }

  function newAccountDashIds() {
    var out = [];
    var boxes = document.querySelectorAll('#acctNewDash input[data-act="acct-new-dash"]');
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) continue;
      var id = boxes[i].getAttribute('data-dash');
      if (DASH_IDS.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
    }
    var ordered = [];
    for (var k = 0; k < DASH_IDS.length; k++) if (out.indexOf(DASH_IDS[k]) >= 0) ordered.push(DASH_IDS[k]);
    return ordered;
  }

  async function addAccount() {
    if (!can('accounts') || !cloud.users) return;
    var id = fieldVal('acctNewId').trim().toLowerCase();
    var name = fieldVal('acctNewName').trim();
    var role = fieldVal('acctNewRole');
    var pw = fieldVal('acctNewPw');
    if (!/^[a-z0-9_-]{2,20}$/.test(id)) return acctFail('아이디는 영문 소문자·숫자·_·- 로 2~20자로 정해 주세요.');
    if (pw.length < 4) return acctFail('비밀번호는 4자 이상으로 정해 주세요.');
    if (!ROLES[role]) role = 'child';
    var dash = newAccountDashIds();
    var users = cloud.users.users;
    for (var i = 0; i < users.length; i++) if (String(users[i].id).toLowerCase() === id) return acctFail('이미 쓰고 있는 아이디예요.');
    acct.msg = '저장하는 중…';
    renderAccounts();
    var salt = randomHex(16);
    var u = { id: id, name: name || id, role: role, salt: salt, hash: await hashPassword(pw, salt), createdAt: new Date().toISOString() };
    if (role !== 'admin') u.dashboards = dash;
    users.push(u);
    var res = await persistUsers('계정 추가: ' + id);
    if (!res.ok) {
      users.pop();
      return acctFail('저장하지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.msg = id + ' 계정을 추가했어요.' + (role === 'admin' ? '' : ' (갈 수 있는 곳: ' + (dash.length ? dashNames(dash) : '없음') + ')');
    renderAccounts();
  }

  async function setDashboardAccess(id, dashId, on) {
    if (!can('accounts') || !cloud.users) return;
    if (DASH_IDS.indexOf(dashId) < 0) return;
    var users = cloud.users.users;
    var target = null;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { target = users[i]; break; }
    if (!target || target.role === 'admin') return;
    var had = Object.prototype.toString.call(target.dashboards) === '[object Array]';
    var oldArr = target.dashboards;
    var cur = dashboardsFor(target);
    var next = [];
    for (var j = 0; j < cur.length; j++) if (cur[j] !== dashId) next.push(cur[j]);
    if (on) next.push(dashId);
    var ordered = [];
    for (var k = 0; k < DASH_IDS.length; k++) if (next.indexOf(DASH_IDS[k]) >= 0) ordered.push(DASH_IDS[k]);
    target.dashboards = ordered;
    var res = await persistUsers('대시보드 권한: ' + id + ' → ' + (ordered.length ? ordered.join(',') : '없음'));
    if (!res.ok) {
      if (had) target.dashboards = oldArr; else delete target.dashboards;
      return acctFail('대시보드 권한을 바꾸지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    if (cloud.me && cloud.me.id === id) {
      cloud.me.dashboards = dashboardsFor(target);
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
      renderHub();
    }
    acct.msg = (target.name || id) + '님이 갈 수 있는 대시보드: ' + (ordered.length ? dashNames(ordered) : '없음');
    renderAccounts();
  }

  async function changeRole(id, role) {
    if (!can('accounts') || !cloud.users) return;
    if (!ROLES[role]) return;
    var users = cloud.users.users;
    var target = null;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { target = users[i]; break; }
    if (!target) return;
    var prev = target.role;
    if (prev === 'admin' && role !== 'admin' && acctCountAdmins() <= 1) {
      return acctFail('관리자는 최소 한 명이 있어야 해요.');
    }
    target.role = role;
    var res = await persistUsers('권한 변경: ' + id + ' → ' + role);
    if (!res.ok) {
      target.role = prev;
      return acctFail('권한을 바꾸지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    if (cloud.me && cloud.me.id === id) {
      cloud.me.role = role;
      cloud.me.dashboards = dashboardsFor(target);
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
    }
    acct.msg = id + ' 권한을 ' + roleLabel(role) + '(으)로 바꿨어요.';
    renderAccounts();
    applyUserUi();
    applyPermissions();
    renderGreeting();
    renderHub();
  }

  async function deleteAccount(id) {
    if (!can('accounts') || !cloud.users) return;
    if (cloud.me && cloud.me.id === id) return acctFail('지금 로그인한 계정은 지울 수 없어요.');
    var users = cloud.users.users;
    var idx = -1;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    if (users[idx].role === 'admin' && acctCountAdmins() <= 1) return acctFail('관리자는 최소 한 명이 있어야 해요.');
    if (!window.confirm('"' + (users[idx].name || id) + '" 계정을 지울까요? 지금 화면은 그대로지만, 다음에 그 계정으로는 로그인할 수 없게 돼요.')) return;
    var removed = users.splice(idx, 1)[0];
    var res = await persistUsers('계정 삭제: ' + id);
    if (!res.ok) {
      users.splice(idx, 0, removed);
      return acctFail('삭제하지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.msg = id + ' 계정을 지웠어요.';
    renderAccounts();
  }

  async function saveAccountPassword() {
    if (!can('accounts') || !cloud.users) return;
    var form = document.getElementById('acctPwForm');
    if (!form) return;
    var id = form.getAttribute('data-id');
    var pw = fieldVal('acctPwNew');
    if (pw.length < 4) return acctFail('비밀번호는 4자 이상으로 정해 주세요.');
    var users = cloud.users.users;
    var target = null;
    for (var i = 0; i < users.length; i++) if (users[i].id === id) { target = users[i]; break; }
    if (!target) return;
    var oldSalt = target.salt, oldHash = target.hash;
    var salt = randomHex(16);
    target.salt = salt;
    target.hash = await hashPassword(pw, salt);
    var res = await persistUsers('비밀번호 변경: ' + id);
    if (!res.ok) {
      target.salt = oldSalt;
      target.hash = oldHash;
      return acctFail('비밀번호를 바꾸지 못했어요. (' + (res.error || '오프라인') + ')');
    }
    acct.pwFor = '';
    acct.msg = id + ' 비밀번호를 바꿨어요.';
    renderAccounts();
  }

  /* ============ 테스트 데이터 초기화 (관리자 전용) ============ */
  /* 가족이 실제로 쓰기 전에, 테스트로 쌓인 기록만 대시보드별로 지운다.
     계정(config/users.json)과 루틴·시간표·교재·스티커 설정은 절대 건드리지 않는다. */
  var resetState = { busy: '', msg: {} };

  function isAdmin() { return !!(cloud.me && cloud.me.role === 'admin'); }
  function nowIso() { return new Date().toISOString(); }
  function isPlainObj(o) { return !!o && typeof o === 'object' && Object.prototype.toString.call(o) !== '[object Array]'; }
  function asObj(o) { return isPlainObj(o) ? o : {}; }
  function asArr(a) { return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayPath() { var d = new Date(); return 'data/' + d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + '.json'; }

  /* 파일 하나 읽기: 없으면 null(건너뜀), 실패하면 out에 실패로 남기고 null */
  async function resetRead(out, path, label) {
    var res = await ghGet(path);
    if (!res.ok) {
      out.push({ path: path, label: label, ok: false, error: res.error || ('HTTP ' + (res.status || 0)) });
      return null;
    }
    if (res.missing) {
      out.push({ path: path, label: label, ok: true, skipped: true });
      return null;
    }
    return asObj(res.data);
  }
  async function resetWrite(out, path, obj, label, message) {
    var res = await ghPut(path, obj, message || ('테스트 초기화: ' + label));
    out.push({ path: path, label: label, ok: !!res.ok, skipped: false, error: res.error || '' });
    return res;
  }

  /* 1) Jaden's Today — 체크·스티커·펫 기록만 (루틴·시간표·교재는 유지) */
  async function runKidsReset() {
    var out = [];
    var now = Date.now();
    var iso = nowIso();

    var st = await resetRead(out, 'config/stickers.json', '칭찬 스티커 기록');
    if (st) {
      st.version = st.version || 1;
      st.unit = Number(st.unit) || 1000;
      st.reasons = asArr(st.reasons); /* 보상 이유 목록은 그대로 */
      st.total = 0;
      st.log = [];
      st.spends = [];
      st.clearedAt = now;
      st.updatedAt = iso;
      await resetWrite(out, 'config/stickers.json', st, '칭찬 스티커 기록', '테스트 초기화: 칭찬 스티커 기록');
    }

    var dPath = todayPath();
    var day = await resetRead(out, dPath, '오늘 기록');
    if (day) {
      day.version = day.version || 1;
      day.date = todayKey();
      day.updatedAt = iso;
      day.by = (cloud.me && cloud.me.id) || '';
      day.checks = {};
      day.d = 0;
      day.t = 0;
      day.pct = 0;
      day.cats = [];
      day.workbooks = { sel: [], done: [] };
      day.stickers = [];
      day.spends = [];
      day.boards = [];
      day.board = { stickers: [], celebrated: false };
      day.clearedAt = now;
      await resetWrite(out, dPath, day, '오늘 기록', '테스트 초기화: 오늘 기록');
    }

    var cfg = await resetRead(out, 'config/settings.json', '펫·누적 기록');
    if (cfg) {
      var pet = asObj(cfg.pet);
      pet.stage = 0;
      pet.exp = 0;
      pet.hatchedAt = 0;
      pet.collection = [];
      pet.awarded = {};
      cfg.pet = pet;
      cfg.stats = asObj(cfg.stats);
      cfg.stats.stickersTotal = 0;
      cfg.clearedAt = now;
      cfg.updatedAt = iso;
      await resetWrite(out, 'config/settings.json', cfg, '펫·누적 기록', '테스트 초기화: 펫 성장·누적 기록');
    }

    /* 4) 계정별 프로필 — 코인·펫 성장·상점에서 산 아이템·방 꾸미기 (프로필이 있을 때만) */
    var profDir = await ghGet('config/profiles');
    if (!profDir.ok) {
      out.push({ path: 'config/profiles', label: '계정별 프로필', ok: false, error: profDir.error || ('HTTP ' + (profDir.status || 0)) });
    } else if (!profDir.missing) {
      var pItems = asArr(profDir.list);
      for (var pi = 0; pi < pItems.length; pi++) {
        var pit = pItems[pi] || {};
        if (pit.type !== 'file' || !/\.json$/i.test(String(pit.path || ''))) continue;
        var pf = await resetRead(out, pit.path, '계정별 프로필');
        if (!pf) continue;
        var petP = asObj(pf.pet);
        petP.stage = 0;
        petP.exp = 0;
        petP.hatchedAt = 0;
        petP.collection = [];
        pf.pet = petP; /* 알 종류·펫 그림은 남겨요 */
        pf.coins = 0;
        pf.owned = {}; /* 산 가구·벽지·옷 (기본 아이템은 아이 대시보드가 다시 채워요) */
        pf.room = {};
        pf.avatar = {};
        pf.bag = {};
        pf.award = { day: '', checks: {}, groups: {}, stickers: 0 };
        pf.clearedAt = now;
        pf.updatedAt = iso;
        await resetWrite(out, pit.path, pf, '계정별 프로필', '테스트 초기화: 계정별 프로필');
      }
    }
    return out;
  }

  /* 2) 냉장고 파먹기 — 재고·장보기·식단 기록만 (예산과 화면 설정은 유지) */
  async function runFridgeReset() {
    var out = [];
    var iso = nowIso();

    var inv = await resetRead(out, 'fridge/inventory.json', '재고');
    if (inv) {
      inv.version = inv.version || 1;
      inv.updatedAt = iso;
      inv.items = [];
      await resetWrite(out, 'fridge/inventory.json', inv, '재고', '테스트 초기화: 냉장고 재고');
    }

    var meals = await resetRead(out, 'fridge/meals.json', '식단·지출');
    if (meals) {
      meals.version = meals.version || 1;
      meals.updatedAt = iso;
      meals.budget = Number(meals.budget) || 0; /* 장보기 예산은 그대로 */
      meals.weeks = {};
      meals.expenses = [];
      await resetWrite(out, 'fridge/meals.json', meals, '식단·지출', '테스트 초기화: 식단·장보기 지출');
    }

    var daily = await resetRead(out, 'fridge/daily.json', '장보기 기록');
    if (daily) {
      daily.version = daily.version || 1;
      daily.updatedAt = iso;
      daily.days = {};
      await resetWrite(out, 'fridge/daily.json', daily, '장보기 기록', '테스트 초기화: 장보기 기록');
    }

    /* 장보기 알림 파일은 저장소에 있을 때만 지워요 */
    var watch = await ghGet('fridge/watch.json');
    if (!watch.ok) {
      out.push({ path: 'fridge/watch.json', label: '장보기 알림', ok: false, error: watch.error || 'HTTP ' + (watch.status || 0) });
    } else if (!watch.missing) {
      var w = asObj(watch.data);
      w.version = w.version || 1;
      w.updatedAt = iso;
      if (Object.prototype.toString.call(w.items) === '[object Array]') w.items = [];
      else if (Object.prototype.toString.call(w.list) === '[object Array]') w.list = [];
      else w.items = [];
      await resetWrite(out, 'fridge/watch.json', w, '장보기 알림', '테스트 초기화: 장보기 알림');
    }

    /* AI 요리 추천은 지난 재고로 만든 것이라 함께 지우고, 화면 설정은 그대로 둬요 */
    var fs = await resetRead(out, 'fridge/settings.json', 'AI 요리 추천');
    if (fs) {
      fs.version = fs.version || 1;
      fs.updatedAt = iso;
      fs.recipes = [];
      fs.recipesAt = '';
      await resetWrite(out, 'fridge/settings.json', fs, 'AI 요리 추천', '테스트 초기화: AI 요리 추천');
    }
    return out;
  }

  /* 3) 가계부 — 거래 내역·예산·고정비만 */
  async function runLedgerReset() {
    var out = [];
    var iso = nowIso();

    var tx = await resetRead(out, 'ledger/transactions.json', '수입·지출 내역');
    if (tx) {
      tx.version = tx.version || 1;
      tx.updatedAt = iso;
      tx.items = [];

  /* ============ 백업 · 복구 (관리자 전용) ============ */
  /* 가족 기록 전체를 저장소의 backups/YYYY-MM-DD.json 에 하루 한 번 남기고,
     7일이 지난 백업은 새 백업을 만들 때 자동으로 지운다. */
  var BACKUP_DIR = 'backups';
  var BACKUP_KEEP_DAYS = 7;
  var BACKUP_ROOTS = ['config/', 'data/', 'fridge/', 'ledger/'];
  var AUTO_BACKUP_KEY = 'kidsDashboard.backup.auto.v1';

  var bak = { busy: false, msg: null, list: null, listErr: '', loading: false, meta: {}, todayExists: false };

  function bakDateKey(name) {
    var m = /^(\d{4})-(\d{2})-(\d{2})\.json$/.exec(String(name || ''));
    return m ? (m[1] + '-' + m[2] + '-' + m[3]) : '';
  }
  function bakDayOf(key) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ''));
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (isNaN(d.getTime())) return null;
    if (d.getFullYear() !== Number(m[1]) || d.getMonth() !== Number(m[2]) - 1 || d.getDate() !== Number(m[3])) return null;
    return d;
  }
  function bakNiceDate(key) {
    var d = bakDayOf(key);
    if (!d) return String(key || '');
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAY_NAMES[d.getDay()] + ')';
  }
  function bakAgeDays(key) {
    var d = bakDayOf(key);
    var t = bakDayOf(todayKey());
    if (!d || !t) return -1;
    return Math.round((t.getTime() - d.getTime()) / 86400000);
  }
  function bakSizeText(n) {
    n = Number(n) || 0;
    if (n >= 1048576) return (Math.round(n / 1048576 * 10) / 10) + 'MB';
    if (n >= 1024) return Math.round(n / 1024) + 'KB';
    return n + 'B';
  }
  /* 백업에 담을 파일: config/·data/·fridge/·ledger/ 의 json (backups/ 자신은 제외) */
  function isBackupTarget(path) {
    var p = String(path || '');
    if (!p || p.indexOf(BACKUP_DIR + '/') === 0) return false;
    if (!/\.json$/i.test(p)) return false;
    for (var i = 0; i < BACKUP_ROOTS.length; i++) if (p.indexOf(BACKUP_ROOTS[i]) === 0) return true;
    return false;
  }

  function ghTree(branch) {
    var url = ghBase() + '/git/trees/' + encodeURIComponent(branch || (cloud.conn && cloud.conn.branch) || 'main') + '?recursive=1&_=' + Date.now();
    return window.fetch(url, { headers: ghHeaders(), cache: 'no-store' }).then(function (res) {
      if (!res.ok) return { ok: false, status: res.status };
      return res.json().then(function (j) {
        var out = [];
        var tree = asArr(j && j.tree);
        for (var i = 0; i < tree.length; i++) {
          var t = tree[i] || {};
          if (t.type !== 'blob' || !t.path || !t.sha) continue;
          if (isBackupTarget(t.path)) out.push({ path: t.path, sha: t.sha });
        }
        return { ok: true, files: out, truncated: !!(j && j.truncated) };
      });
    }).catch(function () { return { ok: false, status: 0 }; });
  }

  async function listTreeFallback(prefix, out, depth) {
    if (depth > 4) return;
    var res = await ghGet(prefix);
    if (!res.ok || res.missing) return;
    var items = asArr(res.list);
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      if (it.type === 'file' && isBackupTarget(it.path)) out.push({ path: it.path, sha: it.sha || '' });
      else if (it.type === 'dir' && String(it.path || '').indexOf(BACKUP_DIR + '/') !== 0) await listTreeFallback(it.path, out, depth + 1);
    }
  }

  async function ghBlobText(sha) {
    try {
      var h = ghHeaders();
      h['Accept'] = 'application/vnd.github.raw';
      var res = await window.fetch(ghBase() + '/git/blobs/' + encodeURIComponent(sha), { headers: h, cache: 'no-store' });
      if (!res.ok) return { ok: false, status: res.status };
      return { ok: true, text: await res.text() };
    } catch (e) {
      return { ok: false, status: 0 };
    }
  }

  async function ghDelete(path, sha, message) {
    try {
      var res = await window.fetch(ghBase() + '/contents/' + path, {
        method: 'DELETE',
        headers: ghHeaders(),
        body: JSON.stringify({ message: message || ('삭제: ' + path), sha: sha, branch: (cloud.conn && cloud.conn.branch) || 'main' })
      });
      if (res.ok) {
        delete cloud.sha[path];
        lsSet(SHA_KEY, JSON.stringify(cloud.sha || {}));
        return { ok: true };
      }
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      return { ok: false, status: res.status, error: 'HTTP ' + res.status };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function mapLimit(items, limit, fn) {
    var out = new Array(items.length);
    var next = 0;
    async function worker() {
      while (next < items.length) {
        var i = next++;
        out[i] = await fn(items[i], i);
      }
    }
    var ws = [];
    var n = Math.min(limit, items.length);
    for (var k = 0; k < n; k++) ws.push(worker());
    await Promise.all(ws);
    return out;
  }

  /* 저장소에 지금 있는 백업 대상 파일 목록 (Trees API → 실패하면 폴더별로) */
  async function bakCollect() {
    var tree = await ghTree();
    var list = [];
    if (tree.ok && tree.files.length && !tree.truncated) {
      list = tree.files;
    } else {
      for (var i = 0; i < BACKUP_ROOTS.length; i++) {
        await listTreeFallback(BACKUP_ROOTS[i].replace(/\/$/, ''), list, 0);
      }
    }
    var seen = {}, out = [];
    for (var j = 0; j < list.length; j++) {
      var f = list[j] || {};
      if (!f.path || seen[f.path]) continue;
      seen[f.path] = 1;
      out.push({ path: f.path, sha: f.sha || '' });
    }
    out.sort(function (a, b) { return a.path < b.path ? -1 : (a.path > b.path ? 1 : 0); });
    return out;
  }

  /* 7일이 지난 백업 파일을 지워요 (오늘 것과 7일 이내는 그대로) */
  async function pruneBackups(todayStr) {
    var res = await ghGet(BACKUP_DIR);
    if (!res.ok) return { ok: false, error: res.error || ('HTTP ' + (res.status || 0)), deleted: [], failed: [] };
    if (res.missing) return { ok: true, deleted: [], failed: [] };
    var items = asArr(res.list);
    var today = todayStr || todayKey();
    var deleted = [], failed = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      if (it.type !== 'file') continue;
      var key = bakDateKey(it.name || it.path);
      if (!key || key === today) continue;
      var age = bakAgeDays(key);
      if (age <= BACKUP_KEEP_DAYS) continue; /* 7일 이내는 그대로 */
      var del = await ghDelete(BACKUP_DIR + '/' + key + '.json', it.sha, '오래된 백업 자동 삭제: ' + key);
      if (del.ok) deleted.push(key);
      else failed.push({ date: key, error: del.error || '' });
    }
    return { ok: true, deleted: deleted, failed: failed };
  }

  function bakPruneText(pruned) {
    if (!pruned) return '';
    var bits = [];
    if (pruned.deleted && pruned.deleted.length) {
      bits.push('7일이 지난 백업 ' + pruned.deleted.length + '개(' + pruned.deleted.join(', ') + ')를 지웠어요');
    }
    if (pruned.failed && pruned.failed.length) bits.push('오래된 백업 ' + pruned.failed.length + '개는 지우지 못했어요');
    if (!pruned.ok && pruned.error) bits.push('오래된 백업 정리 실패: ' + pruned.error);
    return bits.join(' · ');
  }

  /* 오늘 백업 만들기(있으면 덮어쓰기) + 오래된 백업 정리 */
  async function createBackup(auto) {
    var date = todayKey();
    var path = BACKUP_DIR + '/' + date + '.json';
    var list = await bakCollect();
    if (!list.length) return { ok: false, error: '백업할 파일을 찾지 못했어요' };

    var got = await mapLimit(list, 6, async function (f) {
      if (f.sha) {
        var r = await ghBlobText(f.sha);
        if (r.ok) {
          try { return { path: f.path, data: JSON.parse(r.text) }; } catch (e) { /* 아래에서 한 번 더 */ }
        }
      }
      var alt = await ghGet(f.path);
      if (alt.ok && !alt.missing) return { path: f.path, data: alt.data };
      return { path: f.path, bad: true };
    });

    var files = {}, okCount = 0, badCount = 0;
    for (var i = 0; i < got.length; i++) {
      var g = got[i] || {};
      if (!g.bad) { files[g.path] = g.data; okCount++; }
      else badCount++;
    }
    if (!okCount) return { ok: false, error: '파일 내용을 읽지 못했어요' };

    await ghGet(path); /* 오늘 백업이 이미 있으면 그 sha로 덮어써요 */
    var snap = { version: 1, date: date, createdAt: new Date().toISOString(), by: (cloud.me && cloud.me.id) || '', files: files };
    var put = await ghPut(path, snap, (auto ? '자동 백업: ' : '백업: ') + date + ' (' + okCount + '개 파일)');
    if (!put.ok) return { ok: false, error: put.error || '저장하지 못했어요', status: put.status || 0 };

    var pruned = await pruneBackups(date);
    if (bak.meta) delete bak.meta[date];
    bak.todayExists = true;
    return { ok: true, date: date, count: okCount, bad: badCount, pruned: pruned };
  }

  /* ---------- 화면 ---------- */
  function bakRowsHtml() {
    if (bak.loading && !(bak.list && bak.list.length)) return '<div class="bak-empty">⏳ 백업 목록을 불러오는 중…</div>';
    if (bak.listErr) return '<div class="bak-empty">⚠️ 백업 목록을 불러오지 못했어요.<span>' + esc(bak.listErr) + '</span></div>';
    var list = bak.list || [];
    var today = todayKey();
    var h = '';
    for (var i = 0; i < list.length; i++) {
      var it = list[i] || {};
      var key = bakDateKey(it.name || it.path);
      if (!key) continue;
      var age = bakAgeDays(key);
      var meta = bak.meta[key] || null;
      var bits = [];
      if (age === 0) bits.push('오늘');
      else if (age === 1) bits.push('어제');
      else if (age > 1) bits.push(age + '일 전');
      if (meta && meta.count != null) bits.push('파일 ' + meta.count + '개');
      if (it.size) bits.push(bakSizeText(it.size));
      h += '<div class="bak-row' + (key === today ? ' today' : '') + '">' +
        '<div class="bak-when"><b>' + esc(bakNiceDate(key)) + '</b><span>' + esc(bits.join(' · ')) + '</span></div>' +
        '<div class="bak-btns">' +
          '<button type="button" class="bak-go" data-act="backup-restore" data-date="' + esc(key) + '"' + (bak.busy ? ' disabled' : '') + '>이 날짜로 복구</button>' +
          '<button type="button" data-act="backup-download" data-date="' + esc(key) + '">파일 저장</button>' +
        '</div></div>';
    }
    if (!h) {
      return '<div class="bak-empty">아직 백업이 없어요.<span>위의 <b>지금 백업 만들기</b>를 누르면 오늘 기록이 저장돼요.</span></div>';
    }
    return h;
  }

  function renderBackup() {
    var body = document.getElementById('backupBody');
    if (!body) return;
    var st = bak.msg || { ok: true, text: '' };
    var listN = (bak.list && bak.list.length) || 0;
    var h = '<p class="bak-note">가족 기록 전체(<b>config·data·fridge·ledger</b>)를 하루 한 번 <b>backups/날짜.json</b>으로 남겨요. '
      + '<b>7일</b>이 지난 백업은 새 백업을 만들 때 자동으로 지워져요.</p>'
      + '<div class="bak-hero">'
      + '<div class="bak-hero-head"><b>💾 지금 백업 만들기</b><span>'

  async function loadBackupMeta(force) {
    var list = bak.list || [];
    var need = [];
    for (var i = 0; i < list.length; i++) {
      var key = bakDateKey((list[i] || {}).name);
      if (!key) continue;
      if (!force && bak.meta[key]) continue;
      need.push(key);
    }
    if (!need.length) return;
    await mapLimit(need, 3, async function (key) {
      var res = await ghGet(BACKUP_DIR + '/' + key + '.json');
      if (!res.ok || res.missing) { bak.meta[key] = { count: null }; return; }
      var d = asObj(res.data);
      var files = asObj(d.files);
      var n = 0;
      for (var p in files) if (Object.prototype.hasOwnProperty.call(files, p)) n++;
      bak.meta[key] = { count: n };
    });
    renderBackup();
  }

  async function loadBackupList(force) {
    if (!isAdmin()) return;
    if (bak.loading) return;
    bak.loading = true;
    bak.listErr = '';
    renderBackup();
    var res = await ghGet(BACKUP_DIR);
    bak.loading = false;
    if (!res.ok) {
      bak.listErr = res.error || ('HTTP ' + (res.status || 0));
      bak.list = [];
    } else if (res.missing) {
      bak.list = [];
      bak.todayExists = false;
    } else {
      var items = asArr(res.list);
      var list = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i] || {};
        if (it.type !== 'file') continue;
        if (!bakDateKey(it.name || it.path)) continue;
        list.push(it);
      }
      list.sort(function (a, b) { return (a.name < b.name) ? 1 : (a.name > b.name ? -1 : 0); });
      bak.list = list;
      bak.todayExists = false;
      for (var j = 0; j < list.length; j++) if (bakDateKey(list[j].name) === todayKey()) bak.todayExists = true;
    }
    renderBackup();
    loadBackupMeta(!!force);
  }

  async function runBackupNow() {
    if (!isAdmin() || bak.busy) return;
    bak.busy = true;
    bak.msg = { ok: true, text: '⏳ 지금 기록을 백업하는 중이에요…' };
    renderBackup();

    bak.busy = false;
    if (r && r.ok) {
      var t = '✓ ' + bakNiceDate(r.date) + ' 백업을 만들었어요 · 파일 ' + r.count + '개'

      showToast('백업을 만들지 못했어요. 다시 시도해 주세요.');

  async function downloadBackup(key) {
    if (!isAdmin() || !bakDayOf(key)) return;
    var res = await ghGet(BACKUP_DIR + '/' + key + '.json');
    if (!res.ok || res.missing) { showToast('백업 파일을 내려받지 못했어요.'); return; }
    var text = res.raw || JSON.stringify(res.data, null, 2);
    var blob = new window.Blob([text], { type: 'application/json' });
    var url = window.URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'jadenfamily-backup-' + key + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 4000);
    showToast('백업 파일을 저장했어요: ' + key + '.json');
  }

  /* 복구 뒤에는 계정 파일이 그때 상태로 돌아왔을 수 있어서 내 권한을 다시 맞춰요 */
  async function syncAfterRestore() {
    var res = await ghGet('config/users.json');
    if (!res.ok || !res.data || Object.prototype.toString.call(res.data.users) !== '[object Array]') return;
    cloud.users = res.data;

    var u = findUserById(cloud.me && cloud.me.id);
    if (!u) {
      showToast('복구한 백업에 내 계정이 없어 로그아웃했어요.');
      doLogout(true);
      return;
    }
    if (cloud.me) {
      cloud.me.role = ROLES[u.role] ? u.role : 'viewer';
      cloud.me.name = u.name || u.id;
      cloud.me.dashboards = dashboardsFor(u);
      saveSession(cloud.me, !!(cloud.session && cloud.session.store === 'local'), cloud.session);
    }
    applyUserUi();

  async function restoreBackup(key) {
    if (!isAdmin() || bak.busy) return;
    if (!bakDayOf(key)) return;
    var meta = bak.meta[key] || null;
    var nTxt = (meta && meta.count != null) ? '파일 ' + meta.count + '개를 ' : '파일을 ';
    if (!window.confirm('💾 ' + bakNiceDate(key) + ' 백업으로 복구할까요?\n\n'
        + nTxt + '그날 상태로 되돌려요.\n지금 있는 기록은 그때 상태로 덮어써져요.\n계정(config/users.json)도 그날 상태로 돌아가요.')) return;
    if (!window.confirm('마지막 확인이에요.\n' + bakNiceDate(key) + ' 이후에 저장한 기록은 사라져요.\n정말 복구할까요?')) return;

    bak.busy = true;
    bak.msg = { ok: true, text: '⏳ 백업 파일을 읽는 중이에요…' };
    renderBackup();
    var res = await ghGet(BACKUP_DIR + '/' + key + '.json');
    if (!res.ok || res.missing || !res.data) {
      bak.busy = false;
      bak.msg = { ok: false, text: '⚠️ 그 백업 파일을 읽지 못했어요. 목록을 새로 고친 뒤 다시 시도해 주세요.' };
      renderBackup();
      return;
    }
    var files = asObj(res.data.files);
    var paths = [];
    for (var p in files) {
      if (!Object.prototype.hasOwnProperty.call(files, p)) continue;
      if (!isBackupTarget(p) || !isPlainObj(files[p])) continue; /* backups/ 같은 곳에는 절대 쓰지 않아요 */
      paths.push(p);
    }
    if (!paths.length) {
      bak.busy = false;
      bak.msg = { ok: false, text: '⚠️ 이 백업에는 되돌릴 파일이 없어요.' };
      renderBackup();
      return;
    }
    paths.sort();
    var done = 0, failed = [];
    for (var i = 0; i < paths.length; i++) {
      var one = paths[i];
      bak.msg = { ok: true, text: '⏳ 복구하는 중… ' + (i + 1) + '/' + paths.length + ' · ' + one };
      renderBackup();
      var cur = await ghGet(one); /* 최신 sha를 먼저 확인해요 */
      if (!cur.ok) { failed.push(one + ' (' + (cur.error || '') + ')'); continue; }
      var put = await ghPut(one, files[one], '복구: ' + key + ' — ' + one);
      if (put.ok) done++;
      else failed.push(one + ' (' + (put.error || '') + ')');
    }
    bak.busy = false;
    if (!failed.length) {
      bak.msg = { ok: true, text: '✓ ' + bakNiceDate(key) + ' 백업으로 복구했어요 · 파일 ' + done + '개' };
      showToast('✓ ' + bakNiceDate(key) + ' 백업으로 복구했어요');
    } else {
      bak.msg = {
        ok: false,
        text: '⚠️ ' + (done ? done + '개는 되돌렸지만 ' : '') + failed.length + '개를 되돌리지 못했어요: '
          + failed.slice(0, 3).join(', ') + (failed.length > 3 ? ' 외 ' + (failed.length - 3) + '개' : '')
      };
      showToast('일부 파일을 되돌리지 못했어요.');
    }
    await syncAfterRestore();
    bak.list = null;
    await loadBackupList(true);
  }

  /* 관리자가 들어오면 하루 한 번만, 화면을 막지 않고 조용히 백업해요 */
