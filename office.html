<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>AI 사무실 · jadenfamily</title>
<meta name="description" content="우리 집 AI 사무실 — 팀별 AI 직원에게 일을 맡기고 대표님이 결재해요">
<meta name="apple-mobile-web-app-title" content="AI 사무실">
<meta property="og:title" content="AI 사무실 · jadenfamily">
<meta property="og:description" content="CS·기획·디자인·개발·QC·리서치 팀에게 맡기고 대표님 결재로 마무리">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/office.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --ink-3:#958da8;
    --line:#efe4d6;
    --line-2:#f6efe4;
    --card:#ffffff;
    --paper:#fff8ef;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --shadow-s:0 4px 12px rgba(118,86,54,.07);
    --r-lg:20px;
    --r-md:14px;
    --sun:#f59e0b;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ef4b74;
    --sky:#3d9be9;
    --clay:#c2703c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; max-width:100%; overflow-x:hidden; }
  html{ -webkit-text-size-adjust:100%; height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); font-size:15px; line-height:1.45; height:100%; overflow:hidden;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 6% -8%, #ffe6c7 0, rgba(255,230,199,0) 44%),
      radial-gradient(circle at 94% -4%, #dff0ff 0, rgba(223,240,255,0) 42%),
      radial-gradient(circle at 50% 112%, #ffe7f0 0, rgba(255,231,240,0) 44%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  select,input,textarea{ font-family:inherit; font-size:15px; color:var(--ink); }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:inherit; }

  /* ---------- 뼈대 ---------- */
  .app{ height:100%; display:flex; flex-direction:column; min-height:0; min-width:0; }
  .topbar{
    display:flex; align-items:center; gap:10px; padding:9px 14px; flex:0 0 auto;
    background:rgba(255,248,239,.9); backdrop-filter:saturate(150%) blur(10px);
    border-bottom:1px solid rgba(239,228,214,.9); position:relative; z-index:20;
  }
  .back{
    width:36px; height:36px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center;
    background:#fff; box-shadow:var(--shadow-s); text-decoration:none; font-size:17px; font-weight:900; color:var(--ink);
  }
  .back:active{ transform:scale(.96); }
  .office-logo{
    width:36px; height:36px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center; font-size:19px;
    background:linear-gradient(150deg,#e9e2ff 0%,#d9ecff 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  }
  .brand{ min-width:0; }
  .brand h1{ margin:0; font-size:16.5px; font-weight:900; letter-spacing:-.03em; line-height:1.15; white-space:nowrap; }
  .brand p{ margin:1px 0 0; font-size:11px; font-weight:800; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
  .conn{
    display:flex; align-items:center; gap:6px; margin-left:8px; padding:5px 10px; border-radius:999px;
    background:#fff; box-shadow:var(--shadow-s); font-size:11.5px; font-weight:900; color:#4d4463; max-width:31vw;
  }
  .conn i{ width:8px; height:8px; border-radius:50%; background:#c9c2d6; flex:0 0 auto; }
  .conn i.ok{ background:var(--mint); box-shadow:0 0 0 3px rgba(16,185,129,.16); }
  .conn i.warn{ background:var(--sun); }
  .conn span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .grow{ flex:1 1 auto; }
  .counts{ display:flex; align-items:center; gap:10px; font-size:11.5px; font-weight:900; color:#6b6382; white-space:nowrap; }
  .counts b{ color:var(--ink); font-weight:900; }
  .counts .c-wait b{ color:#c2703c; }
  .counts .c-work b{ color:#3d6fd0; }
  .icon-btn{
    width:36px; height:36px; border:0; border-radius:12px; background:#fff; box-shadow:var(--shadow-s);
    font-size:15px; display:grid; place-items:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  .wrap{ flex:1 1 auto; min-height:0; min-width:0; display:flex; }

  /* 왼쪽 층 안내 */
  .rail{
    flex:0 0 92px; padding:12px 8px; overflow-y:auto; border-right:1px solid rgba(239,228,214,.75);
    display:flex; flex-direction:column; gap:7px;
  }
  .rail .rlabel{ font-size:10.5px; font-weight:900; color:#a49bb6; padding:0 4px 2px; letter-spacing:-.01em; }
  .rail button{
    border:1.5px solid #f2e8db; background:#fff; border-radius:14px; padding:8px 6px; display:flex; flex-direction:column;
    gap:1px; align-items:center; box-shadow:0 2px 6px rgba(118,86,54,.04);
  }
  .rail button b{ font-size:14px; font-weight:900; letter-spacing:-.02em; }
  .rail button span{ font-size:10px; font-weight:800; color:#8d849f; }
  .rail button .rn{ font-size:10px; font-weight:900; color:#b6aec6; }
  .rail button.on{ background:#2b2440; border-color:#2b2440; color:#fff; }
  .rail button.on span, .rail button.on .rn{ color:#cfc6e4; }

  /* 사무실 */
  .office{ flex:1 1 auto; min-width:0; overflow-y:auto; overflow-x:hidden; padding:14px 16px 28px; -webkit-overflow-scrolling:touch; }
  .office-head{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .office-head h2{ margin:0; font-size:18px; font-weight:900; letter-spacing:-.03em; }
  .office-head p{ margin:0; font-size:11.5px; font-weight:800; color:#958da8; }

  .room{
    background:rgba(255,255,255,.72); border:1.5px solid #f1e7d9; border-radius:var(--r-lg);
    padding:11px 12px 12px; margin-bottom:11px; box-shadow:0 3px 10px rgba(118,86,54,.04);
  }
  .room.owner{ background:linear-gradient(150deg,#fff3df 0%,#fff9f0 62%,#fff 100%); border-color:#f6ddb4; }
  .room.lobby{ background:linear-gradient(150deg,#eef7ff 0%,#f8fbff 60%,#fff 100%); border-color:#d9ebfd; }
  .room-head{ display:flex; align-items:center; gap:8px; margin-bottom:9px; min-height:22px; }
  .room-floor{ font-size:15px; font-weight:900; letter-spacing:-.03em; }
  .room-name{ font-size:11.5px; font-weight:900; color:#8a5a2c; }
  .room.lobby .room-name{ color:#2f6fa8; }
  .room-sub{ font-size:10.5px; font-weight:800; color:#a49bb6; }
  .room-wait{
    margin-left:auto; font-size:11px; font-weight:900; color:#b56a25; background:#fff3df;
    border:1.5px solid #f6ddb4; border-radius:999px; padding:3px 9px;
  }
  .room-wait.zero{ color:#9c94ad; background:#faf7f2; border-color:#efe7db; }

  .team-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:9px; }
  .team-card{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;
    border:1.5px solid #f0e7da; background:#fff; border-radius:16px; padding:10px 10px 9px; min-width:0;
    box-shadow:0 3px 10px rgba(118,86,54,.05); transition:transform .12s ease, box-shadow .12s ease;
  }
  .team-card:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(118,86,54,.10); }
  .team-card:active{ transform:scale(.99); }
  .team-card .tc-top{ display:flex; align-items:center; gap:7px; width:100%; min-width:0; }
  .avatar{ position:relative; width:44px; height:44px; flex:0 0 auto; }
  .avatar svg{ display:block; width:44px; height:49.5px; }
  .avatar .em{
    position:absolute; right:-3px; bottom:1px; width:19px; height:19px; border-radius:50%; background:#fff;
    display:grid; place-items:center; font-size:11px; box-shadow:0 1px 4px rgba(80,60,40,.16);
  }
  .tc-name{ font-size:13px; font-weight:900; letter-spacing:-.03em; line-height:1.2; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .tc-model{
    display:inline-flex; align-items:center; gap:4px; max-width:100%; font-size:9.5px; font-weight:900; color:#7d7392;
    background:#f7f4ff; border:1px solid #ede7ff; border-radius:999px; padding:1px 7px;
  }
  .tc-model i{ width:6px; height:6px; border-radius:50%; background:#a99fd0; }
  .tc-model i.gemini{ background:#4285f4; } .tc-model i.openrouter{ background:#7a5cf0; } .tc-model i.groq{ background:#f55036; }
  .tc-model span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tc-foot{ display:flex; align-items:center; gap:5px; width:100%; min-width:0; flex-wrap:wrap; }
  .status{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:900; border-radius:999px; padding:2px 7px; }
  .status i{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .status.idle{ color:#8d849f; background:#f6f3ee; }
  .status.working{ color:#2f6fd0; background:#eaf3ff; }
  .status.working i{ animation:pulse 1.1s ease-in-out infinite; }
  .status.waiting{ color:#b4652a; background:#fff1df; }
  .status.done{ color:#0f8a62; background:#e8f9f1; }
  .tc-n{ margin-left:auto; font-size:10px; font-weight:900; color:#b3aabf; }
  .tc-n b{ color:#d1743a; }

  /* 대표실 결재 카드 */
  .ap-mini{
    display:flex; align-items:center; gap:9px; background:#fff; border:1.5px solid #f4e3c7; border-radius:14px;
    padding:8px 9px; margin-bottom:7px; min-width:0;
  }
  .ap-mini .am-ic{ width:28px; height:28px; border-radius:10px; display:grid; place-items:center; background:#fff3df; font-size:14px; flex:0 0 auto; }
  .ap-mini .am-body{ min-width:0; flex:1 1 auto; }
  .ap-mini .am-title{ display:block; font-size:12.5px; font-weight:900; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ap-mini .am-sub{ display:block; font-size:10.5px; font-weight:800; color:#a49bb6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ap-mini .am-act{ display:flex; gap:5px; flex:0 0 auto; }
  .btn-s{
    border:0; border-radius:10px; padding:6px 9px; font-size:11px; font-weight:900; white-space:nowrap;
    background:#f4f1fb; color:#5d4f96;
  }
  .btn-s.ok{ background:linear-gradient(150deg,#7c5cfc,#5a7bff); color:#fff; box-shadow:0 4px 10px rgba(92,72,200,.22); }
  .btn-s.warn{ background:#fff1f2; color:#c14160; }
  .empty{ font-size:11.5px; font-weight:800; color:#a9a1b8; padding:7px 2px; }
  .lobby-row{ display:flex; align-items:center; gap:9px; }
  .lobby-row .lz{ font-size:11px; font-weight:800; color:#5d7fa0; }

  /* 오른쪽 패널 */
  .panel{
    flex:0 0 384px; width:384px; border-left:1px solid rgba(239,228,214,.9);
    overflow-y:auto; overflow-x:hidden; padding:12px 12px 20px; background:rgba(255,252,248,.72);
    -webkit-overflow-scrolling:touch;
  }
  .pane{ display:block; margin-bottom:12px; background:#fff; border:1.5px solid #f1e7d9; border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .pane-head{ display:flex; align-items:center; gap:7px; padding:11px 12px 8px; }
  .pane-head h3{ margin:0; font-size:14px; font-weight:900; letter-spacing:-.03em; }
  .pane-head .n{ margin-left:auto; font-size:11px; font-weight:900; color:#b4652a; background:#fff1df; border-radius:999px; padding:2px 8px; }
  .pane-body{ padding:0 12px 12px; }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:9px; min-width:0; }
  .field > span.lbl{ font-size:11px; font-weight:900; color:#8d849f; }
  .field input, .field select, .field textarea{
    width:100%; min-width:0; border:1.5px solid #eee6db; border-radius:11px; padding:9px 10px; background:#fffdfa;
  }
  .field textarea{ resize:vertical; min-height:78px; line-height:1.5; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid #e2d9ff; border-color:#cfc0ff; }
  .row2{ display:flex; gap:8px; }
  .row2 > *{ flex:1 1 0; min-width:0; }
  .hint{ margin:2px 0 8px; font-size:10.5px; font-weight:800; color:#a49bb6; line-height:1.5; }
  .btn{
    border:0; border-radius:12px; padding:10px 12px; font-size:13px; font-weight:900; color:#fff; width:100%;
    background:linear-gradient(150deg,#7c5cfc,#5a7bff); box-shadow:0 8px 18px rgba(92,72,200,.2);
  }
  .btn[disabled]{ opacity:.55; box-shadow:none; }
  .btn.ghost{ background:#f7f3ff; color:#5d4f96; box-shadow:none; }
  .btn.warn{ background:#fff1f2; color:#c14160; box-shadow:none; }
  .btn.clay{ background:linear-gradient(150deg,#e08a49,#c96f2c); box-shadow:0 8px 18px rgba(190,110,50,.22); }
  .btn-line{ display:flex; gap:7px; flex-wrap:wrap; }
  .btn-line .btn{ width:auto; flex:1 1 110px; }
  .chiprow{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 9px; }
  .chip{
    border:1.5px solid #efe6ff; background:#faf7ff; color:#5d4f96; border-radius:999px; padding:5px 10px;
    font-size:11px; font-weight:900;
  }
  .chip.on{ background:#f0eaff; border-color:#c9b8ff; }

  /* 결재 카드 */
  .ap-card{ border:1.5px solid #f3e3c9; border-radius:15px; padding:10px; margin-bottom:9px; background:#fffdf8; }
  .ap-card.approved{ border-color:#d9f2e6; background:#fbfffd; }
  .ap-card.rejected{ border-color:#f6dfe4; background:#fffafb; }
  .ap-h{ display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:900; color:#b4652a; }
  .ap-h .who{ color:#8d849f; }
  .ap-h .when{ margin-left:auto; color:#b3aabf; font-weight:800; }
  .ap-t{ margin:5px 0 3px; font-size:13.5px; font-weight:900; letter-spacing:-.03em; line-height:1.3; }
  .ap-sum{ font-size:12px; font-weight:700; color:#4c4460; white-space:pre-wrap; line-height:1.55; }
  .ap-points{ margin:7px 0 0; padding-left:15px; font-size:11.5px; font-weight:800; color:#6d6484; }
  .ap-points li{ margin:2px 0; }
  .ap-rec{ margin-top:7px; font-size:11px; font-weight:900; color:#5d4f96; background:#f7f4ff; border-radius:9px; padding:6px 8px; }
  .ap-actions{ display:flex; gap:6px; margin-top:8px; }
  .ap-actions .btn-s{ flex:1 1 0; padding:8px 6px; font-size:12px; }
  details.ap-d{ margin-top:8px; border-top:1px dashed #f0e7da; padding-top:6px; }
  details.ap-d > summary{ cursor:pointer; font-size:11px; font-weight:900; color:#7d7392; list-style:none; }
  details.ap-d > summary::-webkit-details-marker{ display:none; }
  details.ap-d > summary:before{ content:'▸ '; }
  details.ap-d[open] > summary:before{ content:'▾ '; }
  .ap-detail{ margin:6px 0 0; font-size:11.5px; font-weight:700; color:#5a5270; white-space:pre-wrap; word-break:break-word; line-height:1.5; max-height:260px; overflow:auto; }
  .diffbox{ margin:6px 0 0; max-height:230px; overflow:auto; background:#fbfaf7; border:1px solid #f1ece1; border-radius:9px; padding:7px 8px; }
  .diffbox pre{ margin:0; font-size:10.5px; line-height:1.45; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre; }
  .diffbox .add{ color:#0f8a62; } .diffbox .del{ color:#c14160; } .diffbox .ctx{ color:#8d849f; }
  .codemeta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; font-size:10.5px; font-weight:900; }
  .codemeta span{ background:#f4f8ff; color:#39628f; border-radius:999px; padding:2px 8px; }
  .codemeta span.ok{ background:#e8f9f1; color:#0f8a62; }
  .codemeta span.bad{ background:#fff1f2; color:#c14160; }
  .rejectbox{ margin-top:7px; }
  .rejectbox textarea{ width:100%; min-height:62px; border:1.5px solid #f2dde2; border-radius:10px; padding:8px; background:#fff; }

  /* 접수함 */
  .ib-item{ border:1.5px solid #eaf1f8; border-radius:13px; padding:8px 9px; margin-bottom:7px; background:#fbfdff; }
  .ib-h{ display:flex; align-items:center; gap:6px; font-size:10px; font-weight:900; color:#5d7fa0; }
  .ib-h .src{ background:#eaf3ff; color:#2f6fd0; border-radius:999px; padding:1px 7px; }
  .ib-h .when{ margin-left:auto; color:#a9b8c6; font-weight:800; }
  .ib-t{ margin:4px 0 0; font-size:11.5px; font-weight:800; color:#3f4a59; white-space:pre-wrap; word-break:break-word; line-height:1.5; }

  /* 모바일 탭 */
  .mtab{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    background:rgba(255,251,245,.96); backdrop-filter:saturate(150%) blur(12px); border-top:1px solid #f1e7d9;
  }
  .mtab .tabs{ display:flex; gap:5px; }
  .mtab button{
    flex:1 1 0; min-width:0; border:0; background:transparent; border-radius:12px; padding:6px 2px;
    display:flex; flex-direction:column; align-items:center; gap:1px; font-size:10.5px; font-weight:900; color:#958da8;
  }
  .mtab button b{ font-size:16px; font-weight:900; line-height:1.1; }
  .mtab button.on{ background:#2b2440; color:#fff; }
  .mtab button .badge{ font-size:9px; font-weight:900; color:#fff; background:#d1743a; border-radius:999px; padding:0 5px; margin-left:3px; vertical-align:top; }
  .mtab button.on .badge{ background:#f0a45f; color:#3a2a15; }

  /* ---------- 잠금 화면 ---------- */
  .gate{
    position:fixed; inset:0; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; padding:20px;
    box-sizing:border-box; width:100%; max-width:100%;
    background:var(--card, #fff8ef);
    background-image:
      radial-gradient(circle at 10% -10%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% 0%, #dcf0ff 0, rgba(220,240,255,0) 44%);
    overflow-y:auto; overflow-x:hidden; z-index:60;
  }
  .gate-card{
    width:100%; max-width:min(440px, calc(100vw - 32px)); box-sizing:border-box; min-width:0; overflow:hidden;
    background:#fff; border-radius:26px; padding:26px 22px 22px;
    box-shadow:0 18px 44px rgba(118,86,54,.14); text-align:center;
  }
  .gate-card *{ box-sizing:border-box; }
  .gate-card input, .gate-card button, .gate-card textarea, .gate-card select{ max-width:100%; min-width:0; }
  .gate-logo{
    width:62px; height:62px; margin:0 auto 12px; border-radius:22px; display:grid; place-items:center; font-size:32px;
    background:linear-gradient(150deg,#ece6ff 0%,#dcf0ff 100%);
  }
  .gate-card h1{ margin:0 0 4px; font-size:21px; font-weight:900; letter-spacing:-.03em; }
  .gate-sub{ margin:0 0 16px; font-size:13px; font-weight:800; color:var(--ink-2); line-height:1.6; white-space:normal; word-break:keep-all; overflow-wrap:anywhere; max-width:100%; }
  .gate-form{ display:flex; flex-direction:column; gap:10px; text-align:left; position:relative; min-width:0; }
  .gate-form label{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:900; color:var(--ink-2); min-width:0; }
  .gate-form input{
    border:1.5px solid #eee6db; border-radius:13px; padding:11px 13px; font-size:15px; background:#fffdfa;
    width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  }
  .gate-form input:focus{ outline:2px solid #d9cffd; border-color:#cfc0ff; }
  .gate-hide-user{
    position:absolute; left:0; top:0; width:1px; height:1px; padding:0; margin:0; border:0;
    opacity:0; pointer-events:none;
  }
  .gate-btn{
    border:0; border-radius:14px; padding:13px; font-size:15px; font-weight:900; color:#fff;
    width:100%; max-width:100%; box-sizing:border-box; white-space:normal;

<script>

  /* ===== 저장소 이름·경로 다듬기 (chat.html에서 승계) ===== */
  function normRepo(v) {
    var raw = String(v == null ? '' : v).trim();
    if (!raw) return '';
    var s = raw.toLowerCase().replace(/[?#].*$/, '').replace(/\s+/g, '').replace(/\/+$/, '');
    var tokens = s.split(/[\/]+/), i, k, t;
    for (i = tokens.length - 1; i >= 0; i--) {
      t = tokens[i].replace(/\.git$/, '');
      if (!t) continue;
      for (k = 0; k < CODE_REPOS.length; k++) if (t === CODE_REPOS[k]) return CODE_REPOS[k];
    }
    for (i = tokens.length - 1; i >= 0; i--) {
      t = tokens[i].replace(/\.git$/, '');

      if (t && t.indexOf('jadenfamily.') >= 0) continue;

        alg: 'SHA1', digits: TOTP_DIGITS, period: TOTP_PERIOD,
        secret: setup.secret, issuer: TOTP_ISSUER, label: totpLabel(S.me.id),
        kdf: w.kdf, kdfIter: w.kdfIter, salt: w.salt, iv: w.iv, wrappedKey: w.wrappedKey,
        chatSalt: S.chatSalt ? b64enc(S.chatSalt) : '', chatIter: S.chatIter,
        createdAt: nowIso(), updatedAt: nowIso()
      };
      var saved = await saveTotpConfig(cfg);
      if (!saved.ok) { S.totpMsg = saved.error; renderSettings(); return; }
      S.totp = { ok: true, present: true, enabled: true, cfg: cfg };
      S.totpSetup = null;
      S.totpMsg = '2차 인증을 켰어요. 다음부터는 6자리 번호만으로 열려요.';
      renderSettings();
      toast('2차 인증을 켰어요.');
    } catch (e) {
      S.totpMsg = '2차 인증을 켜지 못했어요. ' + (e && e.message ? e.message : '');
      renderSettings();
    }
  }
  async function totpDisableSubmit() {
    if (!S.totp || !S.totp.enabled) return;
    var code = String(fieldVal('totpOffCode')).replace(/\D/g, '');
    var pw = fieldVal('totpOffPw');
    var ok = false;
    if (code.length === TOTP_DIGITS) ok = await totpVerify(S.totp.cfg && S.totp.cfg.secret, code);
    else if (pw) {
      await freshUsers();
      var u = findUser(S.me.id);
      ok = !!(u && u.salt && u.hash && (await hashPassword(pw, u.salt)) === u.hash);
    }
    if (!ok) {
      S.totpMsg = (code || pw) ? '번호나 비밀번호가 맞지 않아요.' : '6자리 번호나 계정 비밀번호를 넣어 주세요.';
      renderSettings();
      return;
    }
    S.totpMsg = '끄는 중…';
    renderSettings();
    var saved = await saveTotpConfig({ version: 1, userId: S.me.id, enabled: false, disabledAt: nowIso(), updatedAt: nowIso() });
    if (!saved.ok) { S.totpMsg = saved.error; renderSettings(); return; }
    S.totp = { ok: true, present: true, enabled: false, cfg: null };
    S.totpOff = false;
    S.totpMsg = '2차 인증을 껐어요. 이제 비밀번호로 열려요.';
    renderSettings();
    toast('2차 인증을 껐어요.');
  }
  function totpCopySecret() {
    var secret = S.totpSetup ? S.totpSetup.secret : '';
    if (!secret) return;
    function done() { toast('열쇠를 복사했어요.'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = secret;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) { toast('복사하지 못했어요. 열쇠를 길게 눌러 직접 복사해 주세요.'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(secret).then(done).catch(fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  /* 비밀번호로 열었을 때 2차 인증 열쇠를 지금 열쇠에 맞춰 조용히 다시 감싸요 */
  async function rewrapTotpKey() {
    if (!S.totp || !S.totp.enabled || !S.totp.cfg || !S.chatKey) return false;
    var cfg = S.totp.cfg;
    try {
      var cur = await unwrapChatKey(cfg);
      var a = new Uint8Array(await subtle().exportKey('raw', cur));
      var b = new Uint8Array(await subtle().exportKey('raw', S.chatKey));
      var same = a.length === b.length;
      for (var i = 0; same && i < a.length; i++) if (a[i] !== b[i]) same = false;
      if (same) return true;
    } catch (e) { /* 아래에서 새로 감싸요 */ }
    try {
      var w = await wrapChatKey(cfg.secret, S.chatKey, cfg.userId, Number(cfg.kdfIter) || TOTP_ITER);
      cfg.kdf = w.kdf; cfg.kdfIter = w.kdfIter; cfg.salt = w.salt; cfg.iv = w.iv; cfg.wrappedKey = w.wrappedKey;
      if (S.chatSalt) cfg.chatSalt = b64enc(S.chatSalt);
      cfg.chatIter = S.chatIter;
      cfg.updatedAt = nowIso();
      var r = await saveTotpConfig(cfg);
      if (r.ok) S.totp.cfg = cfg;
      return !!r.ok;
    } catch (e) { return false; }
  }

  /* 등록된 기기 잠금 해제 · 새 기기 등록: 6자리 번호만으로 */
  async function unlockWithTotp(code, deviceName) {
    if (!S.me) return { ok: false, message: '계정을 확인하지 못했어요.' };
    var cfgRes = await loadTotpConfig(S.me.id);
    S.totp = cfgRes;
    if (!cfgRes.ok && !cfgRes.enabled) {
      return { ok: false, message: '2차 인증 설정을 읽지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.' };
    }
    if (!cfgRes.enabled) {
      return { ok: false, message: '2차 인증이 꺼져 있어요. 비밀번호로 열어 주세요.', needsPassword: true };
    }
    var cfg = cfgRes.cfg;
    if (!(await totpVerify(cfg.secret, code))) {
      return { ok: false, message: '번호가 맞지 않아요. 인증 앱의 최신 6자리를 넣어 주세요.' };
    }
    var key;
    try { key = await unwrapChatKey(cfg); }
    catch (e) { return { ok: false, message: '인증은 확인했지만 대화 열쇠를 풀지 못했어요. 비밀번호로 열어 주세요.', needsPassword: true }; }

    S.chatKey = key;
    S.chatSalt = cfg.chatSalt ? b64dec(cfg.chatSalt) : window.crypto.getRandomValues(new Uint8Array(16));
    S.chatIter = clamp(Number(cfg.chatIter) || CHAT_ITER, 1000, 1000000);

    var envRes = await readThreadsEnvelope();
    if (!envRes.ok) { S.chatKey = null; return { ok: false, message: envRes.error || '대화 보관함을 확인하지 못했어요.' }; }
    if (envRes.env) {
      S.chatSalt = b64dec(envRes.env.salt);
      S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      try { await chatDecrypt(envRes.env); }
      catch (e) {
        S.chatKey = null;
        return { ok: false, message: '인증은 확인했지만 대화를 열지 못했어요. 비밀번호로 열고 2차 인증을 다시 켜 주세요.', needsPassword: true };
      }
    }
    S.unlocked = true;
    touchActivity();
    await bioRefreshKey();
    if (S.gateMode === 'device') {
      var reg = await registerDevice(deviceName);
      if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
    }
    return { ok: true };
  }

  async function submitGateTotp() {
    if (S.gateBusy) return;
    var code = String(fieldVal('gateTotp')).replace(/\D/g, '');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateTotpBtn');
    if (code.length !== TOTP_DIGITS) return gateFail('인증 앱에 뜬 6자리 번호를 넣어 주세요.');
    S.gateBusy = true;
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      var r = await unlockWithTotp(code, name);
      if (!r.ok) {
        gateFail(r.message || '열지 못했어요.');
        if (r.needsPassword) { S.gateAlt = true; renderGate(); gateFail(r.message || ''); }
        return;
      }
      await enterChat();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      S.gateBusy = false;
      var b2 = document.getElementById('gateTotpBtn');
      if (b2) { b2.disabled = false; b2.textContent = S.gateMode === 'device' ? '이 기기 등록하고 열기' : '열기'; }
    }
  }

  async function pasteGateTotp() {
    var el = document.getElementById('gateTotp');
    if (!el || S.gateBusy) return;
    var txt = '';
    try {
      if (navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText();
    } catch (e) { txt = ''; }
    var digits = String(txt || '').replace(/\D/g, '');
    if (digits.length > 6) digits = digits.slice(0, 6);
    if (digits.length < 6) {
      try { el.focus(); } catch (e2) { /* 무시 */ }
      if (digits) el.value = digits;
      toast('복사한 6자리 번호를 찾지 못했어요. 인증 앱에서 번호를 복사한 뒤 다시 눌러 주세요.');
      return;
    }
    el.value = digits;
    await submitGateTotp();
  }

  /* ===== 생체인증(WebAuthn) (chat.html에서 승계) ===== */
  function hasBiometricSupport() {
    return !!(window.PublicKeyCredential && navigator.credentials
      && typeof navigator.credentials.create === 'function'
      && typeof navigator.credentials.get === 'function'
      && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'));
  }
  function b64urlEnc(buf) {
    return b64enc(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDec(txt) {
    var s = String(txt || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return b64dec(s);
  }
  function bioUserId() { return String((S.me && S.me.id) || ''); }
  function bioStoreKey() { return K_BIO + bioUserId(); }
  function bioWrapKeyName() { return K_BIO_WRAP + bioUserId(); }

  /* 이 기기에 등록해 둔 생체인증 정보. 없거나 망가졌으면 null */
  function getBioRecord() {
    var id = bioUserId();
    if (!id) return null;
    var raw = lsGet(bioStoreKey());
    if (!raw) return null;
    var rec = null;
    try { rec = JSON.parse(raw); } catch (e) { return null; }
    if (!rec || typeof rec !== 'object' || !rec.credIdB64 || !rec.wrappedKey || !rec.iv) return null;
    if (rec.userId && String(rec.userId) !== id) return null;
    return rec;
  }
  function saveBioRecord(rec) {
    var id = bioUserId();
    if (!id || !rec) return false;
    rec.version = 1;
    rec.userId = id;
    rec.updatedAt = nowIso();
    return lsSet(bioStoreKey(), JSON.stringify(rec));
  }
  function clearBioRecord() {
    lsDel(bioStoreKey());
    lsDel(bioWrapKeyName());
  }
  function bioLabel() {
    var ua = String(navigator.userAgent || '');
    if (/iPhone|iPad|iPod/.test(ua)) return 'Face ID · Touch ID';
    if (/Macintosh/.test(ua)) return 'Touch ID';
    if (/Android/.test(ua)) return '지문 · 얼굴';
    if (/Windows/.test(ua)) return 'Windows Hello';
    return 'Face ID / 지문';
  }
  function bioAad() { return new TextEncoder().encode('bio:' + bioUserId()); }

  /* 대화 열쇠를 이 기기에서만 쓰는 열쇠로 감싸 둠 (감싸는 열쇠도 이 기기에만) */
  async function bioWrapChatKey(key) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 생체인증을 쓸 수 없어요');
    var raw = new Uint8Array(await sub.exportKey('raw', key));
    var local = window.crypto.getRandomValues(new Uint8Array(32));
    if (!lsSet(bioWrapKeyName(), b64enc(local))) throw new Error('이 기기에 저장하지 못했어요');
    var kek = await sub.importKey('raw', local, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var ct = await sub.encrypt({ name: 'AES-GCM', iv: iv, additionalData: bioAad() }, kek, raw);
    return { iv: b64enc(iv), wrappedKey: b64enc(ct) };
  }
  async function bioUnwrapChatKey(rec) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 생체인증을 쓸 수 없어요');
    var localB64 = lsGet(bioWrapKeyName());
    if (!localB64) throw new Error('이 기기에 등록한 열쇠가 없어요');
    var kek = await sub.importKey('raw', b64dec(localB64), { name: 'AES-GCM' }, false, ['decrypt']);
    var raw = await sub.decrypt({ name: 'AES-GCM', iv: b64dec(rec.iv), additionalData: bioAad() }, kek, b64dec(rec.wrappedKey));
    return sub.importKey('raw', new Uint8Array(raw), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  }

  /* 비밀번호·6자리 번호로 열었을 때도 이 기기의 생체인증 열쇠를 지금 열쇠에 맞춰 조용히 맞춰 둬요 */
  async function bioRefreshKey() {
    try {
      var rec = getBioRecord();
      if (!rec || !S.chatKey || !bioUserId()) return false;
      var w = await bioWrapChatKey(S.chatKey);
      rec.iv = w.iv;
      rec.wrappedKey = w.wrappedKey;
      rec.chatSalt = S.chatSalt ? b64enc(S.chatSalt) : '';
      rec.chatIter = S.chatIter;
      return saveBioRecord(rec);
    } catch (e) { return false; }
  }

  /* 등록: 지금 이 기기의 얼굴·지문을 한 번 확인하고 대화 열쇠를 이 기기에만 맡겨 둬요 */
  async function bioRegister() {
    if (S.bioBusy) return;
    if (!hasBiometricSupport()) {
      S.bioMsg = '이 브라우저에서는 생체인증을 쓸 수 없어요. https 주소이거나 홈 화면에 추가한 앱에서 열어 주세요.';
      renderSettings();
      return;
    }
    if (!S.chatKey || !S.me) {
      S.bioMsg = '대화를 연 뒤에 생체인증을 등록해 주세요.';
      renderSettings();
      return;
    }
    S.bioBusy = true;
    S.bioMsg = '생체인증을 등록하는 중…';
    renderSettings();
    try {
      var cred = await navigator.credentials.create({ publicKey: {
        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "Jaden's Home", id: location.hostname || 'localhost' },
        user: {
          id: new TextEncoder().encode(String(S.me.id || 'user')),
          name: String(S.me.id || 'user'),
          displayName: String(S.me.name || S.me.id || 'Jaden')
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000
      } });
      if (!cred || !cred.rawId) throw new Error('이 기기가 생체인증을 받아 주지 않았어요');
      var w = await bioWrapChatKey(S.chatKey);
      var rec = {
        credIdB64: b64urlEnc(cred.rawId),
        createdAt: nowIso(),
        label: bioLabel(),
        alg: 'AES-GCM',
        iv: w.iv,
        wrappedKey: w.wrappedKey,
        chatSalt: S.chatSalt ? b64enc(S.chatSalt) : '',
        chatIter: S.chatIter
      };
      if (!saveBioRecord(rec)) throw new Error('이 기기에 저장하지 못했어요. 인터넷 창의 저장 공간이 가득 찼는지 확인해 주세요.');
      S.bioMsg = '';
      toast('Face ID / 생체인증이 등록됐어요!');
    } catch (e) {
      var nm = String((e && e.name) || '');
      S.bioMsg = (nm === 'NotAllowedError' || nm === 'AbortError')
        ? '생체인증 등록이 취소됐어요.'
        : (nm === 'InvalidStateError'
          ? '이 기기에 이미 생체인증이 등록되어 있어요. 기기 설정에서 지운 뒤 다시 해 주세요.'
          : '생체인증을 등록하지 못했어요.' + (e && e.message ? ' ' + e.message : ''));
      toast(S.bioMsg);
    } finally {
      S.bioBusy = false;
      renderSettings();
    }
  }

  /* 해제: 이 기기에서만 지워요. 다음부터는 비밀번호나 6자리 번호로 열어요. */
  function bioRemove() {
    clearBioRecord();
    S.bioMsg = '이 기기에서 생체인증을 해제했어요. 이제 비밀번호나 6자리 번호로 열어요.';
    renderSettings();
    toast('이 기기 생체인증을 해제했어요.');
  }

  /* 잠금 화면 맨 위의 ‘생체인증으로 열기’ */
  function bioGateHtml() {
    if (!hasBiometricSupport() || !getBioRecord()) return '';
    return '<button class="gate-btn" type="button" id="gateBioBtn" data-act="gate-bio" style="margin-bottom:10px">🔐 Face ID / 생체인증으로 열기</button>' +
      '<div class="gate-or">또는 직접 입력</div>';
  }

  async function gateBioUnlock() {
    if (S.gateBusy) return;
    var rec = getBioRecord();
    if (!rec || !hasBiometricSupport()) {
      gateFail('이 기기에서는 생체인증을 쓸 수 없어요. 아래 번호나 비밀번호로 열어 주세요.');
      return;
    }
    var btn = document.getElementById('gateBioBtn');
    var opened = false;
    S.gateBusy = true;
    if (btn) { btn.disabled = true; btn.textContent = '생체인증 확인 중…'; }
    try {
      var cred = await navigator.credentials.get({ publicKey: {
        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: b64urlDec(rec.credIdB64), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      } });
      if (!cred) throw new Error('생체인증을 확인하지 못했어요');
      var key = null;
      try { key = await bioUnwrapChatKey(rec); }
      catch (eu) {
        gateFail('생체인증은 확인했지만 대화 열쇠가 바뀌어 있어요. 아래 비밀번호나 번호로 열고 설정에서 생체인증을 다시 등록해 주세요.');
        return;
      }
      S.chatKey = key;
      S.chatSalt = rec.chatSalt ? b64dec(rec.chatSalt) : window.crypto.getRandomValues(new Uint8Array(16));
      S.chatIter = clamp(Number(rec.chatIter) || CHAT_ITER, 1000, 1000000);

      var envRes = await readThreadsEnvelope();
      if (!envRes.ok) { S.chatKey = null; gateFail(envRes.error || '대화 보관함을 확인하지 못했어요.'); return; }
      if (envRes.env) {
        S.chatSalt = b64dec(envRes.env.salt);
        S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
        try { await chatDecrypt(envRes.env); }
        catch (ed) {
          S.chatKey = null;
          gateFail('대화를 열지 못했어요. 비밀번호나 6자리 번호로 열고 설정에서 생체인증을 다시 등록해 주세요.');
          return;
        }
      }
      S.unlocked = true;
      touchActivity();
      if (S.gateMode === 'device') {
        var reg = await registerDevice(fieldVal('gateDevName') || S.deviceName);
        if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
      }
      await bioRefreshKey();
      opened = true;
      await enterChat();
    } catch (e) {
      if (!opened) S.chatKey = null;
      var nm = String((e && e.name) || '');
      if (nm === 'NotAllowedError' || nm === 'AbortError') gateFail('생체인증이 취소됐어요. 아래 번호나 비밀번호로 열 수 있어요.');
      else gateFail('생체인증으로 열지 못했어요. 아래 번호나 비밀번호로 열 수 있어요.');
    } finally {
      S.gateBusy = false;
      var b2 = document.getElementById('gateBioBtn');
      if (b2) { b2.disabled = false; b2.textContent = '🔐 Face ID / 생체인증으로 열기'; }
    }
  }

  /* ===== 등록된 기기 (chat.html에서 승계) ===== */
  async function loadDevices() {
    var r = await ghGetJson(DEFAULT_REPO, PATH_DEVICES, null);
    if (!r.ok) return { ok: false, error: r.error || '기기 목록을 읽지 못했어요', devices: [] };
    if (r.missing) return { ok: true, missing: true, devices: [] };
    var list = (r.data && Object.prototype.toString.call(r.data.devices) === '[object Array]') ? r.data.devices : [];
    return { ok: true, devices: list, sha: r.sha };
  }
  function deviceKnown(devices, deviceId, userId) {
    for (var i = 0; i < devices.length; i++) {
      var d = devices[i] || {};
      if (String(d.id) === String(deviceId) && String(d.userId) === String(userId)) return d;
    }

  function limitInfo(id) {
    var l = S.limits[id];
    if (!l) return { cls: 'unknown', text: '상태 확인 전', left: 0 };
    if (l.state === 'ok') return { cls: 'ok', text: '사용 가능', left: 0 };
    var left = (Number(l.resetAt) || 0) - Date.now();
    if (left <= 0) return { cls: 'ok', text: '사용 가능', left: 0 };
    var label = l.state === 'quota' ? '한도 소진' : '일시 제한';
    return { cls: l.state, text: label + ' · ' + fmtClock(l.resetAt) + ' 초기화', left: left, resetAt: l.resetAt };

  /* ---------- 실제 호출 ---------- */
  function textFromErr(status, json, fallback) {
    var msg = '';
    try {
      if (json && json.error) msg = json.error.message || json.error.status || '';
      if (!msg && json && json.message) msg = json.message;
      if (!msg && json && json.detail) msg = json.detail;
    } catch (e) { msg = ''; }
    return msg || fallback || ('HTTP ' + status);
  }

  /* ---------- Gemini 함수 도구(functionDeclarations) ---------- */
  /* Gemini는 OpenAPI 중 일부 키만 받아요. additionalProperties 같은 미지원 키는 빼고 넘겨요. */
  function geminiSchema(s) {
    if (!s || typeof s !== 'object') return null;
    var out = {}, k;
    if (s.type) out.type = String(s.type).toLowerCase();
    if (s.description) out.description = String(s.description);
    if (Object.prototype.toString.call(s.enum) === '[object Array]') out.enum = s.enum.map(function (x) { return String(x); });
    if (Object.prototype.toString.call(s.required) === '[object Array]') out.required = s.required.map(function (x) { return String(x); });
    if (s.properties && typeof s.properties === 'object') {
      var props = {};
      for (k in s.properties) {
        if (!Object.prototype.hasOwnProperty.call(s.properties, k)) continue;
        var ps = geminiSchema(s.properties[k]);
        if (ps) props[k] = ps;
      }
      out.properties = props;
      if (!out.type) out.type = 'object';
    }
    if (s.items) { var it = geminiSchema(s.items); if (it) out.items = it; }
    return out;
  }
  function geminiToolDef(t) {
    var d = {
      name: String(t.name),
      description: String(t.title || t.name) + ' — ' + String(t.desc || '') + ' 인자 형식: ' + String(t.argsHint || '{}')
    };
    var params = geminiSchema({ type: 'object', properties: TOOL_SCHEMAS[t.name] || {} });
    if (params && params.properties && Object.keys(params.properties).length) d.parameters = params;
    return d;
  }
  function geminiTools() {
    var list = [];
    for (var i = 0; i < TOOLS.length; i++) list.push(geminiToolDef(TOOLS[i]));
    return [{ functionDeclarations: list }];
  }
  /* 함수 도구(tools·functionDeclarations)를 못 받는 모델인지 (400) */
  function isGeminiToolError(status, err) {
    if (Number(status) !== 400 && Number(status) !== 422) return false;
    var e = String(err || '');
    if (!/tool|function|declaration|schema/i.test(e)) return false;
    if (/api key|api_key|quota|billing|permission|safety/i.test(e)) return false;
    return true;
  }

  async function geminiCall(model, req, opts) {
    var key = (opts && opts.key) || providerKey('gemini');
    if (!key) return { ok: false, status: 0, error: 'Gemini 키가 없어요', headers: {} };
    var mid = modelIdOf('gemini', model);
    var withTools = !(opts && opts.noTools) && !noToolsModel(mid);
    function buildBody(useTools) {
      var contents = [];
      for (var mi = 0; mi < req.messages.length; mi++) {
        var m = req.messages[mi];
        var parts = [{ text: String(m.text || '') }];
        var imgs = m.images || [], pdfs = m.pdfs || [], i;
        for (i = 0; i < imgs.length; i++) parts.push({ inlineData: { mimeType: imgs[i].mime, data: imgs[i].data } });
        for (i = 0; i < pdfs.length; i++) parts.push({ inlineData: { mimeType: 'application/pdf', data: pdfs[i].data } });
        var role = m.role === 'assistant' ? 'model' : 'user';
        var prev = contents[contents.length - 1];
        /* 도구 결과는 사용자 말로 붙어서 같은 역할이 이어져요. 한 칸으로 합쳐야 Gemini가 받아요 */
        if (prev && prev.role === role) prev.parts = prev.parts.concat(parts);
        else contents.push({ role: role, parts: parts });
      }
      var body = {
        systemInstruction: { parts: [{ text: req.system }] },
        contents: contents,
        generationConfig: { temperature: 0.5, maxOutputTokens: (opts && opts.maxTokens) || 2048 }
      };
      /* 말로만 “찾아볼게요” 하지 않고 실제로 도구를 부르도록 함수 도구를 함께 보내요 */
      if (useTools) {
        body.tools = geminiTools();
        body.toolConfig = { functionCallingConfig: { mode: 'AUTO' } };
      }
      return body;
    }
    function send(useTools) {
      return window.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(buildBody(useTools)),
        signal: (opts && opts.signal) || undefined
      }).then(function (r) { return r.text().then(function (t) { return { res: r, txt: t, tools: useTools }; }); });
    }
    var got;
    try { got = await send(withTools); }
    catch (e) { return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} }; }
    var headers = headerMap(got.res);
    var json = null;
    try { json = JSON.parse(got.txt); } catch (e) { json = null; }
    noteResult('gemini', model, got.res.status, headers, got.txt);
    var errMsg = got.res.ok ? '' : textFromErr(got.res.status, json, 'HTTP ' + got.res.status);
    /* 이 모델이 함수 도구를 지원하지 않으면 이 모델만 도구 없이 한 번 더 시도해요 */
    if (!got.res.ok && got.tools && (isGeminiToolError(got.res.status, errMsg) || isNoToolSupportError(got.res.status, errMsg))) {
      markNoToolsModel(mid);
      try { got = await send(false); }
      catch (e2) { return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} }; }
      headers = headerMap(got.res);
      json = null;
      try { json = JSON.parse(got.txt); } catch (e3) { json = null; }
      noteResult('gemini', model, got.res.status, headers, got.txt);
      errMsg = got.res.ok ? '' : textFromErr(got.res.status, json, 'HTTP ' + got.res.status);
    }
    if (!got.res.ok) return { ok: false, status: got.res.status, error: errMsg, headers: headers, body: got.txt };
    var parts = (json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    var out = '', calls = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i] || {};
      /* 생각(thought) 조각은 화면에 그대로 보여 주지 않아요 */
      if (p.thought) continue;
      if (p.text) out += p.text;
      var fc = p.functionCall;
      if (fc && fc.name) {
        var args = (fc.args && typeof fc.args === 'object') ? fc.args : {};
        calls.push({ id: 'gem_' + (calls.length + 1), name: String(fc.name), args: args });
      }
    }
    /* 도구를 부른 답변은 본문이 비어 있는 게 정상이에요 */
    if (!String(out).trim() && !calls.length) {
      var block = json && json.promptFeedback && json.promptFeedback.blockReason;
      var fin = json && json.candidates && json.candidates[0] && json.candidates[0].finishReason;
      return {
        ok: false, status: got.res.status, headers: headers, body: got.txt,
        error: block ? ('이 요청은 안전 정책으로 막혔어요 (' + block + ')')
          : (fin && fin !== 'STOP' ? ('답변이 중간에 멈췄어요 (' + fin + ')') : '빈 답변이 왔어요')
      };
    }
    /* 도구 결과는 다음 차례에 [도구 결과 …] 글로 돌아가요.
       (functionCall/functionResponse parts를 되돌려 보내면 사고 서명(thoughtSignature)이 없어 400이 나는 모델이 있어요) */
    return { ok: true, status: got.res.status, text: String(out), toolCalls: calls, headers: headers };
  }

  function openaiStyleCall(url, pid, extraHeaders) {

      /* 이 모델이 함수 도구를 지원하지 않으면 이 모델만 도구 없이 한 번 더 시도해요 */

        catch (e2) { return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} }; }
        hmap = headerMap(got.res);
        json = null;
        try { json = JSON.parse(got.txt); } catch (e3) { json = null; }
        noteResult(pid, model, got.res.status, hmap, got.txt);
        errMsg = got.res.ok ? '' : textFromErr(got.res.status, json, 'HTTP ' + got.res.status);
      }
      if (!got.res.ok) return { ok: false, status: got.res.status, error: errMsg, headers: hmap, body: got.txt };
      var out = '', calls = [];
      try {
        var c = json.choices[0];
        var msg = (c && c.message) || {};
        out = msg.content || '';
        if (Object.prototype.toString.call(out) === '[object Array]') {
          out = out.map(function (p) { return (p && p.text) || ''; }).join('');
        }
        var tc = msg.tool_calls;
        if (Object.prototype.toString.call(tc) === '[object Array]') {
          for (var n = 0; n < tc.length && n < 4; n++) {

            var args = {};
            try { args = JSON.parse(fn.arguments || '{}'); } catch (e4) { args = {}; }

        }
      } catch (e) { out = ''; }
      /* 도구를 부른 답변은 본문이 비어 있는 게 정상이에요 */
      if (!String(out).trim() && !calls.length) return { ok: false, status: got.res.status, error: '빈 답변이 왔어요', headers: hmap, body: got.txt };
      return { ok: true, status: got.res.status, text: String(out), toolCalls: calls, headers: hmap };
    };

  async function listGemini() {
    var key = providerKey('gemini');

    var res = await window.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var j = await res.json();

    for (var i = 0; i < list.length; i++) {
      var m = list[i] || {};
      var id = String(m.name || '').replace(/^models\//, '');
      var methods = m.supportedGenerationMethods || [];
      if (methods.indexOf('generateContent') < 0) continue;
      if (!/^gemini-/.test(id)) continue;
      if (/(image|tts|live|transcribe|embedding|translate|omni|audio|robotics|computer-use|vision-last|nano-banana|imagen|veo|aqa)/i.test(id)) continue;
      /* 단종된 옛 모델(1.x·2.0·2.5)은 목록에 올리지 않아요 */
      if (/^gemini-(1\.|2\.0|2\.5)/i.test(id)) continue;

    }
    var pref = [], rest = [];
    for (var k = 0; k < ids.length; k++) { if (/(flash|hydrogen|pro)/i.test(ids[k])) pref.push(ids[k]); else rest.push(ids[k]); }

  /* ===== 가족 데이터·찾아 바꾸기 (chat.html에서 승계) ===== */
  var FAMILY_PREFIX = ['fridge/', 'ledger/', 'data/', 'config/', 'backups/'];

  async function readFamily(path) {

  /* 큰 파일을 통째로 보내지 않도록 줄/구간 단위로 다뤄요 (토큰 절약) */
  /* 글자는 같은데 들여쓰기·공백만 다른 줄을 찾아요 (쓸 때는 파일 안에서 딱 한 곳일 때만) */
  function findTrimmedBlock(text, oldS) {
    var want = String(oldS == null ? '' : oldS).replace(/\r\n/g, '\n').split('\n');
    for (var a = 0; a < want.length; a++) want[a] = String(want[a]).trim();
    while (want.length && want[0] === '') want.shift();
    while (want.length && want[want.length - 1] === '') want.pop();
    var lines = String(text == null ? '' : text).split('\n');
    if (!want.length) return { hits: [], want: want, lines: lines };
    var hits = [];
    for (var i = 0; i + want.length <= lines.length; i++) {
      var same = true;
      for (var j = 0; j < want.length; j++) {
        if (String(lines[i + j]).trim() !== want[j]) { same = false; break; }
      }
      if (!same) continue;
      hits.push(i);
      if (hits.length > 8) break;
    }
    return { hits: hits, want: want, lines: lines };
  }
  /* 못 찾았을 때 “가장 비슷한 줄”의 위치와 앞뒤 2줄을 알려 줘요 */
  function closestLineHint(text, oldS) {
    var lines = String(text == null ? '' : text).split('\n');
    var raw = String(oldS == null ? '' : oldS).replace(/\r\n/g, '\n').split('\n');
    var cands = [];
    for (var i = 0; i < raw.length; i++) {
      var t = String(raw[i]).trim();
      if (t.length >= 6 && cands.indexOf(t) < 0) cands.push(t);
    }
    cands.sort(function (a, b) { return b.length - a.length; });
    for (var c = 0; c < cands.length; c++) {
      var needle = cands[c].slice(0, 80), best = null;
      for (var k = 0; k < lines.length; k++) {
        var s = String(lines[k]).trim();
        if (!s) continue;
        var score = 0;
        if (s === needle) score = 1000 + s.length;
        else if (needle.length >= 12 && s.indexOf(needle) >= 0) score = 500 + needle.length;
        else {
          var cp = 0;
          while (cp < needle.length && cp < s.length && needle.charAt(cp) === s.charAt(cp)) cp++;
          if (cp >= 8) score = cp;
        }
        if (score > 0 && (!best || score > best.score)) best = { score: score, line: k + 1, text: String(lines[k]).slice(0, 160) };
      }
      if (best) {
        /* 그 줄만 주면 또 틀리니 앞뒤 2줄을 줄 번호와 함께 돌려줘요 */
        var bag = [];
        for (var q = Math.max(1, best.line - 2); q <= Math.min(lines.length, best.line + 2); q++) {
          bag.push((q === best.line ? '>' : ' ') + String(q).padStart(5) + '| ' + String(lines[q - 1]).slice(0, 160));
        }
        best.ctx = bag.join('\n');
        return best;
      }
    }
    return null;
  }
  function applyEdits(text, edits) {
    var out = String(text == null ? '' : text), applied = [];
    for (var i = 0; i < edits.length && i < 20; i++) {
      var e = edits[i] || {};
      var oldS = String(e.old_string == null ? (e.find == null ? '' : e.find) : e.old_string);
      var newS = String(e.new_string == null ? (e.replace == null ? '' : e.replace) : e.new_string);
      if (!oldS) return { ok: false, error: (i + 1) + '번째 수정에 old_string이 없어요.' };
      if (oldS === newS) return { ok: false, error: (i + 1) + '번째 수정: old_string과 new_string이 같아 바뀌는 내용이 없어요.' };
      var count = out.split(oldS).length - 1;
      if (count) {
        var idx = out.indexOf(oldS);
        if (e.replace_all) {
          out = out.split(oldS).join(newS);
          applied.push({ index: i + 1, count: count, all: true });
        } else {
          out = out.slice(0, idx) + newS + out.slice(idx + oldS.length);
          applied.push({ index: i + 1, count: 1, total: count });

      }
      /* 글자는 같은데 들여쓰기·공백만 다를 때: 딱 한 곳이면 그 자리를 바꿔요 */
      var tm = findTrimmedBlock(out, oldS);
      if (tm.hits.length === 1) {
        var st = 0, b;
        for (b = 0; b < tm.hits[0]; b++) st += String(tm.lines[b]).length + 1;
        var en = st;
        for (b = 0; b < tm.want.length; b++) en += String(tm.lines[tm.hits[0] + b]).length + (b < tm.want.length - 1 ? 1 : 0);
        out = out.slice(0, st) + newS + out.slice(en);

  /* ============ 줄 비교(diff) ============ */
  /* 17,000줄짜리 화면의 뒷부분만 고쳐도 그 수정이 잡히도록,
     앞·뒤에서 똑같은 줄은 비교에서 빼고 실제로 달라진 가운데만 비교해요.

    /* 작은 구간은 LCS로 줄 단위 최소 변경을 찾아요 */
    function lcsRows(a0, a1, b0, b1) {
      var na = a1 - a0, nb = b1 - b0, i, j;
      var dp = [];
      for (i = 0; i <= na; i++) { dp.push(new Array(nb + 1).fill(0)); }

        for (j = nb - 1; j >= 0; j--) {

        else if (dp[i2 + 1][j2] >= dp[i2][j2 + 1]) { rows.push({ t: '-', s: A[a0 + i2] }); i2++; }
        else { rows.push({ t: '+', s: B[b0 + j2] }); j2++; }
      }
      while (i2 < na) { rows.push({ t: '-', s: A[a0 + i2] }); i2++; }

  function elapsedLabel(iso) {
    var t = Date.parse(iso || '');
    if (!t) return '';
    var d = Date.now() - t;
    if (d < 0) d = 0;
    var s = Math.floor(d / 1000);
    if (s < 60) return Math.max(1, s) + '초째';
    var m = Math.floor(s / 60);
    if (m < 60) return m + '분 ' + (s % 60) + '초째';
    var h = Math.floor(m / 60);
    if (h < 24) return h + '시간 ' + (m % 60) + '분째';
    return Math.floor(h / 24) + '일째';
  }
  function clockLabel(iso) {
    var t = Date.parse(iso || '');

  }

  async function loadOffice() {

    if (!r.ok) return { ok: false, error: r.error || '사무실 기록을 읽지 못했어요' };
    if (r.missing) { S.office = blankOffice(); return { ok: true, missing: true }; }
    var env = null;
    try { env = JSON.parse(r.raw); } catch (e) { env = null; }
    if (!env || !env.ct) return { ok: false, locked: true, error: '사무실 기록 형식이 달라요' };
    var obj = null;
    try { obj = await familyDecrypt(env); } catch (e) { obj = null; }
    if (!obj) return { ok: false, locked: true, error: '사무실 기록을 열지 못했어요' };
    S.office = normalizeOffice(obj);
    S.officeState = JSON.stringify(S.office);

  }

  }
  function saveOffice() {
    if (!S.office || S.officeLocked || !S.chatKey || !S.me) return Promise.resolve(false);
    var snapshot = JSON.stringify(S.office);
    if (snapshot === S.officeState) return Promise.resolve(true);
    S.saveState = 'saving';
    S.saveChain = S.saveChain.then(async function () {
      try {
        var env = await familyEncrypt(JSON.parse(snapshot));
        var w = await ghPutAt(DEFAULT_REPO, P_OFFICE, JSON.stringify(env, null, 2), '🏢 ' + OFFICE_NAME + ': 사무실 기록 저장', null);

  function errShort(res) {
    if (!res) return 'AI에 연결하지 못했어요';

    if (res.status === 401 || res.status === 403) return 'AI 키나 권한을 확인해 주세요';
    if (!res.status) return String(res.error || '인터넷 연결을 확인해 주세요');

  async function officeCall(team, system, messages, opts) {
    var id = teamModelId(team);
    var sp = splitModelId(id);
    var pid = (sp.pid && PROVIDERS[sp.pid]) ? sp.pid : 'gemini';
    var model = sp.model || modelList(pid)[0];
    var onStep = opts && opts.onStep ? opts.onStep : null;
    if (!hasKey(pid)) return { ok: false, status: 0, error: PROVIDERS[pid].label + ' 키가 아직 없어요. ⚙️ 설정에서 무료 키를 넣어 주세요.' };
    var tools = toolsForTeam(team.id);
    var tried = {}, switched = 0;
    tried[id] = 1;
    var saved = TOOLS;
    TOOLS = tools;
    try {
      var res = await callWithKeys(pid, model, { system: system, messages: messages }, { maxTokens: (opts && opts.maxTokens) || 2600 });
      /* 단종·없어진 모델이면 목록에서 숨기고 바로 쓸 수 있는 모델로 한 번 더 */
      if (res && !res.ok && isDeadModelError(res.status, res.error)) {
        markDeadModel(id, res.error);
        var deadAlt = nextUsableModel(id);
        if (deadAlt) {
          var dsp = splitModelId(deadAlt);
          tried[deadAlt] = 1;
          pid = dsp.pid; model = dsp.model; id = deadAlt;
          toast('이 모델은 더 이상 쓸 수 없어 ' + modelShort(deadAlt) + '(으)로 이어서 해요.');
          if (onStep) onStep('모델 전환 · ' + modelShort(deadAlt));
          res = await callWithKeys(pid, model, { system: system, messages: messages }, { maxTokens: (opts && opts.maxTokens) || 2600 });
        }
      }
      while (res && !res.ok && (res.status === 429 || res.status === 503)) {
        var alt = busyFallbackModel(id, tried);
        if (!alt || switched >= 4) break;
        var bsp = splitModelId(alt);
        tried[alt] = 1;
        switched++;
        var fromShort = modelShort(id);
        pid = bsp.pid;
        model = bsp.model;
        id = alt;
        toast(fromShort + ' 한도/혼잡 → ' + modelShort(alt) + '(으)로 이어서 보내요.');
        if (onStep) onStep('모델 전환 · ' + fromShort + ' → ' + modelShort(alt) + ' (한도·혼잡)');
        res = await callWithKeys(pid, model, { system: system, messages: messages }, { maxTokens: (opts && opts.maxTokens) || 2600 });
      }
      return res;
    } finally {
      TOOLS = saved;
    }
  }

  function jsonBlocks(text) {
    var out = [], re = /```(?:json)?\s*([\s\S]*?)```/gi, m;
    while ((m = re.exec(String(text || '')))) out.push(m[1].trim());
    return out;
  }
  function findReportObj(text) {
    var s = String(text || '');
    var blocks = jsonBlocks(s);
    for (var i = 0; i < blocks.length; i++) {
      var j = null;
      try { j = JSON.parse(blocks[i]); } catch (e) { j = null; }
      if (j && typeof j === 'object' && !Object.prototype.toString.call(j) === '[object Array]' && (j.summary || j.detail || j.points)) return j;
    }
    /* 펜스가 없이 덩그러니 JSON만 온 경우: 균형 잡힌 {...}를 훑어요 */
    for (var start = s.indexOf('{'); start >= 0; start = s.indexOf('{', start + 1)) {
      var depth = 0, inStr = false, esc2 = false, end = -1;
      for (var k = start; k < s.length; k++) {
        var ch = s.charAt(k);
        if (inStr) {
          if (esc2) { esc2 = false; continue; }
          if (ch === '\\') { esc2 = true; continue; }
          if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === '{') depth++;
        else if (ch === '}') { depth--; if (depth === 0) { end = k; break; } }
      }
      if (end < 0) continue;
      var obj = null;
      try { obj = JSON.parse(s.slice(start, end + 1)); } catch (e) { obj = null; }
      if (obj && typeof obj === 'object' && (obj.summary || obj.detail)) return obj;
    }
    return null;
  }

    if (/디자인|design/i.test(s)) return 'design';
    if (/개발|코딩|dev|code/i.test(s)) return 'dev';
    if (/qc|품질|검수/i.test(s)) return 'qc';
    if (/리서치|조사|research/i.test(s)) return 'research';

  function normNext(arr) {
    var out = [];

    if (!(Object.prototype.toString.call(arr) === '[object Array]')) arr = [arr];

      var x = arr[i];
      var label = typeof x === 'string' ? x : String((x && (x.label || x.text || x.title)) || '');

      var teamId = typeof x === 'object' && x ? teamKeyFromName(x.team || x.to || '') : '';

  function enqueuePipeline(secId) {

  async function pumpPipeline() {

  function secChildList(sec) {
    var out = [];
    for (var i = 0; i < ((sec && sec.childIds) || []).length; i++) {
      var c = workById(sec.childIds[i]);

  async function runPipeline(secId) {
    var sec = workById(secId);
    if (!sec) return;
    S.busy['pipe_' + secId] = { at: Date.now() };
    try {
      var ids = (sec.childIds || []).slice();
      for (var i = 0; i < ids.length; i++) {
        var child = workById(ids[i]);
        if (!child) continue;
        var prior = [];
        for (var k = 0; k < i; k++) {
          var pc = workById(ids[k]);
          if (pc && pc.report) prior.push(pc.id);
        }
        child.materialIds = prior.slice(-2);
        child.status = 'working';
        child.startedAt = nowIso();
        child.updatedAt = nowIso();
        sec.currentChildId = child.id;
        sec.updatedAt = nowIso();
        S.busy[child.id] = { at: Date.now() };
        var tname = (teamById(child.teamId) || { name: child.teamId }).name;
        pushLog(sec, tname + '에 일을 전달 (' + (i + 1) + '/' + ids.length + ')');
        renderAll(); saveOfficeSoon(0);
        try {
          child.report = await runTeamAgent(child, teamById(child.teamId) || { id: child.teamId, name: child.teamId, desc: '' });
          child.status = 'done';
          child.doneAt = nowIso();
          pushLog(child, '보고 도착');
          pushLog(sec, tname + ' 결과 도착');
          if (child.code) pushLog(sec, '수정안 도착 · ' + fileLabel(child.code.repo, child.code.path) + ' (아직 반영 전)');
        } catch (e) {
          child.status = 'failed';
          child.error = String(e && e.message ? e.message : e);
          child.report = child.report || { summary: '작업을 마치지 못했어요.', detail: child.error, next: [], at: nowIso() };
          pushLog(child, '실패 · ' + clip(child.error, 120));
          pushLog(sec, tname + ' 실패 · ' + clip(child.error, 90));
        }
        delete S.busy[child.id];
        child.updatedAt = nowIso();
        sec.updatedAt = nowIso();
        renderAll(); saveOfficeSoon(0);
      }
      sec.phase = 'collect';
      pushLog(sec, '비서 취합 보고 작성 중');
      renderAll(); saveOfficeSoon(0);
      var rep = await buildCollectReport(sec);
      sec.report = rep.report;
      sec.secretary = rep.secretary;
      sec.code = rep.code || null;
      sec.status = 'waiting';
      sec.phase = 'report';
      sec.updatedAt = nowIso();
      pushLog(sec, '비서 최종 취합 보고 → 대표실 결재 대기');
      toast('비서가 최종 취합 보고를 올렸어요. 대표실 결재함에서 확인해 주세요.');
    } finally {
      delete S.busy['pipe_' + secId];
      if (sec) { sec.updatedAt = nowIso(); sec.currentChildId = ''; }
      renderAll(); saveOfficeSoon(0);
    }
  }
  async function buildCollectReport(sec) {
    var kids = secChildList(sec);
    var rows = [], code = null;
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i], t = teamById(c.teamId) || { name: c.teamId };
      var rep = c.report || {};
      rows.push('[' + t.name + '] ' + c.title +
        '\n- 상태: ' + (c.status === 'failed' ? ('실패 · ' + clip(c.error || '', 200)) : '완료') +
        '\n- 핵심: ' + clip(rep.summary || '', 600) +
        '\n- 상세: ' + clip(rep.detail || '', 1600) +
        (c.code ? ('\n- 코드 수정안: ' + fileLabel(c.code.repo, c.code.path) + ' (+' + c.code.added + ' −' + c.code.removed + ') · ' + (c.code.checkOk ? '자동 검사 통과' : '자동 검사 문제 있음') + ' · 아직 반영 전') : ''));
      if (c.code) code = c.code;
    }
    var detail = rows.join('\n\n');
    var text = '[취합 보고]\n\n[맡긴 일] ' + sec.title + '\n[대표님 지시] ' + clip(sec.brief, 1500) +
      '\n\n[팀별 결과]\n' + clip(detail, 9000);
    var res = await officeCall(secretaryTeam(), buildSecretarySystem(), [{ role: 'user', text: text }], {
      maxTokens: 1500,
      onStep: function (t) { pushLog(sec, t); if (S.teamModal) renderAll(); }
    });
    var obj = res && res.ok ? findReportObj(res.text) : null;
    var summary = '', points = [], recommend = '';
    if (obj) {
      summary = String(obj.summary || '').trim();
      if (Object.prototype.toString.call(obj.points) === '[object Array]') {
        for (var p = 0; p < obj.points.length && points.length < 5; p++) {
          var s = String(obj.points[p] || '').trim();
          if (s) points.push(s);
        }
      }
      recommend = String(obj.recommend || '').trim();
    }
    if (!summary) {
      var parts = [];
      for (var q = 0; q < kids.length; q++) {
        var kt = teamById(kids[q].teamId) || { name: kids[q].teamId };
        parts.push(kt.name + ': ' + clip((kids[q].report && kids[q].report.summary) || '보고 없음', 160));
      }
      summary = parts.join('\n') || '팀 결과를 모았어요.';
    }
    if (!points.length) {
      if (code) points.push('수정안은 아직 반영 전이에요 — QC 검수 또는 최종 승인하고 반영 중 하나를 골라 주세요.');
      points.push('팀별 결과를 확인해 주세요.');
    }
    if (!recommend) recommend = code ? 'QC 검수를 거친 뒤 최종 승인하면 반영돼요.' : '바로 승인해도 됩니다.';
    return {
      report: { summary: summary, detail: detail, next: [], at: nowIso() },
      secretary: { summary: summary, points: points, recommend: recommend, next: [], collect: true, at: nowIso() },
      code: code
    };
  }

  async function commitCode(item) {
    if (!item || !item.code) { toast('반영할 수정안이 없어요.'); return; }
    var c = item.code;
    if (!S.ai.codeToken) { toast('코드 열쇠가 없어요. ⚙️ 설정에서 넣어 주세요.'); return; }
    var pid = 'commit_' + item.id;
    if (S.busy[pid]) return;
    S.busy[pid] = { at: Date.now() };
    renderAll();
    try {
      var cur = await ghGetAt(c.repo, c.path, S.ai.codeToken);
      if (!cur.ok) throw new Error(cur.error || '파일을 읽지 못했어요');
      var oldText = cur.missing ? '' : String(cur.raw || '');
      var next = null;
      if (Object.prototype.toString.call(c.edits) === '[object Array]' && c.edits.length) {
        var ap = applyEdits(oldText, c.edits);
        if (!ap.ok) throw new Error(ap.error || '찾아 바꾸기를 적용하지 못했어요');
        next = ap.text;
      } else if (c.content != null) {
        next = String(c.content);
      } else if (c.range && c.range.start != null) {
        var arr = oldText.split('\n');
        var st = clamp(Number(c.range.start) || 1, 1, Math.max(1, arr.length));
        var en = clamp(Number(c.range.end) || st, st, Math.max(1, arr.length));
        next = arr.slice(0, st - 1).concat(String(c.range.text || '').split('\n')).concat(arr.slice(en)).join('\n');
      }
      if (next == null) throw new Error('수정 내용이 없어요');
      var check = await checkCodeFile(c.path, next);
      if (!check.ok) {
        var errs = [];
        for (var i = 0; i < (check.steps || []).length; i++) {
          if (!check.steps[i].ok) errs = errs.concat(check.steps[i].errors || []);
        }
        throw new Error('자동 검사에서 문제가 보여 반영하지 않았어요: ' + clip(errs.join(' / '), 200));
      }
      var w = await ghPutAt(c.repo, c.path, next, '🏢 ' + OFFICE_NAME + ': ' + clip(item.title, 60) + ' (대표님 승인)', S.ai.codeToken);
      if (!w.ok) throw new Error(w.error || '저장하지 못했어요');
      item.commit = { ok: true, at: nowIso(), repo: c.repo, path: c.path };
      item.nextDone = true;
      item.nextAt = nowIso();
      if (item.reviewOf) {
        var parent = workById(item.reviewOf);
        if (parent) { parent.commit = item.commit; parent.nextDone = true; parent.nextAt = nowIso(); pushLog(parent, 'QC 승인 뒤 코드 반영 완료'); }
      }
      pushLog(item, '코드 반영 완료 · ' + fileLabel(c.repo, c.path));
      toast('코드에 반영했어요. 화면은 잠시 뒤 새로 고쳐 주세요.');
    } catch (e) {
      item.commit = { ok: false, at: nowIso(), error: String(e && e.message ? e.message : e) };
      pushLog(item, '반영 실패 · ' + clip(item.commit.error, 120));
      toast('반영하지 못했어요: ' + clip(item.commit.error, 110));
    } finally {
      delete S.busy[pid];
      renderAll(); saveOfficeSoon(0);
    }
  }

  function gateFail(text, ok) {

  async function submitGate() {
    var pw = fieldVal('gatePw');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateBtn');
    if (!pw) return gateFail('비밀번호를 넣어 주세요.');
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      await freshUsers();
      var u = findUser(S.me.id);
      if (!u || !u.salt || !u.hash) return gateFail('계정 정보를 확인하지 못했어요.');
      if (String(u.role) !== 'admin') return gateFail('관리자 계정만 열 수 있어요.');
      var hash = await hashPassword(pw, u.salt);
      if (hash !== u.hash) return gateFail('비밀번호가 맞지 않아요.');
      var envRes = await readThreadsEnvelope();
      if (!envRes.ok) return gateFail(envRes.error || '사무실 열쇠를 확인하지 못했어요.');
      if (envRes.env) {
        S.chatSalt = b64dec(envRes.env.salt);
        S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      } else {
        S.chatSalt = window.crypto.getRandomValues(new Uint8Array(16));
        S.chatIter = CHAT_ITER;
      }
      S.chatKey = await chatKeyFrom(pw, S.chatSalt, S.chatIter);
      if (envRes.env) {
        try { await chatDecrypt(envRes.env); }
        catch (e) { S.chatKey = null; return gateFail('이 계정의 기록을 열지 못했어요. 비밀번호를 다시 확인해 주세요.'); }
      }
      S.unlocked = true;
      touchActivity();
      if (S.totp && S.totp.enabled) await rewrapTotpKey();
      await bioRefreshKey();
      if (S.gateMode === 'device') {
        var reg = await registerDevice(name);
        if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
      }
      await enterOffice();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = (btn.textContent === '확인하는 중…') ? '열기' : btn.textContent; }
    }
  }
