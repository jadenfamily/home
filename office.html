  /* ---------- 설정 동작 ---------- */
  function keysCopy() {
    return { gemini: keyList('gemini').slice(), openrouter: keyList('openrouter').slice(), groq: keyList('groq').slice() };
  }
  function fixActiveKeys(keys) {
    for (var i = 0; i < PROVIDER_ORDER.length; i++) {
      var pid = PROVIDER_ORDER[i], n = (keys[pid] || []).length;
      var cur = Number(S.ai.active && S.ai.active[pid]) || 0;
      if (!S.ai.active) S.ai.active = {};
      S.ai.active[pid] = (cur >= 0 && cur < n) ? cur : 0;
    }
    saveKeyState();
  }
  async function persistKeys(keys, okMsg, codeToken) {
    S.settingsMsg = '저장하는 중…';
    renderSettings();
    var r = await saveAiConfig({ keys: keys, codeToken: codeToken == null ? (S.ai.codeToken || '') : codeToken });
    S.settingsMsg = r.ok ? (okMsg || 'AI 키를 저장했어요.') : ('저장하지 못했어요: ' + (r.error || ''));
    if (r.ok) {
      fixActiveKeys(keys);
      renderSettings(); renderTop();
      refreshModels().then(function () { renderSettings(); renderAll(); }).catch(function () { /* 무시 */ });
    } else {
      renderSettings();
    }
    toast(S.settingsMsg);
    return r;
  }
  async function saveKeys(clear) {
    var keys = clear ? emptyKeys() : keysCopy();
    if (!clear) {
      for (var i = 0; i < PROVIDER_ORDER.length; i++) {
        var pid = PROVIDER_ORDER[i], v = fieldVal('setKey_' + pid).trim();
        if (v && keys[pid].indexOf(v) < 0) keys[pid].push(v);
      }
    } else {
      S.keyLimit = {};
      if (S.ai.active) S.ai.active = { gemini: 0, openrouter: 0, groq: 0 };
      saveKeyState();
    }
    await persistKeys(keys, clear ? 'AI 키를 모두 지웠어요.' : 'AI 키를 저장했어요.', clear ? '' : null);
  }
  async function addProviderKey(pid) {
    if (!PROVIDERS[pid]) return;
    var v = fieldVal('setKey_' + pid).trim();
    if (!v) { S.settingsMsg = '넣을 키를 입력해 주세요.'; renderSettings(); return; }
    var keys = keysCopy();
    if (keys[pid].indexOf(v) >= 0) { S.settingsMsg = '이미 넣어 둔 키예요.'; renderSettings(); return; }
    keys[pid].push(v);
    await persistKeys(keys, PROVIDERS[pid].short + ' 키 ' + keys[pid].length + '개를 저장했어요.');
  }
  async function removeProviderKey(pid, i) {
    var keys = keysCopy();
    if (!keys[pid] || i < 0 || i >= keys[pid].length) return;
    keys[pid].splice(i, 1);
    var act = activeIndex(pid);
    if (act >= keys[pid].length) { S.ai.active[pid] = Math.max(0, keys[pid].length - 1); saveKeyState(); }
    if (S.keyLimit && S.keyLimit[pid]) { S.keyLimit[pid] = {}; saveKeyState(); }
    await persistKeys(keys, '키를 지웠어요.');
  }
  function useProviderKey(pid, i) {
    if (!keyList(pid)[i]) return;
    setActiveKey(pid, i);
    clearKeyLimit(pid, i);
    S.settingsMsg = PROVIDERS[pid] ? (PROVIDERS[pid].short + ' 키 ' + (i + 1) + '(으)로 보낼게요.') : '';
    renderSettings();
  }
  async function saveCodeToken() {
    var v = fieldVal('setCodeToken').trim();
    var r = await saveAiConfig({ keys: keysCopy(), codeToken: v || S.ai.codeToken });
    S.settingsMsg = r.ok ? '코드 열쇠를 저장했어요.' : ('저장하지 못했어요: ' + r.error);
    renderSettings();
    toast(S.settingsMsg);
  }
  async function revokeDeviceById(id) {
    if (!id) return;
    var r = await revokeDevice(id);
    if (!r.ok) { toast('해제하지 못했어요: ' + (r.error || '')); return; }
    S.devices = r.devices || [];
    renderSettings();
    toast('기기를 해제했어요.');
    if (String(id) === String(S.deviceId)) { logout(); }
  }
  function setAutoLock(mins) {
    var m = autoLockValid(mins);
    S.pref.autoLock = m;
    savePref();
    touchActivity();
    renderSettings();
    toast(m ? ('자동 잠금을 ' + m + '분으로 맞췄어요.') : '자동 잠금을 껐어요.');
  }
  function saveTeamModel(teamId) {
    if (!S.office) return;
    if (teamId === 'sec') {
      S.office.secretary = S.office.secretary || {};
      S.office.secretary.pid = fieldVal('tm_pid_sec');
      S.office.secretary.model = fieldVal('tm_model_sec');
      S.settingsMsg = '비서 모델을 저장했어요.';
    } else {
      var t = teamById(teamId);
      if (!t) return;
      t.pid = fieldVal('tm_pid_' + teamId);
      t.model = fieldVal('tm_model_' + teamId);
      var nm = fieldVal('tn_' + teamId).trim();
      if (nm) t.name = nm.slice(0, 24);
      S.settingsMsg = t.name + ' 모델을 저장했어요.';
    }
    renderSettings(); renderAll(); saveOfficeSoon(0);
    toast(S.settingsMsg);
  }
  function addTeam() {
    if (!S.office) return;
    var name = fieldVal('ntName').trim();
    if (!name) { S.settingsMsg = '새 팀 이름을 넣어 주세요.'; renderSettings(); return; }
    var id = 'c' + randomHex(3);
    S.office.teams.push({
      id: id, floor: fieldVal('ntFloor') || '2F', name: name.slice(0, 24),
      emoji: (fieldVal('ntEmoji') || '🧩').slice(0, 4), color: '#cfe3f7', desc: '', pid: '', model: '', custom: true
    });
    S.settingsMsg = name + ' 팀을 만들었어요.';
    renderSettings(); renderAll(); saveOfficeSoon(0);
    toast(S.settingsMsg);
  }
  function delTeam(id) {
    if (!S.office) return;
    var keep = [];
    for (var i = 0; i < S.office.teams.length; i++) {
      var t = S.office.teams[i];
      if (t.id === id && t.custom) continue;
      keep.push(t);
    }
    S.office.teams = keep;
    S.settingsMsg = '팀을 지웠어요.';
    renderSettings(); renderAll(); saveOfficeSoon(0);
  }

  /* ==================================================================
     이벤트
     ================================================================== */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || !f.id) return;
    if (f.id === 'gateForm') { e.preventDefault(); submitGate(); return; }
    if (f.id === 'gateTotpForm') { e.preventDefault(); submitGateTotp(); return; }
    if (f.id === 'directForm') {
      e.preventDefault();
      pullDraft();
      startDirective({ teamId: S.draft.team, title: S.draft.title, text: S.draft.text, material: S.draft.material });
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'gateTotp') {
      var digits = String(t.value || '').replace(/\D/g, '').slice(0, 6);
      if (digits !== t.value) t.value = digits;
      if (digits.length === 6 && !S.gateBusy) {
        window.clearTimeout(S.gateAutoT);
        S.gateAutoT = window.setTimeout(function () { submitGateTotp(); }, 120);
      }
      return;
    }
    if (t.id === 'directTeam') S.draft.team = t.value;
    else if (t.id === 'directTitle') S.draft.title = t.value;
    else if (t.id === 'directText') S.draft.text = t.value;
    else if (t.id === 'directMaterial') S.draft.material = t.value;
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'directTeam') { S.draft.team = t.value; renderPanel(); return; }
    if (t.getAttribute('data-act') !== 'team-pid') return;
    var teamId = t.getAttribute('data-team');
    var sel = document.getElementById('tm_model_' + teamId);
    if (sel) sel.innerHTML = modelChoices(t.value, '');
  });

  document.addEventListener('toggle', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || !t.getAttribute('data-key')) return;
    S.details[t.getAttribute('data-key')] = !!t.open;
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (S.teamModal) { closeTeamModal(); return; }
      closeSettings(); return;
    }
    if (e.target && e.target.id === 'directText' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      pullDraft();
      startDirective({ teamId: S.draft.team, title: S.draft.title, text: S.draft.text, material: S.draft.material });
    }
  });

  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
    if (!el) {
      var tm = document.getElementById('teamModal');
      if (tm && !tm.hidden && e.target === tm) { closeTeamModal(); return; }
      var sm = document.getElementById('settingsModal');
      if (sm && !sm.hidden && e.target === sm) closeSettings();
      return;
    }
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'tab') { setTab(el.getAttribute('data-tab') || 'office'); return; }
    if (act === 'go-floor') {
      var fl = el.getAttribute('data-floor');
      setTab('office');
      if (fl === 'all') { var ov = document.getElementById('officeView'); if (ov) ov.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      var room = document.getElementById('room-' + fl);
      if (room) room.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (act === 'team-click') {
      var tid = el.getAttribute('data-team') || 'cs';
      if (teamActive(tid)) { S.directHint = ''; openTeamModal(tid); return; }
      S.selTeam = tid;
      S.draft.team = tid;
      S.clearDraft = true;
      var tObj = tid === 'sec' ? secretaryTeam() : teamById(tid);
      S.directHint = (tObj ? tObj.name : '이 팀') + '에 바로 지시할 수 있어요. 아래에 내용을 적고 [지시 보내기]를 눌러 주세요.';
      setTab('direct');
      renderAll();
      var dt = document.getElementById('directText');
      if (dt) { try { dt.focus(); } catch (err) { /* 무시 */ } }
      return;
    }
    if (act === 'team-modal-close') { closeTeamModal(); return; }
    if (act === 'team-modal-go') {
      closeTeamModal();
      setTab('approve');
      renderAll();
      var cardEl = document.querySelector('.ap-card[data-work="' + id + '"]');
      if (cardEl) { try { cardEl.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err2) { /* 무시 */ } }
      return;
    }
    if (act === 'team-modal-direct') {
      var tmTeam = el.getAttribute('data-team') || 'sec';
      closeTeamModal();
      S.selTeam = tmTeam;
      S.draft.team = tmTeam;
      S.clearDraft = true;
      S.directHint = '';
      setTab('direct');
      renderAll();
      var dtm = document.getElementById('directText');
      if (dtm) { try { dtm.focus(); } catch (err3) { /* 무시 */ } }
      return;
    }
    if (act === 'sec-qc') {
      var sq = workById(id);
      if (!sq || sq.status !== 'waiting' || !sq.code) return;
      sq.status = 'approved';
      sq.approvedAt = nowIso();
      pushLog(sq, '대표님 · QC 검수 요청');
      qcHandoff(sq);
      return;
    }
    if (act === 'sec-commit') {
      var sc = workById(id);
      if (!sc || sc.status !== 'waiting' || !sc.code) return;
      sc.status = 'approved';
      sc.approvedAt = nowIso();
      pushLog(sc, '대표님 · 최종 승인하고 반영');
      commitCode(sc);
      return;
    }
    if (act === 'fill-team') {
      S.draft.team = el.getAttribute('data-team') || 'dev';
      S.clearDraft = true;
      setTab('direct');
      renderAll();
      return;
    }
    if (act === 'approve') { approveWork(id); return; }
    if (act === 'reject-open') { openReject(id); return; }
    if (act === 'reject-cancel') { cancelReject(id); return; }
    if (act === 'reject') { rejectWork(id); return; }
    if (act === 'handoff') { var it = workById(id); if (it) handoff(it, el.getAttribute('data-team'), ''); return; }
    if (act === 'handoff-pick') {
      var it2 = workById(id);
      if (!it2) return;
      var opts = [];
      for (var i = 0; i < S.office.teams.length; i++) if (S.office.teams[i].id !== it2.teamId) opts.push(S.office.teams[i]);
      var names = opts.map(function (t) { return t.name; }).join(' / ');
      var pick = window.prompt('어느 팀으로 넘길까요?\n' + names);
      if (!pick) return;
      var found = '';
      for (var k = 0; k < opts.length; k++) if (opts[k].name.indexOf(String(pick).trim()) >= 0 || String(pick).trim() === opts[k].id) found = opts[k].id;
      if (!found) { toast('팀 이름을 찾지 못했어요.'); return; }
      handoff(it2, found, '');
      return;
    }
    if (act === 'qc-handoff') { var it3 = workById(id); if (it3) qcHandoff(it3); return; }
    if (act === 'commit-code') { var it4 = workById(id); if (it4) commitCode(it4); return; }
    if (act === 'next-done') { finishNext(id); return; }
    if (act === 'retry') {
      var fw = workById(id);
      if (!fw) return;
      if (fw.kind === 'delegation') {
        fw.status = 'working';
        fw.phase = 'plan';
        fw.delegationPlan = [];
        fw.childIds = [];
        pushLog(fw, '다시 맡김 · 배분 계획부터');
        renderAll(); saveOfficeSoon(0);
        enqueuePlan(fw.id, '');
        toast('비서에게 다시 맡겼어요.');
        return;
      }
      fw.status = 'failed';
      var rw = newWork(fw.teamId, fw.title, fw.brief, fw.materialIds, fw.id);
      pushLog(rw, '다시 맡김');
      renderAll(); saveOfficeSoon(0);
      enqueueRun(rw.id);
      toast('다시 맡겼어요.');
      return;
    }
    if (act === 'dismiss-fail') {
      var dw = workById(id);
      if (dw) { dw.status = 'dismissed'; pushLog(dw, '치움'); }
      renderAll(); saveOfficeSoon(0);
      return;
    }
    if (act === 'inbox-refresh') {
      toast('접수함을 새로 읽는 중…');
      loadInbox().then(function () { renderAll(); toast('접수함을 새로 읽었어요.'); });
      return;
    }
    if (act === 'inbox-collect') { collectInbox(); return; }
    if (act === 'settings-open') { openSettings(); return; }
    if (act === 'settings-close') { closeSettings(); return; }
    if (act === 'lock') { closeSettings(); lockNow(); return; }
    if (act === 'logout') { logout(); return; }
    if (act === 'gate-alt') { S.gateAlt = !S.gateAlt; renderGate(); return; }
    if (act === 'gate-paste') { pasteGateTotp(); return; }
    if (act === 'gate-bio') { gateBioUnlock(); return; }
    if (act === 'totp-begin') { totpBeginSetup(); return; }
    if (act === 'totp-cancel') { totpCancelSetup(); return; }
    if (act === 'totp-confirm') { totpConfirmSetup(); return; }
    if (act === 'totp-copy') { totpCopySecret(); return; }
    if (act === 'totp-off-open') { S.totpOff = true; S.totpMsg = ''; renderSettings(); return; }
    if (act === 'totp-off-cancel') { S.totpOff = false; S.totpMsg = ''; renderSettings(); return; }
    if (act === 'totp-off-confirm') { totpDisableSubmit(); return; }
    if (act === 'bio-register') { bioRegister(); return; }
    if (act === 'bio-remove') { bioRemove(); return; }
    if (act === 'save-keys') { saveKeys(false); return; }
    if (act === 'clear-keys') {
      if (!window.confirm('가족이 함께 쓰는 AI 키를 모두 지울까요? 냉파·가계부의 AI 추천도 함께 멈춰요.')) return;
      saveKeys(true); return;
    }
    if (act === 'save-code') { saveCodeToken(); return; }
    if (act === 'key-add') { addProviderKey(el.getAttribute('data-pid')); return; }
    if (act === 'key-del') { removeProviderKey(el.getAttribute('data-pid'), Number(el.getAttribute('data-i'))); return; }
    if (act === 'key-use') { useProviderKey(el.getAttribute('data-pid'), Number(el.getAttribute('data-i'))); return; }
    if (act === 'auto-lock-set') { setAutoLock(Number(el.getAttribute('data-min'))); return; }
    if (act === 'device-revoke') { revokeDeviceById(el.getAttribute('data-id')); return; }
    if (act === 'team-model-save') { saveTeamModel(el.getAttribute('data-team')); return; }
    if (act === 'team-add') { addTeam(); return; }
    if (act === 'team-del') { delTeam(el.getAttribute('data-team')); return; }
  });

  /* 입력 중에는 화면을 다시 그리지 않게, 초안은 이벤트로만 모아요 */
  function tick() {
    autoLockIdle();
    var nodes = document.querySelectorAll('[data-left]');
    for (var i = 0; i < nodes.length; i++) {
      var at = Number(nodes[i].getAttribute('data-left'));
      var ms = at - Date.now();
      nodes[i].textContent = ms > 0 ? fmtLeft(ms) : '곧 풀려요';
    }
    var gate = document.getElementById('gateScreen');
    if (gate && !gate.hidden) return;
    var els = document.querySelectorAll('#teamModalBody [data-elapsed]');
    for (var j = 0; j < els.length; j++) els[j].textContent = elapsedLabel(els[j].getAttribute('data-elapsed'));
    renderTabs();
    renderTop();
  }

  /* ==================================================================
     시작
     ================================================================== */
  function loadPref() {
    var j = null;
    try { j = JSON.parse(lsGet(K_PREF) || 'null'); } catch (e) { j = null; }
    if (!j || typeof j !== 'object') j = {};
    S.pref = {
      model: String(j.model || ''),
      instructions: String(j.instructions || ''),
      autoLock: autoLockValid(j.autoLock)
    };
    var lim = null;
    try { lim = JSON.parse(lsGet(K_LIMITS) || 'null'); } catch (e) { lim = null; }
    S.limits = (lim && typeof lim === 'object') ? lim : {};
  }
  function savePref() {
    lsSet(K_PREF, JSON.stringify(S.pref));
    lsSet(K_LIMITS, JSON.stringify(S.limits));
  }

  async function init() {
    ensureDeviceId();
    loadDead();
    S.conn = loadDevice();
    S.users = loadUsersCache();
    loadPref();
    if (!S.conn) { showGate('noconn'); return; }
    var sess = loadSession();
    if (!sess) { showGate('noauth'); return; }
    await freshUsers();
    var u = findUser(sess.id);
    if (!u) { showGate('noauth'); return; }
    if (String(u.role) !== 'admin') { showGate('admin'); return; }
    S.me = { id: u.id, name: u.name || u.id, role: 'admin' };
    S.totp = await loadTotpConfig(u.id);
    var devs = await loadDevices();
    S.devices = devs.devices || [];
    var known = devs.ok ? deviceKnown(S.devices, S.deviceId, S.me.id) : null;
    if (!known) { showGate('device'); return; }
    showGate('unlock');
  }

  window.addEventListener('beforeunload', function () {
    if (S.unlocked && S.office && S.chatKey && !S.officeLocked) {
      try { saveOffice(); } catch (e) { /* 무시 */ }
    }
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  window.setInterval(tick, 1000);

})();

</script>
</body>
</html>
