<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>AI 사무실 · jadenfamily</title>
<meta name="description" content="우리 집 AI 사무실 — 팀별 AI 직원에게 일을 맡기고 대표님이 결재해요">
<meta name="apple-mobile-web-app-title" content="AI 사무실">
<meta property="og:title" content="AI 사무실 · jadenfamily">
<meta property="og:description" content="CS·기획·디자인·개발·QC·리서치 팀에게 맡기고 대표님 결재로 마무리">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/office.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="office/css/style.css">
</head>
<body data-tab="office">

<div class="app" id="appRoot" hidden>
  <header class="topbar">
    <a class="back" href="./index.html" aria-label="우리 집으로 돌아가기">←</a>
    <span class="office-logo" aria-hidden="true">🏢</span>
    <div class="brand">
      <h1>AI 사무실</h1>
      <p id="whoLine">-</p>
    </div>
    <div class="conn" id="connPill" title="연결 상태"><i id="connDot"></i><span id="connLabel">확인 중…</span></div>
    <span class="grow"></span>
    <div class="counts" id="topCounts" aria-live="polite"></div>
    <button class="icon-btn" type="button" id="settingsBtn" data-act="settings-open" aria-label="설정" aria-haspopup="dialog">⚙️</button>
    <button class="icon-btn" type="button" data-act="lock" aria-label="잠그기">🔒</button>
  </header>

  <div class="wrap">
    <nav class="rail" id="floorRail" aria-label="층 바로가기"></nav>
    <main class="office" id="officeView" aria-live="polite"></main>
    <aside class="panel" id="panel" aria-label="지시와 결재"></aside>
  </div>

  <nav class="mtab" aria-label="메뉴">
    <div class="tabs" id="panelTabs">
      <button type="button" data-act="tab" data-tab="office" class="on"><b>🏢</b><span>사무실</span></button>
      <button type="button" data-act="tab" data-tab="direct"><b>📝</b><span>지시하기</span></button>
      <button type="button" data-act="tab" data-tab="approve"><b>✅</b><span>결재함<span class="badge" id="tabWaitN" hidden>0</span></span></button>
      <button type="button" data-act="tab" data-tab="inbox"><b>📥</b><span>접수함<span class="badge" id="tabInboxN" hidden>0</span></span></button>
    </div>
  </nav>
</div>

<div class="gate" id="gateScreen" hidden>
  <div class="gate-card">
    <div class="gate-logo" aria-hidden="true">🏢</div>
    <h1>AI 사무실</h1>
    <p class="gate-sub" id="gateSub">관리자만 쓸 수 있어요.</p>
    <div id="gateBody"></div>
    <p class="gate-msg" id="gateMsg"></p>
    <a class="gate-link" href="./index.html" id="gateBack">← 우리 집으로</a>
  </div>
</div>

<div class="modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="settingsTitle">⚙️ 설정</h2>
      <button class="modal-close" type="button" data-act="settings-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
  </div>
</div>

<div class="modal" id="teamModal" hidden role="dialog" aria-modal="true" aria-labelledby="teamModalTitle">
  <div class="modal-card team-modal-card">
    <div class="modal-head">
      <h2 id="teamModalTitle">팀 작업 현황</h2>
      <button class="modal-close" type="button" data-act="team-modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="teamModalBody"></div>
  </div>
</div>

<div class="modal" id="workModal" hidden role="dialog" aria-modal="true" aria-labelledby="workModalTitle">
  <div class="modal-card team-modal-card">
    <div class="modal-head">
      <h2 id="workModalTitle">업무 자세히 보기</h2>
      <button class="modal-close" type="button" data-act="work-modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="workModalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="office/js/state.js"></script>
<script src="office/js/util.js"></script>
<script src="office/js/sync.js"></script>
<script src="office/js/crypto.js"></script>
<script src="office/js/qr.js"></script>
<script src="office/js/totp.js"></script>
<script src="office/js/webauthn.js"></script>
<script src="office/js/keys.js"></script>
<script src="office/js/providers.js"></script>
<script src="office/js/tools.js"></script>
<script src="office/js/toolcalls.js"></script>
<script src="office/js/codecheck.js"></script>
<script src="office/js/office-data.js"></script>
<script src="office/js/worker.js"></script>
<script src="office/js/ai.js"></script>
<script src="office/js/secretary.js"></script>
<script src="office/js/approval.js"></script>
<script src="office/js/ui.js"></script>
<script src="office/js/team-modal.js"></script>
<script src="office/js/detail.js"></script>
<script src="office/js/gate.js"></script>
<script src="office/js/settings.js"></script>
<script src="office/js/events.js"></script>
<script src="office/js/boot.js"></script>
</body>
</html>
