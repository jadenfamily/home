  function keysCopy() {
    return { gemini: keyList('gemini').slice(), openrouter: keyList('openrouter').slice(), groq: keyList('groq').slice() };
  }
  function fixActiveKeys(keys) {
    for (var i = 0; i < PROVIDER_ORDER.length; i++) {
      var pid = PROVIDER_ORDER[i], n = (keys[pid] || []).length;
      var cur = Number(S.ai.active && S.ai.active[pid]) || 0;
      if (!S.ai.active) S.ai.active = {};
      S.ai.active[pid] = (cur >= 0 && cur < n) ? cur : 0;
    }
    saveKeyState();
  }
  async function persistKeys(keys, okMsg, codeToken) {
    S.settingsMsg = '저장하는 중…'; renderSettings();
    var r = await saveAiConfig({ keys: keys, codeToken: codeToken == null ? (S.ai.codeToken || '') : codeToken });
    S.settingsMsg = r.ok ? (okMsg || 'AI 키를 저장했어요.') : ('저장하지 못했어요: ' + (r.error || ''));
    if (r.ok) {
      fixActiveKeys(keys);
      renderSettings();
      renderModelBtn();
      refreshModels().then(function () { renderModelBtn(); if (!document.getElementById('modelModal').hidden) renderModelModal(); }).catch(function () { /* 무시 */ });
    } else {
      renderSettings();
    }
    toast(S.settingsMsg);
    return r;
  }
  async function saveKeys(clear) {
    var keys = clear ? emptyKeys() : keysCopy();
    if (!clear) {
      for (var i = 0; i < PROVIDER_ORDER.length; i++) {
        var pid = PROVIDER_ORDER[i], v = fieldVal('setKey_' + pid).trim();
        if (v && keys[pid].indexOf(v) < 0) keys[pid].push(v);
      }
    } else {
      S.keyLimit = {};
      if (S.ai.active) S.ai.active = { gemini: 0, openrouter: 0, groq: 0 };
      saveKeyState();
    }
    await persistKeys(keys, clear ? 'AI 키를 모두 지웠어요.' : 'AI 키를 저장했어요.', clear ? '' : null);
  }
  async function addProviderKey(pid) {
    if (!PROVIDERS[pid]) return;
    var v = fieldVal('setKey_' + pid).trim();
    if (!v) { S.settingsMsg = '넣을 키를 입력해 주세요.'; renderSettings(); return; }
    var keys = keysCopy();
    if (keys[pid].indexOf(v) >= 0) { S.settingsMsg = '이미 넣어 둔 키예요.'; renderSettings(); return; }
    keys[pid].push(v);
    await persistKeys(keys, PROVIDERS[pid].short + ' 키 ' + keys[pid].length + '개를 저장했어요.');
  }
  async function removeProviderKey(pid, i) {
    var keys = keysCopy();
    if (!keys[pid] || i < 0 || i >= keys[pid].length) return;
    keys[pid].splice(i, 1);
    var act = activeIndex(pid);
    if (act >= keys[pid].length) { S.ai.active[pid] = Math.max(0, keys[pid].length - 1); saveKeyState(); }
    if (S.keyLimit && S.keyLimit[pid]) { S.keyLimit[pid] = {}; saveKeyState(); }
    await persistKeys(keys, '키를 지웠어요.');
  }
  function useProviderKey(pid, i) {
    if (!keyList(pid)[i]) return;
    setActiveKey(pid, i);
    clearKeyLimit(pid, i);
    S.settingsMsg = PROVIDERS[pid] ? (PROVIDERS[pid].short + ' 키 ' + (i + 1) + '(으)로 보낼게요.') : '';
    renderSettings();
  }

  async function saveCodeToken() {
    var v = fieldVal('setCodeToken').trim();
    var r = await saveAiConfig({ keys: keysCopy(), codeToken: v || S.ai.codeToken });
    S.settingsMsg = r.ok ? '코드 열쇠를 저장했어요.' : ('저장하지 못했어요: ' + r.error);
    renderSettings();
    toast(S.settingsMsg);
  }

    S.pref.instructions = fieldVal('setInstructions');

  async function revokeDeviceById(id) {
    if (!id) return;
    var r = await revokeDevice(id);

    S.devices = r.devices || [];

    if (String(id) === String(S.deviceId)) {
      closeSettings();
      lockNow(true);
      toast('이 기기가 해제되어 잠갔어요. 다시 쓰려면 비밀번호로 기기를 등록해 주세요.');
    }
  }

  /* ============ 이벤트 ============ */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || !f.id) return;
    if (f.id === 'gateForm') { e.preventDefault(); submitGate(); return; }
    if (f.id === 'gateTotpForm') { e.preventDefault(); submitGateTotp(); return; }
    if (f.id === 'composer') { e.preventDefault(); if (typeof handleComposerSubmit === 'function') handleComposerSubmit(); else sendMessage(); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      closeModelModal(); closeSettings(); closePersona(); return;
    }
    var el = e.target;
    if (el && el.id === 'input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (typeof handleComposerSubmit === 'function') handleComposerSubmit(); else sendMessage();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'input') autoGrow(e.target);
    /* 인증 앱·아이폰 암호가 6자리를 채워 주면 바로 확인해요 */
    if (e.target && e.target.id === 'gateTotp') {
      var digits = String(e.target.value || '').replace(/\D/g, '').slice(0, 6);
      if (digits !== e.target.value) e.target.value = digits;
      if (digits.length === 6 && !S.gateBusy) {
        window.clearTimeout(S.gateAutoT);
        S.gateAutoT = window.setTimeout(function () { submitGateTotp(); }, 120);
      }
    }
  });

  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
    if (!el) {
      var mm = document.getElementById('modelModal');
      if (mm && !mm.hidden && e.target === mm) closeModelModal();
      var sm = document.getElementById('settingsModal');
      if (sm && !sm.hidden && e.target === sm) closeSettings();
      var pm = document.getElementById('personaModal');
      if (pm && !pm.hidden && e.target === pm) closePersona();
      return;
    }
    var act = el.getAttribute('data-act');
    if (act === 'gate-alt') {
      S.gateAlt = !S.gateAlt;
      renderGate();
      return;
    }
    if (act === 'totp-begin') { totpBeginSetup(); return; }
    if (act === 'totp-cancel') { totpCancelSetup(); return; }
    if (act === 'totp-confirm') { totpConfirmSetup(); return; }
    if (act === 'totp-copy') { totpCopySecret(); return; }
    if (act === 'totp-off-open') { S.totpOff = true; S.totpMsg = ''; renderSettings(); return; }
    if (act === 'totp-off-cancel') { S.totpOff = false; S.totpMsg = ''; renderSettings(); return; }
    if (act === 'totp-off-confirm') { totpDisableSubmit(); return; }
    if (act === 'model-open') { openModelModal(); return; }
    if (act === 'persona-open') { openPersona(); return; }
    if (act === 'persona-close') { closePersona(); return; }
    if (act === 'persona-preset') { applyPersonaPreset(el.getAttribute('data-id')); return; }
    if (act === 'persona-save') { savePersona(); return; }
    if (act === 'persona-clear') { clearPersona(); return; }
    if (act === 'model-close') { closeModelModal(); return; }
    if (act === 'settings-open') { openSettings(); return; }
    if (act === 'settings-close') { closeSettings(); return; }
    if (act === 'lock') { closeSettings(); lockNow(); return; }
    if (act === 'logout') { logout(); return; }
    if (act === 'tab-add') {
      var nt = sampleThread();
      S.threads.push(nt);
      S.active = nt.id;
      renderThreadBar(); renderThread(); saveSoon();
      openPersona();
      return;
    }
    if (act === 'tab-go') { S.active = el.getAttribute('data-id') || S.active; S.scrollNext = true; renderThreadBar(); renderThread(); saveSoon(); return; }
    if (act === 'tab-del') {
      var tid = el.getAttribute('data-id');
      var keep = [];
      for (var i = 0; i < S.threads.length; i++) if (S.threads[i].id !== tid) keep.push(S.threads[i]);
      if (!keep.length) { toast('대화방은 하나 이상 있어야 해요.'); return; }
      S.threads = keep;
      if (S.active === tid) S.active = S.threads[0].id;

  /* ============ 붙이기: 이미지 · 음성 · 글/코드 · PDF ============ */
  S.attachments = [];
  var REC = { rec: null, chunks: [], stream: null, startedAt: 0, timer: null, mime: '', cancel: false };
  var MAX_TEXT_CHARS = 20000;

  function fmtSize(n) {
    var b = Number(n) || 0;
    if (b < 1024) return b + 'B';
    if (b < 1024 * 1024) return Math.round(b / 1024) + 'KB';
    return (b / (1024 * 1024)).toFixed(1) + 'MB';
  }
  function extForMime(mime) {
    var m = String(mime || '');
    if (/mp4|m4a|aac/.test(m)) return '.m4a';
    if (/ogg|opus/.test(m)) return '.ogg';
    if (/wav/.test(m)) return '.wav';
    if (/mpeg|mp3/.test(m)) return '.mp3';
    return '.webm';
  }
  function kindOf(file) {
    var type = String((file && file.type) || '');
    var name = String((file && file.name) || '');
    if (/^image\//.test(type) || /\.(png|jpe?g|webp|gif|heic|bmp)$/i.test(name)) return 'image';
    if (/^audio\//.test(type) || /\.(m4a|mp3|wav|ogg|webm|aac|caf|amr|flac|opus|mpga)$/i.test(name)) return 'audio';
    if (/pdf$/i.test(type) || /\.pdf$/i.test(name)) return 'pdf';
    if (/^(text\/|application\/(json|javascript|xml|x-yaml|csv))/.test(type) || /\.(txt|md|markdown|csv|tsv|json|html?|css|js|mjs|ts|jsx|tsx|py|sh|yml|yaml|log|ini|conf|xml|sql)$/i.test(name)) return 'text';
    return 'other';
  }
  function iconOf(kind) {
    if (kind === 'image') return '🖼️';
    if (kind === 'audio') return '🎧';
    if (kind === 'pdf') return '📕';
    if (kind === 'text') return '📄';
    return '📎';
  }
  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsDataURL(file);
    });
  }
  function readAsText(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsText(file);
    });
  }
  function dataUrlParts(dataUrl) {
    var s = String(dataUrl || '');
    var i = s.indexOf(',');
    var head = i >= 0 ? s.slice(0, i) : '';
    var mime = /^data:([^;,]+)/.exec(head);
    return { mime: mime ? mime[1] : '', b64: i >= 0 ? s.slice(i + 1) : s };
  }
  /* 그림은 화면에 보낼 때 줄여서 토큰을 아껴요 */
  function shrinkImage(file) {
    return new Promise(function (resolve) {
      readAsDataUrl(file).then(function (url) {
        var img = new Image();
        img.onload = function () {
          try {
            var max = 1024;
            var w = img.width || 1, h = img.height || 1;
            var scale = Math.min(1, max / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var g = canvas.getContext('2d');
            g.fillStyle = '#fff';
            g.fillRect(0, 0, cw, ch);
            g.drawImage(img, 0, 0, cw, ch);
            var out = canvas.toDataURL('image/jpeg', 0.82);
            var p = dataUrlParts(out);
            var thumb = null;
            try {
              var tc = document.createElement('canvas');
              tc.width = 96; tc.height = 96;
              var tg = tc.getContext('2d');
              tg.fillStyle = '#fff'; tg.fillRect(0, 0, 96, 96);
              var sc = Math.min(96 / w, 96 / h);
              tg.drawImage(img, (96 - w * sc) / 2, (96 - h * sc) / 2, w * sc, h * sc);
              thumb = tc.toDataURL('image/jpeg', 0.7);
            } catch (e2) { thumb = out; }
            resolve({ mime: 'image/jpeg', b64: p.b64, thumb: thumb || out, width: cw, height: ch });
          } catch (e) {
            var pp = dataUrlParts(url);
            resolve({ mime: pp.mime || 'image/png', b64: pp.b64, thumb: url, width: 0, height: 0 });
          }
        };
        img.onerror = function () {
          var pp = dataUrlParts(url);
          resolve({ mime: pp.mime || 'image/png', b64: pp.b64, thumb: url, width: 0, height: 0 });
        };
        img.src = url;
      }).catch(function () { resolve(null); });
    });
  }

  async function buildAttachment(file) {
    var kind = kindOf(file);
    var base = { id: uid('a_'), kind: kind, name: String(file.name || '파일'), size: file.size || 0 };
    if (kind === 'other') return null;
    if (kind === 'audio') {
      if (file.size > 20 * 1024 * 1024) { toast('음성 파일은 20MB 이하로 올려 주세요.'); return null; }
      base.file = file;
      return base;
    }
    if (kind === 'image') {
      if (file.size > 12 * 1024 * 1024) { toast('이미지는 12MB 이하로 올려 주세요.'); return null; }
      var sh = await shrinkImage(file);
      if (!sh) { toast('이미지를 읽지 못했어요.'); return null; }
      base.mime = sh.mime;
      base.b64 = sh.b64;
      base.thumb = sh.thumb;
      base.width = sh.width; base.height = sh.height;
      return base;
    }
    if (kind === 'pdf') {
      if (file.size > 20 * 1024 * 1024) { toast('PDF는 20MB 이하로 올려 주세요.'); return null; }
      var url = await readAsDataUrl(file);
      var pp = dataUrlParts(url);
      base.mime = 'application/pdf';
      base.b64 = pp.b64;
      base.pages = null;
      return base;
    }
    if (kind === 'text') {
      if (file.size > 4 * 1024 * 1024) { toast('글 파일은 4MB 이하로 올려 주세요.'); return null; }
      var text = await readAsText(file);
      var allLines = text.split('\n').length;
      var clipped = text.length > MAX_TEXT_CHARS;
      base.text = clipped ? text.slice(0, MAX_TEXT_CHARS) : text;
      base.lines = allLines;
      base.chars = text.length;
      base.clipped = clipped;
      return base;
    }
    return null;
  }

  async function addFiles(files) {
    var list = files || [];
    if (!list.length) return;
    var added = 0;
    for (var i = 0; i < list.length && i < 8; i++) {
      var f = list[i];
      if (!f) continue;
      if (S.attachments.length >= 6) { toast('한 번에 6개까지 붙일 수 있어요.'); break; }
      try {
        var att = await buildAttachment(f);
        if (att) { S.attachments.push(att); added++; }
        else if (kindOf(f) === 'other') toast('지원하지 않는 파일이에요: ' + (f.name || ''));
      } catch (e) {
        toast('파일을 읽지 못했어요: ' + (f && f.name ? f.name : ''));
      }
    }
    renderChips();
    if (added) toast(added + '개를 붙였어요.');
  }
  function removeAttachment(id) {
    var keep = [];
    for (var i = 0; i < S.attachments.length; i++) if (S.attachments[i].id !== id) keep.push(S.attachments[i]);
    S.attachments = keep;

  function renderChips() {
    var chip = document.getElementById('attachChip');

      if (a.kind === 'image' && a.width) sub = a.width + '×' + a.height;
      h += '<span class="att' + (a.kind === 'image' ? ' img' : '') + '">' +
        (a.kind === 'image' && a.thumb ? '<img src="' + a.thumb + '" alt="">' : '<span class="ai">' + iconOf(a.kind) + '</span>') +
        '<span class="an">' + esc(a.name) + '</span><span class="as">' + esc(sub) + '</span>' +
        '<button class="rm" type="button" data-act="att-remove" data-id="' + esc(a.id) + '" aria-label="' + esc(a.name) + ' 빼기">✕</button>' +
        '</span>';
    }
    chip.innerHTML = h;

  /* ---------- 음성 받아 적기 ---------- */
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result || '');
        var i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsDataURL(file);
    });
  }

  async function groqTranscribe(file) {
    var fd = new FormData();
    fd.append('file', file, file.name || ('audio' + extForMime(file.type)));
    fd.append('model', 'whisper-large-v3-turbo');
    fd.append('language', 'ko');
    fd.append('response_format', 'json');
    var res, txt = '';
    try {
      res = await window.fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + providerKey('groq') },
        body: fd
      });
      txt = await res.text();
    } catch (e) {
      return { ok: false, error: '음성 파일을 보내지 못했어요. 인터넷 연결을 확인해 주세요.' };
    }
    var headers = headerMap(res);
    var json = null;
    try { json = JSON.parse(txt); } catch (e) { json = null; }
    noteResult('groq', 'whisper-large-v3-turbo', res.status, headers, txt);
    if (!res.ok) {
      var info = limitInfo(modelIdOf('groq', 'whisper-large-v3-turbo'));
      return {
        ok: false,
        error: '받아 적지 못했어요. ' + textFromErr(res.status, json, 'HTTP ' + res.status) +
          (info.left > 0 ? '\n(' + info.text + ' · ' + fmtLeft(info.left) + ' 뒤에 다시)' : '')
      };
    }
    var out = String((json && json.text) || '').trim();
    if (!out) return { ok: false, error: '음성을 알아듣지 못했어요. 조금 더 길게 다시 시도해 주세요.' };
    return { ok: true, via: 'groq', transcript: out };
  }

  async function geminiTranscribe(file) {
    var pidModel = splitModelId(S.pref.model || '');
    var model = (pidModel.pid === 'gemini' && pidModel.model) ? pidModel.model : modelList('gemini')[0];
    var b64;
    try { b64 = await fileToBase64(file); } catch (e) { return { ok: false, error: '파일을 읽지 못했어요.' }; }
    var body = {
      contents: [{
        role: 'user',
        parts: [
          { inlineData: { mimeType: String(file.type || 'audio/m4a'), data: b64 } },
          { text: '이 음성 메모를 한국어로 정확히 받아 적어 줘. 그다음 아래 형식으로 정리해 줘.\n\n전사:\n(받아 적은 내용)\n\n요약:\n(세 줄 이내)\n\n할 일:\n- (있으면 목록, 없으면 "없음")' }
        ]
      }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 2048 }
    };
    var res, txt = '';
    try {
      res = await window.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': providerKey('gemini') },
        body: JSON.stringify(body)
      });
      txt = await res.text();
    } catch (e) {
      return { ok: false, error: '음성 파일을 보내지 못했어요. 인터넷 연결을 확인해 주세요.' };
    }
    var headers = headerMap(res);
    var json = null;
    try { json = JSON.parse(txt); } catch (e) { json = null; }
    noteResult('gemini', model, res.status, headers, txt);
    if (!res.ok) {
      var info = limitInfo(modelIdOf('gemini', model));
      return {
        ok: false,
        error: '받아 적지 못했어요. ' + textFromErr(res.status, json, 'HTTP ' + res.status) +
          (info.left > 0 ? '\n(' + info.text + ' · ' + fmtLeft(info.left) + ' 뒤에 다시)' : '')
      };
    }
    var parts = (json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    var whole = '';
    for (var i = 0; i < parts.length; i++) if (parts[i] && parts[i].text) whole += parts[i].text;
    whole = String(whole).trim();
    if (!whole) return { ok: false, error: '음성을 알아듣지 못했어요. 다시 시도해 주세요.' };
    var tr = whole;
    var m = /전사\s*:?\s*([\s\S]*?)(?=\n\s*요약\s*:|$)/.exec(whole);
    if (m && m[1].trim()) tr = m[1].trim();
    return { ok: true, via: 'gemini', transcript: tr, geminiText: whole };
  }

  async function transcribeFile(file) {
    if (!file) return { ok: false, error: '음성 파일이 없어요.' };
    if (hasKey('groq')) return groqTranscribe(file);
    if (hasKey('gemini')) return geminiTranscribe(file);
    return { ok: false, error: '음성 메모를 받아 적으려면 무료 **Groq** 키나 **Gemini** 키가 필요해요.\n⚙️ 설정에서 키를 넣어 주세요.' };
  }

  /* ---------- 녹음 ---------- */
  function pickRecMime() {
    if (!window.MediaRecorder) return '';
    var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/m4a', 'audio/aac', 'audio/ogg'];
    if (typeof window.MediaRecorder.isTypeSupported !== 'function') return '';
    for (var i = 0; i < list.length; i++) {
      try { if (window.MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) { /* 무시 */ }
    }
    return '';
  }
  function updateRecTime() {
    var el = document.getElementById('recTime');
    if (!el || !REC.startedAt) return;
    var s = Math.max(0, Math.floor((Date.now() - REC.startedAt) / 1000));
    el.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function recUi(on) {
    var bar = document.getElementById('recBar');
    var mic = document.getElementById('micBtn');
    if (bar) bar.hidden = !on;
    if (mic) { mic.classList.toggle('on', !!on); mic.textContent = on ? '⏹' : '🎙️'; }
    if (on) updateRecTime();
  }
  async function startRecording() {
    if (REC.rec) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast('이 브라우저에서는 녹음을 쓸 수 없어요. 파일을 붙여 주세요.');
      return;
    }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      var mime = pickRecMime();
      var mr = mime ? new window.MediaRecorder(stream, { mimeType: mime }) : new window.MediaRecorder(stream);
      REC.stream = stream;
      REC.rec = mr;
      REC.chunks = [];
      REC.cancel = false;
      REC.mime = String(mr.mimeType || mime || 'audio/webm');
      mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
      mr.onstop = function () { recordingDone(); };
      mr.start();
      REC.startedAt = Date.now();
      recUi(true);
      window.clearInterval(REC.timer);
      REC.timer = window.setInterval(updateRecTime, 300);
    } catch (e) {
      toast('마이크를 쓸 수 없어요. 브라우저 권한을 확인해 주세요.');
    }
  }
  function stopRecording() { if (REC.rec) { try { REC.rec.stop(); } catch (e) { /* 무시 */ } } }
  function cancelRecording() { if (REC.rec) { REC.cancel = true; stopRecording(); } }

  async function recordingDone() {
    window.clearInterval(REC.timer);
    REC.timer = null;
    recUi(false);
    var stream = REC.stream;
    REC.stream = null;
    if (stream && stream.getTracks) {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* 무시 */ }
    }
    var kind = String(REC.mime || 'audio/webm').split(';')[0] || 'audio/webm';
    var blob = null;
    try { blob = new Blob(REC.chunks, { type: kind }); } catch (e) { blob = null; }
    var wasCancel = REC.cancel;
    REC.rec = null;
    REC.cancel = false;
    REC.chunks = [];
    if (wasCancel) return;
    if (!blob || !blob.size) { toast('녹음된 소리가 없어요.'); return; }
    var d = new Date();
    var name = '녹음-' + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + extForMime(kind);
    var file = null;
    try { file = new File([blob], name, { type: kind }); } catch (e) { file = blob; file.name = name; }
    S.attachments.push({ id: uid('a_'), kind: 'audio', name: name, size: blob.size, file: file });
    renderChips();
    sendAttachFlow();
  }

  /* ---------- 보내기 ---------- */
  function providerCanSeeImages(pid, model) {
    if (pid === 'gemini') return true;
    if (pid === 'openrouter') return /vision|llama-3\.2|llama-4|qwen|gemma|pixtral|claude|gpt-4o|gemini/i.test(String(model));
    if (pid === 'groq') return /vision|llama-4|maverick|scout/i.test(String(model));
    return false;
  }
  function providerCanSeePdf(pid) { return pid === 'gemini'; }

  function attSummary(att) {
    if (att.kind === 'image') return '🖼️ ' + att.name;
    if (att.kind === 'audio') return '🎧 ' + att.name;
    if (att.kind === 'pdf') return '📕 ' + att.name;
    return '📄 ' + att.name + ' (' + att.lines + '줄)';
  }

  async function sendAttachFlow() {
    var t = activeThread();
    if (!t) return;
    if (!S.attachments.length) { sendMessage(); return; }
    if (S.busy[t.id]) { toast('이 대화방은 아직 답을 만들고 있어요. 조금 기다려 주세요.'); return; }

    var items = S.attachments.slice();
    S.attachments = [];
    renderChips();
    var typed = fieldVal('input').trim();
    var sp = splitModelId(currentModel());
    var pid = sp.pid, model = sp.model;

    S.scrollNext = true;
    var msg = addMsg(t, {
      role: 'user', kind: 'file',
      text: typed,
      attachments: items.map(function (a) { return { kind: a.kind, name: a.name, size: a.size, lines: a.lines, chars: a.chars }; })
    });
    var input = document.getElementById('input');
    if (input) { input.value = ''; autoGrow(input); }
    if (!t.title || t.title === '새 대화') t.title = attSummary(items[0]).slice(0, 24);
    renderThreadBar();
    if (S.active === t.id) renderThread();
    saveSoon();
    S.busy[t.id] = { at: Date.now() };
    renderThreadBar();
    if (S.active === t.id) renderThread();

    var images = [], pdfs = [], textBlocks = [], notes = [], geminiText = null;
    try {
      for (var i = 0; i < items.length; i++) {
        var a = items[i];
        if (a.kind === 'audio') {
          msg.text = (msg.text ? msg.text + '\n\n' : '') + '음성 메모를 받아 적는 중…';
          if (S.active === t.id) renderThread();
          var tr = await transcribeFile(a.file);
          msg.text = (msg.text || '').replace('음성 메모를 받아 적는 중…', '').trim();
          if (!tr.ok) { msg.error = true; msg.text = (msg.text ? msg.text + '\n\n' : '') + tr.error; continue; }
          msg.kind = 'audio';
          msg.audioName = a.name;
          msg.audioSize = a.size;
          msg.audioVia = tr.via;
          msg.text = (msg.text ? msg.text + '\n\n' : '') + tr.transcript;
          if (tr.geminiText) geminiText = tr.geminiText;
        } else if (a.kind === 'text') {
          textBlocks.push('📄 파일: ' + a.name + ' (' + a.lines + '줄' + (a.clipped ? ', 앞 ' + MAX_TEXT_CHARS + '자만' : '') + ')\n```\n' + a.text + '\n```');
        } else if (a.kind === 'image') {
          if (providerCanSeeImages(pid, model)) images.push({ mime: a.mime, data: a.b64, name: a.name });
          else notes.push('🖼️ ' + a.name + ' — 지금 모델(' + model + ')은 그림을 못 봐요. Gemini나 비전 모델로 바꾸면 볼 수 있어요.');
        } else if (a.kind === 'pdf') {
          if (providerCanSeePdf(pid)) pdfs.push({ data: a.b64, name: a.name });
          else notes.push('📕 ' + a.name + ' — PDF는 Gemini에서만 읽을 수 있어요. 모델을 Gemini로 바꿔 주세요.');
        }
      }
      msg.attachments = items.filter(function (a) { return a.kind !== 'audio'; }).map(function (a) {
        return { kind: a.kind, name: a.name, size: a.size, lines: a.lines, chars: a.chars };
      });
      if (textBlocks.length) msg.text = (msg.text ? msg.text + '\n\n' : '') + textBlocks.join('\n\n');
      if (notes.length) msg.text = (msg.text ? msg.text + '\n\n' : '') + notes.join('\n');
      if (geminiText) {
        addMsg(t, { role: 'assistant', text: geminiText, model: modelIdOf('gemini', '음성 메모 요약') });
        renderModelBtn();
      } else {
        if (S.active === t.id) renderThread();
        saveSoon();
        await runAssistant(t, { images: images, pdfs: pdfs });
        renderModelBtn();
      }
    } catch (e) {
      msg.error = true;
      msg.text = (msg.text ? msg.text + '\n\n' : '') + '붙인 파일을 처리하지 못했어요. ' + (e && e.message ? e.message : '');
    } finally {
      delete S.busy[t.id];
      renderThreadBar();
      if (S.active === t.id) renderThread();
      saveSoon(0);
    }
  }

  function handleComposerSubmit() {
    if (S.attachments.length) { sendAttachFlow(); return; }
    sendMessage();
  }

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.id !== 'composer') return;
    if (e.defaultPrevented) return;
    e.preventDefault();
    handleComposerSubmit();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.id !== 'fileInput') return;
    var files = [];
    if (el.files) for (var i = 0; i < el.files.length; i++) files.push(el.files[i]);
    if (files.length) addFiles(files);
    try { el.value = ''; } catch (e2) { /* 무시 */ }
  });

  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'attach') {
      var fi = document.getElementById('fileInput');
      if (fi) { try { fi.click(); } catch (e2) { /* 무시 */ } }
      return;
    }
    if (act === 'att-remove') { removeAttachment(el.getAttribute('data-id')); return; }
    if (act === 'mic') { if (REC.rec) stopRecording(); else startRecording(); return; }
    if (act === 'rec-stop') { stopRecording(); return; }
    if (act === 'rec-cancel') { cancelRecording(); return; }
  });
})();
</script>
</body>
</html>
