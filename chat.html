<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>AI 비서 챗 · jadenfamily</title>
<meta name="description" content="우리 집 AI 비서 챗">
<meta name="apple-mobile-web-app-title" content="AI 비서 챗">
<meta property="og:title" content="AI 비서 챗 · jadenfamily">
<meta property="og:description" content="대시보드 코드 수정 · 가족 데이터 확인 · 여러 대화방">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/chat.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --ink-3:#918aa4;
    --line:#f1e6da;
    --card:#ffffff;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --r-lg:22px;
    --sun:#ff9f1c;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ff5c8a;
    --sky:#3d9be9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); font-size:16px; line-height:1.45; height:100%; overflow:hidden;
    background-color:#fff8ef;
    background-image:
      radial-gradient(circle at 8% -6%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% -2%, #dcf0ff 0, rgba(220,240,255,0) 44%),
      radial-gradient(circle at 50% 112%, #ffe7f0 0, rgba(255,231,240,0) 46%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  select,input,textarea{ font-family:inherit; }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:inherit; }

  /* ---------- 앱 뼈대 ---------- */
  .app{
    display:flex; flex-direction:column; height:100%;
    max-width:980px; margin:0 auto; width:100%;
    padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);
  }
  .topbar{
    display:flex; align-items:center; gap:10px; padding:10px 12px 8px;
    background:rgba(255,248,239,.88); backdrop-filter:saturate(150%) blur(10px);
    border-bottom:1px solid rgba(241,230,218,.9);
  }
  .back{
    width:38px; height:38px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center;
    background:#fff; box-shadow:var(--shadow); text-decoration:none; font-size:18px; font-weight:900; color:var(--ink);
  }
  .back:active{ transform:scale(.96); }
  .ai-logo{
    width:38px; height:38px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center; font-size:20px;
    background:linear-gradient(150deg,#e9e2ff 0%,#d9ecff 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  }
  .brand{ min-width:0; }
  .brand h1{ margin:0; font-size:17px; font-weight:900; letter-spacing:-.03em; line-height:1.15; white-space:nowrap; }
  .brand p{ margin:2px 0 0; font-size:11.5px; font-weight:800; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw; }
  .top-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
  .pill-btn{
    display:flex; align-items:center; gap:6px; border:0; background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 11px; box-shadow:var(--shadow); font-size:12px; font-weight:900; max-width:44vw;
  }
  .pill-btn .m-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill-btn .m-dot{ width:8px; height:8px; border-radius:50%; background:#c9c2d6; flex:0 0 auto; }
  .pill-btn .m-dot.ok{ background:var(--mint); }
  .pill-btn .m-dot.limited{ background:var(--sun); }
  .pill-btn .m-dot.quota{ background:var(--pink); }
  .icon-btn{
    width:38px; height:38px; border:0; border-radius:13px; background:#fff; box-shadow:var(--shadow);
    font-size:16px; display:grid; place-items:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  /* ---------- 대화방 탭 ---------- */
  .threadbar{
    display:flex; gap:7px; align-items:center; padding:8px 12px 6px; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .threadbar::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; max-width:180px;
    border:1.5px solid transparent; background:#fff; color:#5e5574; border-radius:999px;
    padding:7px 11px; font-size:12.5px; font-weight:900; box-shadow:0 3px 10px rgba(118,86,54,.06);
  }
  .tab .tname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab.on{ background:#26203a; color:#fff; box-shadow:0 6px 16px rgba(44,36,64,.24); }
  .tab .spin{ width:10px; height:10px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:spin .8s linear infinite; }
  .tab.add{ color:#6a45d8; background:#f2eeff; border-color:#e4dbff; font-size:15px; padding:5px 12px; }
  .tab.persona{ background:#fff7e8; color:#96631a; border-color:#ffe6bd; }
  .presets{ display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 12px; }
  .preset{ border:1.5px solid #f0ebff; background:#fff; color:#4a3a86; border-radius:999px; padding:8px 12px; font-size:12.5px; font-weight:900; }
  .preset.on{ background:#f2eeff; border-color:#b9a4ff; }
  .tab .x{ border:0; background:transparent; color:inherit; opacity:.5; font-size:12px; padding:0 0 0 2px; }
  .tab .x:hover{ opacity:1; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 대화 본문 ---------- */
  .thread{ flex:1; overflow-y:auto; padding:8px 12px 18px; -webkit-overflow-scrolling:touch; }
  .msg{ display:flex; gap:9px; margin:10px 0; align-items:flex-end; }
  .msg .av{ width:28px; height:28px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center; font-size:14px; background:linear-gradient(150deg,#e9e2ff,#d9ecff); }
  .bubble{
    max-width:min(76%, 640px); padding:11px 14px; border-radius:18px; font-size:15px; line-height:1.62;
    background:#fff; box-shadow:0 6px 18px rgba(118,86,54,.07); overflow-wrap:anywhere;
  }
  .msg.me{ flex-direction:row-reverse; }
  .msg.me .bubble{ background:#312a4d; color:#fff; border-bottom-right-radius:6px; }
  .msg.bot .bubble{ border-bottom-left-radius:6px; }
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble code{ background:rgba(124,92,252,.10); padding:1px 5px; border-radius:6px; font-size:.9em; }
  .bubble pre{ background:#1f1a30; color:#f4f1ff; padding:11px 12px; border-radius:12px; overflow-x:auto; font-size:12.5px; line-height:1.5; margin:8px 0; }
  .bubble pre code{ background:transparent; padding:0; font-size:inherit; }
  .bubble ul{ margin:6px 0; padding-left:20px; }
  .bubble li{ margin:2px 0; }
  .bubble a{ color:#5b3fe0; font-weight:800; }
  .msg.me .bubble a{ color:#e7dcff; }
  .meta-line{ font-size:10.5px; font-weight:800; color:var(--ink-3); margin:4px 2px 0; }
  .msg.me .meta-line{ text-align:right; }
  .typing{ display:inline-flex; gap:4px; align-items:center; padding:2px 0; }
  .typing i{ width:6px; height:6px; border-radius:50%; background:#b9b0cc; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.18s; }
  .typing i:nth-child(3){ animation-delay:.36s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-2px); } }
  .welcome{ text-align:center; padding:40px 16px; color:var(--ink-2); }
  .welcome .big{ font-size:44px; }
  .welcome h2{ margin:10px 0 6px; font-size:19px; color:var(--ink); }
  .welcome p{ margin:0 auto; max-width:420px; font-size:13.5px; font-weight:700; line-height:1.7; }

  /* 도구 카드 */
  .card{
    margin:10px 0 2px; max-width:min(86%, 660px); background:#fff; border-radius:16px;
    box-shadow:0 8px 22px rgba(118,86,54,.08); border:1px solid #f0ebff; overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; gap:8px; padding:10px 13px; font-size:12.5px; font-weight:900; background:#f7f4ff; color:#4a3a86; }
  .card-body{ padding:11px 13px; font-size:13px; }
  .card-body .row{ display:flex; gap:8px; padding:3px 0; }
  .card-body .row b{ flex:0 0 auto; color:var(--ink-2); font-size:12px; min-width:52px; }
  .chk{ display:flex; gap:8px; align-items:flex-start; padding:5px 0; font-size:12.5px; font-weight:800; }
  .chk .ic{ flex:0 0 auto; width:18px; text-align:center; }
  .chk.ok{ color:#0f7a55; }
  .chk.bad{ color:#c6415a; }
  .chk .detail{ display:block; font-weight:700; color:#8a6a75; font-size:11.5px; margin-top:2px; white-space:pre-wrap; }
  .diff{ max-height:260px; overflow:auto; background:#fbfaff; border-top:1px solid #f0ebff; font-size:11.5px; line-height:1.5; }
  .diff div{ padding:1px 10px; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .diff .add{ background:#eafaf1; color:#0d6b4a; }
  .diff .del{ background:#fff0f3; color:#a53a52; }
  .diff .ctx{ color:#8c86a0; }
  .card-actions{ display:flex; gap:8px; padding:10px 13px; border-top:1px solid #f0ebff; flex-wrap:wrap; }
  .btn{
    border:0; border-radius:12px; padding:9px 14px; font-size:13px; font-weight:900;
    background:#26203a; color:#fff; box-shadow:0 6px 14px rgba(44,36,64,.18);
  }
  .btn:active{ transform:scale(.985); }
  .btn.ghost{ background:#f4f1fb; color:#4a3a86; box-shadow:none; }
  .btn.warn{ background:#fff0f3; color:#b93b57; box-shadow:none; }
  .btn[disabled]{ opacity:.5; }

  /* ---------- 퀵 버튼 / 입력 ---------- */
  .quickrow{ display:flex; gap:7px; padding:0 12px 8px; overflow-x:auto; scrollbar-width:none; }
  .quickrow::-webkit-scrollbar{ display:none; }
  .quick{
    flex:0 0 auto; border:1px solid #ece4ff; background:#fff; color:#4a3a86; border-radius:999px;
    padding:7px 12px; font-size:12.5px; font-weight:900; box-shadow:0 3px 10px rgba(118,86,54,.05);
  }
  .composer{
    display:flex; align-items:flex-end; gap:8px; padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(255,248,239,.94); border-top:1px solid rgba(241,230,218,.9);
    backdrop-filter:blur(8px);
  }
  .input-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .tool-btn{
    width:42px; height:44px; flex:0 0 auto; border:0; border-radius:15px; background:#fff;
    box-shadow:var(--shadow); font-size:18px; display:grid; place-items:center;
  }
  .tool-btn:active{ transform:scale(.96); }
  .tool-btn.on{ background:#ffe3ea; box-shadow:0 0 0 2px #ffc7d5 inset; }
  .attach-chip{ display:flex; flex-wrap:wrap; gap:6px; }
  .att{
    display:inline-flex; align-items:center; gap:6px; padding:4px 8px 4px 4px; background:#f5f1ff;
    border-radius:12px; font-size:11.5px; font-weight:900; color:#4a3a86; max-width:100%;
  }
  .att img{ width:30px; height:30px; border-radius:8px; object-fit:cover; flex:0 0 auto; display:block; }
  .att .ai{ font-size:14px; width:24px; text-align:center; flex:0 0 auto; }
  .att .an{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:132px; }
  .att .as{ color:#8a7fd0; font-weight:700; font-size:10.5px; white-space:nowrap; }
  .att .rm{ border:0; background:transparent; color:#8a7fd0; font-size:12px; padding:0 2px; }
  .msg-atts{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .msg-att{ font-size:10.5px; font-weight:900; background:rgba(124,92,252,.12); color:#4a3a86; padding:2px 8px; border-radius:999px; }
  .msg.me .msg-att{ background:rgba(255,255,255,.18); color:#efe9ff; }
  .rec-bar{
    display:flex; align-items:center; gap:9px; padding:9px 14px; background:#fff1f4;
    border-top:1px solid #ffd9e2; font-size:12.5px; font-weight:900; color:#b93b57;
  }
  .rec-dot{ width:10px; height:10px; border-radius:50%; background:#ef4d6a; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.7); opacity:.5; } }
  .audio-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3f4fa8; margin-bottom:6px; }
  .composer textarea{
    flex:1; resize:none; border:0; border-radius:18px; padding:12px 14px; font-size:15px; line-height:1.45;
    background:#fff; box-shadow:var(--shadow); max-height:140px; min-height:46px; color:var(--ink);
  }
  .composer textarea:focus{ outline:2px solid #d9cffd; }
  .send{
    width:46px; height:46px; flex:0 0 auto; border:0; border-radius:16px; font-size:17px;
    background:linear-gradient(150deg,#7c5cfc,#5a7bff); color:#fff; box-shadow:0 8px 18px rgba(92,72,200,.28);
  }
  .send:active{ transform:scale(.96); }
  .send[disabled]{ opacity:.45; }
  .foot{ margin:0; padding:0 12px 6px; font-size:10.5px; font-weight:800; color:#a79fbb; text-align:center; }

  /* ---------- 잠금 화면 ---------- */
  .gate{
    position:fixed; inset:0; display:grid; place-items:center; padding:20px;
    background:var(--card, #fff8ef);
    background-image:
      radial-gradient(circle at 10% -10%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% 0%, #dcf0ff 0, rgba(220,240,255,0) 44%);
    overflow-y:auto; z-index:60;
  }
  .gate-card{
    width:100%; max-width:420px; background:#fff; border-radius:26px; padding:26px 22px 22px;
    box-shadow:0 18px 44px rgba(118,86,54,.14); text-align:center;
  }
  .gate-logo{
    width:62px; height:62px; margin:0 auto 12px; border-radius:22px; display:grid; place-items:center; font-size:32px;
    background:linear-gradient(150deg,#ece6ff 0%,#dcf0ff 100%);
  }
  .gate-card h1{ margin:0 0 4px; font-size:21px; font-weight:900; letter-spacing:-.03em; }
  .gate-sub{ margin:0 0 16px; font-size:13px; font-weight:800; color:var(--ink-2); line-height:1.6; }
  .gate-form{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .gate-form label{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:900; color:var(--ink-2); }
  .gate-form input{
    border:1.5px solid #eee6db; border-radius:13px; padding:11px 13px; font-size:15px; background:#fffdfa;
  }
  .gate-form input:focus{ outline:2px solid #d9cffd; border-color:#cfc0ff; }
  .gate-btn{
    border:0; border-radius:14px; padding:13px; font-size:15px; font-weight:900; color:#fff;
    background:linear-gradient(150deg,#7c5cfc,#5a7bff); box-shadow:0 10px 22px rgba(92,72,200,.26);
  }
  .gate-btn[disabled]{ opacity:.6; }
  .gate-link{ display:inline-block; margin-top:14px; font-size:12.5px; font-weight:900; color:#6a5fc0; text-decoration:none; }
  .gate-alt{ display:inline-block; margin:12px 0 0; border:0; background:none; padding:4px 6px; font-size:12.5px; font-weight:900; color:#6a5fc0; }
  .totp-qr{ display:flex; justify-content:center; margin:10px 0 12px; }
  .totp-qr svg{ width:208px; height:208px; border-radius:14px; border:1.5px solid #f0ebff; background:#fff; padding:6px; }
  .totp-key{ display:flex; align-items:center; gap:8px; background:#fbf9ff; border:1.5px solid #f0ebff; border-radius:12px; padding:9px 11px; margin:0 0 10px; }
  .totp-key code{ flex:1; min-width:0; font-size:12.5px; font-weight:800; letter-spacing:.04em; word-break:break-all; color:#4a3a86; }
  .totp-code{ letter-spacing:.3em; font-size:18px; font-weight:900; text-align:center; }
  .gate-msg{ min-height:18px; margin:8px 0 0; font-size:12.5px; font-weight:800; color:#c6415a; text-align:center; }
  .gate-msg.ok{ color:#0f7a55; }
  .gate-note{ margin:14px 0 0; font-size:11.5px; font-weight:700; color:#a79fbb; line-height:1.6; }

  /* ---------- 모달 ---------- */
  .modal{
    position:fixed; inset:0; z-index:80; background:rgba(38,32,58,.42);
    display:flex; align-items:center; justify-content:center; padding:14px;
  }
  .modal-card{
    width:100%; max-width:560px; max-height:86vh; display:flex; flex-direction:column;
    background:#fff; border-radius:24px; box-shadow:0 24px 60px rgba(38,32,58,.3); overflow:hidden;
  }
  .modal-head{ display:flex; align-items:center; gap:10px; padding:15px 18px 12px; border-bottom:1px solid #f4eee6; }
  .modal-head h2{ margin:0; font-size:16.5px; font-weight:900; letter-spacing:-.02em; }
  .modal-close{ margin-left:auto; border:0; background:#f6f2ec; width:32px; height:32px; border-radius:11px; font-size:14px; }
  .modal-body{ padding:14px 18px 20px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sec{ margin-bottom:20px; }
  .sec h3{ margin:0 0 4px; font-size:14px; font-weight:900; }
  .sec .hint{ margin:0 0 10px; font-size:11.5px; font-weight:700; color:var(--ink-3); line-height:1.6; }
  .field{ display:flex; flex-direction:column; gap:5px; margin:8px 0; font-size:12px; font-weight:900; color:var(--ink-2); }
  .field input[type=text], .field input[type=password], .field textarea, .field select{
    border:1.5px solid #eee6db; border-radius:12px; padding:10px 12px; font-size:14px; background:#fffdfa; color:var(--ink);
    font-weight:600;
  }
  .field textarea{ min-height:92px; resize:vertical; line-height:1.6; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid #d9cffd; border-color:#cfc0ff; }
  .mrow{
    display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:14px; background:#fbf9ff;
    border:1.5px solid #f0ebff; margin:7px 0;
  }
  .mrow.on{ border-color:#b9a4ff; background:#f5f1ff; }
  .mrow .mi{ flex:1; min-width:0; }
  .mrow .mi b{ display:block; font-size:13px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow .mi span{ display:block; font-size:11px; font-weight:800; color:var(--ink-3); }
  .badge{ flex:0 0 auto; font-size:10.5px; font-weight:900; padding:3px 7px; border-radius:999px; background:#eefaf3; color:#0f7a55; }
  .badge.limited{ background:#fff4e6; color:#a95c09; }
  .badge.quota{ background:#fff0f3; color:#b93b57; }
  .badge.unknown{ background:#f2f0f6; color:#7c7590; }
  .badge.free{ background:#eef5ff; color:#2f6fb5; }
  .mrow .mi .freemark, .freemark{ display:inline-block; width:auto; font-size:9.5px; font-weight:900; padding:1px 6px; border-radius:999px; background:#eef5ff; color:#2f6fb5; vertical-align:middle; }
  .gtitle{ display:flex; align-items:center; gap:8px; margin:16px 0 4px; font-size:12px; font-weight:900; color:#5b4b9a; text-transform:none; }
  .gtitle .k{ font-size:10.5px; font-weight:900; padding:2px 7px; border-radius:999px; background:#f2eefc; color:#6a45d8; }
  .klist{ display:flex; flex-direction:column; gap:6px; }
  .krow{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; background:#fbf9ff; border-radius:12px; padding:8px 10px; }
  .krow .ki{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .krow .ks{ font-size:10.5px; font-weight:900; color:#0f7a55; }
  .krow .kd{ font-size:10.5px; font-weight:800; color:#8a8398; }
  .mini{ border:0; background:#f2eefc; color:#6a45d8; border-radius:10px; padding:6px 9px; font-size:11px; font-weight:900; }
  .mini.danger{ background:#fff0f3; color:#b93b57; }
  .toast{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px);
    background:#26203a; color:#fff; padding:11px 17px; border-radius:999px; font-size:13px; font-weight:900;

<script>
(function () {
  'use strict';

  /* ============ 기본값 / 상수 ============ */
  var API_BASE = 'https://api.github.com';
  var DEFAULT_OWNER = 'jadenfamily';
  var DEFAULT_REPO = 'kids-dashboard-data';
  var CODE_REPOS = ['home', 'kids-dashboard', 'fridge-dashboard', 'ledger-dashboard'];

  /* /home·아이 대시보드와 같은 열쇠를 써요 (같은 주소라서 로그인이 이어져요) */
  var K_DEVICE = 'kidsDashboard.device.v1';
  var K_USERS = 'kidsDashboard.users.v1';
  var K_SHA = 'kidsDashboard.sha.v1';
  var K_SESSION = 'kidsDashboard.session.v1';

  /* 이 챗에서만 쓰는 열쇠 */
  var K_DEVID = 'kidsDashboard.chat.deviceId.v1';
  var K_UNLOCK = 'kidsDashboard.chat.unlock.v1';
  var K_LIMITS = 'kidsDashboard.chat.limits.v1';
  var K_PREF = 'kidsDashboard.chat.pref.v1';
  var K_MODELS = 'kidsDashboard.chat.models.v1';

  var CHAT_ITER = 150000;
  var PATH_THREADS = 'ai-chat/';
  var PATH_AI = 'config/ai.json';
  var PATH_DEVICES = 'config/trusted-devices.json';

  /* 2차 인증(구글 인증 앱 · 아이폰 암호) */
  var K_TOTP_SEEN = 'kidsDashboard.chat.totp.v1';
  var TOTP_PERIOD = 30;      /* 초 */
  var TOTP_DIGITS = 6;
  var TOTP_ITER = 100000;
  var TOTP_ISSUER = 'jadenfamily';

  /* 더 이상 쓸 수 없게 된 모델은 목록에서 숨겨요 */
  var K_DEAD = 'kidsDashboard.chat.deadModels.v1';
  var K_KEYSTATE = 'kidsDashboard.chat.keyState.v1';
  var PREFERRED_MODEL = { gemini: 'gemini-3.8-flash' };

  var S = {
    conn: null,
    users: null,
    me: null,
    sha: {},
    deviceId: '',
    deviceName: '',
    unlocked: false,
    chatKey: null,
    chatSalt: null,
    chatIter: CHAT_ITER,
    threads: [],
    active: '',
    loaded: false,
    ai: { gemini: '', openrouter: '', groq: '', codeToken: '', at: 0, present: false, keys: { gemini: [], openrouter: [], groq: [] }, active: { gemini: 0, openrouter: 0, groq: 0 } },
    keyLimit: {},
    limits: {},
    pref: { model: '', instructions: '', quick: [] },
    busy: {},
    proposals: {},
    pending: {},
    saveTimer: null,
    saveChain: Promise.resolve(),
    saveState: 'idle',
    gateMode: '',
    gateAlt: false,
    totp: { ok: true, present: false, enabled: false, cfg: null },
    totpSetup: null,
    totpMsg: '',
    totpOff: false,
    dead: {},
    personaSel: '',
    settingsMsg: '',
    modelMsg: '',
    blobs: {},
    smoke: {},
    lastModels: {}
  };

  /* ============ 작은 도구들 ============ */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      if (c === '"') return '&quot;';
      return '&#39;';
    });
  }
  function nowIso() { return new Date().toISOString(); }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function ssGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { window.sessionStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function ssDel(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  function fieldVal(id) { var el = document.getElementById(id); return el ? String(el.value == null ? '' : el.value) : ''; }
  function uid(prefix) { return (prefix || '') + randomHex(6); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function randomHex(n) {
    var bytes = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < n; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytesToHex(bytes);
  }
  function bytesToHex(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += ('0' + bytes[i].toString(16)).slice(-2);
    return s;
  }
  function b64enc(buf) {
    var b = new Uint8Array(buf), s = '', i;
    for (i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return window.btoa(s);
  }
  function b64dec(txt) {
    var bin = window.atob(String(txt || '').replace(/\s/g, '')), i;
    var out = new Uint8Array(bin.length);
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(String(str)), bin = '', i;
    for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return window.btoa(bin);
  }
  function b64decodeUtf8(b64) {
    var bin = window.atob(String(b64 || '').replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
    return decodeURIComponent(escape(bin));
  }
  async function sha256Hex(text) {
    if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest)) {
      throw new Error('이 브라우저에서는 암호화 기능을 쓸 수 없어요. Safari/Chrome을 최신 버전으로 올려 주세요.');
    }
    var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text)));
    return bytesToHex(new Uint8Array(buf));
  }
  function hashPassword(pw, salt) { return sha256Hex(String(salt) + ':' + String(pw)); }

  function fmtWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtClock(ts) {
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtLeft(ms) {
    if (ms <= 0) return '0초';
    var s = Math.ceil(ms / 1000);
    if (s < 60) return s + '초';
    var m = Math.floor(s / 60), r = s % 60;
    if (m < 60) return m + '분' + (r ? ' ' + r + '초' : '');
    var h = Math.floor(m / 60);
    return h + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '');
  }

  function toast(text) {
    var el = document.getElementById('toast');
    if (!el) return;
    var msg = String(text == null ? '' : text);
    if (msg.length > 150) msg = msg.slice(0, 147) + '…';
    el.textContent = msg;
    /* 입력창(붙인 파일 칩 포함) 바로 위에 띄워요 — 설정 창이 열려 있으면 창을 가리지 않게 아래쪽에 */
    var modal = null;
    var ids = ['settingsModal', 'modelModal', 'personaModal'];
    for (var k = 0; k < ids.length; k++) {
      var mm = document.getElementById(ids[k]);
      if (mm && !mm.hidden) { modal = mm; break; }
    }
    try {
      if (modal) {
        el.style.bottom = 'calc(18px + env(safe-area-inset-bottom,0px))';
        el.style.maxWidth = '78vw';
      } else {
        el.style.maxWidth = '';
        var comp = document.querySelector('.composer');
        if (comp) {
          var r = comp.getBoundingClientRect();
          el.style.bottom = Math.max(14, window.innerHeight - r.top + 10) + 'px';
        } else {
          el.style.bottom = '';
        }
      }
    } catch (e2) { /* 무시 */ }
    el.classList.add('show');
    window.clearTimeout(toast.t);
    toast.t = window.setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ============ 기기 연결 정보 / 세션 ============ */
  function loadDevice() {
    try {
      var j = JSON.parse(lsGet(K_DEVICE) || 'null');
      if (j && j.owner && j.repo && j.token) return { owner: j.owner, repo: j.repo, token: j.token, branch: j.branch || 'main', at: j.at || 0 };
    } catch (e) { /* 무시 */ }
    return null;
  }
  function loadUsersCache() { try { return JSON.parse(lsGet(K_USERS) || 'null'); } catch (e) { return null; } }
  function saveUsersCache(u) { if (u) lsSet(K_USERS, JSON.stringify(u)); }
  function loadShaCache() { try { return JSON.parse(lsGet(K_SHA) || '{}') || {}; } catch (e) { return {}; } }
  function loadSession() {
    var raw = lsGet(K_SESSION), store = 'local';
    if (!raw) { raw = ssGet(K_SESSION); store = 'session'; }
    if (!raw) return null;
    var j = null;
    try { j = JSON.parse(raw); } catch (e) { j = null; }
    if (!j || !j.id) return null;
    var exp = Number(j.expiresAt) || 0;
    if (store === 'local' && (!exp || exp <= Date.now())) return null;
    return { id: String(j.id), name: String(j.name || j.id), role: String(j.role || 'viewer'), store: store, expiresAt: exp };
  }
  function clearSession() { lsDel(K_SESSION); ssDel(K_SESSION); }

  function defaultDeviceName() {
    var ua = navigator.userAgent || '';
    var dev = /iPhone/.test(ua) ? '아이폰'
      : /iPad/.test(ua) ? '아이패드'
        : /Android/.test(ua) ? '안드로이드 폰'
          : /Macintosh/.test(ua) ? '맥'
            : /Windows/.test(ua) ? '윈도우 PC'
              : '브라우저';
    var br = /Edg\//.test(ua) ? 'Edge'
      : /Chrome\//.test(ua) ? 'Chrome'
        : /Safari\//.test(ua) ? 'Safari'
          : /Firefox\//.test(ua) ? 'Firefox' : '';
    return br ? dev + ' · ' + br : dev;
  }
  function ensureDeviceId() {
    var id = String(lsGet(K_DEVID) || '').trim();
    if (!/^[a-f0-9]{16,64}$/.test(id)) { id = randomHex(16); lsSet(K_DEVID, id); }
    S.deviceId = id;
    S.deviceName = defaultDeviceName();
    return id;
  }

  /* ============ GitHub Contents API ============ */
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + (token || (S.conn && S.conn.token) || ''),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function repoBase(repo) { return API_BASE + '/repos/' + encodeURIComponent(S.conn.owner) + '/' + encodeURIComponent(repo); }
  function encPath(path) { return String(path || '').split('/').map(encodeURIComponent).join('/'); }
  function shaKey(repo, path) { return repo + '::' + path; }

  async function ghGetAt(repo, path, token) {
    var url = repoBase(repo) + '/contents/' + encPath(path) + '?ref=' + encodeURIComponent((S.conn && S.conn.branch) || 'main') + '&_=' + Date.now();
    try {
      var res = await window.fetch(url, { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 404) return { ok: true, missing: true };
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var j = await res.json();
      if (Object.prototype.toString.call(j) === '[object Array]') return { ok: true, list: j };
      var text = j && j.content ? b64decodeUtf8(j.content) : '';
      if (j && j.sha) S.sha[shaKey(repo, path)] = j.sha;
      return { ok: true, raw: text, sha: j && j.sha };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghGetJson(repo, path, token) {
    var r = await ghGetAt(repo, path, token);
    if (!r.ok || r.missing || r.list) return r;
    var data = null;
    try { data = JSON.parse(r.raw); } catch (e) { data = null; }
    r.data = data;
    return r;
  }

  async function ghPutAt(repo, path, text, message, token) {
    var payload = {
      message: message || ('업데이트: ' + path),
      content: b64encodeUtf8(String(text)),
      branch: (S.conn && S.conn.branch) || 'main'
    };
    var known = S.sha[shaKey(repo, path)];
    if (known) payload.sha = known;
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var res = await window.fetch(repoBase(repo) + '/contents/' + encPath(path), {
          method: 'PUT', headers: ghHeaders(token), body: JSON.stringify(payload)
        });
        if (res.ok) {
          var j = await res.json();
          if (j && j.content && j.content.sha) S.sha[shaKey(repo, path)] = j.content.sha;
          return { ok: true };
        }
        if (res.status === 409 || res.status === 422 || res.status === 404) {
          var cur = await ghGetAt(repo, path, token);
          if (!cur.ok) return { ok: false, status: cur.status, error: cur.error };
          if (cur.missing) delete payload.sha;
          else payload.sha = cur.sha;
          continue;
        }
        if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
        if (res.status === 403) return { ok: false, status: 403, error: '쓰기 권한이 없어요' };
        return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
      }
    }
    return { ok: false, status: 409, error: '다른 기기에서 먼저 저장했어요' };
  }

  /* ============ 가족 공유 AI 설정 암호화 (AES-GCM · PBKDF2) ============ */
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  function familyPass() {
    var c = S.conn || {};
    return String(c.owner || '').toLowerCase() + '/' + String(c.repo || '').toLowerCase() + '::jadenfamily-ai-v1';
  }
  async function familyKey(salt, iter) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 암호화를 쓸 수 없어요');
    var raw = new TextEncoder().encode(familyPass());
    if (!salt) {
      var d = await sub.digest('SHA-256', raw);
      return sub.importKey('raw', d, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }
    var base = await sub.importKey('raw', raw, { name: 'PBKDF2' }, false, ['deriveKey']);
    return sub.deriveKey({ name: 'PBKDF2', salt: salt, iterations: Math.max(1, Number(iter) || 1), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function familyEncrypt(obj) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 암호화를 쓸 수 없어요');
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));

    msg[0] = (hi >>> 24) & 255; msg[1] = (hi >>> 16) & 255; msg[2] = (hi >>> 8) & 255; msg[3] = hi & 255;
    msg[4] = (lo >>> 24) & 255; msg[5] = (lo >>> 16) & 255; msg[6] = (lo >>> 8) & 255; msg[7] = lo & 255;
    var key = await sub.importKey('raw', b32decode(secret), { name: 'HMAC', hash: { name: 'SHA-1' } }, false, ['sign']);
    var mac = new Uint8Array(await sub.sign('HMAC', key, msg));
    var off = mac[mac.length - 1] & 15;
    var num = ((mac[off] & 127) << 24) | (mac[off + 1] << 16) | (mac[off + 2] << 8) | mac[off + 3];
    var code = String(num % Math.pow(10, TOTP_DIGITS));
    while (code.length < TOTP_DIGITS) code = '0' + code;
    return code;
  }
  async function totpVerify(secret, code, atMs) {
    var c = String(code == null ? '' : code).replace(/\D/g, '');
    if (c.length !== TOTP_DIGITS || !secret) return false;
    var base = atMs == null ? Date.now() : Number(atMs);
    for (var d = -1; d <= 1; d++) {
      try {
        if (await totpAt(secret, base + d * TOTP_PERIOD * 1000) === c) return true;
      } catch (e) { return false; }
    }
    return false;
  }
  async function totpKek(secret, salt, iter) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 인증 기능을 쓸 수 없어요');
    var raw = new TextEncoder().encode('jadenfamily-totp-v1:' + String(secret || '').toUpperCase());
    var base = await sub.importKey('raw', raw, { name: 'PBKDF2' }, false, ['deriveKey']);
    return sub.deriveKey({
      name: 'PBKDF2', salt: salt, iterations: clamp(Number(iter) || TOTP_ITER, 10000, 1000000), hash: 'SHA-256'
    }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  function totpAad(userId) { return new TextEncoder().encode('totp:' + String(userId)); }
  async function wrapChatKey(secret, key, userId, iter) {
    var sub = subtle();
    var raw = new Uint8Array(await sub.exportKey('raw', key));
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var kek = await totpKek(secret, salt, iter);
    var ct = await sub.encrypt({ name: 'AES-GCM', iv: iv, additionalData: totpAad(userId) }, kek, raw);
    return { kdf: 'PBKDF2-SHA256', kdfIter: clamp(Number(iter) || TOTP_ITER, 10000, 1000000), salt: b64enc(salt), iv: b64enc(iv), wrappedKey: b64enc(ct) };
  }
  async function unwrapChatKey(cfg) {
    var sub = subtle();
    if (!cfg || !cfg.secret || !cfg.wrappedKey) throw new Error('2차 인증 열쇠가 없어요');
    var kek = await totpKek(cfg.secret, b64dec(cfg.salt), cfg.kdfIter);
    var raw = await sub.decrypt({ name: 'AES-GCM', iv: b64dec(cfg.iv), additionalData: totpAad(cfg.userId) }, kek, b64dec(cfg.wrappedKey));
    return sub.importKey('raw', new Uint8Array(raw), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  }

  function totpSeen(userId) {
    var j = null;
    try { j = JSON.parse(lsGet(K_TOTP_SEEN) || '{}'); } catch (e) { j = null; }
    return !!(j && j[userId]);
  }
  function rememberTotpSeen(userId, on) {
    var j = null;
    try { j = JSON.parse(lsGet(K_TOTP_SEEN) || '{}'); } catch (e) { j = null; }
    if (!j || typeof j !== 'object') j = {};
    j[userId] = !!on;
    lsSet(K_TOTP_SEEN, JSON.stringify(j));
  }

  async function loadTotpConfig(userId) {

    }

    var cfg = r.data || null;

  }
  async function saveTotpConfig(cfg) {

    return w.ok ? { ok: true } : { ok: false, error: w.error || '2차 인증 설정을 저장하지 못했어요' };
  }

  /* 켜기: 열쇠 만들기 → QR·열쇠 보여 주기 → 번호 한 번 확인 → 저장 */
  function totpBeginSetup() {
    if (!S.me) return;

    S.totpMsg = '';

  async function totpConfirmSetup() {
    var setup = S.totpSetup;

    var code = String(fieldVal('totpSetupCode')).replace(/\D/g, '');
    if (code.length !== TOTP_DIGITS) { S.totpMsg = '인증 앱에 뜬 6자리 번호를 넣어 주세요.'; renderSettings(); return; }
    if (!S.chatKey) { S.totpMsg = '대화 열쇠가 없어 2차 인증을 켤 수 없어요. 다시 열고 시도해 주세요.'; renderSettings(); return; }
    if (!(await totpVerify(setup.secret, code))) {
      S.totpMsg = '번호가 맞지 않아요. 인증 앱의 최신 번호를 넣어 주세요.';
      renderSettings();
      return;
    }
    S.totpMsg = '저장하는 중…';
    renderSettings();
    try {
      var w = await wrapChatKey(setup.secret, S.chatKey, S.me.id, TOTP_ITER);
      var cfg = {
        version: 1, userId: S.me.id, enabled: true,
        alg: 'SHA1', digits: TOTP_DIGITS, period: TOTP_PERIOD,
        secret: setup.secret, issuer: TOTP_ISSUER, label: totpLabel(S.me.id),
        kdf: w.kdf, kdfIter: w.kdfIter, salt: w.salt, iv: w.iv, wrappedKey: w.wrappedKey,
        chatSalt: S.chatSalt ? b64enc(S.chatSalt) : '', chatIter: S.chatIter,
        createdAt: nowIso(), updatedAt: nowIso()
      };
      var saved = await saveTotpConfig(cfg);
      if (!saved.ok) { S.totpMsg = saved.error; renderSettings(); return; }
      S.totp = { ok: true, present: true, enabled: true, cfg: cfg };
      S.totpSetup = null;
      S.totpMsg = '2차 인증을 켰어요. 다음부터는 6자리 번호만으로 열려요.';
      renderSettings();
      toast('2차 인증을 켰어요.');
    } catch (e) {
      S.totpMsg = '2차 인증을 켜지 못했어요. ' + (e && e.message ? e.message : '');
      renderSettings();
    }
  }
  async function totpDisableSubmit() {
    if (!S.totp || !S.totp.enabled) return;
    var code = String(fieldVal('totpOffCode')).replace(/\D/g, '');
    var pw = fieldVal('totpOffPw');
    var ok = false;
    if (code.length === TOTP_DIGITS) ok = await totpVerify(S.totp.cfg && S.totp.cfg.secret, code);
    else if (pw) {
      await freshUsers();
      var u = findUser(S.me.id);
      ok = !!(u && u.salt && u.hash && (await hashPassword(pw, u.salt)) === u.hash);
    }
    if (!ok) {
      S.totpMsg = (code || pw) ? '번호나 비밀번호가 맞지 않아요.' : '6자리 번호나 계정 비밀번호를 넣어 주세요.';
      renderSettings();
      return;
    }
    S.totpMsg = '끄는 중…';

  }
  function totpCopySecret() {
    var secret = S.totpSetup ? S.totpSetup.secret : '';
    if (!secret) return;
    function done() { toast('열쇠를 복사했어요.'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = secret;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) { toast('복사하지 못했어요. 열쇠를 길게 눌러 직접 복사해 주세요.'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(secret).then(done).catch(fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  /* 비밀번호로 열었을 때 2차 인증 열쇠를 지금 열쇠에 맞춰 조용히 다시 감싸요 */
  async function rewrapTotpKey() {
    if (!S.totp || !S.totp.enabled || !S.totp.cfg || !S.chatKey) return false;
    var cfg = S.totp.cfg;
    try {
      var cur = await unwrapChatKey(cfg);
      var a = new Uint8Array(await subtle().exportKey('raw', cur));
      var b = new Uint8Array(await subtle().exportKey('raw', S.chatKey));
      var same = a.length === b.length;
      for (var i = 0; same && i < a.length; i++) if (a[i] !== b[i]) same = false;
      if (same) return true;
    } catch (e) { /* 아래에서 새로 감싸요 */ }
    try {
      var w = await wrapChatKey(cfg.secret, S.chatKey, cfg.userId, Number(cfg.kdfIter) || TOTP_ITER);
      cfg.kdf = w.kdf; cfg.kdfIter = w.kdfIter; cfg.salt = w.salt; cfg.iv = w.iv; cfg.wrappedKey = w.wrappedKey;
      if (S.chatSalt) cfg.chatSalt = b64enc(S.chatSalt);
      cfg.chatIter = S.chatIter;
      cfg.updatedAt = nowIso();
      var r = await saveTotpConfig(cfg);
      if (r.ok) S.totp.cfg = cfg;
      return !!r.ok;
    } catch (e) { return false; }
  }

  /* 등록된 기기 잠금 해제 · 새 기기 등록: 6자리 번호만으로 */
  async function unlockWithTotp(code, deviceName) {
    if (!S.me) return { ok: false, message: '계정을 확인하지 못했어요.' };
    var cfgRes = await loadTotpConfig(S.me.id);
    S.totp = cfgRes;
    if (!cfgRes.ok && !cfgRes.enabled) {
      return { ok: false, message: '2차 인증 설정을 읽지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.' };
    }
    if (!cfgRes.enabled) {
      return { ok: false, message: '2차 인증이 꺼져 있어요. 비밀번호로 열어 주세요.', needsPassword: true };
    }
    var cfg = cfgRes.cfg;
    if (!(await totpVerify(cfg.secret, code))) {
      return { ok: false, message: '번호가 맞지 않아요. 인증 앱의 최신 6자리를 넣어 주세요.' };
    }
    var key;
    try { key = await unwrapChatKey(cfg); }
    catch (e) { return { ok: false, message: '인증은 확인했지만 대화 열쇠를 풀지 못했어요. 비밀번호로 열어 주세요.', needsPassword: true }; }

    S.chatKey = key;
    S.chatSalt = cfg.chatSalt ? b64dec(cfg.chatSalt) : window.crypto.getRandomValues(new Uint8Array(16));
    S.chatIter = clamp(Number(cfg.chatIter) || CHAT_ITER, 1000, 1000000);

    var envRes = await readThreadsEnvelope();
    if (!envRes.ok) { S.chatKey = null; return { ok: false, message: envRes.error || '대화 보관함을 확인하지 못했어요.' }; }
    if (envRes.env) {
      S.chatSalt = b64dec(envRes.env.salt);
      S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      try { await chatDecrypt(envRes.env); }
      catch (e) {
        S.chatKey = null;
        return { ok: false, message: '인증은 확인했지만 대화를 열지 못했어요. 비밀번호로 열고 2차 인증을 다시 켜 주세요.', needsPassword: true };
      }
    }
    S.unlocked = true;
    await cacheUnlock('', S.chatSalt, S.chatIter);
    if (S.gateMode === 'device') {
      var reg = await registerDevice(deviceName);
      if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
    }
    return { ok: true };
  }

  async function submitGateTotp() {
    if (S.gateBusy) return;
    var code = String(fieldVal('gateTotp')).replace(/\D/g, '');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateTotpBtn');
    if (code.length !== TOTP_DIGITS) return gateFail('인증 앱에 뜬 6자리 번호를 넣어 주세요.');
    S.gateBusy = true;
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      var r = await unlockWithTotp(code, name);
      if (!r.ok) {
        gateFail(r.message || '열지 못했어요.');
        if (r.needsPassword) { S.gateAlt = true; renderGate(); gateFail(r.message || ''); }
        return;
      }
      await enterChat();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      S.gateBusy = false;
      var b2 = document.getElementById('gateTotpBtn');
      if (b2) { b2.disabled = false; b2.textContent = S.gateMode === 'device' ? '이 기기 등록하고 열기' : '열기'; }
    }
  }

  /* ============ 등록된 기기 ============ */
  async function loadDevices() {
    var r = await ghGetJson(DEFAULT_REPO, PATH_DEVICES, null);
    if (!r.ok) return { ok: false, error: r.error || '기기 목록을 읽지 못했어요', devices: [] };
    if (r.missing) return { ok: true, missing: true, devices: [] };
    var list = (r.data && Object.prototype.toString.call(r.data.devices) === '[object Array]') ? r.data.devices : [];
    return { ok: true, devices: list, sha: r.sha };
  }
  function deviceKnown(devices, deviceId, userId) {
    for (var i = 0; i < devices.length; i++) {
      var d = devices[i] || {};
      if (String(d.id) === String(deviceId) && String(d.userId) === String(userId)) return d;
    }
    return null;
  }
  async function registerDevice(name) {
    var cur = await loadDevices();
    if (!cur.ok) return { ok: false, error: cur.error };
    var list = cur.devices.slice();
    var found = deviceKnown(list, S.deviceId, S.me.id);
    var rec = {
      id: S.deviceId,
      userId: S.me.id,
      name: String(name || S.deviceName || '이 기기').slice(0, 40),
      at: found ? found.at : nowIso(),
      lastSeen: nowIso(),
      ua: String(navigator.userAgent || '').slice(0, 180)
    };
    if (found) {
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].id) === String(S.deviceId) && String(list[i].userId) === String(S.me.id)) { list[i] = rec; break; }
      }
    } else {
      list.push(rec);
    }
    var body = { version: 1, updatedAt: nowIso(), devices: list };
    var w = await ghPutAt(DEFAULT_REPO, PATH_DEVICES, JSON.stringify(body, null, 2), (found ? 'AI 비서 챗 기기 확인: ' : 'AI 비서 챗 새 기기 등록: ') + rec.name, null);
    if (!w.ok) return { ok: false, error: w.error || '기기 등록을 저장하지 못했어요' };
    return { ok: true, device: rec };
  }
  async function revokeDevice(id) {
    var cur = await loadDevices();
    if (!cur.ok) return { ok: false, error: cur.error };
    var list = [];
    for (var i = 0; i < cur.devices.length; i++) if (String(cur.devices[i].id) !== String(id)) list.push(cur.devices[i]);
    var body = { version: 1, updatedAt: nowIso(), devices: list };
    var w = await ghPutAt(DEFAULT_REPO, PATH_DEVICES, JSON.stringify(body, null, 2), 'AI 비서 챗 기기 해제', null);
    if (!w.ok) return { ok: false, error: w.error };
    return { ok: true, devices: list };
  }

  /* ============ AI 설정 (config/ai.json) ============ */
  /* ---------- 제공자별 열쇠 여러 개 (한도에 걸리면 다음 열쇠로) ---------- */
  function emptyKeys() { return { gemini: [], openrouter: [], groq: [] }; }
  function normalizeKeys(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var v = String(list[i] == null ? '' : list[i]).trim();
      if (v && out.indexOf(v) < 0) out.push(v);
    }
    return out;
  }
  function keysFromConfig(obj) {
    var keys = emptyKeys(), active = { gemini: 0, openrouter: 0, groq: 0 };
    for (var i = 0; i < PROVIDER_ORDER.length; i++) {
      var pid = PROVIDER_ORDER[i];
      var arr = obj[pid + 'Keys'];
      var list = (Object.prototype.toString.call(arr) === '[object Array]') ? normalizeKeys(arr) : [];
      if (!list.length) {
        var single = String((pid === 'gemini' ? (obj.key || obj.gemini) : obj[pid]) || '').trim();
        if (single) list = [single];
      }
      keys[pid] = list;
    }
    var act = (obj && obj.activeKey) || {};
    for (i = 0; i < PROVIDER_ORDER.length; i++) {
      var p2 = PROVIDER_ORDER[i];
      var n = Number(act[p2]);
      active[p2] = (n >= 0 && n < keys[p2].length) ? n : 0;
    }
    return { keys: keys, active: active };
  }
  function keyList(pid) {
    if (!S.ai.keys) S.ai.keys = emptyKeys();
    if (!S.ai.keys[pid]) S.ai.keys[pid] = [];
    return S.ai.keys[pid];
  }
  function activeIndex(pid) {
    var l = keyList(pid);
    var i = Number(S.ai.active && S.ai.active[pid]);
    if (isNaN(i) || i < 0 || i >= l.length) i = 0;
    return i;
  }
  function setActiveKey(pid, i) {
    if (!S.ai.active) S.ai.active = {};
    S.ai.active[pid] = i;
    saveKeyState();
    renderModelBtn();
  }
  function maskKey(k) {
    var t = String(k || '');
    if (t.length <= 4) return '····';
    return '····' + t.slice(-4);
  }
  function keyLimitUntil(pid, i) {
    var m = (S.keyLimit && S.keyLimit[pid]) || {};
    return Number(m[i]) || 0;
  }
  function clearKeyLimit(pid, i) {
    if (S.keyLimit && S.keyLimit[pid] && S.keyLimit[pid][i]) { delete S.keyLimit[pid][i]; saveKeyState(); }
  }
  function markKeyLimited(pid, i, res) {
    if (!S.keyLimit) S.keyLimit = {};
    if (!S.keyLimit[pid]) S.keyLimit[pid] = {};
    var h = (res && res.headers) || {};
    var wait = parseDur(h['retry-after']);
    if (wait == null) wait = 60000;
    S.keyLimit[pid][i] = Date.now() + clamp(wait, 1000, 86400000);
    saveKeyState();
  }
  function loadKeyState() {
    var j = null;
    try { j = JSON.parse(lsGet(K_KEYSTATE) || 'null'); } catch (e) { j = null; }
    S.keyLimit = (j && j.limit && typeof j.limit === 'object') ? j.limit : {};
    if (j && j.active && typeof j.active === 'object' && S.ai && S.ai.active) {
      for (var i = 0; i < PROVIDER_ORDER.length; i++) {
        var pid = PROVIDER_ORDER[i], n = Number(j.active[pid]);
        if (!isNaN(n) && n >= 0 && n < keyList(pid).length) S.ai.active[pid] = n;
      }
    }
  }
  function saveKeyState() {
    lsSet(K_KEYSTATE, JSON.stringify({ active: (S.ai && S.ai.active) || {}, limit: S.keyLimit || {} }));
  }

  async function loadAiConfig() {
    var r = await ghGetJson(DEFAULT_REPO, PATH_AI, null);
    if (!r.ok) return { ok: false, error: r.error || 'AI 설정을 읽지 못했어요' };
    if (r.missing) {
      S.ai = { gemini: '', openrouter: '', groq: '', codeToken: '', at: 0, present: false, keys: emptyKeys(), active: { gemini: 0, openrouter: 0, groq: 0 } };
      loadKeyState();
      return { ok: true, missing: true };
    }
    var obj = null;
    try { obj = await familyDecrypt(r.data); } catch (e) { obj = null; }
    if (!obj) {
      S.ai = { gemini: '', openrouter: '', groq: '', codeToken: '', at: 0, present: true, error: '설정을 열지 못했어요', keys: emptyKeys(), active: { gemini: 0, openrouter: 0, groq: 0 } };
      return { ok: true, locked: true };
    }
    var kc = keysFromConfig(obj);
    S.ai = {
      gemini: kc.keys.gemini[0] || '',
      openrouter: kc.keys.openrouter[0] || '',
      groq: kc.keys.groq[0] || '',
      codeToken: String(obj.codeToken || ''),
      at: Date.parse(obj.updatedAt || '') || 0,
      present: true,
      keys: kc.keys,
      active: kc.active
    };
    loadKeyState();
    return { ok: true };

        else { var dd = Date.parse(xr); if (!isNaN(dd)) reset = dd; }
      }
    }
    if (!reset) {
      var rd = /"retryDelay"\s*:\s*"([^"]+)"/.exec(body);
      if (rd) { var ms = parseDur(rd[1]); if (ms != null) reset = Date.now() + ms; }
    }
    var quotaWord = /quota|per day|daily|exceeded your current quota|free-models-per-day|billing/i.test(body);
    if (quotaWord) kind = 'quota';
    if (kind === 'quota' && !reset) {
      if (pid === 'gemini') reset = nextMidnightInZone('America/Los_Angeles');
      else if (pid === 'openrouter') reset = nextMidnightUTC();
      else reset = Date.now() + 3600000;
    }
    if (kind === 'limited' && !reset) reset = Date.now() + 60000;
    S.limits[id] = { state: kind, resetAt: reset, at: Date.now(), note: body.slice(0, 160) };
    savePref();
  }

  function textFromErr(status, json, fallback) {
    var msg = '';
    try {
      if (json && json.error) msg = json.error.message || json.error.status || '';
      if (!msg && json && json.message) msg = json.message;
      if (!msg && json && json.detail) msg = json.detail;
    } catch (e) { msg = ''; }
    return msg || fallback || ('HTTP ' + status);
  }

  async function geminiCall(model, req, opts) {
    var key = (opts && opts.key) || providerKey('gemini');
    if (!key) return { ok: false, status: 0, error: 'Gemini 키가 없어요', headers: {} };
    var body = {
      systemInstruction: { parts: [{ text: req.system }] },
      contents: req.messages.map(function (m) {
        var parts = [{ text: String(m.text || '') }];
        var imgs = m.images || [], pdfs = m.pdfs || [], i;
        for (i = 0; i < imgs.length; i++) parts.push({ inlineData: { mimeType: imgs[i].mime, data: imgs[i].data } });
        for (i = 0; i < pdfs.length; i++) parts.push({ inlineData: { mimeType: 'application/pdf', data: pdfs[i].data } });
        return { role: m.role === 'assistant' ? 'model' : 'user', parts: parts };
      }),
      generationConfig: { temperature: 0.5, maxOutputTokens: (opts && opts.maxTokens) || 2048 }
    };
    var res, txt = '';
    try {
      res = await window.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(body),
        signal: (opts && opts.signal) || undefined
      });
      txt = await res.text();
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} };
    }
    var headers = headerMap(res);
    var json = null;
    try { json = JSON.parse(txt); } catch (e) { json = null; }
    noteResult('gemini', model, res.status, headers, txt);
    if (!res.ok) return { ok: false, status: res.status, error: textFromErr(res.status, json, 'HTTP ' + res.status), headers: headers, body: txt };
    var parts = (json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    var out = '';
    for (var i = 0; i < parts.length; i++) if (parts[i] && parts[i].text) out += parts[i].text;
    if (!out) {
      var block = json && json.promptFeedback && json.promptFeedback.blockReason;
      return { ok: false, status: res.status, error: block ? ('이 요청은 안전 정책으로 막혔어요 (' + block + ')') : '빈 답변이 왔어요', headers: headers, body: txt };
    }
    return { ok: true, status: res.status, text: out, headers: headers };
  }

  function openaiStyleCall(url, pid, extraHeaders) {
    return async function (model, req, opts) {
      var key = (opts && opts.key) || providerKey(pid);
      if (!key) return { ok: false, status: 0, error: PROVIDERS[pid].label + ' 키가 없어요', headers: {} };
      var msgs = [{ role: 'system', content: req.system }];
      for (var i = 0; i < req.messages.length; i++) {
        var m = req.messages[i];
        var imgs = m.images || [];
        var content = String(m.text || '');
        if (imgs.length) {
          content = [];
          if (m.text) content.push({ type: 'text', text: String(m.text) });
          for (var k = 0; k < imgs.length; k++) {
            content.push({ type: 'image_url', image_url: { url: 'data:' + imgs[k].mime + ';base64,' + imgs[k].data } });
          }
        }
        msgs.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: content });
      }
      var body = { model: model, messages: msgs, temperature: 0.5 };
      if (opts && opts.maxTokens) body.max_tokens = opts.maxTokens;
      var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key };
      for (var k in extraHeaders) if (Object.prototype.hasOwnProperty.call(extraHeaders, k)) headers[k] = extraHeaders[k];
      var res, txt = '';
      try {
        res = await window.fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: (opts && opts.signal) || undefined });
        txt = await res.text();
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} };
      }
      var hmap = headerMap(res);
      var json = null;
      try { json = JSON.parse(txt); } catch (e) { json = null; }
      noteResult(pid, model, res.status, hmap, txt);
      if (!res.ok) return { ok: false, status: res.status, error: textFromErr(res.status, json, 'HTTP ' + res.status), headers: hmap, body: txt };
      var out = '';
      try {
        var c = json.choices[0];
        out = (c && c.message && c.message.content) || '';
        if (Object.prototype.toString.call(out) === '[object Array]') {
          out = out.map(function (p) { return (p && p.text) || ''; }).join('');
        }
      } catch (e) { out = ''; }
      if (!String(out).trim()) return { ok: false, status: res.status, error: '빈 답변이 왔어요', headers: hmap, body: txt };
      return { ok: true, status: res.status, text: String(out), headers: hmap };
    };
  }

  async function listGemini() {
    var key = providerKey('gemini');
    if (!key) return [];
    var res = await window.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var j = await res.json();
    var ids = [], list = (j && j.models) || [];
    for (var i = 0; i < list.length; i++) {
      var m = list[i] || {};
      var id = String(m.name || '').replace(/^models\//, '');
      var methods = m.supportedGenerationMethods || [];
      if (methods.indexOf('generateContent') < 0) continue;
      if (!/^gemini-/.test(id)) continue;
      if (/(image|tts|live|transcribe|embedding|translate|omni|audio|robotics|computer-use|vision-last)/i.test(id)) continue;
      /* 단종된 옛 모델(1.x·2.0·2.5)은 목록에 올리지 않아요 */
      if (/^gemini-(1\.|2\.0|2\.5)/i.test(id)) continue;
      ids.push(id);
    }
    var pref = [], rest = [];
    for (var k = 0; k < ids.length; k++) { if (/(flash|hydrogen|pro)/i.test(ids[k])) pref.push(ids[k]); else rest.push(ids[k]); }
    return pref.concat(rest);
  }

  function applyEdits(text, edits) {
    var out = String(text), applied = [];
    for (var i = 0; i < edits.length && i < 20; i++) {
      var e = edits[i] || {};
      var oldS = String(e.old_string == null ? (e.find == null ? '' : e.find) : e.old_string);
      var newS = String(e.new_string == null ? (e.replace == null ? '' : e.replace) : e.new_string);
      if (!oldS) return { ok: false, error: (i + 1) + '번째 수정에 old_string이 없어요.' };
      var count = out.split(oldS).length - 1;
      if (!count) {
        return {
          ok: false,
          error: (i + 1) + '번째 수정: old_string을 파일에서 찾지 못했어요. search_code나 read_code_slice로 정확한 글자를 먼저 확인해 주세요.\n(찾던 글: ' + oldS.slice(0, 80).replace(/\n/g, '\\n') + ')'
        };
      }
      var idx = out.indexOf(oldS);
      if (e.replace_all) {
        out = out.split(oldS).join(newS);
        applied.push({ index: i + 1, count: count, all: true });
      } else {
        out = out.slice(0, idx) + newS + out.slice(idx + oldS.length);
        applied.push({ index: i + 1, count: 1, total: count });
      }
    }
    return { ok: true, text: out, applied: applied };
  }

  function toolByName(name) {
    for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].name === name) return TOOLS[i];
    return null;
  }

  function parseToolCall(text) {
    if (!text) return null;
    var m = /```[a-zA-Z]*\s*([\s\S]*?)```/g, x;
    while ((x = m.exec(text))) {
      var call = tryJsonTool(x[1].trim());
      if (call) return call;
    }
    return tryJsonTool(String(text).trim());
  }
  function tryJsonTool(s) {
    if (!s) return null;
    var j = null;
    try { j = JSON.parse(s); } catch (e) {
      var a = s.indexOf('{'), b = s.lastIndexOf('}');
      if (a >= 0 && b > a) { try { j = JSON.parse(s.slice(a, b + 1)); } catch (e2) { j = null; } }
    }
    if (!j || typeof j !== 'object') return null;
    var name = j.tool || j.name || j.tool_name;
    if (!name || !toolByName(String(name))) return null;
    var args = j.args || j.arguments || j.input || {};
    if (typeof args === 'string') { try { args = JSON.parse(args); } catch (e) { args = {}; } }
    return { name: String(name), args: (args && typeof args === 'object') ? args : {} };
  }

  /* ============ 3단계 자동 검사 ============ */
  var smokeWaiters = {};
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object' || !d.__chk) return;
    var arr = smokeWaiters[d.__chk];
    if (arr) arr.push(d);
  });

  function stepHtml(html) {
    var errs = [];
    if (!/<html[\s>]/i.test(html)) errs.push('<html> 태그가 없어요');
    if (!/<\/html>/i.test(html)) errs.push('</html> 닫는 태그가 없어요');
    var open = (html.match(/<script\b/gi) || []).length;
    var close = (html.match(/<\/script\s*>/gi) || []).length;
    if (open !== close) errs.push('<script> 여는 개수(' + open + ')와 닫는 개수(' + close + ')가 달라요');
    var doc = null;
    try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { errs.push('HTML을 해석하지 못했어요'); }
    if (doc) {
      if (doc.querySelector('parsererror')) errs.push('브라우저가 HTML 구조를 해석하지 못했어요');
      if (!doc.body || !doc.body.children.length) errs.push('화면에 그릴 내용(<body>)이 비어 있어요');
      var broken = doc.querySelectorAll('script:not([src])');
      for (var i = 0; i < broken.length; i++) { /* 구조 확인용 */ }
    }
    return { ok: !errs.length, errors: errs };
  }

  function stepScripts(html) {
    var errs = [];
    var re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, m, idx = 0;
    while ((m = re.exec(html))) {
      idx++;
      var attrs = m[1] || '';
      var code = m[2] || '';
      if (/\bsrc\s*=/.test(attrs)) continue;
      if (/type\s*=\s*["']?(?!text\/javascript|module|application\/javascript)/i.test(attrs)) continue;
      if (!code.trim()) continue;
      try {
        /* 컴파일만 하고 실행하지는 않아요 */
        new Function(code);
      } catch (e) {
        var line = guessLine(code, e);
        errs.push('스크립트 ' + idx + '번째: ' + (e && e.message ? e.message : '문법 오류') + (line ? ' (' + line + '번째 줄 근처)' : ''));
      }
    }
    return { ok: !errs.length, errors: errs };
  }
  function guessLine(code, e) {
    var m = /line\s+(\d+)/i.exec(String(e && e.message || ''));
    if (m) return m[1];
    var st = String(e && e.stack || '');
    var m2 = /<anonymous>:(\d+):(\d+)/.exec(st);
    return m2 ? m2[1] : '';
  }

  function stepRuntime(html) {
    return new Promise(function (resolve) {
      var token = 'chk' + randomHex(5);
      smokeWaiters[token] = [];
      var got = smokeWaiters[token];
      var iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.setAttribute('tabindex', '-1');
      iframe.style.cssText = 'position:fixed;left:-10000px;top:0;width:390px;height:800px;opacity:0;pointer-events:none;border:0;';
      var prelude = '<script>(function(){var T=' + JSON.stringify(token) + ';function send(o){o.__chk=T;try{parent.postMessage(o,"*")}catch(e){}}' +
        'window.addEventListener("error",function(e){send({k:"err",m:String((e&&e.message)||"스크립트 오류"),where:(e&&e.filename?String(e.filename)+" ":"")+((e&&e.lineno)||"")});},true);' +
        'window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;send({k:"rej",m:String((r&&(r.message||r))||"처리하지 못한 오류")});});' +
        'window.addEventListener("load",function(){setTimeout(function(){send({k:"done"})},30);});' +
        '})();<\/script>';
      var src = String(html);
      var headEnd = src.search(/<head[^>]*>/i);
      if (headEnd >= 0) {
        var gt = src.indexOf('>', headEnd);
        src = src.slice(0, gt + 1) + prelude + src.slice(gt + 1);
      } else {
        src = prelude + src;
      }
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        window.clearTimeout(timer);
        var errs = [];
        for (var i = 0; i < got.length; i++) {
          if (got[i].k === 'err') errs.push('실행 오류: ' + got[i].m + (got[i].where ? ' (' + got[i].where + ')' : ''));
          else if (got[i].k === 'rej') errs.push('처리하지 못한 오류: ' + got[i].m);
        }
        try { iframe.remove(); } catch (e) { /* 무시 */ }
        delete smokeWaiters[token];
        resolve({ ok: !errs.length, errors: errs });
      }
      var timer = window.setTimeout(finish, 3600);
      iframe.addEventListener('load', function () { window.setTimeout(finish, 900); });
      iframe.srcdoc = src;
      document.body.appendChild(iframe);
      window.setTimeout(function () {
        for (var i = 0; i < got.length; i++) if (got[i].k === 'done') { window.setTimeout(finish, 350); break; }
      }, 600);
    });
  }

  async function checkHtml(html) {
    var s1 = stepHtml(html);
    var s2 = stepScripts(html);
    var s3 = { ok: true, errors: [], skipped: true };
    if (s1.ok && s2.ok) s3 = await stepRuntime(html);
    var steps = [
      { key: 'html', name: '1단계 · HTML 구조 검사', ok: s1.ok, errors: s1.errors },
      { key: 'js', name: '2단계 · 스크립트 문법 검사', ok: s2.ok, errors: s2.errors },
      { key: 'runtime', name: '3단계 · 숨김 화면 실행 검사', ok: s3.ok, errors: s3.errors, skipped: !!s3.skipped }
    ];
    return { ok: s1.ok && s2.ok && s3.ok, steps: steps };
  }

  /* ============ 줄 비교(diff) ============ */
  function diffLines(a, b) {
    var A = String(a || '').split('\n'), B = String(b || '').split('\n');
    if (A.length > 1600) A = A.slice(0, 1600).concat(['… (앞부분만 비교)']);
    if (B.length > 1600) B = B.slice(0, 1600).concat(['… (앞부분만 비교)']);
    var n = A.length, m = B.length;
    var dp = [];
    for (var i = 0; i <= n; i++) { dp.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        dp[i][j] = (A[i] === B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var rows = [], i2 = 0, j2 = 0;
    while (i2 < n && j2 < m) {
      if (A[i2] === B[j2]) { rows.push({ t: ' ', s: A[i2] }); i2++; j2++; }
      else if (dp[i2 + 1][j2] >= dp[i2][j2 + 1]) { rows.push({ t: '-', s: A[i2] }); i2++; }
      else { rows.push({ t: '+', s: B[j2] }); j2++; }
    }
    while (i2 < n) { rows.push({ t: '-', s: A[i2] }); i2++; }
    while (j2 < m) { rows.push({ t: '+', s: B[j2] }); j2++; }
    /* 바뀐 곳 주변만 남기고 앞뒤는 2줄씩만 */
    var keep = [];
    for (var k = 0; k < rows.length; k++) {
      if (rows[k].t === ' ') continue;
      for (var d = Math.max(0, k - 2); d <= Math.min(rows.length - 1, k + 2); d++) keep[d] = 1;
    }
    var out = [], skipped = 0, added = 0, removed = 0;
    for (k = 0; k < rows.length; k++) {
      if (rows[k].t === '+') added++;
      if (rows[k].t === '-') removed++;
      if (!keep[k]) { skipped++; continue; }
      if (skipped) { out.push({ t: '·', s: '… ' + skipped + '줄 그대로 …' }); skipped = 0; }
      out.push(rows[k]);
      if (out.length > 260) { out.push({ t: '·', s: '… (나머지 생략)' }); break; }
    }
    return { rows: out, added: added, removed: removed };
  }

  async function submitGate() {
    var pw = fieldVal('gatePw');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateBtn');
    if (!pw) return gateFail('비밀번호를 넣어 주세요.');
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      await freshUsers();
      var u = findUser(S.me.id);
      if (!u || !u.salt || !u.hash) return gateFail('계정 정보를 확인하지 못했어요.');
      if (String(u.role) !== 'admin') return gateFail('관리자 계정만 열 수 있어요.');
      var hash = await hashPassword(pw, u.salt);
      if (hash !== u.hash) return gateFail('비밀번호가 맞지 않아요.');

      var envRes = await readThreadsEnvelope();
      if (!envRes.ok) return gateFail(envRes.error || '대화 보관함을 확인하지 못했어요.');
      if (envRes.env) {
        S.chatSalt = b64dec(envRes.env.salt);
        S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      } else {
        S.chatSalt = window.crypto.getRandomValues(new Uint8Array(16));
        S.chatIter = CHAT_ITER;
      }
      S.chatKey = await chatKeyFrom(pw, S.chatSalt, S.chatIter);
      if (envRes.env) {
        try { await chatDecrypt(envRes.env); }
        catch (e) { S.chatKey = null; return gateFail('이 계정의 대화를 열지 못했어요. 비밀번호를 다시 확인해 주세요.'); }
      }
      S.unlocked = true;
      await cacheUnlock(pw, S.chatSalt, S.chatIter);
      /* 비밀번호로 열었으니 2차 인증 열쇠도 지금 열쇠에 맞춰 조용히 맞춰 둬요 */
      if (S.totp && S.totp.enabled) await rewrapTotpKey();

      if (S.gateMode === 'device') {
        var reg = await registerDevice(name);
        if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
      }
      await enterChat();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = (btn.textContent === '확인하는 중…') ? '열기' : btn.textContent; }
    }
  }

  function mdText(t) {
    var s = esc(t);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, function (_, pre, u) {
      return pre + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
    var blocks = s.split(/\n{2,}/), html = '';
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b.trim()) continue;
      var lines = b.split('\n');
      var allList = true;
      for (var k = 0; k < lines.length; k++) if (lines[k].trim() && !/^\s*[-*]\s+/.test(lines[k])) allList = false;
      if (allList && lines.length) {
        var li = '';
        for (var j = 0; j < lines.length; j++) li += '<li>' + lines[j].replace(/^\s*[-*]\s+/, '') + '</li>';
        html += '<ul>' + li + '</ul>';
      } else {
        html += '<p>' + lines.join('<br>') + '</p>';
      }
    }
    return html;
  }
  function md(t) {
    var src = String(t || '');
    var re = /```([a-zA-Z0-9+#._-]*)\r?\n?([\s\S]*?)```/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += mdText(src.slice(last, m.index));
      out += '<pre><code>' + esc(String(m[2]).replace(/\n$/, '')) + '</code></pre>';
      last = m.index + m[0].length;
    }
    out += mdText(src.slice(last));
    return out || '<p></p>';
  }

    lines.push('```tool');
    lines.push('{"tool":"도구이름","args":{}}');
    lines.push('```');

      lines.push('- ' + TOOLS[i].name + ': ' + TOOLS[i].desc + ' args 형식: ' + TOOLS[i].argsHint);

    lines.push('- code_read는 200줄 이하의 작은 파일에만 쓴다. 650KB짜리 파일을 content로 통째로 쓰면 안 된다.');

    lines.push('- 저장과 배포는 도현님이 [저장]·[반영하기]를 눌러야만 실제로 일어난다. 네가 눌렀다고 말하지 않는다.');
    lines.push('- 비밀번호·토큰·API 키는 절대 답변에 쓰거나 물어보지 않는다.');
    lines.push('- 확인하지 않은 사실을 지어내지 않는다. 모르면 모른다고 말한다.');
    if (S.pref.instructions) {
      lines.push('');
      lines.push('[사용자 지침]');
      lines.push(String(S.pref.instructions).slice(0, 4000));
    }
    return lines.join('\n');

  function clipText(s, n) {
    var t = String(s || '');
    if (t.length <= n) return t;
    return t.slice(0, n) + '\n… (토큰을 아끼려고 앞부분만 남겼어요. 더 필요하면 다시 읽어 달라고 하세요)';
  }
  /* 최근 대화만 + 오래된 도구 결과는 잘라서 보내요 (모델을 바꿔도 토큰을 아껴요) */
  function buildHistory(t) {
    var msgs = [];
    for (var i = 0; i < t.messages.length; i++) {
      var mm = t.messages[i];
      if (mm && mm.text) msgs.push(mm);
    }
    var out = [], toolSeen = 0, budget = 42000;
    for (var k = msgs.length - 1; k >= 0 && out.length < 16; k--) {
      var m = msgs[k];
      var text = '';
      if (m.role === 'user') {
        text = m.kind === 'audio'
          ? ('[음성 메모 전사]\n' + String(m.text) + '\n\n이 음성 메모를 짧게 요약하고, 할 일·일정이 있으면 목록으로 뽑아 줘.')
          : String(m.text);
      } else if (m.role === 'assistant') {
        text = String(m.text);
      } else if (m.role === 'tool') {
        toolSeen++;
        var cap = toolSeen <= 2 ? 5000 : 600;
        text = '[도구 결과 ' + (m.tool || '') + ']\n' + clipText(m.text, cap);
      } else {
        continue;
      }
      if (text.length > budget) text = clipText(text, Math.max(600, budget));
      budget -= text.length;
      out.unshift({ role: (m.role === 'assistant') ? 'assistant' : 'user', text: text });
      if (budget <= 0) break;
    }
    return out;
  }

  function stripToolBlock(text) {
    return String(text || '').replace(/```[a-zA-Z]*\s*[\s\S]*?```/g, '').trim();
  }

  function errorText(pid, model, res) {
    var id = modelIdOf(pid, model);
    var info = limitInfo(id);
    var head = '';
    if (res.status === 429) head = '지금 이 모델은 요청 한도에 걸렸어요.';
    else if (res.status === 401 || res.status === 403) head = '키나 권한을 확인해야 해요.';
    else if (!res.status) head = '인터넷 연결을 확인해 주세요.';
    else if (isDeadModelError(res.status, res.error)) head = '이 모델은 더 이상 쓸 수 없어 목록에서 숨겼어요.';
    else head = 'AI 쪽에서 문제가 생겼어요.';
    var detail = res.error ? '\n(' + String(res.error).slice(0, 160) + ')' : '';
    var next = '';
    if (isDeadModelError(res.status, res.error)) next = '\n\n다른 모델로 바꿔서 다시 보내 주세요.';
    else if (info.left > 0) next = '\n\n**' + info.text + '** — ' + fmtLeft(info.left) + ' 뒤에 다시 쓸 수 있어요. 그동안 다른 모델로 바꿔서 이어서 하면 돼요.';
    else if (res.status === 429) next = '\n\n모델을 바꿔서 다시 보내 보세요.';
    return head + detail + next;
  }

  async function runAssistant(t, attach) {
    var id = currentModel();
    var sp = splitModelId(id);
    var pid = sp.pid && PROVIDERS[sp.pid] ? sp.pid : 'gemini';
    var model = sp.model || modelList(pid)[0];
    if (!hasKey(pid)) {
      addMsg(t, { role: 'assistant', error: true, model: id, text: PROVIDERS[pid].label + ' 키가 아직 없어요. ⚙️ 설정에서 무료 키를 넣어 주세요. (다른 제공자 키를 넣었다면 모델을 바꿔 주세요.)' });
      return;
    }
    for (var step = 0; step < 5; step++) {
      var msgs = buildHistory(t);
      if (attach && ((attach.images && attach.images.length) || (attach.pdfs && attach.pdfs.length))) {
        var lastMsg = msgs[msgs.length - 1];
        if (lastMsg && lastMsg.role === 'user') {
          if (attach.images && attach.images.length) lastMsg.images = attach.images;
          if (attach.pdfs && attach.pdfs.length) lastMsg.pdfs = attach.pdfs;
        }
      }
      attach = null; /* 그림·PDF는 첫 요청에만 붙여요 (토큰 절약) */
      var res = await callWithKeys(pid, model, { system: buildSystem(t), messages: msgs }, { signal: S.busy[t.id] && S.busy[t.id].signal });
      renderModelBtn();
      if (!res.ok) {
        /* 단종·없는 모델이면 목록에서 숨기고, 바로 쓸 수 있는 모델로 바꿔 이어서 답해요 */
        if (isDeadModelError(res.status, res.error)) {
          markDeadModel(id, res.error);
          var alt = nextUsableModel(id);
          if (alt && !t._modelSwitch) {
            t._modelSwitch = true;
            S.pref.model = alt;
            savePref();
            renderModelBtn();
            if (!document.getElementById('modelModal').hidden) renderModelModal();
            toast('이 모델은 더 이상 쓸 수 없어 ' + modelShort(alt) + '(으)로 바꿨어요.');
            return runAssistant(t, attach);
          }
          if (alt) { S.pref.model = alt; savePref(); renderModelBtn(); }
          addMsg(t, { role: 'assistant', error: true, model: id, text: errorText(pid, model, res) });
          return;
        }
        reviveDeadModel(id);
        addMsg(t, { role: 'assistant', error: true, model: id, text: errorText(pid, model, res) });
        return;
      }
      reviveDeadModel(id);
      var call = parseToolCall(res.text);
      if (!call) {
        addMsg(t, { role: 'assistant', text: res.text, model: id });
        return;
      }
      var plain = stripToolBlock(res.text);
      if (plain) addMsg(t, { role: 'assistant', text: plain, model: id });
      var out;
      try {
        out = await toolByName(call.name).run(call.args, { threadId: t.id });
      } catch (e) {
        out = { text: '도구를 실행하지 못했어요: ' + (e && e.message ? e.message : ''), label: '오류' };
      }
      addMsg(t, { role: 'tool', tool: call.name, label: out.label || call.name, text: out.text || '', card: out.card || null });
      if (S.active === t.id) renderThread();
      S.scrollNext = true;
      saveSoon();
    }
    addMsg(t, { role: 'assistant', text: '도구를 여러 번 쓰다가 잠시 멈췄어요. 조금 더 구체적으로 말씀해 주시면 이어서 할게요.' });
  }

  async function sendMessage(text) {
    var t = activeThread();
    if (!t) return;
    var body = String(text == null ? fieldVal('input') : text).trim();
    if (!body) return;
    if (S.busy[t.id]) { toast('이 대화방은 아직 답을 만들고 있어요. 다른 대화방을 쓰거나 조금 기다려 주세요.'); return; }
    if (!hasKey(splitModelId(currentModel()).pid)) {
      toast('먼저 ⚙️ 설정에서 AI 키를 넣어 주세요.');
      return;
    }
    S.scrollNext = true;
    addMsg(t, { role: 'user', text: body });
    if (!t.title || t.title === '새 대화') { t.title = body.slice(0, 22) + (body.length > 22 ? '…' : ''); }
    var input = document.getElementById('input');
    if (input) { input.value = ''; autoGrow(input); }
    renderThreadBar();
    if (S.active === t.id) renderThread();
    saveSoon();
    var ac = null;
    try { ac = new AbortController(); } catch (e) { ac = null; }
    S.busy[t.id] = { at: Date.now(), signal: ac ? ac.signal : undefined };
    renderThreadBar();
    if (S.active === t.id) renderThread();
    try {
      await runAssistant(t);
    } catch (e) {
      addMsg(t, { role: 'assistant', error: true, text: '답을 만드는 중에 문제가 생겼어요. ' + (e && e.message ? e.message : '') });
    } finally {
      delete S.busy[t.id];
      renderThreadBar();
      if (S.active === t.id) renderThread();
      renderModelBtn();
      saveSoon(0);
    }
  }

  /* 한도(429)에 걸리면 같은 제공자의 다음 열쇠로 이어서 보내요 */
  function keyOrder(pid) {
    var l = keyList(pid);
    if (l.length <= 1) return l.length ? [0] : [];
    var start = activeIndex(pid), out = [];
    for (var k = 0; k < l.length; k++) out.push((start + k) % l.length);
    var now = Date.now();
    out.sort(function (a, b) {
      var la = keyLimitUntil(pid, a), lb = keyLimitUntil(pid, b);
      var ea = la > now ? la : 0, eb = lb > now ? lb : 0;
      return ea - eb;
    });
    return out;
  }
  async function callWithKeys(pid, model, req, opts) {
    var prov = PROVIDERS[pid];
    var list = keyList(pid);
    if (!list.length || list.length === 1) {
      var single = list.length ? list[0] : '';
      var o0 = {}, k0;
      for (k0 in (opts || {})) o0[k0] = opts[k0];
      if (single) o0.key = single;
      var r0 = await prov.call(model, req, o0);
      if (r0 && r0.ok) clearKeyLimit(pid, 0);
      return r0;
    }
    var order = keyOrder(pid), last = null;
    for (var t = 0; t < order.length; t++) {
      var idx = order[t];
      var o = {}, kk;
      for (kk in (opts || {})) o[kk] = opts[kk];
      o.key = list[idx];
      var res = await prov.call(model, req, o);
      if (res && res.ok) {
        if (activeIndex(pid) !== idx) setActiveKey(pid, idx);
        clearKeyLimit(pid, idx);
        return res;
      }
      last = res;
      if (res && res.status === 429 && t < order.length - 1) {
        markKeyLimited(pid, idx, res);
        var label = PROVIDERS[pid].short || PROVIDERS[pid].label;
        toast(label + ' 키 ' + (idx + 1) + '이(가) 한도에 걸려 키 ' + (order[t + 1] + 1) + '(으)로 이어서 보냈어요.');
        continue;
      }
      if (res && res.status === 429) markKeyLimited(pid, idx, res);
      return res;
    }
    return last;
  }

    if (res.ok) {

  }
