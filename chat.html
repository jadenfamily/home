  /* ---------- 작업 단계를 사람이 읽는 요약으로 ---------- */
  var STEP_ICONS = ['🧠', '🔁', '⚡', '🔍', '📖', '📁', '✏️', '📊', '💾', '🔧', '⏳', '✓'];
  function fileBase(p) {
    var s = String(p || '').replace(/\/+$/, '');
    return s.split('/').pop() || s;
  }
  function shortQ(q) {
    var s = String(q == null ? '' : q).replace(/\s+/g, ' ').trim();
    return s.length > 30 ? s.slice(0, 30) + '…' : s;
  }
  /* 도구 한 단계: {ico, verb, sub} — 파일 이름·찾은 말·건수·줄 구간까지만, 생코드는 없음 */
  function toolStep(name, args, out) {
    var a = args || {};
    var info = (out && out.info) || {};
    var repo = a.repo ? normRepo(a.repo) : 'home';
    var path = info.path != null ? String(info.path) : normPath(repo, a.path);
    var f = fileBase(path);
    if (name === 'search_code') {
      var sub = f + ' · “' + shortQ(info.query != null ? info.query : a.query) + '”';
      if (info.hits != null) sub += info.hits ? ' ' + info.hits + '건' : ' 결과 없음';
      return { ico: '🔍', verb: '코드 검색', sub: sub };
    }
    if (name === 'read_code_slice') {
      var st = Number(info.start || a.start) || 1;
      var sub2 = f;
      if (info.end != null) sub2 += ' ' + st + '~' + info.end + '줄';
      else sub2 += ' ' + st + '줄부터';
      return { ico: '📖', verb: '코드 읽기', sub: sub2 };
    }
    if (name === 'code_read') return { ico: '📖', verb: '코드 읽기', sub: f + (info.total ? ' (' + info.total + '줄)' : '') };
    if (name === 'code_list') return { ico: '📁', verb: '파일 목록', sub: repo + (path ? '/' + path : '') };
    if (name === 'code_edit') return { ico: '✏️', verb: '코드 수정', sub: repo + '/' + f };
    if (name === 'family_data') return { ico: '📊', verb: '가족 데이터', sub: String(a.kind || 'summary') };
    if (name === 'family_save') return { ico: '💾', verb: '저장 제안', sub: String(a.path || '') };
    return { ico: '🔧', verb: String((out && out.label) || name || '도구'), sub: '' };
  }
  function normStep(s) {
    if (s && typeof s === 'object') {
      return { ico: String(s.ico || '•'), verb: String(s.verb || ''), sub: String(s.sub || ''), at: s.at, dur: s.dur };
    }
    var str = String(s == null ? '' : s).trim();
    var ico = '•';
    for (var k = 0; k < STEP_ICONS.length; k++) {
      if (str.indexOf(STEP_ICONS[k]) === 0) { ico = STEP_ICONS[k]; str = str.slice(STEP_ICONS[k].length).trim(); break; }
    }
    return { ico: ico, verb: str, sub: '', at: null, dur: null };
  }
  function stepText(s) {
    var n = normStep(s);
    return n.verb + (n.sub ? ' · ' + n.sub : '');
  }
  function stepDur(ms) {
    var d = Number(ms || 0);
    return d >= 1000 ? fmtSecs(d) : '';
  }

  function workStart(t) {
    if (!t) return;
    if (!S.work) S.work = {};
    if (S.work[t.id]) { workTimerStart(); return; }
    S.work[t.id] = { at: Date.now(), step: { ico: '🧠', verb: '답변 생각하는 중', sub: '' }, stepAt: Date.now(), steps: [], mark: t.messages.length };
    workTimerStart();
    if (S.active === t.id) renderThread();
  }
  /* quiet=true: 지금 하는 일만 바꾸고 타임라인 기록엔 안 남겨요("결과로 답 만드는 중" 같은 되돌이 단계) */
  function workStep(t, label, quiet, force) {
    if (!t) return;
    var w = S.work && S.work[t.id];
    if (!w || !label) return;
    var s = normStep(label);
    if (!s.verb && !s.sub) return;
    if (!force && w.step && stepText(w.step) === stepText(s)) return;
    if (w.step && w.step.verb && !w.stepQuiet) {
      w.steps.push({ ico: w.step.ico, verb: w.step.verb, sub: w.step.sub, at: w.stepAt, dur: Date.now() - w.stepAt });
    }
    w.step = s;
    w.stepQuiet = !!quiet;
    w.stepAt = Date.now();
    if (S.active === t.id) renderThread();
  }
  /* 도구 결과를 받은 뒤 지금 단계의 이름만 결과까지 담아 고쳐 써요(단계를 새로 만들지 않음) */
  function workRelabel(t, step) {
    if (!t) return;
    var w = S.work && S.work[t.id];
    if (!w || !step) return;
    var s = normStep(step);
    if (!s.verb) return;
    if (w.step && w.step.verb) {
      s.at = w.stepAt; w.step = s; w.stepQuiet = false;
    }
    if (S.active === t.id) renderThread();
  }
  function workLogHtml(w, liveStep) {
    var h = '<div class="work-log">';
    var steps = (w && w.steps) || [];
    for (var i = 0; i < steps.length; i++) {
      var s = normStep(steps[i]);
      var d = stepDur(s.dur);
      h += '<div class="w-line"><span class="w-ico" aria-hidden="true">' + esc(s.ico || '•') + '</span>' +
        '<span class="w-body"><span class="w-verb">' + esc(s.verb) + '</span>' +
        (s.sub ? '<span class="w-sub"> · ' + esc(s.sub) + '</span>' : '') + '</span>' +
        (d ? '<span class="w-d">' + d + '</span>' : '') + '</div>';
    }
    if (liveStep) {
      var c = normStep(liveStep);
      h += '<div class="w-line now"><span class="w-ico" aria-hidden="true">' + esc(c.ico === '•' ? '⏳' : c.ico) + '</span>' +
        '<span class="w-body"><span class="w-verb">' + esc(c.verb) + '</span>' +
        (c.sub ? '<span class="w-sub"> · ' + esc(c.sub) + '</span>' : '') + '</span>' +
        '<span class="w-d">진행 중</span></div>';
    }
    return h + '</div>';
  }
  function workChipHtml(t) {
    var w = S.work && S.work[t.id];
    if (!w) return '';
    var open = !!S.workOpen[t.id];
    return '<div class="work' + (open ? ' open' : '') + '">' +
      '<button class="work-head" type="button" data-act="work-toggle" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span aria-hidden="true">⚡</span><span class="w-txt">작업 중</span>' +
      '<span class="w-elapsed" id="workElapsed">⏱ ' + fmtElapsed(Date.now() - w.at) + '</span>' +
      '<span class="w-sep" aria-hidden="true">·</span>' +
      '<span class="w-do" id="workDo">' + esc(stepText(w.step || '')) + '</span>' +
      '<span class="w-caret" aria-hidden="true">' + (open ? '▴' : '▾') + '</span></button>' +
      (open ? workLogHtml(w, w.step) : '') + '</div>';
  }
  function workDoneHtml(m) {
    var w = m && m.work;
    if (!w || !w.steps || !w.steps.length) return '';
    var open = !!(S.logOpen && S.logOpen[m.id]);
    return '<div class="work done' + (open ? ' open' : '') + '">' +
      '<button class="work-head" type="button" data-act="work-log" data-id="' + esc(m.id) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span aria-hidden="true">✅</span><span class="w-txt">작업 내역</span>' +
      '<span class="w-sep" aria-hidden="true">·</span>' +
      '<span class="w-do">' + fmtSecs(Number(w.sec || 0) * 1000) + ' (' + w.steps.length + '단계)</span>' +
      '<span class="w-caret" aria-hidden="true">' + (open ? '▴' : '▾') + '</span></button>' +
      (open ? workLogHtml({ at: w.at || 0, steps: w.steps }, null) : '') + '</div>';
  }
  function workFinish(t) {
    if (!t) return null;
    var w = S.work && S.work[t.id];
    if (!w) return null;
    if (w.step && w.step.verb && !w.stepQuiet) {
      w.steps.push({ ico: w.step.ico, verb: w.step.verb, sub: w.step.sub, at: w.stepAt, dur: Date.now() - w.stepAt });
    }
    /* 도구를 한 번도 안 쓴 답변(그냥 대화)에는 작업 내역 칩을 붙이지 않아요 — 화면이 깔끔해야 해서 */
    var acted = false;
    for (var q = 0; q < w.steps.length; q++) {
      if (String(w.steps[q].ico || '') !== '🧠') { acted = true; break; }
    }
    var target = null;
    for (var i = t.messages.length - 1; i >= 0 && i >= (w.mark || 0); i--) {
      var m = t.messages[i];
      if (m.role === 'assistant' && !m.nudge) { target = m; break; }
    }
    if (!target) {
      for (var k = t.messages.length - 1; k >= 0; k--) {
        if (t.messages[k].role === 'assistant' && !t.messages[k].nudge) { target = t.messages[k]; break; }
      }
    }
    if (target && acted) target.work = { sec: Math.max(1, Math.round((Date.now() - w.at) / 1000)), steps: w.steps.slice(), at: w.at };
    delete S.work[t.id];
    workTimerStop();
    return target;
  }

  /* 도구가 남긴 짧은 안내 — 앞 세 줄까지만 */
  function noteText(s) {
    var t = String(s == null ? '' : s).replace(/\r/g, '');
    var lines = t.split('\n');
    var head = lines.slice(0, 3).join('\n');
    if (lines.length > 3) head += '\n…';
    if (head.length > 220) head = head.slice(0, 220) + '…';
    return head;
  }

  function msgHtml(m) {
    if (m.nudge) {
      return '<div class="nudge">🔄 말로만 하지 말고 바로 실행하도록 한 번 더 요청했어요</div>';
    }
    if (m.role === 'tool') {
      /* 생코드·데이터 원문은 본문에 쏟지 않아요. 카드(수정·저장 제안)와 짧은 안내만 보여 주고,
         무슨 일을 했는지는 위 작업 내역(세로 타임라인)에서 확인해요. */
      if (m.card) {
        return '<div class="tool-card"><div class="tool-head">' + (m.card.kind === 'edit' ? '✏️' : '💾') + ' ' +
          esc(m.label || m.tool || '도구') + '</div>' +
          (m.card.kind === 'edit' ? editCardHtml(m.card) : writeCardHtml(m.card)) + '</div>';
      }
      if (m.quiet || !m.text) return '';
      return '<div class="tool-note">' + esc(noteText(m.text)) + '</div>';
    }
    var me = m.role === 'user';
    var h = '<div class="msg ' + (me ? 'me' : 'bot') + '" data-mid="' + esc(m.id) + '">';
    if (!me) h += '<span class="av" aria-hidden="true">🤖</span>';
    h += '<div><div class="bubble' + (m.error ? ' err' : '') + '">' +
      (m.replyTo && m.replyTo.text
        ? '<div class="quoted">↩️ <b>' + esc(m.replyTo.role === 'user' ? '나' : 'AI 비서') + '</b> · ' + esc(snippet(m.replyTo.text, 120)) + '</div>'
        : '') +
      (m.attachments && m.attachments.length ? '<div class="msg-atts">' + m.attachments.map(function (a) {
        return '<span class="msg-att">' + iconOf(a.kind) + ' ' + esc(a.name) + (a.kind === 'text' && a.lines ? ' · ' + a.lines + '줄' : '') + '</span>';
      }).join('') + '</div>' : '') +
      (m.kind === 'audio' ? '<span class="audio-tag">🎧 ' + esc(m.audioName || '음성 메모') + (m.audioSize ? ' · ' + fmtSize(m.audioSize) : '') + (m.audioVia ? ' · ' + (m.audioVia === 'groq' ? 'Groq로 받아 적음' : 'Gemini로 정리') : '') + '</span>' : '') +
      md(m.text) + '</div>';
    var meta = [];
    if (m.model && !me) meta.push(modelShort(m.model));
    if (m.at) meta.push(fmtClock(Date.parse(m.at) || Date.now()));
    h += '<div class="under"><span class="meta-line">' + esc(meta.join(' · ')) + '</span>' +
      '<button class="reply-btn" type="button" data-act="reply" data-id="' + esc(m.id) + '" aria-label="이 메시지에 답장하기">↩️ 답장</button></div>';
    h += workDoneHtml(m);
    h += '</div></div>';
    return h;
  }

  /* ============ 맨 위로 · 맨 아래로 단추 ============ */
  /* 대화 칸 바로 아래(퀵 버튼·입력줄 위)에 뜨게 위치를 잡아요 */
  function placeJumpBtns() {
    var view = document.getElementById('threadView');
    var stack = document.getElementById('jumpStack');
    if (!view || !stack) return;
    var app = document.getElementById('appRoot');
    var vr = view.getBoundingClientRect();
    var ab = (app && app.getBoundingClientRect().bottom) || window.innerHeight;
    var gap = Math.round(ab - vr.bottom) + 10;
    if (!isFinite(gap) || gap < 8) gap = 84;
    stack.style.bottom = gap + 'px';
  }
  /* 넘치는 글이 있을 때만, 위·아래 끝에 닿았을 때만 보여요 */
  function updJumpBtns() {
    var view = document.getElementById('threadView');
    var top = document.getElementById('jumpTop');
    var bot = document.getElementById('jumpBottom');
    if (!view || !top || !bot) return;
    placeJumpBtns();
    var canScroll = view.scrollHeight > view.clientHeight + 24;
    var restBottom = view.scrollHeight - view.scrollTop - view.clientHeight;
    top.classList.toggle('show', canScroll && view.scrollTop > 24);
    bot.classList.toggle('show', canScroll && restBottom > 24);
  }
  function jumpThread(toTop) {
    var view = document.getElementById('threadView');
    if (!view) return;
    var y = toTop ? 0 : view.scrollHeight;
    try { view.scrollTo({ top: y, behavior: 'smooth' }); }
    catch (e) { view.scrollTop = y; }
    updJumpBtns();
  }

  function renderThread() {
    var view = document.getElementById('threadView');
    if (!view) return;
    var t = activeThread();
    if (!t) {
      view.innerHTML = '<div class="welcome"><div class="big">🤖</div><h2>새 대화를 시작해요</h2><p>대시보드 코드를 고치거나, 가족 데이터를 확인하거나, 그냥 수다를 떨 수도 있어요.</p></div>';
      updJumpBtns();
      return;
    }
    var nearBottom = (view.scrollHeight - view.scrollTop - view.clientHeight) < 120;
    var h = '';
    if (!t.messages.length) {
      h = '<div class="welcome"><div class="big">🤖</div><h2>무엇을 도와드릴까요?</h2>' +
        '<p>예: “냉파 화면에서 글자가 겹치는 부분 고쳐 줘”, “이번 달 지출 요약해 줘”, “홈에 새 카드 하나 추가해 줘”.</p></div>';
    }
    for (var i = 0; i < t.messages.length; i++) h += msgHtml(t.messages[i]);
    if (S.busy[t.id]) {
      if (S.work && S.work[t.id]) {
        /* 매 초 갱신되는 접이식 작업 상태 칩 (.typing은 예전 상태 확인용 빈 표시) */
        h += '<div class="msg bot workwrap" data-work="1"><span class="typing" aria-hidden="true"></span>' + workChipHtml(t) + '</div>';
      } else {
        h += '<div class="msg bot"><span class="av" aria-hidden="true">🤖</span><div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>';
      }
    }
    view.innerHTML = h;
    renderQuoteBar();
    if (nearBottom || S.scrollNext) { view.scrollTop = view.scrollHeight; S.scrollNext = false; }
    updJumpBtns();
  }

  /* ============ 도구 카드 동작 ============ */
  function addMsg(t, m) {
    if (!m.id) m.id = uid('m_');
    if (!m.at) m.at = nowIso();
    t.messages.push(m);
    t.updatedAt = nowIso();
    return m;
  }

  async function commitProposal(id) {
    var p = S.proposals[id];
    if (!p || p.state !== 'pending') return;
    if (!p.check || !p.check.ok) { toast('자동 검사에서 문제가 보여 반영할 수 없어요.'); return; }
    p.state = 'committing'; p.error = '';
    renderThread();
    var msg = 'AI 비서: ' + String(p.summary || '').slice(0, 60);
    var r = await ghPutAt(p.repo, p.path, p.content, msg, S.ai.codeToken);
    if (!r.ok) { p.state = 'pending'; p.error = r.error || '반영하지 못했어요'; toast('반영하지 못했어요'); renderThread(); return; }
    p.state = 'done';
    toast('저장소에 반영했어요! 실제 화면에는 1분쯤 뒤에 적용되니 잠시 후 새로고침해 주세요.');
    renderThread();
    saveSoon(0);
  }

  async function savePending(id) {
    var w = S.pending[id];
    if (!w || w.state === 'done') return;
    if (!w.path || w.data == null) { toast('저장할 내용이 없어요'); return; }
    w.state = 'saving'; w.error = '';
    renderThread();
    var r = await ghPutAt(DEFAULT_REPO, w.path, JSON.stringify(w.data, null, 2), 'AI 비서: ' + (w.reason || w.path), null);
    if (!r.ok) { w.state = 'pending'; w.error = r.error || '저장하지 못했어요'; toast('저장하지 못했어요'); renderThread(); return; }
    w.state = 'done';
    toast('저장했어요.');
    renderThread();
    saveSoon(0);
  }

  function cancelPending(id) {
    delete S.pending[id];
    renderThread();
    saveSoon(0);
  }

  function fixWithAi(id) {
    var p = S.proposals[id];
    if (!p) return;
    var t = findThread(p.thread) || activeThread();
    if (!t) return;
    S.active = t.id;
    var errs = [];
    if (p.check && p.check.steps) {
      for (var i = 0; i < p.check.steps.length; i++) {
        if (!p.check.steps[i].ok && p.check.steps[i].errors) errs = errs.concat(p.check.steps[i].errors);
      }
    }
    var text = '방금 제안한 ' + p.repo + '/' + p.path + ' 수정안에서 자동 검사 오류가 났어: ' + (errs.join(' / ') || '알 수 없는 오류') + '. 파일 전체를 다시 읽고 고쳐서 code_edit로 다시 제안해 줘.';
    renderThreadBar();
    renderThread();
    /* 사용자가 [AI에게 고쳐 달라고 하기]를 눌러 보낸 말이라 이미 승인된 이어가기로 봐요 */
    sendMessage(text, { approved: true });
  }

  /* ============ AI 대화 처리 ============ */
  function buildSystem(t) {
    var d = new Date();
    var lines = [];
    lines.push('너는 jadenfamily 가족의 AI 비서 "비서"다. 한국어로 짧고 분명하게, 실제로 도움이 되는 답을 한다.');
    lines.push('오늘은 ' + d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + '요일 ' + fmtClock(d.getTime()) + ' (한국 시간).');
    lines.push('지금 대화하는 사람: ' + (S.me.name || S.me.id) + ' (관리자).');
    var persona = personaOf(t);
    if (persona.role || persona.goal || persona.format) {
      lines.push('');
      lines.push('[이 대화방의 역할]');
      if (persona.role) lines.push('역할: ' + persona.role);
      if (persona.goal) lines.push('목적: ' + persona.goal);
      if (persona.format) lines.push('원하는 양식/규칙: ' + persona.format);
      lines.push('이 대화방의 모든 답변은 위 역할·목적·양식을 따른다.');
    }
    lines.push('');
    lines.push('[가족 대시보드]');
    lines.push('- 홈(가족 허브): jadenfamily/home — 허브 대문 화면은 index.html, AI 비서 챗 화면은 chat.html이야. 말풍선·설정 창·도구처럼 “챗” 기능은 chat.html이고, 대문 카드·계정 메뉴는 index.html이야.');
    lines.push('- 아이: kids-dashboard(index.html) / 냉파: fridge-dashboard(index.html) / 가계부: ledger-dashboard(index.html)');
    lines.push('- 데이터는 비공개 저장소(kids-dashboard-data)에 있어. 데이터는 family_data 도구로 읽고, 고칠 때는 family_save로 제안해.');
    lines.push('- 코드 도구에는 path를 반드시 적는다. path가 비면 home은 index.html을 뒤지니 chat.html 같은 다른 파일은 영영 못 찾는다. 예: {"repo":"home","path":"chat.html","query":".msg.bot"}');

        toast(fromShort + ' 한도/혼잡 → ' + modelShort(altBusyId) + '로 자동 전환했어요.');
        res = await callWithKeys(pid, model, { system: buildSystem(t), messages: msgs }, { signal: S.busy[t.id] && S.busy[t.id].signal });
      }
      renderModelBtn();
      if (!res.ok) {
        /* 단종·없는 모델이면 목록에서 숨기고, 바로 쓸 수 있는 모델로 바꿔 이어서 답해요 */
        if (isDeadModelError(res.status, res.error)) {
          markDeadModel(id, res.error);
          var alt = nextUsableModel(id);
          if (alt && !t._modelSwitch) {
            t._modelSwitch = true;
            S.pref.model = alt;
            savePref();
            renderModelBtn();
            if (!document.getElementById('modelModal').hidden) renderModelModal();
            toast('이 모델은 더 이상 쓸 수 없어 ' + modelShort(alt) + '(으)로 바꿨어요.');
            workStep(t, { ico: '🔁', verb: '모델 전환 재시도 중', sub: '' });
            return await runAssistant(t, attach);
          }
          if (alt) { S.pref.model = alt; savePref(); renderModelBtn(); }
          addMsg(t, { role: 'assistant', error: true, model: id, text: errorText(pid, model, res) });
          return;
        }
        reviveDeadModel(id);
        addMsg(t, { role: 'assistant', error: true, model: id, text: errorText(pid, model, res) });
        return;
      }
      reviveDeadModel(id);
      /* 1) 함수 도구(tool_calls) 응답을 먼저 보고, 2) 없으면 ```tool 블록을 살펴봐요 */
      var native = (res.toolCalls && res.toolCalls.length) ? res.toolCalls : null;
      var call = native ? null : parseToolCall(res.text);
      if (!native && !call) {
        /* 코드 편집자 모드에서 말로만 “찾아볼게요” 하고 멈추면 한 번만 다시 재촉해요
           (고칠 계획을 보이고 승인을 묻는 답변은 재촉하지 않아요) */
        if (!nudged && step === 0 && personaOf(t).preset === 'code' && willActByWords(res.text) && !asksForApproval(res.text)) {
          nudged = true;
          addMsg(t, { role: 'assistant', text: res.text, model: id });
          addMsg(t, { role: 'user', text: '말로만 하지 말고 지금 바로 읽기 도구를 호출해 확인해 주세요.', nudge: true });
          workStep(t, { ico: '🔁', verb: '다시 실행 요청 중', sub: '' });
          if (S.active === t.id) renderThread();
          S.scrollNext = true;
          saveSoon();
          continue;
        }
        addMsg(t, { role: 'assistant', text: res.text, model: id });
        return;
      }
      var plain = stripToolBlock(res.text);
      /* 도구를 부르는 중간 턴의 글은 아직 실제 결과가 아니에요. 말풍선으로 쌓지 않고
         작업 타임라인에 한 줄만 남겨요. (실패해도 완료된 것처럼 보이던 문제) */
      if (plain) workStep(t, { ico: '💬', verb: plainBrief(plain), sub: '' }, false, true);
      var todo = native || [call];
      for (var ti = 0; ti < todo.length; ti++) {
        var one = todo[ti] || {};
        var tool = toolByName(one.name);
        var out;
        if (!tool) {
          out = {
            text: '그런 도구는 없어요. 쓸 수 있는 도구는 ' + TOOLS.map(function (x) { return x.name; }).join(', ') + ' 예요.',
            label: '도구 이름 확인'
          };
        } else {
          /* 저장소 이름·경로가 전체 주소나 owner/repo로 와도 도구가 알아듣게 다듬어요 */
          var toolArgs = normalizeToolArgs(one.name, one.args || {});
          var gateState = GATE_TOOLS[one.name] ? approvalGateState(t) : null;
          if (gateState && !gateState.ok) {
            /* 승인 전에는 실제 편집·저장을 하지 않아요 (도구 결과만 돌려줘요) */
            blockedEdits++;
            out = approvalBlockedResult(gateState);
            workStep(t, { ico: '🚫', verb: '승인 확인 필요', sub: toolStep(one.name, toolArgs, null).sub }, false, true);
            workRelabel(t, { ico: '🚫', verb: '승인 확인 필요', sub: toolStep(one.name, toolArgs, null).sub + ' · 실행하지 않음' });
          } else {
            workStep(t, toolStep(one.name, toolArgs, null), false, true);
            try {
              out = await tool.run(toolArgs, { threadId: t.id });
            } catch (e) {
              out = { text: '도구를 실행하지 못했어요: ' + (e && e.message ? e.message : ''), label: '오류' };
            }
            workRelabel(t, toolStep(one.name, toolArgs, out));
          }
        }
        addMsg(t, { role: 'tool', tool: one.name, label: out.label || one.name, text: out.text || '', card: out.card || null, callId: one.id || '', quiet: !!out.quiet, info: out.info || null });
      }
      if (blockedEdits >= 3) {
        addMsg(t, { role: 'assistant', text: '승인을 받기 전에 바로 고치려고 해서 멈췄어요. 무엇을 어떻게 바꿀지 한 번 더 말씀해 주시면 그때 진행할게요.' });
        return;
      }
      workStep(t, { ico: '🧠', verb: '결과로 답 만드는 중', sub: '' }, true);
      if (S.active === t.id) renderThread();
      S.scrollNext = true;
      saveSoon();
    }
    addMsg(t, { role: 'assistant', text: '도구를 여러 번 쓰다가 잠시 멈췄어요. 조금 더 구체적으로 말씀해 주시면 이어서 할게요.' });
    } finally {
      workFinish(t);
      if (S.active === t.id) renderThread();
    }
  }

  async function sendMessage(text, opts) {
    var t = activeThread();
    if (!t) return;
    var body = String(text == null ? fieldVal('input') : text).trim();
    if (!body) return;
    if (S.busy[t.id]) { toast('이 대화방은 아직 답을 만들고 있어요. 다른 대화방을 쓰거나 조금 기다려 주세요.'); return; }
    if (!hasKey(splitModelId(currentModel()).pid)) {
      toast('먼저 ⚙️ 설정에서 AI 키를 넣어 주세요.');
      return;
    }
    S.scrollNext = true;
    touchActivity();
    var rq = (S.reply && S.reply[t.id]) ? S.reply[t.id] : null;
    var um = { role: 'user', text: body, replyTo: rq ? { id: rq.id, role: rq.role, text: rq.text } : null };
    if (opts && opts.approved) um.approved = true;
    addMsg(t, um);
    if (rq) { delete S.reply[t.id]; renderQuoteBar(); }
    if (!t.title || t.title === '새 대화') { t.title = body.slice(0, 22) + (body.length > 22 ? '…' : ''); }
    var input = document.getElementById('input');
    if (input) { input.value = ''; autoGrow(input); }
    renderThreadBar();
    if (S.active === t.id) renderThread();
    saveSoon();
    var ac = null;
    try { ac = new AbortController(); } catch (e) { ac = null; }
    S.busy[t.id] = { at: Date.now(), signal: ac ? ac.signal : undefined };
    renderThreadBar();
    if (S.active === t.id) renderThread();
    try {
      await runAssistant(t);
    } catch (e) {
      addMsg(t, { role: 'assistant', error: true, text: '답을 만드는 중에 문제가 생겼어요. ' + (e && e.message ? e.message : '') });
    } finally {
      delete S.busy[t.id];
      /* 답이 도착한 것도 ‘쓰고 있는 중’으로 봐요 */
      touchActivity();
      renderThreadBar();
      if (S.active === t.id) renderThread();
      renderModelBtn();
      saveSoon(0);
    }
  }

  /* 한도(429)에 걸리면 같은 제공자의 다음 열쇠로 이어서 보내요 */
  function keyOrder(pid) {
    var l = keyList(pid);
    if (l.length <= 1) return l.length ? [0] : [];
    var start = activeIndex(pid), out = [];
    for (var k = 0; k < l.length; k++) out.push((start + k) % l.length);
    var now = Date.now();
    out.sort(function (a, b) {
      var la = keyLimitUntil(pid, a), lb = keyLimitUntil(pid, b);
      var ea = la > now ? la : 0, eb = lb > now ? lb : 0;
      return ea - eb;
    });
    return out;
  }
  async function callWithKeys(pid, model, req, opts) {
    var prov = PROVIDERS[pid];
    var list = keyList(pid);
    if (!list.length || list.length === 1) {
      var single = list.length ? list[0] : '';
      var o0 = {}, k0;
      for (k0 in (opts || {})) o0[k0] = opts[k0];
      if (single) o0.key = single;
      var r0 = await prov.call(model, req, o0);
      if (r0 && r0.ok) clearKeyLimit(pid, 0);
      return r0;
    }
    var order = keyOrder(pid), last = null;
    for (var t = 0; t < order.length; t++) {
      var idx = order[t];
      var o = {}, kk;
      for (kk in (opts || {})) o[kk] = opts[kk];
      o.key = list[idx];
      var res = await prov.call(model, req, o);
      if (res && res.ok) {
        if (activeIndex(pid) !== idx) setActiveKey(pid, idx);
        clearKeyLimit(pid, idx);
        return res;
      }
      last = res;
      if (res && res.status === 429 && t < order.length - 1) {
        markKeyLimited(pid, idx, res);
        var label = PROVIDERS[pid].short || PROVIDERS[pid].label;
        toast(label + ' 키 ' + (idx + 1) + '이(가) 한도에 걸려 키 ' + (order[t + 1] + 1) + '(으)로 이어서 보냈어요.');
        continue;
      }
      if (res && res.status === 429) markKeyLimited(pid, idx, res);
      return res;
    }
    return last;
  }

  function keysCopy() {
    return { gemini: keyList('gemini').slice(), openrouter: keyList('openrouter').slice(), groq: keyList('groq').slice() };
  }
  function fixActiveKeys(keys) {
    for (var i = 0; i < PROVIDER_ORDER.length; i++) {
      var pid = PROVIDER_ORDER[i], n = (keys[pid] || []).length;
      var cur = Number(S.ai.active && S.ai.active[pid]) || 0;
      if (!S.ai.active) S.ai.active = {};
      S.ai.active[pid] = (cur >= 0 && cur < n) ? cur : 0;
    }
    saveKeyState();
  }
  async function persistKeys(keys, okMsg, codeToken) {
    S.settingsMsg = '저장하는 중…'; renderSettings();
    var r = await saveAiConfig({ keys: keys, codeToken: codeToken == null ? (S.ai.codeToken || '') : codeToken });
    S.settingsMsg = r.ok ? (okMsg || 'AI 키를 저장했어요.') : ('저장하지 못했어요: ' + (r.error || ''));
    if (r.ok) {
      fixActiveKeys(keys);
      renderSettings();
      renderModelBtn();
      refreshModels().then(function () { renderModelBtn(); if (!document.getElementById('modelModal').hidden) renderModelModal(); }).catch(function () { /* 무시 */ });
    } else {
      renderSettings();
    }
    toast(S.settingsMsg);
    return r;
  }
  async function saveKeys(clear) {
    var keys = clear ? emptyKeys() : keysCopy();
    if (!clear) {
      for (var i = 0; i < PROVIDER_ORDER.length; i++) {
        var pid = PROVIDER_ORDER[i], v = fieldVal('setKey_' + pid).trim();
        if (v && keys[pid].indexOf(v) < 0) keys[pid].push(v);
      }
    } else {
      S.keyLimit = {};
      if (S.ai.active) S.ai.active = { gemini: 0, openrouter: 0, groq: 0 };
      saveKeyState();
    }
    await persistKeys(keys, clear ? 'AI 키를 모두 지웠어요.' : 'AI 키를 저장했어요.', clear ? '' : null);
  }
  async function addProviderKey(pid) {
    if (!PROVIDERS[pid]) return;
    var v = fieldVal('setKey_' + pid).trim();
    if (!v) { S.settingsMsg = '넣을 키를 입력해 주세요.'; renderSettings(); return; }
    var keys = keysCopy();
    if (keys[pid].indexOf(v) >= 0) { S.settingsMsg = '이미 넣어 둔 키예요.'; renderSettings(); return; }
    keys[pid].push(v);
    await persistKeys(keys, PROVIDERS[pid].short + ' 키 ' + keys[pid].length + '개를 저장했어요.');
  }
  async function removeProviderKey(pid, i) {
    var keys = keysCopy();
    if (!keys[pid] || i < 0 || i >= keys[pid].length) return;
    keys[pid].splice(i, 1);
    var act = activeIndex(pid);
    if (act >= keys[pid].length) { S.ai.active[pid] = Math.max(0, keys[pid].length - 1); saveKeyState(); }
    if (S.keyLimit && S.keyLimit[pid]) { S.keyLimit[pid] = {}; saveKeyState(); }
    await persistKeys(keys, '키를 지웠어요.');
  }
  function useProviderKey(pid, i) {
    if (!keyList(pid)[i]) return;
    setActiveKey(pid, i);
    clearKeyLimit(pid, i);
    S.settingsMsg = PROVIDERS[pid] ? (PROVIDERS[pid].short + ' 키 ' + (i + 1) + '(으)로 보낼게요.') : '';
    renderSettings();
  }

  async function saveCodeToken() {
    var v = fieldVal('setCodeToken').trim();
    var r = await saveAiConfig({ keys: keysCopy(), codeToken: v || S.ai.codeToken });
    S.settingsMsg = r.ok ? '코드 열쇠를 저장했어요.' : ('저장하지 못했어요: ' + r.error);
    renderSettings();
    toast(S.settingsMsg);
  }

  function saveInstructions() {
    S.pref.instructions = fieldVal('setInstructions');
    savePref();
    saveSoon(0);
    S.settingsMsg = '지침을 저장했어요.'; renderSettings();
    toast('지침을 저장했어요.');

  function addQuick() {
    var label = fieldVal('qNewLabel').trim();
    var prompt = fieldVal('qNewPrompt').trim();
    if (!label || !prompt) { toast('버튼 이름과 보낼 요청을 모두 넣어 주세요.'); return; }
    S.pref.quick.push({ label: label.slice(0, 24), prompt: prompt });
    savePref(); saveSoon(0);
    S.settingsMsg = '빠른 버튼을 추가했어요.';
    renderSettings(); renderQuick();
  }

  function delQuick(i) {
    S.pref.quick.splice(i, 1);
    savePref(); saveSoon(0);
    renderSettings(); renderQuick();
  }

  /* 자동 잠금 시간 고르기 (1·3·5·10·30분 · 끄기) */

    var m = autoLockValid(mins);
    S.pref.autoLock = m;
    savePref();
    touchActivity();
    renderSettings();
    toast(m ? ('자동 잠금을 ' + m + '분으로 맞췄어요.') : '자동 잠금을 껐어요. 들어올 때는 그대로 잠겨 있어요.');

  S.attachments = [];

  function fmtSize(n) {
    var b = Number(n) || 0;
    if (b < 1024) return b + 'B';
    if (b < 1024 * 1024) return Math.round(b / 1024) + 'KB';
    return (b / (1024 * 1024)).toFixed(1) + 'MB';

  function extForMime(mime) {

    if (/wav/.test(m)) return '.wav';
    if (/mpeg|mp3/.test(m)) return '.mp3';
    return '.webm';
  }
  function kindOf(file) {
    var type = String((file && file.type) || '');
    var name = String((file && file.name) || '');
    if (/^image\//.test(type) || /\.(png|jpe?g|webp|gif|heic|bmp)$/i.test(name)) return 'image';
    if (/^audio\//.test(type) || /\.(m4a|mp3|wav|ogg|webm|aac|caf|amr|flac|opus|mpga)$/i.test(name)) return 'audio';
    if (/pdf$/i.test(type) || /\.pdf$/i.test(name)) return 'pdf';
    if (/^(text\/|application\/(json|javascript|xml|x-yaml|csv))/.test(type) || /\.(txt|md|markdown|csv|tsv|json|html?|css|js|mjs|ts|jsx|tsx|py|sh|yml|yaml|log|ini|conf|xml|sql)$/i.test(name)) return 'text';
    return 'other';
  }
  function iconOf(kind) {
    if (kind === 'image') return '🖼️';

  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsDataURL(file);
    });
  }
  function readAsText(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsText(file);
    });
  }
  function dataUrlParts(dataUrl) {
    var s = String(dataUrl || '');
    var i = s.indexOf(',');
    var head = i >= 0 ? s.slice(0, i) : '';
    var mime = /^data:([^;,]+)/.exec(head);
    return { mime: mime ? mime[1] : '', b64: i >= 0 ? s.slice(i + 1) : s };
  }
  /* 그림은 화면에 보낼 때 줄여서 토큰을 아껴요 */
  function shrinkImage(file) {
    return new Promise(function (resolve) {
      readAsDataUrl(file).then(function (url) {
        var img = new Image();
        img.onload = function () {
          try {
            var max = 1024;
            var w = img.width || 1, h = img.height || 1;
            var scale = Math.min(1, max / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var g = canvas.getContext('2d');
            g.fillStyle = '#fff';
            g.fillRect(0, 0, cw, ch);
            g.drawImage(img, 0, 0, cw, ch);
            var out = canvas.toDataURL('image/jpeg', 0.82);
            var p = dataUrlParts(out);
            var thumb = null;
            try {
              var tc = document.createElement('canvas');
              tc.width = 96; tc.height = 96;
              var tg = tc.getContext('2d');
              tg.fillStyle = '#fff'; tg.fillRect(0, 0, 96, 96);
              var sc = Math.min(96 / w, 96 / h);
              tg.drawImage(img, (96 - w * sc) / 2, (96 - h * sc) / 2, w * sc, h * sc);
              thumb = tc.toDataURL('image/jpeg', 0.7);
            } catch (e2) { thumb = out; }
            resolve({ mime: 'image/jpeg', b64: p.b64, thumb: thumb || out, width: cw, height: ch });
          } catch (e) {
            var pp = dataUrlParts(url);
            resolve({ mime: pp.mime || 'image/png', b64: pp.b64, thumb: url, width: 0, height: 0 });
          }
        };
        img.onerror = function () {
          var pp = dataUrlParts(url);
          resolve({ mime: pp.mime || 'image/png', b64: pp.b64, thumb: url, width: 0, height: 0 });
        };
        img.src = url;
      }).catch(function () { resolve(null); });
    });
  }

  async function buildAttachment(file) {
    var kind = kindOf(file);
    var base = { id: uid('a_'), kind: kind, name: String(file.name || '파일'), size: file.size || 0 };
    if (kind === 'other') return null;
    if (kind === 'audio') {
      if (file.size > 20 * 1024 * 1024) { toast('음성 파일은 20MB 이하로 올려 주세요.'); return null; }
      base.file = file;
      return base;
    }
    if (kind === 'image') {
      if (file.size > 12 * 1024 * 1024) { toast('이미지는 12MB 이하로 올려 주세요.'); return null; }
      var sh = await shrinkImage(file);
      if (!sh) { toast('이미지를 읽지 못했어요.'); return null; }
      base.mime = sh.mime;
      base.b64 = sh.b64;
      base.thumb = sh.thumb;
      base.width = sh.width; base.height = sh.height;
      return base;
    }
    if (kind === 'pdf') {
      if (file.size > 20 * 1024 * 1024) { toast('PDF는 20MB 이하로 올려 주세요.'); return null; }
      var url = await readAsDataUrl(file);
      var pp = dataUrlParts(url);
      base.mime = 'application/pdf';
      base.b64 = pp.b64;
      base.pages = null;
      return base;
    }
    if (kind === 'text') {
      if (file.size > 4 * 1024 * 1024) { toast('글 파일은 4MB 이하로 올려 주세요.'); return null; }
      var text = await readAsText(file);
      var allLines = text.split('\n').length;
      var clipped = text.length > MAX_TEXT_CHARS;
      base.text = clipped ? text.slice(0, MAX_TEXT_CHARS) : text;
      base.lines = allLines;
      base.chars = text.length;
      base.clipped = clipped;
      return base;
    }
    return null;
  }

  /* ---------- 음성 받아 적기 ---------- */
  function fileToBase64(file) {

      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result || '');
        var i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했어요')); };
      fr.readAsDataURL(file);
    });
  }

  async function groqTranscribe(file) {
    var fd = new FormData();
    fd.append('file', file, file.name || ('audio' + extForMime(file.type)));
    fd.append('model', 'whisper-large-v3-turbo');
    fd.append('language', 'ko');
    fd.append('response_format', 'json');
    var res, txt = '';
    try {
      res = await window.fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + providerKey('groq') },
        body: fd
      });
      txt = await res.text();
    } catch (e) {
      return { ok: false, error: '음성 파일을 보내지 못했어요. 인터넷 연결을 확인해 주세요.' };
    }
    var headers = headerMap(res);
    var json = null;
    try { json = JSON.parse(txt); } catch (e) { json = null; }
    noteResult('groq', 'whisper-large-v3-turbo', res.status, headers, txt);
    if (!res.ok) {
      var info = limitInfo(modelIdOf('groq', 'whisper-large-v3-turbo'));
      return {
        ok: false,
        error: '받아 적지 못했어요. ' + textFromErr(res.status, json, 'HTTP ' + res.status) +
          (info.left > 0 ? '\n(' + info.text + ' · ' + fmtLeft(info.left) + ' 뒤에 다시)' : '')
      };
    }
    var out = String((json && json.text) || '').trim();
    if (!out) return { ok: false, error: '음성을 알아듣지 못했어요. 조금 더 길게 다시 시도해 주세요.' };
    return { ok: true, via: 'groq', transcript: out };
  }

  async function geminiTranscribe(file) {
    var pidModel = splitModelId(S.pref.model || '');
    var model = (pidModel.pid === 'gemini' && pidModel.model) ? pidModel.model : modelList('gemini')[0];
    var b64;
    try { b64 = await fileToBase64(file); } catch (e) { return { ok: false, error: '파일을 읽지 못했어요.' }; }
    var body = {
      contents: [{
        role: 'user',
        parts: [
          { inlineData: { mimeType: String(file.type || 'audio/m4a'), data: b64 } },
          { text: '이 음성 메모를 한국어로 정확히 받아 적어 줘. 그다음 아래 형식으로 정리해 줘.\n\n전사:\n(받아 적은 내용)\n\n요약:\n(세 줄 이내)\n\n할 일:\n- (있으면 목록, 없으면 "없음")' }
        ]
      }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 2048 }
    };
    var res, txt = '';
    try {
      res = await window.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': providerKey('gemini') },
        body: JSON.stringify(body)
      });
      txt = await res.text();
    } catch (e) {
      return { ok: false, error: '음성 파일을 보내지 못했어요. 인터넷 연결을 확인해 주세요.' };
    }
    var headers = headerMap(res);
    var json = null;
    try { json = JSON.parse(txt); } catch (e) { json = null; }
    noteResult('gemini', model, res.status, headers, txt);
    if (!res.ok) {
      var info = limitInfo(modelIdOf('gemini', model));
      return {
        ok: false,
        error: '받아 적지 못했어요. ' + textFromErr(res.status, json, 'HTTP ' + res.status) +
          (info.left > 0 ? '\n(' + info.text + ' · ' + fmtLeft(info.left) + ' 뒤에 다시)' : '')
      };
    }
    var parts = (json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    var whole = '';
    for (var i = 0; i < parts.length; i++) if (parts[i] && parts[i].text) whole += parts[i].text;
    whole = String(whole).trim();
    if (!whole) return { ok: false, error: '음성을 알아듣지 못했어요. 다시 시도해 주세요.' };
    var tr = whole;
    var m = /전사\s*:?\s*([\s\S]*?)(?=\n\s*요약\s*:|$)/.exec(whole);
    if (m && m[1].trim()) tr = m[1].trim();
    return { ok: true, via: 'gemini', transcript: tr, geminiText: whole };
  }

  async function transcribeFile(file) {
    if (!file) return { ok: false, error: '음성 파일이 없어요.' };
    if (hasKey('groq')) return groqTranscribe(file);
    if (hasKey('gemini')) return geminiTranscribe(file);
    return { ok: false, error: '음성 메모를 받아 적으려면 무료 **Groq** 키나 **Gemini** 키가 필요해요.\n⚙️ 설정에서 키를 넣어 주세요.' };
  }

  /* ---------- 녹음 ---------- */
  function pickRecMime() {
    if (!window.MediaRecorder) return '';
    var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/m4a', 'audio/aac', 'audio/ogg'];
    if (typeof window.MediaRecorder.isTypeSupported !== 'function') return '';
    for (var i = 0; i < list.length; i++) {
      try { if (window.MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) { /* 무시 */ }
    }
    return '';
  }
  function updateRecTime() {
    var el = document.getElementById('recTime');
    if (!el || !REC.startedAt) return;
    var s = Math.max(0, Math.floor((Date.now() - REC.startedAt) / 1000));
    el.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function recUi(on) {
    var bar = document.getElementById('recBar');
    var mic = document.getElementById('micBtn');
    if (bar) bar.hidden = !on;
    if (mic) { mic.classList.toggle('on', !!on); mic.textContent = on ? '⏹' : '🎙️'; }
    if (on) updateRecTime();
  }
  async function startRecording() {
    if (REC.rec) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast('이 브라우저에서는 녹음을 쓸 수 없어요. 파일을 붙여 주세요.');
      return;
    }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      var mime = pickRecMime();
      var mr = mime ? new window.MediaRecorder(stream, { mimeType: mime }) : new window.MediaRecorder(stream);
      REC.stream = stream;
      REC.rec = mr;
      REC.chunks = [];
      REC.cancel = false;
      REC.mime = String(mr.mimeType || mime || 'audio/webm');
      mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
      mr.onstop = function () { recordingDone(); };
      mr.start();
      REC.startedAt = Date.now();
      recUi(true);
      window.clearInterval(REC.timer);
      REC.timer = window.setInterval(updateRecTime, 300);
    } catch (e) {
      toast('마이크를 쓸 수 없어요. 브라우저 권한을 확인해 주세요.');
    }
  }
  function stopRecording() { if (REC.rec) { try { REC.rec.stop(); } catch (e) { /* 무시 */ } } }
  function cancelRecording() { if (REC.rec) { REC.cancel = true; stopRecording(); } }

  async function recordingDone() {
    window.clearInterval(REC.timer);
    REC.timer = null;
    recUi(false);
    var stream = REC.stream;
    REC.stream = null;
    if (stream && stream.getTracks) {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* 무시 */ }
    }
    var kind = String(REC.mime || 'audio/webm').split(';')[0] || 'audio/webm';
    var blob = null;
    try { blob = new Blob(REC.chunks, { type: kind }); } catch (e) { blob = null; }
    var wasCancel = REC.cancel;
    REC.rec = null;
    REC.cancel = false;
    REC.chunks = [];
    if (wasCancel) return;
    if (!blob || !blob.size) { toast('녹음된 소리가 없어요.'); return; }
    var d = new Date();
    var name = '녹음-' + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + extForMime(kind);
    var file = null;
    try { file = new File([blob], name, { type: kind }); } catch (e) { file = blob; file.name = name; }
    S.attachments.push({ id: uid('a_'), kind: 'audio', name: name, size: blob.size, file: file });
    renderChips();
    sendAttachFlow();
  }

  /* ---------- 보내기 ---------- */
  function providerCanSeeImages(pid, model) {
    if (pid === 'gemini') return true;
    if (pid === 'openrouter') return /vision|llama-3\.2|llama-4|qwen|gemma|pixtral|claude|gpt-4o|gemini/i.test(String(model));
    if (pid === 'groq') return /vision|llama-4|maverick|scout/i.test(String(model));
    return false;
  }
  function providerCanSeePdf(pid) { return pid === 'gemini'; }

  function attSummary(att) {
    if (att.kind === 'image') return '🖼️ ' + att.name;
    if (att.kind === 'audio') return '🎧 ' + att.name;
    if (att.kind === 'pdf') return '📕 ' + att.name;
    return '📄 ' + att.name + ' (' + att.lines + '줄)';
  }

  async function sendAttachFlow() {
    var t = activeThread();
    if (!t) return;
    if (!S.attachments.length) { sendMessage(); return; }
    if (S.busy[t.id]) { toast('이 대화방은 아직 답을 만들고 있어요. 조금 기다려 주세요.'); return; }

    var items = S.attachments.slice();
    S.attachments = [];
    renderChips();
    var typed = fieldVal('input').trim();
    var sp = splitModelId(currentModel());
    var pid = sp.pid, model = sp.model;

    S.scrollNext = true;
    var msg = addMsg(t, {
      role: 'user', kind: 'file',
      text: typed,
      attachments: items.map(function (a) { return { kind: a.kind, name: a.name, size: a.size, lines: a.lines, chars: a.chars }; })
    });
    var input = document.getElementById('input');
    if (input) { input.value = ''; autoGrow(input); }
    if (!t.title || t.title === '새 대화') t.title = attSummary(items[0]).slice(0, 24);
    renderThreadBar();
    if (S.active === t.id) renderThread();
    saveSoon();
    S.busy[t.id] = { at: Date.now() };
    renderThreadBar();
    if (S.active === t.id) renderThread();

    var images = [], pdfs = [], textBlocks = [], notes = [], geminiText = null;
    try {
      for (var i = 0; i < items.length; i++) {
        var a = items[i];
        if (a.kind === 'audio') {
          msg.text = (msg.text ? msg.text + '\n\n' : '') + '음성 메모를 받아 적는 중…';
          if (S.active === t.id) renderThread();
          var tr = await transcribeFile(a.file);
          msg.text = (msg.text || '').replace('음성 메모를 받아 적는 중…', '').trim();
          if (!tr.ok) { msg.error = true; msg.text = (msg.text ? msg.text + '\n\n' : '') + tr.error; continue; }
          msg.kind = 'audio';
          msg.audioName = a.name;
          msg.audioSize = a.size;
          msg.audioVia = tr.via;
          msg.text = (msg.text ? msg.text + '\n\n' : '') + tr.transcript;
          if (tr.geminiText) geminiText = tr.geminiText;
        } else if (a.kind === 'text') {
          textBlocks.push('📄 파일: ' + a.name + ' (' + a.lines + '줄' + (a.clipped ? ', 앞 ' + MAX_TEXT_CHARS + '자만' : '') + ')\n```\n' + a.text + '\n```');
        } else if (a.kind === 'image') {
          if (providerCanSeeImages(pid, model)) images.push({ mime: a.mime, data: a.b64, name: a.name });
          else notes.push('🖼️ ' + a.name + ' — 지금 모델(' + model + ')은 그림을 못 봐요. Gemini나 비전 모델로 바꾸면 볼 수 있어요.');
        } else if (a.kind === 'pdf') {
          if (providerCanSeePdf(pid)) pdfs.push({ data: a.b64, name: a.name });
          else notes.push('📕 ' + a.name + ' — PDF는 Gemini에서만 읽을 수 있어요. 모델을 Gemini로 바꿔 주세요.');
        }
      }
      msg.attachments = items.filter(function (a) { return a.kind !== 'audio'; }).map(function (a) {
        return { kind: a.kind, name: a.name, size: a.size, lines: a.lines, chars: a.chars };
      });
      if (textBlocks.length) msg.text = (msg.text ? msg.text + '\n\n' : '') + textBlocks.join('\n\n');
      if (notes.length) msg.text = (msg.text ? msg.text + '\n\n' : '') + notes.join('\n');
      if (geminiText) {
        addMsg(t, { role: 'assistant', text: geminiText, model: modelIdOf('gemini', '음성 메모 요약') });
        renderModelBtn();
      } else {
        if (S.active === t.id) renderThread();
        saveSoon();
        await runAssistant(t, { images: images, pdfs: pdfs });
        renderModelBtn();
      }
    } catch (e) {
      msg.error = true;
      msg.text = (msg.text ? msg.text + '\n\n' : '') + '붙인 파일을 처리하지 못했어요. ' + (e && e.message ? e.message : '');
    } finally {
      delete S.busy[t.id];
      renderThreadBar();
      if (S.active === t.id) renderThread();
      saveSoon(0);
    }
  }

  function handleComposerSubmit() {
    if (S.attachments.length) { sendAttachFlow(); return; }
    sendMessage();
  }

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.id !== 'composer') return;
    if (e.defaultPrevented) return;
    e.preventDefault();
    handleComposerSubmit();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.id !== 'fileInput') return;
    var files = [];
    if (el.files) for (var i = 0; i < el.files.length; i++) files.push(el.files[i]);
    if (files.length) addFiles(files);
    try { el.value = ''; } catch (e2) { /* 무시 */ }
  });

  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'attach') {
      var fi = document.getElementById('fileInput');
      if (fi) { try { fi.click(); } catch (e2) { /* 무시 */ } }
      return;
    }
    if (act === 'att-remove') { removeAttachment(el.getAttribute('data-id')); return; }
    if (act === 'mic') { if (REC.rec) stopRecording(); else startRecording(); return; }
    if (act === 'rec-stop') { stopRecording(); return; }
    if (act === 'rec-cancel') { cancelRecording(); return; }
  });
})();
</script>
</body>
</html>
