<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>AI 비서 챗 · jadenfamily</title>
<meta name="description" content="우리 집 AI 비서 챗">
<meta name="apple-mobile-web-app-title" content="AI 비서 챗">
<meta property="og:title" content="AI 비서 챗 · jadenfamily">
<meta property="og:description" content="대시보드 코드 수정 · 가족 데이터 확인 · 여러 대화방">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jadenfamily">
<meta property="og:url" content="https://jadenfamily.github.io/home/chat.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --ink-3:#918aa4;
    --line:#f1e6da;
    --card:#ffffff;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --r-lg:22px;
    --sun:#ff9f1c;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ff5c8a;
    --sky:#3d9be9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; max-width:100%; overflow-x:hidden; }
  html{ -webkit-text-size-adjust:100%; height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); font-size:16px; line-height:1.45; height:100%; overflow:hidden;
    background-color:#fff8ef;
    background-image:
      radial-gradient(circle at 8% -6%, #ffe6c7 0, rgba(255,230,199,0) 46%),
      radial-gradient(circle at 92% -2%, #dcf0ff 0, rgba(220,240,255,0) 44%),
      radial-gradient(circle at 50% 112%, #ffe7f0 0, rgba(255,231,240,0) 46%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  select,input,textarea{ font-family:inherit; }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:inherit; }

  /* ---------- 앱 뼈대 ---------- */
  .app{
    position:relative;
    display:flex; flex-direction:column; height:100%;
    max-width:980px; margin:0 auto; width:100%; min-width:0; overflow-x:hidden;
    padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);
  }
  .topbar{
    display:flex; align-items:center; gap:10px; padding:10px 12px 8px;
    background:rgba(255,248,239,.88); backdrop-filter:saturate(150%) blur(10px);
    border-bottom:1px solid rgba(241,230,218,.9);
  }
  .back{
    width:38px; height:38px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center;
    background:#fff; box-shadow:var(--shadow); text-decoration:none; font-size:18px; font-weight:900; color:var(--ink);
  }
  .back:active{ transform:scale(.96); }
  .ai-logo{
    width:38px; height:38px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center; font-size:20px;
    background:linear-gradient(150deg,#e9e2ff 0%,#d9ecff 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  }
  .brand{ min-width:0; }
  .brand h1{ margin:0; font-size:17px; font-weight:900; letter-spacing:-.03em; line-height:1.15; white-space:nowrap; }
  .brand p{ margin:2px 0 0; font-size:11.5px; font-weight:800; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw; }
  .top-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
  .pill-btn{
    display:flex; align-items:center; gap:6px; border:0; background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 11px; box-shadow:var(--shadow); font-size:12px; font-weight:900; max-width:44vw;
  }
  .pill-btn .m-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill-btn .m-dot{ width:8px; height:8px; border-radius:50%; background:#c9c2d6; flex:0 0 auto; }
  .pill-btn .m-dot.ok{ background:var(--mint); }
  .pill-btn .m-dot.limited{ background:var(--sun); }
  .pill-btn .m-dot.quota{ background:var(--pink); }
  .icon-btn{
    width:38px; height:38px; border:0; border-radius:13px; background:#fff; box-shadow:var(--shadow);
    font-size:16px; display:grid; place-items:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  /* ---------- 대화방 탭 ---------- */
  .threadbar{
    display:flex; gap:7px; align-items:center; padding:8px 12px 6px; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .threadbar::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; max-width:180px;
    border:1.5px solid transparent; background:#fff; color:#5e5574; border-radius:999px;
    padding:7px 11px; font-size:12.5px; font-weight:900; box-shadow:0 3px 10px rgba(118,86,54,.06);
  }
  .tab .tname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab.on{ background:#26203a; color:#fff; box-shadow:0 6px 16px rgba(44,36,64,.24); }
  .tab .spin{ width:10px; height:10px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:spin .8s linear infinite; }
  .tab.add{ color:#6a45d8; background:#f2eeff; border-color:#e4dbff; font-size:15px; padding:5px 12px; }
  .tab.persona{ background:#fff7e8; color:#96631a; border-color:#ffe6bd; }
  .presets{ display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 12px; }
  .preset{ border:1.5px solid #f0ebff; background:#fff; color:#4a3a86; border-radius:999px; padding:8px 12px; font-size:12.5px; font-weight:900; }
  .preset.on{ background:#f2eeff; border-color:#b9a4ff; }
  .tab .x{ border:0; background:transparent; color:inherit; opacity:.5; font-size:12px; padding:0 0 0 2px; }
  .tab .x:hover{ opacity:1; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 대화 본문 ---------- */
  /* 대화 스크롤 칸: 안쪽에서 넘쳐도 이 칸이 가로로 밀리지 않게 잠가 둬요 (iOS Safari 가로 팬 방지) */
  .thread{ flex:1; min-width:0; max-width:100%; overflow-x:hidden; overflow-y:auto; padding:8px 12px 18px; -webkit-overflow-scrolling:touch; }
  .msg{ display:flex; gap:9px; margin:10px 0; align-items:flex-end; min-width:0; max-width:100%; }
  /* 말풍선을 감싸는 칸이 좁아질 수 있어야 코드블록이 화면 밖으로 밀리지 않아요 */
  .msg > div{ min-width:0; max-width:100%; flex:0 1 auto; }
  .msg .av{ width:28px; height:28px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center; font-size:14px; background:linear-gradient(150deg,#e9e2ff,#d9ecff); }
  .bubble{
    max-width:min(76%, 640px); padding:11px 14px; border-radius:18px; font-size:15px; line-height:1.62;
    background:#fff; box-shadow:0 6px 18px rgba(118,86,54,.07); overflow-wrap:anywhere; word-break:break-word;
    min-width:0; box-sizing:border-box;
  }
  .msg.me{ flex-direction:row-reverse; }
  .msg.me .bubble{ background:#312a4d; color:#fff; border-bottom-right-radius:6px; }
  .msg.bot .bubble{ background:var(--bot-bg,#fff); color:var(--bot-fg,#222); border-bottom-left-radius:6px; }
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble code{ background:rgba(124,92,252,.10); padding:1px 5px; border-radius:6px; font-size:.9em; }
  .bubble pre{ background:#1f1a30; color:#f4f1ff; padding:11px 12px; border-radius:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; font-size:12.5px; line-height:1.5; margin:8px 0;
    max-width:100%; min-width:0; box-sizing:border-box; }
  .bubble pre code{ background:transparent; padding:0; font-size:inherit; }
  .bubble ul{ margin:6px 0; padding-left:20px; }
  .bubble li{ margin:2px 0; }
  .bubble a{ color:#5b3fe0; font-weight:800; }
  .msg.me .bubble a{ color:#e7dcff; }
  .meta-line{ font-size:10.5px; font-weight:800; color:var(--ink-3); margin:4px 2px 0; }
  .msg.me .meta-line{ text-align:right; }
  .typing{ display:inline-flex; gap:4px; align-items:center; padding:2px 0; }
  .typing i{ width:6px; height:6px; border-radius:50%; background:#b9b0cc; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.18s; }
  .typing i:nth-child(3){ animation-delay:.36s; }
  /* ---------- 답장(인용) ---------- */
  .under{ display:flex; align-items:center; gap:6px; margin:4px 2px 0; }
  .under .meta-line{ margin:0; }
  .msg.me .under{ flex-direction:row-reverse; }
  .reply-btn{ border:0; background:none; color:#b3abc4; font-size:11.5px; font-weight:900; padding:2px 5px; border-radius:8px; transition:.15s; }
  .reply-btn:active{ transform:scale(.94); background:#f2eefc; color:#6a45d8; }
  @media (hover:hover){ .reply-btn{ opacity:.5; } .msg:hover .reply-btn{ opacity:1; } }
  .quoted{ border-left:3px solid rgba(124,92,252,.55); background:rgba(124,92,252,.08); border-radius:9px; padding:6px 9px; margin:0 0 8px; font-size:11.5px; font-weight:800; color:#6b6383; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .msg.me .quoted{ background:rgba(255,255,255,.14); border-left-color:rgba(231,220,255,.75); color:#e7dcff; }
  .quotebar{ display:flex; align-items:center; gap:7px; margin:0 0 6px; padding:8px 11px; border-radius:12px; background:#f6f2ff; border-left:3px solid #8b6cf0; font-size:12px; font-weight:800; color:#5b4b9a; }
  .quotebar[hidden]{ display:none; }
  .quotebar .q-txt{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quotebar .q-x{ border:0; background:none; color:#8a83a0; font-size:15px; font-weight:900; padding:0 4px; }
  .msg.swiping{ transform:translateX(7px); transition:transform .08s; }
  /* ---------- 접이식 작업 상태 칩 + 세로 타임라인 ---------- */
  .workwrap{ display:block; padding:0 2px; margin:2px 0 4px 36px; }
  .work{ display:block; width:-webkit-fit-content; width:fit-content; max-width:100%; background:#f7f3ff; border:1.5px solid #ece3ff; border-radius:14px; overflow:hidden; }
  .work.open{ width:100%; max-width:520px; }
  .work-head{ display:flex; align-items:center; gap:6px; width:100%; min-width:0; border:0; background:none; padding:7px 11px; font-size:12px; font-weight:900; color:#5b4b9a; text-align:left; }
  .work-head > span{ flex:0 0 auto; }
  .work-head .w-do{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#6a45d8; }
  .work-head .w-elapsed{ font-variant-numeric:tabular-nums; }
  .work-head .w-caret{ color:#a79fbb; margin-left:2px; }
  .work-head .w-sep{ color:#c3bbd6; }
  /* 펼친 기록: 얇은 세로 연결선 + 단계별 아이콘 + 사람이 읽는 요약 (생코드 없음) */
  .work-log{ border-top:1.5px solid #ece3ff; background:#fcfaff; padding:10px 12px 11px; display:flex; flex-direction:column; }
  .w-line{ position:relative; display:flex; align-items:flex-start; gap:8px; padding:0 0 9px; font-size:11.5px; font-weight:800; color:#5b4b9a; }
  .w-line:last-child{ padding-bottom:0; }
  .w-line:not(:last-child)::before{ content:''; position:absolute; left:9px; top:20px; bottom:0; width:2px; background:#ded2ff; border-radius:2px; }
  .w-ico{ position:relative; z-index:1; flex:0 0 20px; width:20px; height:20px; border-radius:50%; background:#fff; border:1.5px solid #e2d8ff; display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; }
  .w-body{ flex:1 1 auto; min-width:0; padding-top:2px; line-height:1.45; overflow-wrap:anywhere; word-break:break-word; }
  .w-body .w-verb{ font-weight:900; color:#5b4b9a; }
  .w-body .w-sub{ font-weight:700; color:#8a83a0; }
  .w-line .w-d{ flex:0 0 auto; padding-top:2px; font-size:10.5px; font-weight:800; color:#b3abc4; font-variant-numeric:tabular-nums; }
  .w-line.now .w-ico{ border-color:#b9a5f7; animation:wpulse 1.5s infinite; }
  .w-line.now .w-verb{ color:#6a45d8; }
  .w-line.now .w-d{ color:#8b6cf0; }
  @keyframes wpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(139,108,240,.32); } 50%{ box-shadow:0 0 0 5px rgba(139,108,240,0); } }
  .work.done{ background:#f2fbf6; border-color:#d6f2e2; }
  .work.done .work-head{ color:#0f7a55; }
  .work.done .work-head .w-do{ color:#0f7a55; }
  .work.done .work-log{ border-top-color:#d6f2e2; background:#f8fdfa; }
  .work.done .w-line{ color:#0f7a55; }
  .work.done .w-line:not(:last-child)::before{ background:#cbe8da; }
  .work.done .w-ico{ border-color:#cdeedc; }
  .work.done .w-body .w-verb{ color:#0f7a55; }
  .work.done .w-body .w-sub{ color:#6f8f80; }
  .work.done .w-line .w-d{ color:#9db8ac; }
  /* 도구가 남긴 짧은 안내·오류만 본문에 (생코드는 절대 쏟지 않아요) */
  .tool-card{ margin:6px 0 8px 36px; }
  .tool-card .tool-head{ font-size:11.5px; font-weight:800; color:#8a83a0; margin:0 0 5px; }
  .tool-note{ margin:4px 0 6px 36px; max-width:80%; padding:6px 10px; border-radius:10px; background:#f7f5fb; border-left:3px solid #e2d8ff; font-size:11.5px; font-weight:800; color:#7c7590; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-2px); } }
  .welcome{ text-align:center; padding:40px 16px; color:var(--ink-2); }
  .welcome .big{ font-size:44px; }
  .welcome h2{ margin:10px 0 6px; font-size:19px; color:var(--ink); }
  .welcome p{ margin:0 auto; max-width:420px; font-size:13.5px; font-weight:700; line-height:1.7; }

  /* 도구 카드 */
  .card{
    margin:10px 0 2px; max-width:min(86%, 660px); background:#fff; border-radius:16px;
    box-shadow:0 8px 22px rgba(118,86,54,.08); border:1px solid #f0ebff; overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; gap:8px; padding:10px 13px; font-size:12.5px; font-weight:900; background:#f7f4ff; color:#4a3a86; }
  .card-body{ padding:11px 13px; font-size:13px; }
  .card-body .row{ display:flex; gap:8px; padding:3px 0; }
  .card-body .row b{ flex:0 0 auto; color:var(--ink-2); font-size:12px; min-width:52px; }
  .chk{ display:flex; gap:8px; align-items:flex-start; padding:5px 0; font-size:12.5px; font-weight:800; }
  .chk .ic{ flex:0 0 auto; width:18px; text-align:center; }
  .chk.ok{ color:#0f7a55; }
  .chk.bad{ color:#c6415a; }
  .chk .detail{ display:block; font-weight:700; color:#8a6a75; font-size:11.5px; margin-top:2px; white-space:pre-wrap; }
  .diff{ max-height:260px; overflow:auto; background:#fbfaff; border-top:1px solid #f0ebff; font-size:11.5px; line-height:1.5; }
  .diff div{ padding:1px 10px; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .diff .add{ background:#eafaf1; color:#0d6b4a; }
  .diff .del{ background:#fff0f3; color:#a53a52; }
  .diff .ctx{ color:#8c86a0; }
  .card-actions{ display:flex; gap:8px; padding:10px 13px; border-top:1px solid #f0ebff; flex-wrap:wrap; }
  .btn{
    border:0; border-radius:12px; padding:9px 14px; font-size:13px; font-weight:900;
    background:#26203a; color:#fff; box-shadow:0 6px 14px rgba(44,36,64,.18);
  }
  .btn:active{ transform:scale(.985); }
  .btn.ghost{ background:#f4f1fb; color:#4a3a86; box-shadow:none; }
  .btn.warn{ background:#fff0f3; color:#b93b57; box-shadow:none; }
  .btn[disabled]{ opacity:.5; }

  /* ---------- 퀵 버튼 / 입력 ---------- */
  .quickrow{ display:flex; gap:7px; padding:0 12px 8px; overflow-x:auto; scrollbar-width:none; }
  .quickrow::-webkit-scrollbar{ display:none; }
  .quick{
    flex:0 0 auto; border:1px solid #ece4ff; background:#fff; color:#4a3a86; border-radius:999px;
    padding:7px 12px; font-size:12.5px; font-weight:900; box-shadow:0 3px 10px rgba(118,86,54,.05);
  }
  .composer{
    display:flex; align-items:flex-end; gap:8px; padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(255,248,239,.94); border-top:1px solid rgba(241,230,218,.9);
    backdrop-filter:blur(8px);
  }
  .input-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .tool-btn{
    width:42px; height:44px; flex:0 0 auto; border:0; border-radius:15px; background:#fff;
    box-shadow:var(--shadow); font-size:18px; display:grid; place-items:center;
  }
  .tool-btn:active{ transform:scale(.96); }
  .tool-btn.on{ background:#ffe3ea; box-shadow:0 0 0 2px #ffc7d5 inset; }
  .attach-chip{ display:flex; flex-wrap:wrap; gap:6px; }
  .att{
    display:inline-flex; align-items:center; gap:6px; padding:4px 8px 4px 4px; background:#f5f1ff;
    border-radius:12px; font-size:11.5px; font-weight:900; color:#4a3a86; max-width:100%;
  }
  .att img{ width:30px; height:30px; border-radius:8px; object-fit:cover; flex:0 0 auto; display:block; }
  .att .ai{ font-size:14px; width:24px; text-align:center; flex:0 0 auto; }
  .att .an{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:132px; }
  .att .as{ color:#8a7fd0; font-weight:700; font-size:10.5px; white-space:nowrap; }
  .att .rm{ border:0; background:transparent; color:#8a7fd0; font-size:12px; padding:0 2px; }
  .msg-atts{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .msg-att{ font-size:10.5px; font-weight:900; background:rgba(124,92,252,.12); color:#4a3a86; padding:2px 8px; border-radius:999px; }
  .msg.me .msg-att{ background:rgba(255,255,255,.18); color:#efe9ff; }
  .rec-bar{
    display:flex; align-items:center; gap:9px; padding:9px 14px; background:#fff1f4;
    border-top:1px solid #ffd9e2; font-size:12.5px; font-weight:900; color:#b93b57;
  }
  .rec-dot{ width:10px; height:10px; border-radius:50%; background:#ef4d6a; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.7); opacity:.5; } }
  .audio-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3f4fa8; margin-bottom:6px; }
  .composer textarea{
    flex:1; resize:none; border:0; border-radius:18px; padding:12px 14px; font-size:15px; line-height:1.45;
    background:#fff; box-shadow:var(--shadow); max-height:140px; min-height:46px; color:var(--ink);
  }
  .composer textarea:focus{ outline:2px solid #d9cffd; }
  .send{
    width:46px; height:46px; flex:0 0 auto; border:0; border-radius:16px; font-size:17px;
    background:linear-gradient(150deg,#7c5cfc,#5a7bff); color:#fff; box-shadow:0 8px 18px rgba(92,72,200,.28);
  }
  .send:active{ transform:scale(.96); }
  .send[disabled]{ opacity:.45; }
  .foot{ margin:0; padding:0 12px 6px; font-size:10.5px; font-weight:800; color:#a79fbb; text-align:center; }

  /* ---------- 맨 위로 · 맨 아래로 (대화 칸 오른쪽 아래에 떠 있는 단추) ---------- */
  .jump-stack{
    position:absolute; right:12px; bottom:118px; z-index:7;
    display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none;
  }
  .jump-btn{
    width:36px; height:36px; padding:0; border:1px solid rgba(255,255,255,.5); border-radius:50%;
    display:grid; place-items:center; font-size:15px; line-height:1;
    background:rgba(44,36,64,.34); color:#fff;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);

<div class="app" id="appRoot" hidden>

<script>
(function () {
  'use strict';

  /* ============ 기본값 / 상수 ============ */
  var API_BASE = 'https://api.github.com';
  var DEFAULT_OWNER = 'jadenfamily';
  var DEFAULT_REPO = 'kids-dashboard-data';
  var CODE_REPOS = ['home', 'kids-dashboard', 'fridge-dashboard', 'ledger-dashboard'];
  /* 모델이 저장소를 jadenfamily/home · https://jadenfamily.github.io/home/chat.html 처럼 줘도
     저장소 이름만 뽑아 씀 (그대로 비교하면 “그런 저장소 없음”으로 거절되던 문제) */
  var REPO_ALIAS = {
    'home': 'home', '허브': 'home', '홈': 'home',
    'kids': 'kids-dashboard', 'kid': 'kids-dashboard', '아이': 'kids-dashboard',
    'fridge': 'fridge-dashboard', '냉파': 'fridge-dashboard', '냉장고': 'fridge-dashboard',
    'ledger': 'ledger-dashboard', '가계부': 'ledger-dashboard'
  };
  function normRepo(v) {
    var raw = String(v == null ? '' : v).trim();
    if (!raw) return '';
    var s = raw.toLowerCase().replace(/[?#].*$/, '').replace(/\s+/g, '').replace(/\/+$/, '');
    var tokens = s.split(/[\/]+/), i, k, t;
    for (i = tokens.length - 1; i >= 0; i--) {
      t = tokens[i].replace(/\.git$/, '');
      if (!t) continue;
      for (k = 0; k < CODE_REPOS.length; k++) if (t === CODE_REPOS[k]) return CODE_REPOS[k];
    }
    for (i = tokens.length - 1; i >= 0; i--) {
      t = tokens[i].replace(/\.git$/, '');
      if (t && REPO_ALIAS[t]) return REPO_ALIAS[t];
      if (t && t.indexOf('jadenfamily.') >= 0) continue;
    }
    /* github.io 호스트만 준 경우(https://jadenfamily.github.io/)는 홈 저장소예요 */
    if (/^https?:\/\/[^\/]*jadenfamily\.github\.io\/?$/.test(raw.toLowerCase())) return 'home';
    t = (tokens[tokens.length - 1] || '').replace(/\.git$/, '');
    return t;
  }
  /* jadenfamily/home/chat.html · 전체 주소 · 앞에 붙은 저장소 이름을 걷어 내요 */
  function normPath(repo, p) {
    var s = String(p == null ? '' : p).trim();
    if (!s) return '';
    s = s.replace(/^(?:https?:\/\/)?(?:www\.)?github\.com\/[^\/]+\/[^\/]+\/(?:blob|tree|raw)\/[^\/]+\//i, '');
    s = s.replace(/^https?:\/\/[^\/]+\//i, '');
    s = s.replace(/[?#].*$/, '');
    s = s.replace(/^\/+/, '');
    var r = String(repo || '').toLowerCase();
    if (r && s.toLowerCase().indexOf(r + '/') === 0) s = s.slice(r.length + 1);
    return s;
  }

  /* /home·아이 대시보드와 같은 열쇠를 써요 (같은 주소라서 로그인이 이어져요) */
  var K_DEVICE = 'kidsDashboard.device.v1';
  var K_USERS = 'kidsDashboard.users.v1';
  var K_SHA = 'kidsDashboard.sha.v1';
  var K_SESSION = 'kidsDashboard.session.v1';

  /* 이 챗에서만 쓰는 열쇠 */
  var K_DEVID = 'kidsDashboard.chat.deviceId.v1';
  var K_UNLOCK = 'kidsDashboard.chat.unlock.v1';
  var K_LIMITS = 'kidsDashboard.chat.limits.v1';
  var K_PREF = 'kidsDashboard.chat.pref.v1';
  var K_MODELS = 'kidsDashboard.chat.models.v1';

  /* 자동 잠금 시간(분) — 0은 끄기. 마지막으로 쓴 때를 기억했다가 지나면 잠가요. */
  var AUTO_LOCK_STEPS = [1, 3, 5, 10, 30, 0];
  var AUTO_LOCK_DEFAULT = 5;

  var CHAT_ITER = 150000;
  var PATH_THREADS = 'ai-chat/';
  var PATH_AI = 'config/ai.json';
  var PATH_DEVICES = 'config/trusted-devices.json';

  /* 생체인증(Face ID · 지문) — 등록한 기기의 localStorage에만 둬요. 어디에도 올리지 않아요. */
  var K_BIO = 'jaden_chat_bio_v1_';
  var K_BIO_WRAP = 'jaden_chat_bio_wrap_v1_';

  /* 2차 인증(구글 인증 앱 · 아이폰 암호) */
  var K_TOTP_SEEN = 'kidsDashboard.chat.totp.v1';
  var TOTP_PERIOD = 30;      /* 초 */
  var TOTP_DIGITS = 6;
  var TOTP_ITER = 100000;
  var TOTP_ISSUER = 'jadenfamily';

    var bytes = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < n; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytesToHex(bytes);

  function bytesToHex(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += ('0' + bytes[i].toString(16)).slice(-2);
    return s;
  }
  function b64enc(buf) {
    var b = new Uint8Array(buf), s = '', i;
    for (i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return window.btoa(s);
  }
  function b64dec(txt) {
    var bin = window.atob(String(txt || '').replace(/\s/g, '')), i;
    var out = new Uint8Array(bin.length);
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(String(str)), bin = '', i;
    for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return window.btoa(bin);
  }
  function b64decodeUtf8(b64) {
    var bin = window.atob(String(b64 || '').replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);

  /* ============ GitHub Contents API ============ */
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + (token || (S.conn && S.conn.token) || ''),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function repoBase(repo) { return API_BASE + '/repos/' + encodeURIComponent(S.conn.owner) + '/' + encodeURIComponent(repo); }
  function encPath(path) { return String(path || '').split('/').map(encodeURIComponent).join('/'); }
  function shaKey(repo, path) { return repo + '::' + path; }

  /* 1MB가 넘는 파일은 contents 응답이 content 없이 sha만 와서 본문을 Git Blob에서 받아요.
     같은 sha를 한 화면에서 두 번 받지 않도록 받은 본문은 잠깐 들고 있어요(내용이 같으면 sha도 같아요). */
  var BLOB_CACHE = {};
  var BLOB_CACHE_MAX = 4;
  async function ghGetBlobText(repo, sha, token) {
    var ck = String(repo) + '::' + String(sha);
    if (Object.prototype.hasOwnProperty.call(BLOB_CACHE, ck)) return { ok: true, raw: BLOB_CACHE[ck] };
    try {
      var res = await window.fetch(repoBase(repo) + '/git/blobs/' + encodeURIComponent(sha),
        { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var blob = await res.json();
      var raw = blob && blob.content ? b64decodeUtf8(blob.content) : '';
      if (!raw) return { ok: false, status: res.status, error: '큰 파일의 내용을 받지 못했어요' };
      BLOB_CACHE[ck] = raw;
      var ks = Object.keys(BLOB_CACHE);
      while (ks.length > BLOB_CACHE_MAX) delete BLOB_CACHE[ks.shift()];
      return { ok: true, raw: raw };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghGetAt(repo, path, token) {
    var url = repoBase(repo) + '/contents/' + encPath(path) + '?ref=' + encodeURIComponent((S.conn && S.conn.branch) || 'main') + '&_=' + Date.now();
    try {
      var res = await window.fetch(url, { headers: ghHeaders(token), cache: 'no-store' });
      if (res.status === 404) return { ok: true, missing: true };
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var j = await res.json();
      if (Object.prototype.toString.call(j) === '[object Array]') return { ok: true, list: j };
      var text = j && j.content ? b64decodeUtf8(j.content) : '';
      if (j && j.sha) S.sha[shaKey(repo, path)] = j.sha;
      if (j && j.sha && !text && (j.encoding === 'none' || Number(j.size) > 0)) {
        var big = await ghGetBlobText(repo, j.sha, token);
        if (!big.ok) return { ok: false, status: big.status, error: big.error };
        text = big.raw;
      }
      return { ok: true, raw: text, sha: j && j.sha };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghGetJson(repo, path, token) {
    var r = await ghGetAt(repo, path, token);
    if (!r.ok || r.missing || r.list) return r;
    var data = null;
    try { data = JSON.parse(r.raw); } catch (e) { data = null; }
    r.data = data;
    return r;
  }

  async function ghPutAt(repo, path, text, message, token) {
    var payload = {
      message: message || ('업데이트: ' + path),
      content: b64encodeUtf8(String(text)),
      branch: (S.conn && S.conn.branch) || 'main'
    };
    var known = S.sha[shaKey(repo, path)];
    if (known) payload.sha = known;
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var res = await window.fetch(repoBase(repo) + '/contents/' + encPath(path), {
          method: 'PUT', headers: ghHeaders(token), body: JSON.stringify(payload)
        });
        if (res.ok) {
          var j = await res.json();
          if (j && j.content && j.content.sha) S.sha[shaKey(repo, path)] = j.content.sha;
          return { ok: true };
        }
        if (res.status === 409 || res.status === 422 || res.status === 404) {
          var cur = await ghGetAt(repo, path, token);
          if (!cur.ok) return { ok: false, status: cur.status, error: cur.error };
          if (cur.missing) delete payload.sha;
          else payload.sha = cur.sha;
          continue;
        }
        if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
        if (res.status === 403) return { ok: false, status: 403, error: '쓰기 권한이 없어요' };
        return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
      }
    }
    return { ok: false, status: 409, error: '다른 기기에서 먼저 저장했어요' };
  }

  /* ============ 가족 공유 AI 설정 암호화 (AES-GCM · PBKDF2) ============ */
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  function familyPass() {
    var c = S.conn || {};
    return String(c.owner || '').toLowerCase() + '/' + String(c.repo || '').toLowerCase() + '::jadenfamily-ai-v1';
  }
  async function familyKey(salt, iter) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 암호화를 쓸 수 없어요');
    var raw = new TextEncoder().encode(familyPass());
    if (!salt) {
      var d = await sub.digest('SHA-256', raw);
      return sub.importKey('raw', d, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }
    var base = await sub.importKey('raw', raw, { name: 'PBKDF2' }, false, ['deriveKey']);
    return sub.deriveKey({ name: 'PBKDF2', salt: salt, iterations: Math.max(1, Number(iter) || 1), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function familyEncrypt(obj) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 암호화를 쓸 수 없어요');
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var k = await familyKey(salt, CHAT_ITER);
    var ct = await sub.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
    return { version: 1, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: CHAT_ITER, salt: b64enc(salt), iv: b64enc(iv), ct: b64enc(ct), updatedAt: nowIso() };
  }
  async function familyDecrypt(p) {
    if (!p || !p.iv || !p.ct) return null;
    var sub = subtle();
    if (!sub) return null;
    var k = await familyKey(p.salt ? b64dec(p.salt) : null, Number(p.iter) || 1);
    var pt = await sub.decrypt({ name: 'AES-GCM', iv: b64dec(p.iv) }, k, b64dec(p.ct));
    var txt = new TextDecoder('utf-8').decode(new Uint8Array(pt));
    try { return JSON.parse(txt); } catch (e) { return null; }
  }

  /* ============ 내 대화 잠금 열쇠 (계정 비밀번호 → AES-GCM) ============ */
  async function chatKeyFrom(pw, salt, iter) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 암호화를 쓸 수 없어요');
    var raw = new TextEncoder().encode('jadenfamily-chat-v1:' + String(pw));
    var base = await sub.importKey('raw', raw, { name: 'PBKDF2' }, false, ['deriveKey']);
    return sub.deriveKey({ name: 'PBKDF2', salt: salt, iterations: clamp(Number(iter) || CHAT_ITER, 1, 1000000), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  async function chatEncrypt(text) {
    var sub = subtle();
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var ct = await sub.encrypt({ name: 'AES-GCM', iv: iv }, S.chatKey, new TextEncoder().encode(String(text)));
    return { version: 1, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: S.chatIter, salt: b64enc(S.chatSalt), iv: b64enc(iv), ct: b64enc(ct), updatedAt: nowIso(), user: S.me.id };
  }
  async function chatDecrypt(env) {
    var sub = subtle();
    var pt = await sub.decrypt({ name: 'AES-GCM', iv: b64dec(env.iv) }, S.chatKey, b64dec(env.ct));
    return new TextDecoder('utf-8').decode(new Uint8Array(pt));
  }
  /* ============ 자동 잠금 (마지막으로 쓴 때 + 설정한 시간) ============ */
  function autoLockValid(v) {
    var m = Number(v);
    if (v === '' || v == null || isNaN(m)) return AUTO_LOCK_DEFAULT;
    for (var i = 0; i < AUTO_LOCK_STEPS.length; i++) if (AUTO_LOCK_STEPS[i] === m) return m;
    return AUTO_LOCK_DEFAULT;
  }
  function autoLockMins() {
    var m = Number((S.pref && S.pref.autoLock != null) ? S.pref.autoLock : AUTO_LOCK_DEFAULT);
    if (isNaN(m)) return AUTO_LOCK_DEFAULT;
    for (var i = 0; i < AUTO_LOCK_STEPS.length; i++) if (AUTO_LOCK_STEPS[i] === m) return m;
    return AUTO_LOCK_DEFAULT;
  }
  function autoLockLabel(m) { return m ? (m + '분') : '끄기'; }
  function touchActivity() { S.lastActivityAt = Date.now(); }
  function autoLockLeftMs() {
    var mins = autoLockMins();
    if (!mins) return 0;
    return Math.max(0, (S.lastActivityAt || Date.now()) + mins * 60000 - Date.now());
  }
  function autoLockIdle() {
    if (!S.unlocked || !S.chatKey) return false;
    var mins = autoLockMins();
    if (!mins) return false;
    /* 답을 만드는 중에는 잠그지 않아요 (만들던 답이 사라지지 않게) */
    for (var k in S.busy) { if (S.busy[k]) return false; }
    if (!S.lastActivityAt) { S.lastActivityAt = Date.now(); return false; }
    if (Date.now() - S.lastActivityAt < mins * 60000) return false;
    lockNow(true, '설정한 ' + mins + '분이 지나 안전하게 잠겼어요. 다시 열려면 비밀번호나 6자리 번호를 넣어 주세요.');
    return true;
  }
  function lockNow(silent, note) {
    S.unlocked = false;
    S.chatKey = null;
    S.chatSalt = null;
    S.threads = [];
    S.active = '';
    S.loaded = false;
    S.blobs = {};
    S.lastActivityAt = 0;
    /* 이전 버전이 남긴 잠금 해제 흔적이 있으면 지워요 */
    ssDel(K_UNLOCK);

    /* 화면에 남아 있던 대화·입력·붙인 파일도 지워요 */

    if (tv) tv.innerHTML = '';

    showGate('unlock');
    if (note) gateFail(note, true);
    else if (!silent) toast('잠갔어요. 다시 열려면 비밀번호가 필요해요.');
  }

  /* ============ QR 코드 (바깥 라이브러리 없이 그림) ============ */
/* 순수 자바스크립트 QR 코드 생성 (byte 모드, 버전 1~10, M/L) — 바깥 CDN 없이 씁니다. */
var QR = (function () {
  'use strict';

  /* [버전][레벨] = [EC 코드워드/블록, [그룹1 블록수, 그룹1 데이터, 그룹2 블록수, 그룹2 데이터]] */

      (cfg.enabled ? 'AI 비서 챗 2차 인증 켜기: ' : 'AI 비서 챗 2차 인증 끄기: ') + String(cfg.userId || ''));
    return w.ok ? { ok: true } : { ok: false, error: w.error || '2차 인증 설정을 저장하지 못했어요' };
  }

  /* 켜기: 열쇠 만들기 → QR·열쇠 보여 주기 → 번호 한 번 확인 → 저장 */
  function totpBeginSetup() {
    if (!S.me) return;
    var secret = randomSecret();
    S.totpSetup = { secret: secret, uri: totpUri(secret, S.me.id), at: Date.now() };
    S.totpMsg = '';
    S.totpOff = false;
    renderSettings();
  }
  function totpCancelSetup() {
    S.totpSetup = null;
    S.totpMsg = '';
    renderSettings();
  }
  async function totpConfirmSetup() {
    var setup = S.totpSetup;
    if (!setup) return;
    var code = String(fieldVal('totpSetupCode')).replace(/\D/g, '');
    if (code.length !== TOTP_DIGITS) { S.totpMsg = '인증 앱에 뜬 6자리 번호를 넣어 주세요.'; renderSettings(); return; }
    if (!S.chatKey) { S.totpMsg = '대화 열쇠가 없어 2차 인증을 켤 수 없어요. 다시 열고 시도해 주세요.'; renderSettings(); return; }
    if (!(await totpVerify(setup.secret, code))) {
      S.totpMsg = '번호가 맞지 않아요. 인증 앱의 최신 번호를 넣어 주세요.';
      renderSettings();
      return;
    }
    S.totpMsg = '저장하는 중…';
    renderSettings();
    try {
      var w = await wrapChatKey(setup.secret, S.chatKey, S.me.id, TOTP_ITER);
      var cfg = {
        version: 1, userId: S.me.id, enabled: true,
        alg: 'SHA1', digits: TOTP_DIGITS, period: TOTP_PERIOD,
        secret: setup.secret, issuer: TOTP_ISSUER, label: totpLabel(S.me.id),
        kdf: w.kdf, kdfIter: w.kdfIter, salt: w.salt, iv: w.iv, wrappedKey: w.wrappedKey,
        chatSalt: S.chatSalt ? b64enc(S.chatSalt) : '', chatIter: S.chatIter,
        createdAt: nowIso(), updatedAt: nowIso()
      };
      var saved = await saveTotpConfig(cfg);
      if (!saved.ok) { S.totpMsg = saved.error; renderSettings(); return; }
      S.totp = { ok: true, present: true, enabled: true, cfg: cfg };
      S.totpSetup = null;
      S.totpMsg = '2차 인증을 켰어요. 다음부터는 6자리 번호만으로 열려요.';
      renderSettings();
      toast('2차 인증을 켰어요.');
    } catch (e) {
      S.totpMsg = '2차 인증을 켜지 못했어요. ' + (e && e.message ? e.message : '');
      renderSettings();
    }
  }
  async function totpDisableSubmit() {
    if (!S.totp || !S.totp.enabled) return;
    var code = String(fieldVal('totpOffCode')).replace(/\D/g, '');
    var pw = fieldVal('totpOffPw');
    var ok = false;
    if (code.length === TOTP_DIGITS) ok = await totpVerify(S.totp.cfg && S.totp.cfg.secret, code);
    else if (pw) {
      await freshUsers();
      var u = findUser(S.me.id);
      ok = !!(u && u.salt && u.hash && (await hashPassword(pw, u.salt)) === u.hash);
    }
    if (!ok) {
      S.totpMsg = (code || pw) ? '번호나 비밀번호가 맞지 않아요.' : '6자리 번호나 계정 비밀번호를 넣어 주세요.';
      renderSettings();
      return;
    }
    S.totpMsg = '끄는 중…';
    renderSettings();
    var saved = await saveTotpConfig({ version: 1, userId: S.me.id, enabled: false, disabledAt: nowIso(), updatedAt: nowIso() });
    if (!saved.ok) { S.totpMsg = saved.error; renderSettings(); return; }
    S.totp = { ok: true, present: true, enabled: false, cfg: null };
    S.totpOff = false;
    S.totpMsg = '2차 인증을 껐어요. 이제 비밀번호로 열려요.';
    renderSettings();
    toast('2차 인증을 껐어요.');
  }
  function totpCopySecret() {
    var secret = S.totpSetup ? S.totpSetup.secret : '';
    if (!secret) return;
    function done() { toast('열쇠를 복사했어요.'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = secret;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) { toast('복사하지 못했어요. 열쇠를 길게 눌러 직접 복사해 주세요.'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(secret).then(done).catch(fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  /* 비밀번호로 열었을 때 2차 인증 열쇠를 지금 열쇠에 맞춰 조용히 다시 감싸요 */
  async function rewrapTotpKey() {
    if (!S.totp || !S.totp.enabled || !S.totp.cfg || !S.chatKey) return false;
    var cfg = S.totp.cfg;
    try {
      var cur = await unwrapChatKey(cfg);
      var a = new Uint8Array(await subtle().exportKey('raw', cur));
      var b = new Uint8Array(await subtle().exportKey('raw', S.chatKey));
      var same = a.length === b.length;
      for (var i = 0; same && i < a.length; i++) if (a[i] !== b[i]) same = false;
      if (same) return true;
    } catch (e) { /* 아래에서 새로 감싸요 */ }
    try {
      var w = await wrapChatKey(cfg.secret, S.chatKey, cfg.userId, Number(cfg.kdfIter) || TOTP_ITER);
      cfg.kdf = w.kdf; cfg.kdfIter = w.kdfIter; cfg.salt = w.salt; cfg.iv = w.iv; cfg.wrappedKey = w.wrappedKey;
      if (S.chatSalt) cfg.chatSalt = b64enc(S.chatSalt);
      cfg.chatIter = S.chatIter;
      cfg.updatedAt = nowIso();
      var r = await saveTotpConfig(cfg);
      if (r.ok) S.totp.cfg = cfg;
      return !!r.ok;
    } catch (e) { return false; }
  }

  /* 등록된 기기 잠금 해제 · 새 기기 등록: 6자리 번호만으로 */
  async function unlockWithTotp(code, deviceName) {
    if (!S.me) return { ok: false, message: '계정을 확인하지 못했어요.' };
    var cfgRes = await loadTotpConfig(S.me.id);
    S.totp = cfgRes;
    if (!cfgRes.ok && !cfgRes.enabled) {
      return { ok: false, message: '2차 인증 설정을 읽지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.' };
    }
    if (!cfgRes.enabled) {
      return { ok: false, message: '2차 인증이 꺼져 있어요. 비밀번호로 열어 주세요.', needsPassword: true };
    }
    var cfg = cfgRes.cfg;
    if (!(await totpVerify(cfg.secret, code))) {
      return { ok: false, message: '번호가 맞지 않아요. 인증 앱의 최신 6자리를 넣어 주세요.' };
    }
    var key;
    try { key = await unwrapChatKey(cfg); }
    catch (e) { return { ok: false, message: '인증은 확인했지만 대화 열쇠를 풀지 못했어요. 비밀번호로 열어 주세요.', needsPassword: true }; }

    S.chatKey = key;
    S.chatSalt = cfg.chatSalt ? b64dec(cfg.chatSalt) : window.crypto.getRandomValues(new Uint8Array(16));
    S.chatIter = clamp(Number(cfg.chatIter) || CHAT_ITER, 1000, 1000000);

    var envRes = await readThreadsEnvelope();
    if (!envRes.ok) { S.chatKey = null; return { ok: false, message: envRes.error || '대화 보관함을 확인하지 못했어요.' }; }
    if (envRes.env) {
      S.chatSalt = b64dec(envRes.env.salt);
      S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      try { await chatDecrypt(envRes.env); }
      catch (e) {
        S.chatKey = null;
        return { ok: false, message: '인증은 확인했지만 대화를 열지 못했어요. 비밀번호로 열고 2차 인증을 다시 켜 주세요.', needsPassword: true };
      }
    }
    S.unlocked = true;
    touchActivity();
    await bioRefreshKey();
    if (S.gateMode === 'device') {
      var reg = await registerDevice(deviceName);
      if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
    }
    return { ok: true };
  }

  async function submitGateTotp() {
    if (S.gateBusy) return;
    var code = String(fieldVal('gateTotp')).replace(/\D/g, '');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateTotpBtn');
    if (code.length !== TOTP_DIGITS) return gateFail('인증 앱에 뜬 6자리 번호를 넣어 주세요.');
    S.gateBusy = true;
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      var r = await unlockWithTotp(code, name);
      if (!r.ok) {
        gateFail(r.message || '열지 못했어요.');
        if (r.needsPassword) { S.gateAlt = true; renderGate(); gateFail(r.message || ''); }
        return;
      }
      await enterChat();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      S.gateBusy = false;
      var b2 = document.getElementById('gateTotpBtn');
      if (b2) { b2.disabled = false; b2.textContent = S.gateMode === 'device' ? '이 기기 등록하고 열기' : '열기'; }
    }
  }

  async function pasteGateTotp() {
    var el = document.getElementById('gateTotp');
    if (!el || S.gateBusy) return;
    var txt = '';
    try {
      if (navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText();
    } catch (e) { txt = ''; }
    var digits = String(txt || '').replace(/\D/g, '');
    if (digits.length > 6) digits = digits.slice(0, 6);
    if (digits.length < 6) {
      try { el.focus(); } catch (e2) { /* 무시 */ }
      if (digits) el.value = digits;
      toast('복사한 6자리 번호를 찾지 못했어요. 인증 앱에서 번호를 복사한 뒤 다시 눌러 주세요.');
      return;
    }
    el.value = digits;
    await submitGateTotp();
  }

  /* ============ 생체인증 (Face ID · 지문) — 이 기기에서만 ============ */
  /* 이 브라우저가 생체인증(WebAuthn)을 쓸 수 있는지 */
  function hasBiometricSupport() {
    return !!(window.PublicKeyCredential && navigator.credentials
      && typeof navigator.credentials.create === 'function'
      && typeof navigator.credentials.get === 'function'
      && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'));
  }
  function b64urlEnc(buf) {
    return b64enc(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDec(txt) {
    var s = String(txt || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return b64dec(s);
  }
  function bioUserId() { return String((S.me && S.me.id) || ''); }
  function bioStoreKey() { return K_BIO + bioUserId(); }
  function bioWrapKeyName() { return K_BIO_WRAP + bioUserId(); }

  /* 이 기기에 등록해 둔 생체인증 정보. 없거나 망가졌으면 null */
  function getBioRecord() {
    var id = bioUserId();
    if (!id) return null;
    var raw = lsGet(bioStoreKey());
    if (!raw) return null;
    var rec = null;
    try { rec = JSON.parse(raw); } catch (e) { return null; }
    if (!rec || typeof rec !== 'object' || !rec.credIdB64 || !rec.wrappedKey || !rec.iv) return null;
    if (rec.userId && String(rec.userId) !== id) return null;
    return rec;
  }
  function saveBioRecord(rec) {
    var id = bioUserId();
    if (!id || !rec) return false;
    rec.version = 1;
    rec.userId = id;
    rec.updatedAt = nowIso();
    return lsSet(bioStoreKey(), JSON.stringify(rec));
  }
  function clearBioRecord() {
    lsDel(bioStoreKey());
    lsDel(bioWrapKeyName());
  }
  function bioLabel() {
    var ua = String(navigator.userAgent || '');
    if (/iPhone|iPad|iPod/.test(ua)) return 'Face ID · Touch ID';
    if (/Macintosh/.test(ua)) return 'Touch ID';
    if (/Android/.test(ua)) return '지문 · 얼굴';
    if (/Windows/.test(ua)) return 'Windows Hello';
    return 'Face ID / 지문';
  }
  function bioAad() { return new TextEncoder().encode('bio:' + bioUserId()); }

  /* 대화 열쇠를 이 기기에서만 쓰는 열쇠로 감싸 둠 (감싸는 열쇠도 이 기기에만) */
  async function bioWrapChatKey(key) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 생체인증을 쓸 수 없어요');
    var raw = new Uint8Array(await sub.exportKey('raw', key));
    var local = window.crypto.getRandomValues(new Uint8Array(32));
    if (!lsSet(bioWrapKeyName(), b64enc(local))) throw new Error('이 기기에 저장하지 못했어요');
    var kek = await sub.importKey('raw', local, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var ct = await sub.encrypt({ name: 'AES-GCM', iv: iv, additionalData: bioAad() }, kek, raw);
    return { iv: b64enc(iv), wrappedKey: b64enc(ct) };
  }
  async function bioUnwrapChatKey(rec) {
    var sub = subtle();
    if (!sub) throw new Error('이 브라우저에서는 생체인증을 쓸 수 없어요');
    var localB64 = lsGet(bioWrapKeyName());
    if (!localB64) throw new Error('이 기기에 등록한 열쇠가 없어요');
    var kek = await sub.importKey('raw', b64dec(localB64), { name: 'AES-GCM' }, false, ['decrypt']);
    var raw = await sub.decrypt({ name: 'AES-GCM', iv: b64dec(rec.iv), additionalData: bioAad() }, kek, b64dec(rec.wrappedKey));
    return sub.importKey('raw', new Uint8Array(raw), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  }

  /* 비밀번호·6자리 번호로 열었을 때도 이 기기의 생체인증 열쇠를 지금 열쇠에 맞춰 조용히 맞춰 둬요 */
  async function bioRefreshKey() {
    try {
      var rec = getBioRecord();
      if (!rec || !S.chatKey || !bioUserId()) return false;
      var w = await bioWrapChatKey(S.chatKey);
      rec.iv = w.iv;
      rec.wrappedKey = w.wrappedKey;
      rec.chatSalt = S.chatSalt ? b64enc(S.chatSalt) : '';
      rec.chatIter = S.chatIter;
      return saveBioRecord(rec);
    } catch (e) { return false; }
  }

  /* 등록: 지금 이 기기의 얼굴·지문을 한 번 확인하고 대화 열쇠를 이 기기에만 맡겨 둬요 */
  async function bioRegister() {
    if (S.bioBusy) return;
    if (!hasBiometricSupport()) {
      S.bioMsg = '이 브라우저에서는 생체인증을 쓸 수 없어요. https 주소이거나 홈 화면에 추가한 앱에서 열어 주세요.';
      renderSettings();
      return;
    }
    if (!S.chatKey || !S.me) {
      S.bioMsg = '대화를 연 뒤에 생체인증을 등록해 주세요.';
      renderSettings();
      return;
    }
    S.bioBusy = true;
    S.bioMsg = '생체인증을 등록하는 중…';
    renderSettings();
    try {
      var cred = await navigator.credentials.create({ publicKey: {
        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "Jaden's Home", id: location.hostname || 'localhost' },
        user: {
          id: new TextEncoder().encode(String(S.me.id || 'user')),
          name: String(S.me.id || 'user'),
          displayName: String(S.me.name || S.me.id || 'Jaden')
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000
      } });
      if (!cred || !cred.rawId) throw new Error('이 기기가 생체인증을 받아 주지 않았어요');
      var w = await bioWrapChatKey(S.chatKey);
      var rec = {
        credIdB64: b64urlEnc(cred.rawId),
        createdAt: nowIso(),
        label: bioLabel(),
        alg: 'AES-GCM',
        iv: w.iv,
        wrappedKey: w.wrappedKey,
        chatSalt: S.chatSalt ? b64enc(S.chatSalt) : '',
        chatIter: S.chatIter
      };
      if (!saveBioRecord(rec)) throw new Error('이 기기에 저장하지 못했어요. 인터넷 창의 저장 공간이 가득 찼는지 확인해 주세요.');
      S.bioMsg = '';
      toast('Face ID / 생체인증이 등록됐어요!');
    } catch (e) {
      var nm = String((e && e.name) || '');
      S.bioMsg = (nm === 'NotAllowedError' || nm === 'AbortError')
        ? '생체인증 등록이 취소됐어요.'
        : (nm === 'InvalidStateError'
          ? '이 기기에 이미 생체인증이 등록되어 있어요. 기기 설정에서 지운 뒤 다시 해 주세요.'
          : '생체인증을 등록하지 못했어요.' + (e && e.message ? ' ' + e.message : ''));
      toast(S.bioMsg);
    } finally {
      S.bioBusy = false;
      renderSettings();
    }
  }

  /* 해제: 이 기기에서만 지워요. 다음부터는 비밀번호나 6자리 번호로 열어요. */
  function bioRemove() {
    clearBioRecord();
    S.bioMsg = '이 기기에서 생체인증을 해제했어요. 이제 비밀번호나 6자리 번호로 열어요.';
    renderSettings();
    toast('이 기기 생체인증을 해제했어요.');
  }

  /* 잠금 화면 맨 위의 ‘생체인증으로 열기’ */
  function bioGateHtml() {
    if (!hasBiometricSupport() || !getBioRecord()) return '';
    return '<button class="gate-btn" type="button" id="gateBioBtn" data-act="gate-bio" style="margin-bottom:10px">🔐 Face ID / 생체인증으로 열기</button>' +
      '<div class="gate-or">또는 직접 입력</div>';
  }

  async function gateBioUnlock() {
    if (S.gateBusy) return;
    var rec = getBioRecord();
    if (!rec || !hasBiometricSupport()) {
      gateFail('이 기기에서는 생체인증을 쓸 수 없어요. 아래 번호나 비밀번호로 열어 주세요.');
      return;
    }
    var btn = document.getElementById('gateBioBtn');
    var opened = false;
    S.gateBusy = true;
    if (btn) { btn.disabled = true; btn.textContent = '생체인증 확인 중…'; }
    try {
      var cred = await navigator.credentials.get({ publicKey: {
        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: b64urlDec(rec.credIdB64), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      } });
      if (!cred) throw new Error('생체인증을 확인하지 못했어요');
      var key = null;
      try { key = await bioUnwrapChatKey(rec); }
      catch (eu) {
        gateFail('생체인증은 확인했지만 대화 열쇠가 바뀌어 있어요. 아래 비밀번호나 번호로 열고 설정에서 생체인증을 다시 등록해 주세요.');
        return;
      }
      S.chatKey = key;
      S.chatSalt = rec.chatSalt ? b64dec(rec.chatSalt) : window.crypto.getRandomValues(new Uint8Array(16));
      S.chatIter = clamp(Number(rec.chatIter) || CHAT_ITER, 1000, 1000000);

      var envRes = await readThreadsEnvelope();
      if (!envRes.ok) { S.chatKey = null; gateFail(envRes.error || '대화 보관함을 확인하지 못했어요.'); return; }
      if (envRes.env) {
        S.chatSalt = b64dec(envRes.env.salt);
        S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
        try { await chatDecrypt(envRes.env); }
        catch (ed) {
          S.chatKey = null;

  /* ============ 등록된 기기 ============ */
  async function loadDevices() {
    var r = await ghGetJson(DEFAULT_REPO, PATH_DEVICES, null);
    if (!r.ok) return { ok: false, error: r.error || '기기 목록을 읽지 못했어요', devices: [] };
    if (r.missing) return { ok: true, missing: true, devices: [] };
    var list = (r.data && Object.prototype.toString.call(r.data.devices) === '[object Array]') ? r.data.devices : [];
    return { ok: true, devices: list, sha: r.sha };
  }
  function deviceKnown(devices, deviceId, userId) {
    for (var i = 0; i < devices.length; i++) {
      var d = devices[i] || {};
      if (String(d.id) === String(deviceId) && String(d.userId) === String(userId)) return d;
    }
    return null;
  }
  async function registerDevice(name) {
    var cur = await loadDevices();
    if (!cur.ok) return { ok: false, error: cur.error };
    var list = cur.devices.slice();
    var found = deviceKnown(list, S.deviceId, S.me.id);
    var rec = {
      id: S.deviceId,
      userId: S.me.id,
      name: String(name || S.deviceName || '이 기기').slice(0, 40),
      at: found ? found.at : nowIso(),
      lastSeen: nowIso(),
      ua: String(navigator.userAgent || '').slice(0, 180)
    };
    if (found) {
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].id) === String(S.deviceId) && String(list[i].userId) === String(S.me.id)) { list[i] = rec; break; }
      }
    } else {
      list.push(rec);
    }
    var body = { version: 1, updatedAt: nowIso(), devices: list };
    var w = await ghPutAt(DEFAULT_REPO, PATH_DEVICES, JSON.stringify(body, null, 2), (found ? 'AI 비서 챗 기기 확인: ' : 'AI 비서 챗 새 기기 등록: ') + rec.name, null);
    if (!w.ok) return { ok: false, error: w.error || '기기 등록을 저장하지 못했어요' };
    return { ok: true, device: rec };
  }
  async function revokeDevice(id) {
    var cur = await loadDevices();
    if (!cur.ok) return { ok: false, error: cur.error };
    var list = [];
    for (var i = 0; i < cur.devices.length; i++) if (String(cur.devices[i].id) !== String(id)) list.push(cur.devices[i]);
    var body = { version: 1, updatedAt: nowIso(), devices: list };
    var w = await ghPutAt(DEFAULT_REPO, PATH_DEVICES, JSON.stringify(body, null, 2), 'AI 비서 챗 기기 해제', null);
    if (!w.ok) return { ok: false, error: w.error };
    return { ok: true, devices: list };
  }

  /* ============ AI 설정 (config/ai.json) ============ */
  /* ---------- 제공자별 열쇠 여러 개 (한도에 걸리면 다음 열쇠로) ---------- */
  function emptyKeys() { return { gemini: [], openrouter: [], groq: [] }; }
  function normalizeKeys(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var v = String(list[i] == null ? '' : list[i]).trim();
      if (v && out.indexOf(v) < 0) out.push(v);
    }
    return out;
  }
  function keysFromConfig(obj) {
    var keys = emptyKeys(), active = { gemini: 0, openrouter: 0, groq: 0 };
    for (var i = 0; i < PROVIDER_ORDER.length; i++) {
      var pid = PROVIDER_ORDER[i];
      var arr = obj[pid + 'Keys'];
      var list = (Object.prototype.toString.call(arr) === '[object Array]') ? normalizeKeys(arr) : [];
      if (!list.length) {
        var single = String((pid === 'gemini' ? (obj.key || obj.gemini) : obj[pid]) || '').trim();
        if (single) list = [single];
      }
      keys[pid] = list;
    }
    var act = (obj && obj.activeKey) || {};
    for (i = 0; i < PROVIDER_ORDER.length; i++) {
      var p2 = PROVIDER_ORDER[i];
      var n = Number(act[p2]);
      active[p2] = (n >= 0 && n < keys[p2].length) ? n : 0;
    }
    return { keys: keys, active: active };
  }
  function keyList(pid) {
    if (!S.ai.keys) S.ai.keys = emptyKeys();
    if (!S.ai.keys[pid]) S.ai.keys[pid] = [];
    return S.ai.keys[pid];
  }
  function activeIndex(pid) {
    var l = keyList(pid);
    var i = Number(S.ai.active && S.ai.active[pid]);
    if (isNaN(i) || i < 0 || i >= l.length) i = 0;
    return i;
  }
  function setActiveKey(pid, i) {
    if (!S.ai.active) S.ai.active = {};
    S.ai.active[pid] = i;
    saveKeyState();
    renderModelBtn();
  }
  function maskKey(k) {
    var t = String(k || '');
    if (t.length <= 4) return '····';
    return '····' + t.slice(-4);
  }
  function keyLimitUntil(pid, i) {
    var m = (S.keyLimit && S.keyLimit[pid]) || {};
    return Number(m[i]) || 0;
  }
  function clearKeyLimit(pid, i) {
    if (S.keyLimit && S.keyLimit[pid] && S.keyLimit[pid][i]) { delete S.keyLimit[pid][i]; saveKeyState(); }
  }
  function markKeyLimited(pid, i, res) {
    if (!S.keyLimit) S.keyLimit = {};
    if (!S.keyLimit[pid]) S.keyLimit[pid] = {};
    var h = (res && res.headers) || {};
    var wait = parseDur(h['retry-after']);
    if (wait == null) wait = 60000;
    S.keyLimit[pid][i] = Date.now() + clamp(wait, 1000, 86400000);
    saveKeyState();
  }
  function loadKeyState() {

      for (var i = 0; i < PROVIDER_ORDER.length; i++) {
        var pid = PROVIDER_ORDER[i], n = Number(j.active[pid]);
        if (!isNaN(n) && n >= 0 && n < keyList(pid).length) S.ai.active[pid] = n;
      }
    }
  }
  function saveKeyState() {

    var r = await ghGetJson(DEFAULT_REPO, PATH_AI, null);

    if (!obj) {

  async function saveAiConfig(next) {

  /* #rgb · #rrggbb만 통과시켜요 (CSS 변수에 그대로 들어가니 이상한 값은 버려요) */
  function normHexColor(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    if (s.charAt(0) !== '#') s = '#' + s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) {
      s = '#' + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3);
    }
    if (!/^#[0-9a-fA-F]{6}$/.test(s)) return '';
    return s.toLowerCase();
  }

  async function loadThreads() {
    var r = await readThreadsEnvelope();
    if (!r.ok) {
      S.threads = [sampleThread()];
      S.active = S.threads[0].id;
      S.loaded = true;
      return { ok: false, error: r.error };
    }
    if (r.missing) {
      S.chatSalt = S.chatSalt || window.crypto.getRandomValues(new Uint8Array(16));
      S.threads = [sampleThread()];
      S.active = S.threads[0].id;
      S.loaded = true;
      return { ok: true };
    }
    var txt = null;
    try { txt = await chatDecrypt(r.env); } catch (e) {
      return { ok: false, error: '대화 보관함을 열지 못했어요. 비밀번호를 다시 확인해 주세요.' };
    }
    var obj = null;
    try { obj = JSON.parse(txt); } catch (e) { obj = null; }
    if (!obj || Object.prototype.toString.call(obj.threads) !== '[object Array]') {
      return { ok: false, error: '대화 보관함 내용을 읽지 못했어요.' };
    }
    S.threads = obj.threads;
    S.active = String(obj.active || '') || (S.threads[0] && S.threads[0].id) || '';
    if (!S.threads.length) { S.threads = [sampleThread()]; S.active = S.threads[0].id; }
    if (!findThread(S.active)) S.active = S.threads[0].id;
    if (obj.pref && typeof obj.pref === 'object') {
      if (obj.pref.instructions) S.pref.instructions = String(obj.pref.instructions);
      if (Object.prototype.toString.call(obj.pref.quick) === '[object Array]' && obj.pref.quick.length) S.pref.quick = obj.pref.quick;

      noteResult('gemini', model, got.res.status, headers, got.txt);

    if (!got.res.ok) return { ok: false, status: got.res.status, error: errMsg, headers: headers, body: got.txt };

    var out = '', calls = [];

        calls.push({ id: 'gem_' + (calls.length + 1), name: String(fc.name), args: args });

      var fin = json && json.candidates && json.candidates[0] && json.candidates[0].finishReason;
      return {

    return { ok: true, status: got.res.status, text: String(out), toolCalls: calls, headers: headers };

  function openaiStyleCall(url, pid, extraHeaders) {
    return async function (model, req, opts) {
      var key = (opts && opts.key) || providerKey(pid);
      if (!key) return { ok: false, status: 0, error: PROVIDERS[pid].label + ' 키가 없어요', headers: {} };
      var msgs = [{ role: 'system', content: req.system }];
      for (var i = 0; i < req.messages.length; i++) {
        var m = req.messages[i];
        var imgs = m.images || [];
        var content = String(m.text || '');
        if (imgs.length) {
          content = [];
          if (m.text) content.push({ type: 'text', text: String(m.text) });
          for (var k = 0; k < imgs.length; k++) {
            content.push({ type: 'image_url', image_url: { url: 'data:' + imgs[k].mime + ';base64,' + imgs[k].data } });
          }
        }
        msgs.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: content });
      }
      var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key };
      for (var k in extraHeaders) if (Object.prototype.hasOwnProperty.call(extraHeaders, k)) headers[k] = extraHeaders[k];
      var mid = modelIdOf(pid, model);
      var withTools = !(opts && opts.noTools) && !noToolsModel(mid);
      function send(useTools) {
        var body = { model: model, messages: msgs, temperature: 0.5 };
        if (opts && opts.maxTokens) body.max_tokens = opts.maxTokens;
        /* 말로만 “찾아볼게요” 하지 않고 실제로 도구를 부르도록 함수 도구를 함께 보내요 */
        if (useTools) { body.tools = openaiTools(); body.tool_choice = 'auto'; }
        return window.fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: (opts && opts.signal) || undefined })
          .then(function (r) { return r.text().then(function (t) { return { res: r, txt: t, tools: useTools }; }); });
      }
      var got;
      try { got = await send(withTools); }
      catch (e) { return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} }; }
      var hmap = headerMap(got.res);
      var json = null;
      try { json = JSON.parse(got.txt); } catch (e) { json = null; }
      noteResult(pid, model, got.res.status, hmap, got.txt);
      var errMsg = got.res.ok ? '' : textFromErr(got.res.status, json, 'HTTP ' + got.res.status);
      /* 이 모델이 함수 도구를 지원하지 않으면 이 모델만 도구 없이 한 번 더 시도해요 */
      if (!got.res.ok && got.tools && isNoToolSupportError(got.res.status, errMsg)) {
        markNoToolsModel(mid);
        try { got = await send(false); }
        catch (e2) { return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요', headers: {} }; }
        hmap = headerMap(got.res);
        json = null;
        try { json = JSON.parse(got.txt); } catch (e3) { json = null; }
        noteResult(pid, model, got.res.status, hmap, got.txt);
        errMsg = got.res.ok ? '' : textFromErr(got.res.status, json, 'HTTP ' + got.res.status);
      }
      if (!got.res.ok) return { ok: false, status: got.res.status, error: errMsg, headers: hmap, body: got.txt };
      var out = '', calls = [];
      try {
        var c = json.choices[0];
        var msg = (c && c.message) || {};
        out = msg.content || '';
        if (Object.prototype.toString.call(out) === '[object Array]') {
          out = out.map(function (p) { return (p && p.text) || ''; }).join('');
        }
        var tc = msg.tool_calls;
        if (Object.prototype.toString.call(tc) === '[object Array]') {
          for (var n = 0; n < tc.length && n < 4; n++) {
            var fn = (tc[n] && tc[n].function) || {};
            var args = {};
            try { args = JSON.parse(fn.arguments || '{}'); } catch (e4) { args = {}; }
            if (!args || typeof args !== 'object') args = {};
            if (fn.name) calls.push({ id: String((tc[n] && tc[n].id) || ''), name: String(fn.name), args: args });
          }
        }
      } catch (e) { out = ''; }
      /* 도구를 부른 답변은 본문이 비어 있는 게 정상이에요 */
      if (!String(out).trim() && !calls.length) return { ok: false, status: got.res.status, error: '빈 답변이 왔어요', headers: hmap, body: got.txt };
      return { ok: true, status: got.res.status, text: String(out), toolCalls: calls, headers: hmap };
    };
  }

  /* 큰 파일을 통째로 보내지 않도록 줄/구간 단위로 다뤄요 (토큰 절약) */
  /* 글자는 같은데 들여쓰기·공백만 다른 줄을 찾아요 (쓸 때는 파일 안에서 딱 한 곳일 때만) */
  function findTrimmedBlock(text, oldS) {
    var want = String(oldS == null ? '' : oldS).replace(/\r\n/g, '\n').split('\n');
    for (var a = 0; a < want.length; a++) want[a] = String(want[a]).trim();
    while (want.length && want[0] === '') want.shift();
    while (want.length && want[want.length - 1] === '') want.pop();
    var lines = String(text == null ? '' : text).split('\n');
    if (!want.length) return { hits: [], want: want, lines: lines };
    var hits = [];
    for (var i = 0; i + want.length <= lines.length; i++) {
      var same = true;
      for (var j = 0; j < want.length; j++) {
        if (String(lines[i + j]).trim() !== want[j]) { same = false; break; }
      }
      if (!same) continue;
      hits.push(i);
      if (hits.length > 8) break;
    }
    return { hits: hits, want: want, lines: lines };
  }
  /* 못 찾았을 때 “가장 비슷한 줄”의 위치와 앞뒤 2줄을 알려 줘요 */
  function closestLineHint(text, oldS) {
    var lines = String(text == null ? '' : text).split('\n');
    var raw = String(oldS == null ? '' : oldS).replace(/\r\n/g, '\n').split('\n');
    var cands = [];
    for (var i = 0; i < raw.length; i++) {
      var t = String(raw[i]).trim();
      if (t.length >= 6 && cands.indexOf(t) < 0) cands.push(t);
    }
    cands.sort(function (a, b) { return b.length - a.length; });
    for (var c = 0; c < cands.length; c++) {
      var needle = cands[c].slice(0, 80), best = null;
      for (var k = 0; k < lines.length; k++) {
        var s = String(lines[k]).trim();
        if (!s) continue;
        var score = 0;
        if (s === needle) score = 1000 + s.length;
        else if (needle.length >= 12 && s.indexOf(needle) >= 0) score = 500 + needle.length;
        else {
          var cp = 0;
          while (cp < needle.length && cp < s.length && needle.charAt(cp) === s.charAt(cp)) cp++;
          if (cp >= 8) score = cp;
        }
        if (score > 0 && (!best || score > best.score)) best = { score: score, line: k + 1, text: String(lines[k]).slice(0, 160) };
      }
      if (best) {
        /* 그 줄만 주면 또 틀리니 앞뒤 2줄을 줄 번호와 함께 돌려줘요 */
        var bag = [];
        for (var q = Math.max(1, best.line - 2); q <= Math.min(lines.length, best.line + 2); q++) {
          bag.push((q === best.line ? '>' : ' ') + String(q).padStart(5) + '| ' + String(lines[q - 1]).slice(0, 160));
        }
        best.ctx = bag.join('\n');
        return best;
      }
    }
    return null;
  }
  function applyEdits(text, edits) {
    var out = String(text == null ? '' : text), applied = [];
    for (var i = 0; i < edits.length && i < 20; i++) {
      var e = edits[i] || {};
      var oldS = String(e.old_string == null ? (e.find == null ? '' : e.find) : e.old_string);
      var newS = String(e.new_string == null ? (e.replace == null ? '' : e.replace) : e.new_string);
      if (!oldS) return { ok: false, error: (i + 1) + '번째 수정에 old_string이 없어요.' };
      if (oldS === newS) return { ok: false, error: (i + 1) + '번째 수정: old_string과 new_string이 같아 바뀌는 내용이 없어요.' };
      var count = out.split(oldS).length - 1;
      if (count) {
        var idx = out.indexOf(oldS);
        if (e.replace_all) {
          out = out.split(oldS).join(newS);
          applied.push({ index: i + 1, count: count, all: true });
        } else {
          out = out.slice(0, idx) + newS + out.slice(idx + oldS.length);
          applied.push({ index: i + 1, count: 1, total: count });
        }
        continue;
      }
      /* 글자는 같은데 들여쓰기·공백만 다를 때: 딱 한 곳이면 그 자리를 바꿔요 */
      var tm = findTrimmedBlock(out, oldS);
      if (tm.hits.length === 1) {
        var st = 0, b;
        for (b = 0; b < tm.hits[0]; b++) st += String(tm.lines[b]).length + 1;
        var en = st;
        for (b = 0; b < tm.want.length; b++) en += String(tm.lines[tm.hits[0] + b]).length + (b < tm.want.length - 1 ? 1 : 0);
        out = out.slice(0, st) + newS + out.slice(en);
        applied.push({ index: i + 1, count: 1, total: 1, trimmed: true });
        continue;
      }
      var msg = (i + 1) + '번째 수정: old_string을 파일에서 찾지 못했어요.';
      if (tm.hits.length > 1) {
        msg += '\n공백만 다른 줄이 ' + tm.hits.length + '곳(더 있을 수 있어요)에 있어 어디를 바꿀지 고를 수 없어요. 앞뒤 줄을 한두 줄 더 넣어 한 곳만 남겨 주세요.';
      }
      var hint = closestLineHint(out, oldS);
      if (hint) msg += '\n가장 비슷한 줄: ' + hint.line + '번째 줄 「' + hint.text.trim() + '」 — 이 들여쓰기·글자를 그대로 old_string에 쓰면 돼요.';
      if (hint && hint.ctx) msg += '\n그 줄 앞뒤 2줄(> 표시가 그 줄):\n' + hint.ctx;
      msg += '\n(찾던 글: ' + oldS.slice(0, 80).replace(/\n/g, '\\n') + ')';
      return { ok: false, error: msg };
    }
    return { ok: true, text: out, applied: applied };
  }

  /* HTML은 브라우저 파서(DOMParser)로 읽어요. JS 문자열 안의 “<script>” 글자에 속지 않아요. */

  function checkCssText(text) {

  /* ============ 줄 비교(diff) ============ */
  function diffLines(a, b) {
    var A = String(a || '').split('\n'), B = String(b || '').split('\n');
    if (A.length > 1600) A = A.slice(0, 1600).concat(['… (앞부분만 비교)']);
    if (B.length > 1600) B = B.slice(0, 1600).concat(['… (앞부분만 비교)']);
    var n = A.length, m = B.length;
    var dp = [];
    for (var i = 0; i <= n; i++) { dp.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        dp[i][j] = (A[i] === B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var rows = [], i2 = 0, j2 = 0;
    while (i2 < n && j2 < m) {
      if (A[i2] === B[j2]) { rows.push({ t: ' ', s: A[i2] }); i2++; j2++; }
      else if (dp[i2 + 1][j2] >= dp[i2][j2 + 1]) { rows.push({ t: '-', s: A[i2] }); i2++; }
      else { rows.push({ t: '+', s: B[j2] }); j2++; }
    }
    while (i2 < n) { rows.push({ t: '-', s: A[i2] }); i2++; }
    while (j2 < m) { rows.push({ t: '+', s: B[j2] }); j2++; }
    /* 바뀐 곳 주변만 남기고 앞뒤는 2줄씩만 */
    var keep = [];
    for (var k = 0; k < rows.length; k++) {
      if (rows[k].t === ' ') continue;
      for (var d = Math.max(0, k - 2); d <= Math.min(rows.length - 1, k + 2); d++) keep[d] = 1;
    }
    var out = [], skipped = 0, added = 0, removed = 0;
    for (k = 0; k < rows.length; k++) {
      if (rows[k].t === '+') added++;
      if (rows[k].t === '-') removed++;
      if (!keep[k]) { skipped++; continue; }
      if (skipped) { out.push({ t: '·', s: '… ' + skipped + '줄 그대로 …' }); skipped = 0; }
      out.push(rows[k]);
      if (out.length > 260) { out.push({ t: '·', s: '… (나머지 생략)' }); break; }
    }
    return { rows: out, added: added, removed: removed };
  }

  function renderGate() {

  function findUser(id) {

    var key = String(id || '').toLowerCase();
    for (var i = 0; i < users.length; i++) {
      if (String(users[i].id).toLowerCase() === key) return users[i];
    }
    return null;

  async function freshUsers() {
    try {
      var r = await ghGetJson(DEFAULT_REPO, 'config/users.json', null);
      if (r.ok && r.data && Object.prototype.toString.call(r.data.users) === '[object Array]') {
        S.users = r.data;

      }

    return (S.users && S.users.users) || [];

  async function submitGate() {
    var pw = fieldVal('gatePw');
    var name = fieldVal('gateDevName') || S.deviceName;
    var btn = document.getElementById('gateBtn');
    if (!pw) return gateFail('비밀번호를 넣어 주세요.');
    if (btn) { btn.disabled = true; btn.textContent = '확인하는 중…'; }
    try {
      await freshUsers();
      var u = findUser(S.me.id);
      if (!u || !u.salt || !u.hash) return gateFail('계정 정보를 확인하지 못했어요.');
      if (String(u.role) !== 'admin') return gateFail('관리자 계정만 열 수 있어요.');
      var hash = await hashPassword(pw, u.salt);
      if (hash !== u.hash) return gateFail('비밀번호가 맞지 않아요.');

      var envRes = await readThreadsEnvelope();
      if (!envRes.ok) return gateFail(envRes.error || '대화 보관함을 확인하지 못했어요.');
      if (envRes.env) {
        S.chatSalt = b64dec(envRes.env.salt);
        S.chatIter = clamp(Number(envRes.env.iter) || CHAT_ITER, 1000, 1000000);
      } else {
        S.chatSalt = window.crypto.getRandomValues(new Uint8Array(16));
        S.chatIter = CHAT_ITER;
      }
      S.chatKey = await chatKeyFrom(pw, S.chatSalt, S.chatIter);
      if (envRes.env) {
        try { await chatDecrypt(envRes.env); }
        catch (e) { S.chatKey = null; return gateFail('이 계정의 대화를 열지 못했어요. 비밀번호를 다시 확인해 주세요.'); }
      }
      S.unlocked = true;
      touchActivity();
      /* 비밀번호로 열었으니 2차 인증 열쇠도 지금 열쇠에 맞춰 조용히 맞춰 둬요 */
      if (S.totp && S.totp.enabled) await rewrapTotpKey();
      await bioRefreshKey();

      if (S.gateMode === 'device') {
        var reg = await registerDevice(name);
        if (!reg.ok) toast('기기 등록을 저장하지 못했어요. 다음에 다시 확인할게요.');
      }
      await enterChat();
    } catch (e) {
      gateFail('열지 못했어요. ' + (e && e.message ? e.message : ''));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = (btn.textContent === '확인하는 중…') ? '열기' : btn.textContent; }
    }
  }

  function mdText(t) {
    var s = esc(t);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, function (_, pre, u) {
      return pre + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
    var blocks = s.split(/\n{2,}/), html = '';
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b.trim()) continue;
      var lines = b.split('\n');
      var allList = true;
      for (var k = 0; k < lines.length; k++) if (lines[k].trim() && !/^\s*[-*]\s+/.test(lines[k])) allList = false;
      if (allList && lines.length) {
        var li = '';
        for (var j = 0; j < lines.length; j++) li += '<li>' + lines[j].replace(/^\s*[-*]\s+/, '') + '</li>';
        html += '<ul>' + li + '</ul>';
      } else {
        html += '<p>' + lines.join('<br>') + '</p>';
      }
    }
    return html;
  }
  function md(t) {
    var src = String(t || '');
    var re = /```([a-zA-Z0-9+#._-]*)\r?\n?([\s\S]*?)```/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += mdText(src.slice(last, m.index));
      out += '<pre><code>' + esc(String(m[2]).replace(/\n$/, '')) + '</code></pre>';
      last = m.index + m[0].length;
    }
    out += mdText(src.slice(last));
    return out || '<p></p>';
  }

        (s.errors && s.errors.length ? '<span class="detail">' + esc(s.errors.join('\n')) + '</span>' : '') +
        '</span></div>';

    h += '</div>';
    return h;
  }
  function diffHtml(diff) {

  function snippet(s, n) {

  function msgById(t, id) {

  /* ============ 작업 상태(⏱ 경과·지금 하는 일) ============ */
  function fmtElapsed(ms) {
    var s = Math.max(0, Math.floor(Number(ms || 0) / 1000));
    return Math.floor(s / 60) + ':' + pad2(s % 60);
  }
  function fmtSecs(ms) {
    var s = Math.max(0, Math.round(Number(ms || 0) / 1000));
    if (s < 60) return s + '초';
    return Math.floor(s / 60) + '분' + (s % 60 ? ' ' + (s % 60) + '초' : '');
  }
  function workTick() {
    var t = activeThread();
    if (!t) return;
    var w = S.work && S.work[t.id];
    var el = document.getElementById('workElapsed');
    if (!w || !el) return;
    el.textContent = '⏱ ' + fmtElapsed(Date.now() - w.at);
  }
  function workTimerStart() {
    if (workTimerStart.id) return;
    workTimerStart.id = window.setInterval(workTick, 1000);

  function workTimerStop() {
    if (workTimerStart.id) { window.clearInterval(workTimerStart.id); workTimerStart.id = 0; }
